<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Secure Registration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #020205;
            background: radial-gradient(circle at center, #0f1020 0%, #05050a 70%, #020203 100%);
            overflow: hidden;
            padding: 15px;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
            animation: float 12s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            top: -100px; left: -100px;
        }
        .orb-2 {
            width: 500px; height: 500px;
            background: linear-gradient(135deg, #00f0ff, #0072ff);
            bottom: -150px; right: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            100% { transform: translateY(30px) scale(1.1) rotate(5deg); }
        }

        /* Landscape Horizontal Glass Box */
        .glass-box {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 750px;
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 25px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            max-height: 92vh;
            overflow-y: auto;
        }

        .glass-box::-webkit-scrollbar {
            width: 4px;
        }
        .glass-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .emoji {
            font-size: 32px;
            animation: pulse-light 1.5s infinite alternate;
        }

        @keyframes pulse-light {
            0% { opacity: 0.4; filter: drop-shadow(0 0 8px #ff007f); transform: scale(0.95); }
            100% { opacity: 1; filter: drop-shadow(0 0 20px #00f0ff); transform: scale(1.1); }
        }

        /* 2-Column Grid Layout for Landscape Efficiency */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
        }

        .input-group {
            position: relative;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .input-group input:focus {
            border-color: #00f0ff;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .hint {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 3px;
            line-height: 1.2;
        }

        .full-width {
            grid-column: span 2;
        }

        .register-btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 0, 127, 0.4);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 1px;
        }

        .register-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.7);
        }

        .footer-link-container {
            text-align: center;
            margin-top: 12px;
            grid-column: span 2;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: color 0.3s, text-shadow 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link:hover {
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-box">
        <div class="game-title">
            <span class="emoji">✨</span> CREATE ACCOUNT
        </div>
        
        <div class="form-grid">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="e.g. gamer_123#" autocomplete="off">
                <div class="hint">Min 5 letters, 2-5 numbers, 1 special char</div>
            </div>

            <div class="input-group">
                <label>Gmail Address</label>
                <input type="email" id="regEmail" placeholder="example@gmail.com">
            </div>

            <div class="input-group">
                <label>Create Password</label>
                <input type="password" id="regPassword" placeholder="Strong password">
                <div class="hint">Min 5 letters, 2-5 numbers, 1 special char</div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password">
            </div>
            
            <div class="full-width">
                <button type="button" class="register-btn" id="submitBtn" onclick="registerUser()">REGISTER & VERIFY</button>
            </div>

            <div class="footer-link-container">
                <a href="index.html" class="back-link">⬅️ Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Validation Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCK9njPkGdw91_vGhI0_mRflpXBbz2D_zo",
            authDomain: "z-pajal.firebaseapp.com",
            databaseURL: "https://z-pajal-default-rtdb.firebaseio.com",
            projectId: "z-pajal",
            storageBucket: "z-pajal.firebasestorage.app",
            messagingSenderId: "941362119453",
            appId: "1:941362119453:web:c52140dba1952a389197f4",
            measurementId: "G-PKKCQ5CT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.registerUser = async function() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!username || !email || !password || !confirmPassword) {
                alert("Kripya sabhi fields bharein!");
                return;
            }

            // 1. Username Validation Check
            const lettersMatch = username.match(/[a-zA-Z]/g);
            const numbersMatch = username.match(/[0-9]/g);
            const specialMatch = username.match(/[!@#$%^&*()_+]/g);

            if (!lettersMatch || lettersMatch.length < 5) {
                alert("Username mein kam se kam 5 alphabetical characters hone chahiye!");
                return;
            }
            if (!numbersMatch || numbersMatch.length < 2 || numbersMatch.length > 5) {
                alert("Username mein 2 se 5 numbers (counts) hone chahiye!");
                return;
            }
            if (!specialMatch || specialMatch.length < 1) {
                alert("Username mein !@#$%^&*()_+ mein se koi ek special character hona zaroori hai!");
                return;
            }

            // 2. Password Validation Check
            const pLetters = password.match(/[a-zA-Z]/g);
            const pNumbers = password.match(/[0-9]/g);
            const pSpecial = password.match(/[!@#$%^&*()_+]/g);

            if (!pLetters || pLetters.length < 5 || !pNumbers || pNumbers.length < 2 || pNumbers.length > 5 || !pSpecial) {
                alert("Password strong hona chahiye: Min 5 letters, 2-5 numbers, aur 1 special character zaroori hai!");
                return;
            }

            if (password !== confirmPassword) {
                alert("Password aur Confirm Password match nahi ho rahe hain!");
                return;
            }

            try {
                btn.innerText = "Checking Username...";
                btn.disabled = true;

                // 3. Check if Username already exists in Firebase Database
                const usernameRef = ref(db, 'usernames/' + username.toLowerCase());
                const snapshot = await get(usernameRef);

                if (snapshot.exists()) {
                    alert("⚠️ This name already exists / Access Denied! Kripya koi dusra username chunein.");
                    btn.innerText = "REGISTER & VERIFY";
                    btn.disabled = false;
                    return;
                }

                btn.innerText = "Creating Account...";

                // 4. Create user in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Save Username in Realtime Database to block duplicates forever
                await set(usernameRef, { uid: user.uid, email: email });

                // Set Display Name
                await updateProfile(user, { displayName: username });

                // Send Email Verification Code / Link
                await sendEmailVerification(user);

                // Save Active Session / User Data in DB
                await set(ref(db, 'users/' + user.uid + '/profile'), {
                    username: username,
                    email: email,
                    createdAt: Date.now()
                });

                alert("🎉 Account successful ban gaya! Humne aapke Gmail (" + email + ") par verification link bhej diya hai. Email verify karne ke baad aap login kar sakte hain.");

                // Sign out temporarily so they verify
                await signOut(auth);
                window.location.href = "index.html";

            } catch (error) {
                alert("Error: " + error.message);
                btn.innerText = "REGISTER & VERIFY";
                btn.disabled = false;
            }
        }
    </script>

    <!-- Fullscreen API & Landscape Orientation Lock Integration -->
    <script>
        async function enableLandscapeFullscreen() {
            const docElement = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (docElement.requestFullscreen) {
                        await docElement.requestFullscreen();
                    } else if (docElement.webkitRequestFullscreen) {
                        await docElement.webkitRequestFullscreen();
                    } else if (docElement.msRequestFullscreen) {
                        await docElement.msRequestFullscreen();
                    }
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {
                // Ignore restrictions
            }
        }

        window.addEventListener('click', enableLandscapeFullscreen, { once: true });
        window.addEventListener('touchstart', enableLandscapeFullscreen, { once: true });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Home Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #2b1a09 0%, #0f0803 50%, #1a0f03 100%);
            background-attachment: fixed;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(43, 26, 9, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(210, 140, 60, 0.3);
            border-radius: 15px;
            padding: 10px 25px;
            margin-bottom: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .nav-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: #ffaa00;
            text-shadow: 0 0 8px rgba(255,170,0,0.5);
        }

        .user-info {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 14px;
            color: #ffcc66;
        }

        .logout-btn {
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid rgba(255, 0, 127, 0.5);
            color: #ff75bc;
            padding: 6px 15px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 0, 127, 0.4);
            color: #fff;
        }

        /* Main Center Dashboard Arena */
        .main-arena {
            flex: 1;
            background: rgba(20, 12, 5, 0.85);
            border: 2px solid rgba(210, 140, 60, 0.4);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: inset 0 0 25px rgba(210, 140, 60, 0.1), 0 10px 30px rgba(0,0,0,0.6);
        }

        .welcome-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
        }

        .desc-text {
            color: #d0b090;
            font-size: 14px;
            max-width: 500px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .play-game-btn {
            background: linear-gradient(45deg, #ffaa00, #ff5500);
            border: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            padding: 15px 40px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 170, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .play-game-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 170, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- Top Navigation Bar -->
        <div class="top-nav">
            <div class="nav-title">🤪 Z PAJAL - DASHBOARD</div>
            <div class="user-info">
                <span id="userEmailDisplay">Loading...</span>
                <button class="logout-btn" onclick="logoutUser()">LOGOUT</button>
            </div>
        </div>

        <!-- Main Arena Box -->
        <div class="main-arena">
            <div class="welcome-badge">SELECT YOUR CHALLENGE</div>
            <div class="desc-text">
                Prepare yourself for Level 1! Avoid hidden traps, collect coins carefully, and reach the white exit gate without getting blown up.
            </div>
            <button class="play-game-btn" onclick="startLevel1()">PLAY LEVEL 1 🎮</button>
        </div>
    </div>

    <!-- Firebase Auth & Session Security Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCK9njPkGdw91_vGhI0_mRflpXBbz2D_zo",
            authDomain: "z-pajal.firebaseapp.com",
            databaseURL: "https://z-pajal-default-rtdb.firebaseio.com",
            projectId: "z-pajal",
            storageBucket: "z-pajal.firebasestorage.app",
            messagingSenderId: "941362119453",
            appId: "1:941362119453:web:c52140dba1952a389197f4",
            measurementId: "G-PKKCQ5CT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 🛑 Strict Security & Back Button Trap
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function () {
            history.pushState(null, null, location.href);
        });

        // Check active session & authentication
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('userEmailDisplay').innerText = user.email;

                // Single device session tracking
                const localSession = localStorage.getItem('userSessionId');
                onValue(ref(db, 'users/' + user.uid + '/activeSession'), (snapshot) => {
                    const serverSession = snapshot.val();
                    if (serverSession && localSession !== serverSession) {
                        alert("⚠️ Your account was logged in from another device!");
                        signOut(auth).then(() => {
                            localStorage.clear();
                            window.location.href = "index.html";
                        });
                    }
                });
            } else {
                // Agar user login nahi hai toh wapas login page par bhej do
                window.location.href = "index.html";
            }
        });

        window.startLevel1 = function() {
            // Yahan aap apni game wali file ka naam likh sakte hain (jaise game.html)
            window.location.href = "game.html";
        }

        window.logoutUser = function() {
            signOut(auth).then(() => {
                localStorage.clear();
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("Logout Error:", error);
            });
        }
    </script>
</body>
</html>

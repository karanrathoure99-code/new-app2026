<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤪 Z PAJAL - Arcade Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #070514;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 127, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 204, 0.15) 0%, transparent 40%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Cyberpunk Arcade Box */
        .dashboard-container {
            background: rgba(16, 13, 37, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 204, 0.3);
            border-radius: 25px;
            padding: 35px 30px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2), inset 0 0 20px rgba(255, 0, 127, 0.1);
            text-align: center;
            position: relative;
            animation: containerGlow 4s infinite alternate;
        }

        @keyframes containerGlow {
            0% { border-color: rgba(0, 255, 204, 0.3); box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
            100% { border-color: rgba(255, 0, 127, 0.4); box-shadow: 0 0 35px rgba(255, 0, 127, 0.3); }
        }

        .arcade-badge {
            display: inline-block;
            background: linear-gradient(90deg, #ff007f, #7928ca);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #00ffcc, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .subtitle {
            font-size: 13px;
            color: #a0a0c0;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Gamer Profile Card */
        .profile-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #00ffcc);
            animation: scanLine 3s infinite;
        }

        @keyframes scanLine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .username {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #ff007f;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
        }

        .rank {
            font-size: 16px;
            font-weight: 600;
            color: #ffcc00;
            margin-bottom: 5px;
        }

        .level-count {
            font-size: 13px;
            color: #8c8cb2;
            font-weight: 500;
        }

        /* Neon Play Button */
        .play-btn {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4);
            position: relative;
            overflow: hidden;
        }

        .play-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.7);
            background: linear-gradient(135deg, #ff198c, #893ad6);
        }

        .play-btn:active {
            transform: translateY(1px);
        }

        /* Cyber Logout Button */
        .logout-btn {
            background: transparent;
            color: #8c8cb2;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="arcade-badge">🎮 ARCADE ZONE</div>
        <h1>🤪 Z PAJAL</h1>
        <p class="subtitle">ENTER THE HARDCORE GAME REALM</p>

        <div class="profile-card">
            <div class="username" id="displayUsername">Loading...</div>
            <div class="rank" id="displayRank">Rank: Loading...</div>
            <div class="level-count" id="displayLevel">Level: 1</div>
        </div>

        <button class="play-btn" onclick="startGame()">🚀 PLAY GAME - LEVEL 1</button>
        <button class="logout-btn" onclick="logoutUser()">LOGOUT SESSION</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCK9njPkGdw91_vGhI0_mRflpXBbz2D_zo",
            authDomain: "z-pajal.firebaseapp.com",
            databaseURL: "https://z-pajal-default-rtdb.firebaseio.com",
            projectId: "z-pajal",
            storageBucket: "z-pajal.firebasestorage.app",
            messagingSenderId: "941362119453",
            appId: "1:941362119453:web:c52140dba1952a389197f4",
            measurementId: "G-PKKCQ5CT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // High-Tech Sci-Fi Click/Tech Sound Generator (Web Audio API)
        function playTechSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                // High tech frequency shift (sci-fi tap)
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);

                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        }

        // Cute Girl Voice Simulation + Laughing Effect
        function playGirlWelcomeVoice(username) {
            if ('speechSynthesis' in window) {
                // Cancel any pending speech
                window.speechSynthesis.cancel();

                // 1. Welcome sentence (Cute high pitch girl voice)
                const welcomeText = "Welcome to Z Pajal game, " + username + "!";
                const utterance = new SpeechSynthesisUtterance(welcomeText);
                utterance.rate = 1.0; 
                utterance.pitch = 1.8; // High pitch for girl voice
                utterance.volume = 1.0;

                // 2. Laughing effect after sentence completes
                utterance.onend = function() {
                    setTimeout(() => {
                        const laughUtterance = new SpeechSynthesisUtterance("Ha ha ha! Let's play!");
                        laughUtterance.rate = 1.3;
                        laughUtterance.pitch = 1.9; // Extra cute/playful laugh tone
                        window.speechSynthesis.speak(laughUtterance);
                    }, 300);
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        // Rank Calculate Logic
        function calculateRank(level) {
            if (level >= 1 && level <= 10) return "Silver";
            if (level >= 11 && level <= 25) return "Shine Silver";
            if (level >= 26 && level <= 40) return "Gold";
            if (level >= 41 && level <= 65) return "Shine Gold";
            if (level >= 66 && level <= 80) return "Diamond";
            if (level >= 81 && level <= 110) return "Pro Diamond";
            if (level >= 111 && level <= 200) return "Grand Pro Diamond";
            if (level >= 300) return "Legend Grand Master";
            return "Grand Pro Diamond";
        }

        // Check Auth and Load Data
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const uid = user.uid;
                const userRef = ref(db, 'users/' + uid);
                try {
                    const snapshot = await get(userRef);
                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        const username = userData.username || "Player";
                        const level = userData.level || 1;

                        document.getElementById('displayUsername').innerText = username;
                        document.getElementById('displayLevel').innerText = "Level: " + level;
                        document.getElementById('displayRank').innerText = "Rank: " + calculateRank(level);

                        playGirlWelcomeVoice(username);
                    } else {
                        const fallbackName = user.email.split('@')[0];
                        document.getElementById('displayUsername').innerText = fallbackName;
                        document.getElementById('displayLevel').innerText = "Level: 1";
                        document.getElementById('displayRank').innerText = "Rank: Silver";
                        playGirlWelcomeVoice(fallbackName);
                    }
                } catch (error) {
                    console.error("Error fetching user data:", error);
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // Global functions tied to window
        window.logoutUser = function() {
            playTechSound();
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("Sign out error", error);
            });
        };

        window.startGame = function() {
            playTechSound();
            setTimeout(() => {
                window.location.href = "game.html?level=1";
            }, 150); // slight delay so tech sound is audible before navigating
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤪 Z PAJAL - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Dark Glassmorphism Container */
        .dashboard-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .profile-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .username {
            font-size: 22px;
            font-weight: bold;
            color: #ff007f;
            margin-bottom: 8px;
        }

        .rank {
            font-size: 18px;
            font-weight: 600;
            color: #ffcc00;
            margin-bottom: 5px;
        }

        .level-count {
            font-size: 14px;
            color: #aaa;
        }

        .play-btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            margin-top: 10px;
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
        }

        .logout-btn {
            background: transparent;
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>🤪 Z PAJAL</h1>
        <p style="font-size: 14px; color: #ccc;">Welcome to the Hardcore Zone</p>

        <div class="profile-card">
            <div class="username" id="displayUsername">Loading...</div>
            <div class="rank" id="displayRank">Rank: Loading...</div>
            <div class="level-count" id="displayLevel">Level: 1</div>
        </div>

        <button class="play-btn" onclick="startGame()">Play Game - Level 1</button>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Correct Firebase Configuration added here
        const firebaseConfig = {
            apiKey: "AIzaSyCK9njPkGdw91_vGhI0_mRflpXBbz2D_zo",
            authDomain: "z-pajal.firebaseapp.com",
            databaseURL: "https://z-pajal-default-rtdb.firebaseio.com",
            projectId: "z-pajal",
            storageBucket: "z-pajal.firebasestorage.app",
            messagingSenderId: "941362119453",
            appId: "1:941362119453:web:c52140dba1952a389197f4",
            measurementId: "G-PKKCQ5CT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Welcome Sound Play karne ka function
        function playWelcomeVoice(username) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("Welcome to Z Pajal game, " + username);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Rank Calculate karne ka Logic
        function calculateRank(level) {
            if (level >= 1 && level <= 10) return "Silver";
            if (level >= 11 && level <= 25) return "Shine Silver";
            if (level >= 26 && level <= 40) return "Gold";
            if (level >= 41 && level <= 65) return "Shine Gold";
            if (level >= 66 && level <= 80) return "Diamond";
            if (level >= 81 && level <= 110) return "Pro Diamond";
            if (level >= 111 && level <= 200) return "Grand Pro Diamond";
            if (level >= 300) return "Legend Grand Master";
            return "Grand Pro Diamond";
        }

        // Check Auth and Load User Data
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const uid = user.uid;
                const userRef = ref(db, 'users/' + uid);
                try {
                    const snapshot = await get(userRef);
                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        const username = userData.username || "Player";
                        const level = userData.level || 1;

                        document.getElementById('displayUsername').innerText = username;
                        document.getElementById('displayLevel').innerText = "Level: " + level;
                        document.getElementById('displayRank').innerText = "Rank: " + calculateRank(level);

                        playWelcomeVoice(username);
                    } else {
                        document.getElementById('displayUsername').innerText = user.email.split('@')[0];
                        document.getElementById('displayLevel').innerText = "Level: 1";
                        document.getElementById('displayRank').innerText = "Rank: Silver";
                        playWelcomeVoice("Player");
                    }
                } catch (error) {
                    console.error("Error fetching user data:", error);
                }
            } else {
                // Agar user logged in nahi hai tabhi index.html par bhejega
                window.location.href = "index.html";
            }
        });

        window.logoutUser = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("Sign out error", error);
            });
        };

        window.startGame = function() {
            window.location.href = "game.html?level=1";
        }
    </script>
</body>
</html>

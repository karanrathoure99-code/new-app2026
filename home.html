<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Arcade Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Press+Start+2P&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Chakra Petch', 'Poppins', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #916000;
            overflow: hidden;
            padding: 10px;
        }

        /* Landscape Horizontal Dashboard Box */
        .dashboard-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 720px;
            background: #ffb356;
            border: 5px solid #ffb356;
            border-radius: 14px;
            padding: 16px 24px;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.35);
            max-height: 98vh;
            overflow-y: auto;
            text-align: center;
        }

        .dashboard-container::-webkit-scrollbar {
            width: 6px;
        }
        .dashboard-container::-webkit-scrollbar-thumb {
            background: #523500;
            border-radius: 10px;
        }

        .arcade-badge {
            display: inline-block;
            background: #523500;
            color: #ffb356;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 2px solid #3b2500;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 12px;
            color: #523500;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        /* Landscape 2-Column Split Layout */
        .profile-rank-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 10px;
            align-items: center;
        }

        .left-profile-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .profile-oval {
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 10px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-shadow: 3px 3px 0px #523500;
        }

        .avatar-img {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #ffa133;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            border: 2px solid #523500;
            flex-shrink: 0;
        }

        .username-container {
            text-align: left;
            overflow: hidden;
        }

        .username {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            font-weight: 700;
            color: #3b2500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-tag {
            font-size: 9px;
            color: #7d540f;
            font-weight: 700;
        }

        .level-outside {
            font-size: 11px;
            font-weight: 800;
            color: #523500;
            letter-spacing: 1px;
            text-align: left;
            padding-left: 6px;
            font-family: 'Press Start 2P', monospace;
        }

        .right-rank-wrapper {
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            box-shadow: 3px 3px 0px #523500;
        }

        .rank-logo {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .rank-title-label {
            font-size: 8px;
            color: #7d540f;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .rank {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            font-weight: 700;
            text-align: center;
            margin-top: 2px;
            color: #523500;
        }

        .info-square-box {
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 10px;
            text-align: left;
            box-shadow: 3px 3px 0px #523500;
        }

        .info-square-box h3 {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #523500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .info-line {
            font-size: 11px;
            color: #3b2500;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
        }

        .info-line:last-child {
            margin-bottom: 0;
        }

        .play-btn {
            background: #523500;
            color: #ffb356;
            border: 3px solid #3b2500;
            padding: 11px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.15s ease;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.4);
            margin-bottom: 8px;
        }

        .play-btn:hover {
            background: #694400;
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.4);
        }

        .play-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4);
        }

        .logout-btn {
            background: transparent;
            color: #523500;
            border: 2px solid #523500;
            padding: 7px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: #ffbe73;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="arcade-badge">😈 LEVEL DEVIL ZONE</div>
        <h1>🤪 Z PAJAL</h1>

        <div class="profile-rank-row">
            <div class="left-profile-wrapper">
                <div class="profile-oval">
                    <div class="avatar-img">😈</div>
                    <div class="username-container">
                        <div class="username" id="displayUsername">Loading...</div>
                        <div class="user-tag">Rage Gamer</div>
                    </div>
                </div>
                <div class="level-outside" id="displayLevel">LEVEL: 1</div>
            </div>

            <div class="right-rank-wrapper">
                <div class="rank-logo" id="displayRankLogo">🛡️</div>
                <div class="rank-title-label">Current Rank</div>
                <div class="rank" id="displayRank">Silver</div>
            </div>
        </div>

        <div class="info-square-box">
            <h3>😈 DEVIL STATUS</h3>
            <div class="info-line">🚪 <b>Target:</b> Har level ke gate tak surakshit pahuncho</div>
            <div class="info-line">💀 <b>Warning:</b> Invisible spikes aur moving doors se bach ke</div>
            <div class="info-line">⚡ <b>Rule:</b> Zero patience, direct rage-quit!</div>
        </div>

        <button class="play-btn" id="playGameBtn" onclick="startGame()">🚀 PLAY GAME - LEVEL 1</button>
        <button class="logout-btn" onclick="logoutUser()">LOGOUT SESSION</button>
    </div>

    <!-- Firebase SDK Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCK9njPkGdw91_vGhI0_mRflpXBbz2D_zo",
            authDomain: "z-pajal.firebaseapp.com",
            databaseURL: "https://z-pajal-default-rtdb.firebaseio.com",
            projectId: "z-pajal",
            storageBucket: "z-pajal.firebasestorage.app",
            messagingSenderId: "941362119453",
            appId: "1:941362119453:web:c52140dba1952a389197f4",
            measurementId: "G-PKKCQ5CT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Real-time Level Tracker
        let currentSavedLevel = parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga')) || 1;
        document.getElementById('displayLevel').innerText = "LEVEL: " + currentSavedLevel;
        document.getElementById('playGameBtn').innerText = "🚀 PLAY GAME - LEVEL " + currentSavedLevel;

        function playTechSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);

                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        function playBoyWelcomeVoice(username) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const welcomeText = "Welcome to Z Pajal game, " + username + "!";
                const utterance = new SpeechSynthesisUtterance(welcomeText);
                utterance.rate = 1.0; 
                utterance.pitch = 0.8; 
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateRankInfo(level) {
            let rankName = "Silver";

            if (level >= 1 && level <= 10) { rankName = "Silver"; }
            else if (level >= 11 && level <= 25) { rankName = "Shine Silver"; }
            else if (level >= 26 && level <= 40) { rankName = "Gold"; }
            else if (level >= 41 && level <= 65) { rankName = "Shine Gold"; }
            else if (level >= 66 && level <= 80) { rankName = "Diamond"; }
            else if (level >= 81 && level <= 110) { rankName = "Pro Diamond"; }
            else if (level >= 111 && level <= 200) { rankName = "Grand Pro Diamond"; }
            else if (level >= 300) { rankName = "Legend Grand Master"; }
            else { rankName = "Grand Pro Diamond"; }

            document.getElementById('displayRank').innerText = rankName;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const uid = user.uid;
                const userRef = ref(db, 'users/' + uid);
                let finalUsername = "Player";
                let userLevel = 1;

                try {
                    const snapshot = await get(userRef);
                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        finalUsername = userData.username || userData.name || user.displayName || (user.email ? user.email.split('@')[0] : "Player");
                        userLevel = userData.level || 1;
                    } else {
                        finalUsername = user.displayName || (user.email ? user.email.split('@')[0] : "Gamer");
                    }
                } catch (error) {
                    console.error("Error fetching user data from DB:", error);
                    finalUsername = user.displayName || (user.email ? user.email.split('@')[0] : "Player");
                }

                let actualUserLevel = Math.max(currentSavedLevel, userLevel);

                document.getElementById('displayUsername').innerText = finalUsername;
                document.getElementById('displayLevel').innerText = "LEVEL: " + actualUserLevel;
                document.getElementById('playGameBtn').innerText = "🚀 PLAY GAME - LEVEL " + actualUserLevel;
                
                updateRankInfo(actualUserLevel);
                playBoyWelcomeVoice(finalUsername);
            } else {
                window.location.href = "index.html";
            }
        });

        window.logoutUser = function() {
            playTechSound();
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("Sign out error", error);
            });
        };

        window.startGame = function() {
            playTechSound();
            setTimeout(() => {
                window.location.href = "level.html";
            }, 150);
        };
    </script>

    <!-- Fullscreen API & Landscape Orientation Lock Integration -->
    <script>
        async function enableLandscapeFullscreen() {
            const docElement = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (docElement.requestFullscreen) {
                        await docElement.requestFullscreen();
                    } else if (docElement.webkitRequestFullscreen) {
                        await docElement.webkitRequestFullscreen();
                    } else if (docElement.msRequestFullscreen) {
                        await docElement.msRequestFullscreen();
                    }
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {
                // Ignore restrictions
            }
        }

        window.addEventListener('click', enableLandscapeFullscreen, { once: true });
        window.addEventListener('touchstart', enableLandscapeFullscreen, { once: true });
    </script>
</body>
</html>

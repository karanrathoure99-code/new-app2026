<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤪 Z PAJAL - Arcade Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #3d0a3d 0%, #070514 50%, #032b29 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard-container {
            background: rgba(20, 18, 40, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 30px 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .arcade-badge {
            display: inline-block;
            background: linear-gradient(90deg, #ff007f, #7928ca);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .profile-rank-row {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 15px;
            margin-bottom: 20px;
        }

        .left-profile-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-oval {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 50px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.1), 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .avatar-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff007f, #00ffcc);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .username-container {
            text-align: left;
            overflow: hidden;
        }

        .username {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        .user-tag {
            font-size: 10px;
            color: #8c8cb2;
        }

        .level-outside {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #00ffcc;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
        }

        .right-rank-wrapper {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.1), 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .rank-logo {
            font-size: 24px;
            margin-bottom: 3px;
            filter: drop-shadow(0 0 8px currentColor);
        }

        .rank-title-label {
            font-size: 10px;
            color: #8c8cb2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .rank {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-top: 2px;
        }

        .info-square-box {
            background: rgba(15, 12, 30, 0.6);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.05), 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .info-square-box h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #00ffcc;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .info-line {
            font-size: 12px;
            color: #b0b0d0;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-line:last-child {
            margin-bottom: 0;
        }

        .play-btn {
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4);
            margin-bottom: 12px;
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.7);
        }

        .logout-btn {
            background: transparent;
            color: #8c8cb2;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="arcade-badge">🎮 ARCADE ZONE</div>
        <h1>🤪 Z PAJAL</h1>

        <div class="profile-rank-row">
            <div class="left-profile-wrapper">
                <div class="profile-oval">
                    <div class="avatar-img">🧑‍💻</div>
                    <div class="username-container">
                        <div class="username" id="displayUsername">Loading...</div>
                        <div class="user-tag">Rage Gamer</div>
                    </div>
                </div>
                <div class="level-outside" id="displayLevel">LEVEL: 1</div>
            </div>

            <div class="right-rank-wrapper">
                <div class="rank-logo" id="displayRankLogo">🛡️</div>
                <div class="rank-title-label">Current Rank</div>
                <div class="rank" id="displayRank">Silver</div>
            </div>
        </div>

        <div class="info-square-box">
            <h3>⚡ REALM STATUS</h3>
            <div class="info-line">🎯 <b>Objective:</b> Dam hai to level up karke dikhao</div>
            <div class="info-line">⚠️ <b>Warning:</b> Watch out for fake floors</div>
            <div class="info-line">🏆 <b>Goal:</b> Reach Grand Master status</div>
        </div>

        <button class="play-btn" onclick="startGame()">🚀 PLAY GAME - LEVEL 1</button>
        <button class="logout-btn" onclick="logoutUser()">LOGOUT SESSION</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCK9njPkGdw91_vGhI0_mRflpXBbz2D_zo",
            authDomain: "z-pajal.firebaseapp.com",
            databaseURL: "https://z-pajal-default-rtdb.firebaseio.com",
            projectId: "z-pajal",
            storageBucket: "z-pajal.firebasestorage.app",
            messagingSenderId: "941362119453",
            appId: "1:941362119453:web:c52140dba1952a389197f4",
            measurementId: "G-PKKCQ5CT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        function playTechSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);

                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        function playBoyWelcomeVoice(username) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const welcomeText = "Welcome to Z Pajal game, " + username + "!";
                const utterance = new SpeechSynthesisUtterance(welcomeText);
                utterance.rate = 1.0; 
                utterance.pitch = 0.8; 
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateRankInfo(level) {
            let rankName = "Silver";
            let color = "#c0c0c0";

            if (level >= 1 && level <= 10) { rankName = "Silver"; color = "#c0c0c0"; }
            else if (level >= 11 && level <= 25) { rankName = "Shine Silver"; color = "#e0e0e0"; }
            else if (level >= 26 && level <= 40) { rankName = "Gold"; color = "#ffd700"; }
            else if (level >= 41 && level <= 65) { rankName = "Shine Gold"; color = "#ffea75"; }
            else if (level >= 66 && level <= 80) { rankName = "Diamond"; color = "#00ffff"; }
            else if (level >= 81 && level <= 110) { rankName = "Pro Diamond"; color = "#00bfff"; }
            else if (level >= 111 && level <= 200) { rankName = "Grand Pro Diamond"; color = "#7b68ee"; }
            else if (level >= 300) { rankName = "Legend Grand Master"; color = "#ff00ff"; }
            else { rankName = "Grand Pro Diamond"; color = "#7b68ee"; }

            document.getElementById('displayRank').innerText = rankName;
            document.getElementById('displayRank').style.color = color;
            document.getElementById('displayRankLogo').style.color = color;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const uid = user.uid;
                const userRef = ref(db, 'users/' + uid);
                let finalUsername = "Player";
                let userLevel = 1;

                try {
                    const snapshot = await get(userRef);
                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        finalUsername = userData.username || userData.name || user.displayName || (user.email ? user.email.split('@')[0] : "Player");
                        userLevel = userData.level || 1;
                    } else {
                        finalUsername = user.displayName || (user.email ? user.email.split('@')[0] : "Gamer");
                    }
                } catch (error) {
                    console.error("Error fetching user data from DB:", error);
                    finalUsername = user.displayName || (user.email ? user.email.split('@')[0] : "Player");
                }

                document.getElementById('displayUsername').innerText = finalUsername;
                document.getElementById('displayLevel').innerText = "LEVEL: " + userLevel;
                updateRankInfo(userLevel);

                playBoyWelcomeVoice(finalUsername);
            } else {
                window.location.href = "index.html";
            }
        });

        window.logoutUser = function() {
            playTechSound();
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("Sign out error", error);
            });
        };

        window.startGame = function() {
            playTechSound();
            setTimeout(() => {
                window.location.href = "game.html?level=1";
            }, 150);
        }
    </script>
</body>
</html>

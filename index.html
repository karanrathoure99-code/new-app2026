<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Level Devil Style Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Press+Start+2P&family=Poppins:wght@600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Chakra Petch', 'Poppins', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #916000;
            overflow: hidden;
            padding: 15px;
        }

        /* Glass Box / Card */
        .glass-box {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            background: #ffb356;
            border: 5px solid #ffb356;
            border-radius: 14px;
            padding: 30px 40px;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 35px;
        }

        /* Left Side: Branding */
        .brand-section {
            flex: 1;
            text-align: center;
        }

        .game-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 20px;
            font-weight: 700;
            color: #523500;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            line-height: 1.4;
        }

        .emoji {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 70px;
            height: 70px;
            background: #ffa133;
            border: 4px solid #523500;
            border-radius: 10px;
            box-shadow: 4px 4px 0px #523500;
            font-size: 38px;
        }

        /* Right Side: Form Controls */
        .form-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .input-group {
            margin-bottom: 14px;
            position: relative;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 8px;
            color: #3b2500;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            box-shadow: 3px 3px 0px #523500;
            transition: all 0.2s ease;
        }

        .input-group input::placeholder {
            color: #7d540f;
            font-weight: 600;
        }

        .input-group input:focus {
            border-color: #3b2500;
            background: #ffbe73;
            box-shadow: 4px 4px 0px #3b2500;
        }

        .button-wrapper {
            width: 100%;
            height: 48px;
            margin-top: 6px;
            margin-bottom: 14px;
        }

        #loginBtn {
            width: 100%;
            height: 100%;
            background: #523500;
            color: #ffb356;
            border: 3px solid #3b2500;
            border-radius: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.4);
            transition: all 0.15s ease;
            letter-spacing: 1px;
        }

        #loginBtn:hover {
            background: #694400;
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.4);
        }

        #loginBtn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4);
        }

        .footer-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 3px dashed #b87c28;
        }

        .footer-options a {
            color: #523500;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #ffa742;
            padding: 6px 10px;
            border: 2px solid #523500;
            border-radius: 6px;
            box-shadow: 2px 2px 0px #523500;
        }

        .footer-options a:hover {
            color: #000000;
            background: #ffbe73;
        }
    </style>
</head>
<body>

    <div class="glass-box">
        <!-- Left Landscape Branding -->
        <div class="brand-section">
            <div class="game-title">
                <span class="emoji">😈</span>
                <span>Z PAJAL</span>
            </div>
        </div>

        <!-- Right Landscape Form Controls -->
        <div class="form-section">
            <div class="input-group">
                <input type="email" id="gmail" placeholder="Enter Gmail" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            
            <div class="button-wrapper">
                <button id="loginBtn" type="button">START</button>
            </div>

            <div class="footer-options">
                <a href="about.html"><span>🛡️</span> About Game</a>
                <a href="register.html"><span>✨</span> New Account</a>
            </div>
        </div>
    </div>

    <!-- Firebase Authentication & Database Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCK9njPkGdw91_vGhI0_mRflpXBbz2D_zo",
            authDomain: "z-pajal.firebaseapp.com",
            databaseURL: "https://z-pajal-default-rtdb.firebaseio.com",
            projectId: "z-pajal",
            storageBucket: "z-pajal.firebasestorage.app",
            messagingSenderId: "941362119453",
            appId: "1:941362119453:web:c52140dba1952a389197f4",
            measurementId: "G-PKKCQ5CT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Fullscreen API & Landscape Orientation Lock Integration
        async function enableLandscapeFullscreen() {
            const docElement = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (docElement.requestFullscreen) {
                        await docElement.requestFullscreen();
                    } else if (docElement.webkitRequestFullscreen) {
                        await docElement.webkitRequestFullscreen();
                    } else if (docElement.msRequestFullscreen) {
                        await docElement.msRequestFullscreen();
                    }
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {
                // Ignore if browser restricts auto-lock or fullscreen without user gesture
            }
        }

        window.addEventListener('click', enableLandscapeFullscreen, { once: true });
        window.addEventListener('touchstart', enableLandscapeFullscreen, { once: true });

        const loginBtn = document.getElementById('loginBtn');
        const gmailInput = document.getElementById('gmail');
        const passwordInput = document.getElementById('password');

        loginBtn.addEventListener('click', async () => {
            const email = gmailInput.value.trim();
            const password = passwordInput.value.trim();

            if(email === '' || password === '') {
                alert("Game rules: Pehle Gmail aur Password fill karo!");
                return;
            }

            try {
                loginBtn.innerHTML = "LOGGING IN...";
                loginBtn.disabled = true;
                
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                if (!user.emailVerified) {
                    alert("⚠️ Pehle apne Gmail (" + email + ") par jaakar verification link par click karein, tabhi game khulegi!");
                    loginBtn.innerHTML = "START";
                    loginBtn.disabled = false;
                    return;
                }

                const sessionId = 'session_' + Math.random().toString(36).substring(2) + Date.now();
                localStorage.setItem('userSessionId', sessionId);

                await set(ref(db, 'users/' + user.uid + '/activeSession'), sessionId);

                alert("🎉 Welcome to 🤪 Z PAJAL! Login successful. Loading Home...");
                
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1000);

            } catch (error) {
                alert("Login Failed: " + error.message);
                loginBtn.innerHTML = "START";
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Landscape Gaming Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #020205;
            background: radial-gradient(circle at center, #0f1020 0%, #05050a 70%, #020203 100%);
            overflow: hidden;
            padding: 15px;
        }

        /* Cyber Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
            animation: float 12s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            top: -100px; left: -100px;
        }
        .orb-2 {
            width: 500px; height: 500px;
            background: linear-gradient(135deg, #00f0ff, #0072ff);
            bottom: -150px; right: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            100% { transform: translateY(30px) scale(1.1) rotate(5deg); }
        }

        /* Landscape Horizontal Glass Card */
        .glass-box {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 700px;
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 30px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        /* Left Side: Branding */
        .brand-section {
            flex: 1;
            text-align: center;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .emoji {
            font-size: 55px;
            animation: pulse-light 1.5s infinite alternate;
        }

        @keyframes pulse-light {
            0% { opacity: 0.4; filter: drop-shadow(0 0 8px #ff007f); transform: scale(0.95); }
            100% { opacity: 1; filter: drop-shadow(0 0 25px #00f0ff); transform: scale(1.1); }
        }

        /* Right Side: Form Controls */
        .form-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-group input:focus {
            border-color: #00f0ff;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .button-wrapper {
            position: relative;
            height: 46px;
            margin-top: 5px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #loginBtn {
            position: absolute;
            width: 90px;
            height: 38px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), width 0.4s ease, height 0.4s ease, background 0.4s ease, font-size 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 8px 20px rgba(255, 0, 127, 0.4);
            z-index: 20;
            letter-spacing: 1px;
        }

        #loginBtn.final-state {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(0, 255, 128, 0.5);
            transform: translate(0px, 0px) !important;
            letter-spacing: 1.5px;
        }

        .footer-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .footer-options a {
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: color 0.3s, text-shadow 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-options a:hover {
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-box">
        <!-- Left Landscape Branding -->
        <div class="brand-section">
            <div class="game-title">
                <span class="emoji">🤪</span> Z PAJAL
            </div>
        </div>

        <!-- Right Landscape Form Controls -->
        <div class="form-section">
            <div class="input-group">
                <input type="email" id="gmail" placeholder="Enter Gmail" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            
            <div class="button-wrapper">
                <button id="loginBtn" type="button">START</button>
            </div>

            <div class="footer-options">
                <a href="about.html"><span>🛡️</span> About Game</a>
                <a href="register.html"><span>✨</span> New Account</a>
            </div>
        </div>
    </div>

    <!-- Firebase Authentication & Database Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCK9njPkGdw91_vGhI0_mRflpXBbz2D_zo",
            authDomain: "z-pajal.firebaseapp.com",
            databaseURL: "https://z-pajal-default-rtdb.firebaseio.com",
            projectId: "z-pajal",
            storageBucket: "z-pajal.firebasestorage.app",
            messagingSenderId: "941362119453",
            appId: "1:941362119453:web:c52140dba1952a389197f4",
            measurementId: "G-PKKCQ5CT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Fullscreen API & Landscape Orientation Lock Integration
        async function enableLandscapeFullscreen() {
            const docElement = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (docElement.requestFullscreen) {
                        await docElement.requestFullscreen();
                    } else if (docElement.webkitRequestFullscreen) {
                        await docElement.webkitRequestFullscreen();
                    } else if (docElement.msRequestFullscreen) {
                        await docElement.msRequestFullscreen();
                    }
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {
                // Ignore if browser restricts auto-lock or fullscreen without user gesture
            }
        }

        window.addEventListener('click', enableLandscapeFullscreen, { once: true });
        window.addEventListener('touchstart', enableLandscapeFullscreen, { once: true });

        const loginBtn = document.getElementById('loginBtn');
        const gmailInput = document.getElementById('gmail');
        const passwordInput = document.getElementById('password');
        
        let attempts = 0;
        let isFinalState = false;

        function dodgeAction(e) {
            if (isFinalState) return;

            if(gmailInput.value.trim() === '' || passwordInput.value.trim() === '') return;

            if (attempts < 5) {
                if (e && (e.type === 'click' || e.type === 'touchstart')) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                const moveX = (Math.random() - 0.5) * 220; 
                const moveY = (Math.random() - 0.5) * 120; 
                
                loginBtn.style.transform = `translate(${moveX}px, ${moveY}px)`;
                
                const taunts = ["MISS!", "OOPS!", "NOPE!", "HAHA!", "SLOW!"];
                loginBtn.innerHTML = taunts[attempts];
                
                attempts++;
            } else if (attempts === 5) {
                isFinalState = true;
                loginBtn.classList.add('final-state');
                loginBtn.innerHTML = "GOTCHA! PLAY NOW 🎮";
            }
        }

        loginBtn.addEventListener('mouseenter', dodgeAction);
        loginBtn.addEventListener('touchstart', (e) => {
            if (!isFinalState) {
                e.preventDefault(); 
                dodgeAction(e);
            }
        }, { passive: false });

        loginBtn.addEventListener('click', async (e) => {
            if (!isFinalState) {
                e.preventDefault();
                dodgeAction(e);
                return;
            }

            const email = gmailInput.value.trim();
            const password = passwordInput.value.trim();

            if(email === '' || password === '') {
                alert("Game rules: Pehle Gmail aur Password fill karo!");
                return;
            }

            try {
                loginBtn.innerHTML = "Logging in...";
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                if (!user.emailVerified) {
                    alert("⚠️ Pehle apne Gmail (" + email + ") par jaakar verification link par click karein, tabhi game khulegi!");
                    loginBtn.innerHTML = "GOTCHA! PLAY NOW 🎮";
                    return;
                }

                const sessionId = 'session_' + Math.random().toString(36).substring(2) + Date.now();
                localStorage.setItem('userSessionId', sessionId);

                await set(ref(db, 'users/' + user.uid + '/activeSession'), sessionId);

                alert("🎉 Welcome to 🤪 Z PAJAL! Login successful. Loading Home...");
                
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1000);

            } catch (error) {
                alert("Login Failed: " + error.message);
                loginBtn.innerHTML = "GOTCHA! PLAY NOW 🎮";
            }
        });
    </script>

</body>
</html>

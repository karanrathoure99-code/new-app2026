<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Premium Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Landscape Mode & Responsive Fit for All Devices */
        @media screen and (orientation: portrait) {
            body::before {
                content: "Please rotate your device to Landscape Mode 🔄";
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: #050505;
                color: #fff;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 20px;
                font-weight: 600;
                text-align: center;
                z-index: 99999;
                padding: 20px;
            }
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            background: linear-gradient(to right, #050505, #0a0a0c, #050505);
            overflow: hidden;
            padding: 10px;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 300px; height: 300px;
            background: #ff007f;
            top: -50px; left: -50px;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: #00f0ff;
            bottom: -100px; right: -50px;
            animation-delay: -3s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(50px) scale(1.2); }
        }

        .glass-box {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 25px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .game-title {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .emoji {
            font-size: 35px;
            animation: pulse-light 1.5s infinite alternate;
        }

        @keyframes pulse-light {
            0% { opacity: 0.3; filter: drop-shadow(0 0 5px #ffcc00); transform: scale(0.9); }
            100% { opacity: 1; filter: drop-shadow(0 0 25px #ffcc00); transform: scale(1.1); }
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border: 2px solid #00f0ff;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .button-wrapper {
            position: relative;
            height: 48px;
            margin-top: 5px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #loginBtn {
            position: absolute;
            width: 80px;
            height: 38px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.25s ease-out, width 0.4s ease, height 0.4s ease, background 0.4s ease, font-size 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
            z-index: 20;
        }

        #loginBtn.final-state {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #00b09b, #96c93d);
            font-size: 16px;
            box-shadow: 0 5px 20px rgba(0, 255, 128, 0.5);
            transform: translate(0px, 0px) !important;
        }

        .footer-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-options a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.3s, text-shadow 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .footer-options a:hover {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-box">
        <div class="game-title">
            <span class="emoji">🤪</span> Z PAJAL
        </div>
        
        <div class="input-group">
            <input type="email" id="gmail" placeholder="Enter Gmail" required autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Enter Password" required>
        </div>
        
        <div class="button-wrapper">
            <button id="loginBtn" type="button">START</button>
        </div>

        <div class="footer-options">
            <a href="about.html"><span>🛡️</span> About Game</a>
            <a href="register.html"><span>✨</span> New Account</a>
        </div>
    </div>

    <!-- Firebase Authentication & Database Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCK9njPkGdw91_vGhI0_mRflpXBbz2D_zo",
            authDomain: "z-pajal.firebaseapp.com",
            databaseURL: "https://z-pajal-default-rtdb.firebaseio.com",
            projectId: "z-pajal",
            storageBucket: "z-pajal.firebasestorage.app",
            messagingSenderId: "941362119453",
            appId: "1:941362119453:web:c52140dba1952a389197f4",
            measurementId: "G-PKKCQ5CT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Fullscreen API Integration
        function requestFullscreen() {
            const docElement = document.documentElement;
            if (!document.fullscreenElement) {
                if (docElement.requestFullscreen) {
                    docElement.requestFullscreen().catch(() => {});
                } else if (docElement.webkitRequestFullscreen) {
                    docElement.webkitRequestFullscreen();
                } else if (docElement.msRequestFullscreen) {
                    docElement.msRequestFullscreen();
                }
            }
        }

        window.addEventListener('click', requestFullscreen, { once: true });
        window.addEventListener('touchstart', requestFullscreen, { once: true });

        const loginBtn = document.getElementById('loginBtn');
        const gmailInput = document.getElementById('gmail');
        const passwordInput = document.getElementById('password');
        
        let attempts = 0;
        let isFinalState = false;

        function dodgeAction(e) {
            if (isFinalState) return;

            if(gmailInput.value.trim() === '' || passwordInput.value.trim() === '') return;

            if (attempts < 5) {
                if (e && (e.type === 'click' || e.type === 'touchstart')) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                const moveX = (Math.random() - 0.5) * 220; 
                const moveY = (Math.random() - 0.5) * 120; 
                
                loginBtn.style.transform = `translate(${moveX}px, ${moveY}px)`;
                
                const taunts = ["MISS!", "OOPS!", "NOPE!", "HAHA!", "SLOW!"];
                loginBtn.innerHTML = taunts[attempts];
                
                attempts++;
            } else if (attempts === 5) {
                isFinalState = true;
                loginBtn.classList.add('final-state');
                loginBtn.innerHTML = "GOTCHA! PLAY NOW 🎮";
            }
        }

        loginBtn.addEventListener('mouseenter', dodgeAction);
        loginBtn.addEventListener('touchstart', (e) => {
            if (!isFinalState) {
                e.preventDefault(); 
                dodgeAction(e);
            }
        }, { passive: false });

        loginBtn.addEventListener('click', async (e) => {
            if (!isFinalState) {
                e.preventDefault();
                dodgeAction(e);
                return;
            }

            const email = gmailInput.value.trim();
            const password = passwordInput.value.trim();

            if(email === '' || password === '') {
                alert("Game rules: Pehle Gmail aur Password fill karo!");
                return;
            }

            try {
                loginBtn.innerHTML = "Logging in...";
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                if (!user.emailVerified) {
                    alert("⚠️ Pehle apne Gmail (" + email + ") par jaakar verification link par click karein, tabhi game khulegi!");
                    loginBtn.innerHTML = "GOTCHA! PLAY NOW 🎮";
                    return;
                }

                const sessionId = 'session_' + Math.random().toString(36).substring(2) + Date.now();
                localStorage.setItem('userSessionId', sessionId);

                await set(ref(db, 'users/' + user.uid + '/activeSession'), sessionId);

                alert("🎉 Welcome to 🤪 Z PAJAL! Login successful. Loading Home...");
                
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1000);

            } catch (error) {
                alert("Login Failed: " + error.message);
                loginBtn.innerHTML = "GOTCHA! PLAY NOW 🎮";
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardcore Game - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; /* Gaming terminal vibe */
        }
        
        body {
            background-color: #050505; /* Pitch black */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #ff003c; /* Neon Danger Red */
        }

        .login-container {
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #ff003c;
            padding: 40px 30px;
            width: 350px;
            box-shadow: 0 0 20px #ff003c, inset 0 0 10px #ff003c;
            text-align: center;
            position: relative;
        }

        /* Glitchy title effect */
        .login-container h2 {
            margin-bottom: 30px;
            font-size: 26px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 2px 2px 5px #ff003c;
            animation: pulse 2s infinite;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #555;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            text-align: center;
            letter-spacing: 1px;
        }

        .input-group input:focus {
            border-bottom: 2px solid #ff003c;
            box-shadow: 0 5px 5px -5px #ff003c;
        }

        .input-group input::placeholder {
            color: #666;
            letter-spacing: 2px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #ff003c;
            color: #000;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            letter-spacing: 3px;
        }

        .btn:hover {
            background: #000;
            color: #ff003c;
            border: 1px solid #ff003c;
            box-shadow: 0 0 25px #ff003c;
        }

        .warning-text {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { text-shadow: 2px 2px 5px #ff003c; }
            50% { text-shadow: 0 0 20px #ff003c, 0 0 30px #ff003c; }
            100% { text-shadow: 2px 2px 5px #ff003c; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Enter The Void</h2>
        
        <form onsubmit="event.preventDefault(); alert('Game Starting... Get Ready to Rage!');">
            <div class="input-group">
                <input type="text" placeholder="PLAYER ID" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" placeholder="PASSWORD" required>
            </div>
            
            <button type="submit" class="btn">Start Game</button>
        </form>

        <p class="warning-text">WARNING: EXTREME DIFFICULTY AHEAD</p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Level Devil Style Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Press+Start+2P&family=Poppins:wght@600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Chakra Petch', 'Poppins', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #3d3516;
            background-image: 
                linear-gradient(rgba(255, 204, 0, 0.08) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 204, 0, 0.08) 2px, transparent 2px);
            background-size: 40px 40px;
            overflow: hidden;
            padding: 15px;
            position: relative;
        }

        /* Level Devil Spike Accents */
        body::before, body::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 16px;
            background: repeating-linear-gradient(
                45deg,
                #29230d,
                #29230d 8px,
                transparent 8px,
                transparent 16px
            );
            z-index: 1;
        }
        body::before { top: 0; }
        body::after { bottom: 0; transform: rotate(180deg); }

        /* Floating Devil Blocks */
        .orb {
            position: absolute;
            z-index: 0;
            opacity: 0.25;
            border-radius: 6px;
            border: 4px solid #000;
        }
        .orb-1 {
            width: 90px;
            height: 90px;
            background: #ffcc00;
            top: 15%;
            left: 8%;
            transform: rotate(-12deg);
            box-shadow: 6px 6px 0px #000;
            animation: trollBob 4s infinite alternate ease-in-out;
        }
        .orb-2 {
            width: 110px;
            height: 110px;
            background: #e6b800;
            bottom: 15%;
            right: 8%;
            transform: rotate(15deg);
            box-shadow: 8px 8px 0px #000;
            animation: trollBob 5s infinite alternate-reverse ease-in-out;
        }

        @keyframes trollBob {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-18px) rotate(8deg); }
        }

        /* Level Devil Platform Box (Normal Theme) */
        .glass-box {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            background: #2b2522;
            border: 5px solid #110e0d;
            border-radius: 14px;
            padding: 30px 40px;
            box-shadow: 10px 10px 0px #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 35px;
        }

        /* Left Side: Level Devil Title & Mascot */
        .brand-section {
            flex: 1;
            text-align: center;
        }

        .game-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 20px;
            font-weight: 700;
            color: #ffcc00;
            letter-spacing: 1px;
            text-shadow: 3px 3px 0px #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            line-height: 1.4;
        }

        .emoji {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 70px;
            height: 70px;
            background: #ffcc00;
            border: 4px solid #110e0d;
            border-radius: 10px;
            box-shadow: 5px 5px 0px #000;
            font-size: 38px;
            animation: dummyIdle 1.2s infinite alternate steps(2);
        }

        @keyframes dummyIdle {
            0% { transform: translateY(0) scaleY(1); }
            100% { transform: translateY(-6px) scaleY(0.96); }
        }

        /* Right Side: Form Controls */
        .form-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .input-group {
            margin-bottom: 14px;
            position: relative;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #1a1614;
            border: 3px solid #110e0d;
            border-radius: 8px;
            color: #f7ede2;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.2s ease;
        }

        .input-group input::placeholder {
            color: #8c827a;
            font-weight: 600;
        }

        .input-group input:focus {
            border-color: #ffcc00;
            background: #141110;
            box-shadow: 5px 5px 0px #ffcc00;
        }

        .button-wrapper {
            width: 100%;
            height: 48px;
            margin-top: 6px;
            margin-bottom: 14px;
        }

        #loginBtn {
            width: 100%;
            height: 100%;
            background: #ffcc00;
            color: #110e0d;
            border: 3px solid #110e0d;
            border-radius: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.15s ease;
            letter-spacing: 1px;
        }

        #loginBtn:hover {
            background: #ffd633;
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px #000;
        }

        #loginBtn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        .footer-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 3px dashed #3a322e;
        }

        .footer-options a {
            color: #d8cec4;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1e1917;
            padding: 6px 10px;
            border: 2px solid #110e0d;
            border-radius: 6px;
            box-shadow: 2px 2px 0px #000;
        }

        .footer-options a:hover {
            color: #ffcc00;
            border-color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-box">
        <!-- Left Landscape Branding -->
        <div class="brand-section">
            <div class="game-title">
                <span class="emoji">😈</span>
                <span>Z PAJAL</span>
            </div>
        </div>

        <!-- Right Landscape Form Controls -->
        <div class="form-section">
            <div class="input-group">
                <input type="email" id="gmail" placeholder="Enter Gmail" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            
            <div class="button-wrapper">
                <button id="loginBtn" type="button">START</button>
            </div>

            <div class="footer-options">
                <a href="about.html"><span>🛡️</span> About Game</a>
                <a href="register.html"><span>✨</span> New Account</a>
            </div>
        </div>
    </div>

    <!-- Firebase Authentication & Database Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCK9njPkGdw91_vGhI0_mRflpXBbz2D_zo",
            authDomain: "z-pajal.firebaseapp.com",
            databaseURL: "https://z-pajal-default-rtdb.firebaseio.com",
            projectId: "z-pajal",
            storageBucket: "z-pajal.firebasestorage.app",
            messagingSenderId: "941362119453",
            appId: "1:941362119453:web:c52140dba1952a389197f4",
            measurementId: "G-PKKCQ5CT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Fullscreen API & Landscape Orientation Lock Integration
        async function enableLandscapeFullscreen() {
            const docElement = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (docElement.requestFullscreen) {
                        await docElement.requestFullscreen();
                    } else if (docElement.webkitRequestFullscreen) {
                        await docElement.webkitRequestFullscreen();
                    } else if (docElement.msRequestFullscreen) {
                        await docElement.msRequestFullscreen();
                    }
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {
                // Ignore if browser restricts auto-lock or fullscreen without user gesture
            }
        }

        window.addEventListener('click', enableLandscapeFullscreen, { once: true });
        window.addEventListener('touchstart', enableLandscapeFullscreen, { once: true });

        const loginBtn = document.getElementById('loginBtn');
        const gmailInput = document.getElementById('gmail');
        const passwordInput = document.getElementById('password');

        loginBtn.addEventListener('click', async () => {
            const email = gmailInput.value.trim();
            const password = passwordInput.value.trim();

            if(email === '' || password === '') {
                alert("Game rules: Pehle Gmail aur Password fill karo!");
                return;
            }

            try {
                loginBtn.innerHTML = "LOGGING IN...";
                loginBtn.disabled = true;
                
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                if (!user.emailVerified) {
                    alert("⚠️ Pehle apne Gmail (" + email + ") par jaakar verification link par click karein, tabhi game khulegi!");
                    loginBtn.innerHTML = "START";
                    loginBtn.disabled = false;
                    return;
                }

                const sessionId = 'session_' + Math.random().toString(36).substring(2) + Date.now();
                localStorage.setItem('userSessionId', sessionId);

                await set(ref(db, 'users/' + user.uid + '/activeSession'), sessionId);

                alert("🎉 Welcome to 🤪 Z PAJAL! Login successful. Loading Home...");
                
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1000);

            } catch (error) {
                alert("Login Failed: " + error.message);
                loginBtn.innerHTML = "START";
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>

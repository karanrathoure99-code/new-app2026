<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Gameplay</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020205;
            background: radial-gradient(circle at center, #0f1020 0%, #05050a 70%, #020203 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
        }

        /* Glowing Ambient Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.45;
            animation: float 12s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-1 {
            width: 450px; height: 450px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            top: -120px; left: -100px;
        }
        .orb-2 {
            width: 520px; height: 520px;
            background: linear-gradient(135deg, #00f0ff, #0072ff);
            bottom: -150px; right: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1) rotate(0deg); }
            100% { transform: translateY(30px) scale(1.1) rotate(5deg); }
        }

        /* Centered Game Screen Wrapper */
        .game-wrapper {
            width: 1280px;
            height: 720px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
            z-index: 10;
            transform: scale(var(--scale-factor, 1));
            transform-origin: center center;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        /* Glassmorphism HUD */
        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 16px;
            padding: 8px 22px;
            margin-bottom: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            z-index: 20;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            letter-spacing: 1px;
        }

        .hud-stats {
            display: flex;
            gap: 22px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            align-items: center;
        }

        #scoreDisplay {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        #shieldDisplay {
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
            letter-spacing: 0.5px;
        }

        .hud-right-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .arena-container {
            flex: 1;
            background: rgba(10, 10, 18, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(0, 240, 255, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 8px;
        }

        /* Cyber Background Grid */
        .distractor-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 127, 0.08) 0%, rgba(0, 240, 255, 0.05) 50%, transparent 80%),
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: pulseBg 7s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulseBg {
            0% { opacity: 0.65; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        #gameCanvas {
            width: 100%;
            height: 410px;
            display: block;
            position: relative;
            z-index: 2;
        }

        .controls-overlay {
            position: relative;
            bottom: 0;
            left: 0;
            width: 100%;
            margin-top: 4px;
            padding: 0 8px;
            pointer-events: auto;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
        }

        .control-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
            align-items: center;
        }

        .control-group.right-group {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
        }

        /* Neon Glass Controls */
        .ctrl-btn {
            background: rgba(20, 20, 35, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(0, 240, 255, 0.25);
            border-bottom: 3px solid rgba(0, 240, 255, 0.45);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            width: 95px;
            height: 70px;
            font-size: 16px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            touch-action: manipulation;
            position: relative;
            transition: all 0.15s ease;
        }

        .ctrl-btn:active, .ctrl-btn.pressed {
            transform: translateY(2px) scale(0.97);
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.35), rgba(121, 40, 202, 0.35));
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        .btn-logo {
            font-size: 12px;
            font-weight: 900;
            color: #00f0ff;
            margin-bottom: 2px;
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.6);
        }

        .btn-label {
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.5px;
        }

        .back-btn, .prev-lvl-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .back-btn:hover, .prev-lvl-btn:hover {
            color: #00f0ff;
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        #notificationModal {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid #00f0ff;
            padding: 16px 30px;
            border-radius: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px rgba(0, 240, 255, 0.3);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notificationModal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="notificationModal">🎉 Level Cleared!</div>

    <div class="game-wrapper" id="gameWrapper">
        <div class="game-hud">
            <div class="hud-title" id="levelTitle">⚡ LEVEL 1 ⚡</div>
            <div class="hud-stats">
                <span id="scoreDisplay">COINS: 0/4</span>
                <span id="shieldDisplay">SHIELD: OFF</span>
            </div>
            <div class="hud-right-group">
                <button class="prev-lvl-btn" onclick="goToPrevLevel()">◀ BACK</button>
                <button class="back-btn" onclick="goHome()">QUIT</button>
            </div>
        </div>

        <div class="arena-container">
            <div class="distractor-bg"></div>
            <canvas id="gameCanvas"></canvas>

            <div class="controls-overlay" id="mobileControls">
                <div class="control-group">
                    <button class="ctrl-btn" id="leftBtnM">◀</button>
                    <button class="ctrl-btn" id="rightBtnM">▶</button>
                </div>
                <div class="control-group right-group">
                    <button class="ctrl-btn" id="jumpBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">JUMP</span>
                    </button>
                    <button class="ctrl-btn" id="rightDownBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">DOWN</span>
                    </button>
                    <button class="ctrl-btn" id="shieldBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">SHLD</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleScreenFit(e) {
            if (e.target.closest('button') || e.target.closest('.ctrl-btn') || e.target.closest('.game-hud')) {
                return;
            }
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        window.addEventListener('click', handleScreenFit);
        window.addEventListener('touchstart', handleScreenFit);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let canvasWidth = 1280;
        let canvasHeight = 410;

        function resizeCanvas() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            const scaleX = screenW / 1280;
            const scaleY = screenH / 720;
            const scale = Math.min(scaleX, scaleY) * 0.98;

            document.documentElement.style.setProperty('--scale-factor', scale);

            canvasWidth = 1280;
            canvasHeight = 410;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';

            updateGameLayout();
        }

        // ==========================================
        // 💾 AUTO-RESUME HIGHEST UNLOCKED LEVEL (FIXED)
        // ==========================================
        let savedMaxLevel = parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga')) || 1;
        
        // 🛠️ FIX 1: game20.html ko badal kar game2.html kar diya gaya hai
        if (savedMaxLevel >= 6) {
            window.location.replace("game2.html");
        }

        let currentLevel = savedMaxLevel;
        
        let isDoorOpen = true; 
        let score = 0;
        let shieldActive = false;
        let isExploding = false;
        let isRebuilding = false;
        let rebuildTimer = 0;
        let respawnAuraTimer = 0;
        let isSlowMo = false;
        let fragments = [];
        let particles = [];
        let floatingTexts = [];

        // 🏃 PLAYER STATS
        let player = {
            x: 40,
            y: 100,
            width: 13.0,     
            height: 40.5,    
            vx: 0,
            vy: 0,
            speed: 4.5,       
            jumpForce: -7.8,  
            gravity: 0.38,    
            isGrounded: false,
            animTimer: 0
        };

        let platforms = [];
        let coins = [];
        let goal = { x: 0, y: 0, w: 38, h: 52 };

        function updateGameLayout() {
            score = 0;
            
            const surfaceTop = canvasHeight - 40;
            const surfaceHeight = 40;

            if (currentLevel === 1) {
                document.getElementById('levelTitle').innerText = "⚡『 🪙 Aukaat se bahar hai ye gate, wapas ja 』- Lvl 1 ⚡";
            } else if (currentLevel === 2) {
                document.getElementById('levelTitle').innerText = "🎯『 💎 Aukaat se bahar hai ye gate, wapas ja 』- Lvl 2 ⚡";
            } else if (currentLevel === 3) {
                document.getElementById('levelTitle').innerText = "🚀『 💰 Aukaat se bahar hai ye gate, wapas ja 』- Lvl 3 ⚡";
            } else if (currentLevel === 4) {
                document.getElementById('levelTitle').innerText = "🔥『 🏆 Aukaat se bahar hai ye gate, wapas ja 』- Lvl 4 ⚡";
            } else if (currentLevel === 5) {
                document.getElementById('levelTitle').innerText = "👑『 ✨ Aukaat se bahar hai ye gate, wapas ja 』- Lvl 5 ⚡";
            }

            let totalCoinsInLevel = (currentLevel === 2) ? 6 : 4;
            document.getElementById('scoreDisplay').innerText = "COINS: " + score + "/" + totalCoinsInLevel;

            platforms = [
                { x: 0, y: surfaceTop, w: canvasWidth, h: surfaceHeight, type: 'ground' }
            ];

            if (currentLevel === 1) {
                platforms.push({ x: Math.floor(canvasWidth * 0.45), y: surfaceTop, w: 90, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                isDoorOpen = true;
                player.x = 40;
                player.y = 100;
            } 
            else if (currentLevel === 2) {
                platforms.push({ x: Math.floor(canvasWidth * 0.7), y: surfaceTop, w: 90, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                isDoorOpen = false;
                player.x = 40;
                player.y = 100;
            }
            else if (currentLevel === 3) {
                let sWidth = 80;
                let sHeight = 16;
                let sY = surfaceTop - 50;
                
                platforms.push({ x: 220, y: sY, w: sWidth, h: sHeight, type: 'secondSurface' });
                platforms.push({ x: 480, y: sY, w: sWidth, h: sHeight, type: 'secondSurface' });
                platforms.push({ x: 740, y: sY, w: sWidth, h: sHeight, type: 'secondSurface' });
                platforms.push({ x: 1000, y: sY, w: sWidth, h: sHeight, type: 'secondSurface' });

                isDoorOpen = false;
                player.x = 50;
                player.y = surfaceTop - 90;
            }
            else if (currentLevel === 4) {
                platforms.push({ x: Math.floor(canvasWidth * 0.3), y: surfaceTop - 55, w: 120, h: 18, type: 'secondSurface' });
                platforms.push({ x: Math.floor(canvasWidth * 0.65), y: surfaceTop - 65, w: 120, h: 18, type: 'secondSurface' });
                isDoorOpen = false;
                player.x = 40;
                player.y = 100;
            }
            else if (currentLevel === 5) {
                platforms.push({ x: Math.floor(canvasWidth * 0.2), y: surfaceTop - 50, w: 100, h: 18, type: 'secondSurface' });
                platforms.push({ x: Math.floor(canvasWidth * 0.5), y: surfaceTop - 65, w: 100, h: 18, type: 'secondSurface' });
                platforms.push({ x: Math.floor(canvasWidth * 0.8), y: surfaceTop - 55, w: 100, h: 18, type: 'secondSurface' });
                isDoorOpen = true;
                player.x = 40;
                player.y = 100;
            }

            coins = [];
            let startMargin = 160; 
            let endMargin = 180;   
            let usableWidth = canvasWidth - startMargin - endMargin;
            let coinSpacing = totalCoinsInLevel > 1 ? usableWidth / (totalCoinsInLevel - 1) : 0;

            let boomIndices = [];
            if (currentLevel === 3) {
                boomIndices = [1, 2];
            } else if (currentLevel === 4) {
                boomIndices = [0, 1, 3];
            } else if (currentLevel === 5) {
                boomIndices = [1, 2];
            }

            for (let i = 1; i <= totalCoinsInLevel; i++) {
                let hasBoom = boomIndices.includes(i - 1);
                coins.push({
                    x: startMargin + (i - 1) * coinSpacing,
                    y: surfaceTop - 25,
                    collected: false,
                    radius: 5,
                    isBoom: hasBoom,
                    floatOffset: Math.random() * Math.PI
                });
            }

            goal.y = surfaceTop - goal.h;
            goal.x = canvasWidth - goal.w - 8; 
        }

        function goToPrevLevel() {
            if (currentLevel > 1) {
                currentLevel--;
                player.vx = 0;
                player.vy = 0;
                updateGameLayout();
            } else {
                const modal = document.getElementById('notificationModal');
                modal.innerText = "⚠️ Yeh pehla level hai!";
                modal.classList.add('show');
                setTimeout(() => modal.classList.remove('show'), 1500);
            }
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        resizeCanvas();

        let keys = { left: false, right: false, down: false };

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        window.addEventListener('click', initAudio);
        window.addEventListener('touchstart', initAudio);
        window.addEventListener('keydown', initAudio);

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'coin') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(659.25, now); 
                    osc.frequency.setValueAtTime(987.77, now + 0.08); 
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'blast') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(15, now + 0.5);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'reboot') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        const bindButton = (id, onStart, onEnd) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const handleStart = (e) => {
                if (e) e.preventDefault();
                initAudio();
                btn.classList.add('pressed');
                onStart();
            };
            const handleEnd = (e) => {
                if (e) e.preventDefault();
                btn.classList.remove('pressed');
                onEnd();
            };
            btn.addEventListener('touchstart', handleStart, { passive: false });
            btn.addEventListener('touchend', handleEnd, { passive: false });
            btn.addEventListener('touchcancel', handleEnd, { passive: false });
            btn.addEventListener('mousedown', handleStart);
            btn.addEventListener('mouseup', handleEnd);
            btn.addEventListener('mouseleave', handleEnd);
        };

        bindButton('leftBtnM', () => keys.left = true, () => keys.left = false);
        bindButton('rightBtnM', () => keys.right = true, () => keys.right = false);
        bindButton('rightDownBtnM', () => keys.down = true, () => keys.down = false);

        function triggerJump() {
            if (player.isGrounded && !isExploding && !isRebuilding) {
                player.vy = player.jumpForce; 
                player.isGrounded = false;
                playSound('jump');
                for (let i = 0; i < 6; i++) {
                    particles.push({
                        x: player.x + player.width / 2,
                        y: player.y + player.height,
                        vx: (Math.random() - 0.5) * 2.5,
                        vy: -Math.random() * 1.8,
                        size: Math.random() * 3 + 1,
                        color: 'rgba(0, 240, 255, 0.8)',
                        life: 25
                    });
                }
            }
        }

        const jumpBtnM = document.getElementById('jumpBtnM');
        if (jumpBtnM) {
            const handleJumpAction = (e) => {
                if (e) e.preventDefault();
                initAudio();
                jumpBtnM.classList.add('pressed');
                setTimeout(() => jumpBtnM.classList.remove('pressed'), 150);
                triggerJump();
            };
            jumpBtnM.addEventListener('touchstart', handleJumpAction, { passive: false });
            jumpBtnM.addEventListener('mousedown', handleJumpAction);
        }

        const shieldBtnM = document.getElementById('shieldBtnM');
        if (shieldBtnM) {
            const activateShield = (e) => {
                if (e) e.preventDefault();
                initAudio();
                shieldBtnM.classList.add('pressed');
                shieldActive = true;
                const el = document.getElementById('shieldDisplay');
                el.innerText = "SHIELD: ON";
                el.style.color = "#ff007f";
                el.style.textShadow = "0 0 10px rgba(255, 0, 127, 0.8)";
            };
            const deactivateShield = (e) => {
                if (e) e.preventDefault();
                shieldBtnM.classList.remove('pressed');
                shieldActive = false;
                const el = document.getElementById('shieldDisplay');
                el.innerText = "SHIELD: OFF";
                el.style.color = "#00ffcc";
                el.style.textShadow = "0 0 8px rgba(0, 255, 204, 0.4)";
            };
            shieldBtnM.addEventListener('touchstart', activateShield, { passive: false });
            shieldBtnM.addEventListener('touchend', deactivateShield, { passive: false });
            shieldBtnM.addEventListener('touchcancel', deactivateShield, { passive: false });
            shieldBtnM.addEventListener('mousedown', activateShield);
            shieldBtnM.addEventListener('mouseup', deactivateShield);
            shieldBtnM.addEventListener('mouseleave', deactivateShield);
        }

        window.addEventListener('keydown', e => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'Shift') {
                shieldActive = true;
                const el = document.getElementById('shieldDisplay');
                el.innerText = "SHIELD: ON";
                el.style.color = "#ff007f";
                el.style.textShadow = "0 0 10px rgba(255, 0, 127, 0.8)";
            }
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === 'Shift') {
                shieldActive = false;
                const el = document.getElementById('shieldDisplay');
                el.innerText = "SHIELD: OFF";
                el.style.color = "#00ffcc";
                el.style.textShadow = "0 0 8px rgba(0, 255, 204, 0.4)";
            }
        });

        function triggerExplosion() {
            if (currentLevel !== 3 && currentLevel !== 4 && currentLevel !== 5 && shieldActive) return;
            if (isExploding || isRebuilding) return;
            
            isExploding = true;
            isSlowMo = true;
            playSound('blast');

            let spawnX = (currentLevel === 3) ? 50 : 40;
            let spawnY = (currentLevel === 3) ? (canvasHeight - 40 - 90) : 100;

            fragments = [];
            const colors = ['#00f0ff', '#ff007f', '#00ffcc', '#ffffff', '#7928ca'];
            for (let i = 0; i < 30; i++) {
                fragments.push({
                    x: player.x + Math.random() * player.width,
                    y: player.y + Math.random() * player.height,
                    originX: spawnX + player.width / 2,
                    originY: spawnY + player.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.6) * 12,
                    color: colors[i % colors.length],
                    size: Math.random() * 4 + 2,
                    spin: Math.random() * 0.4
                });
            }

            setTimeout(() => {
                isExploding = false;
                isRebuilding = true;
                rebuildTimer = 1.0;
                playSound('reboot');

                setTimeout(() => {
                    isRebuilding = false;
                    isSlowMo = false;
                    respawnAuraTimer = 35;
                    updateGameLayout();
                }, 800);

            }, 850);
        }

        function checkCoins() {
            coins.forEach(c => {
                if (!c.collected && Math.hypot((player.x + player.width/2) - c.x, (player.y + player.height/2) - c.y) < 22) {
                    c.collected = true;

                    if (c.isBoom) {
                        playSound('blast');
                        triggerExplosion();
                        return;
                    }

                    score += 1; 
                    playSound('coin');
                    
                    floatingTexts.push({ text: '+1', x: c.x, y: c.y - 10, alpha: 1, vy: -1 });

                    if (currentLevel === 2) {
                        let allCollected = coins.every(coin => coin.collected);
                        if (allCollected) {
                            isDoorOpen = true; 
                            floatingTexts.push({ text: 'GATE UNLOCKED!', x: player.x - 30, y: player.y - 20, alpha: 1, vy: -1 });
                        }
                    }
                    else if (currentLevel === 3 && score >= 2) {
                        isDoorOpen = true; 
                        floatingTexts.push({ text: 'GATE UNLOCKED!', x: player.x - 30, y: player.y - 20, alpha: 1, vy: -1 });
                    } 
                    else if (currentLevel === 4 && score >= 1) {
                        isDoorOpen = true; 
                        floatingTexts.push({ text: 'GATE UNLOCKED!', x: player.x - 30, y: player.y - 20, alpha: 1, vy: -1 });
                    }
                    else if (currentLevel === 5 && score >= 1) {
                        isDoorOpen = false;
                        floatingTexts.push({ text: 'GATE LOCKED!', x: player.x - 30, y: player.y - 20, alpha: 1, vy: -1 });
                    }

                    for (let i = 0; i < 8; i++) {
                        particles.push({
                            x: c.x,
                            y: c.y,
                            vx: (Math.random() - 0.5) * 5,
                            vy: (Math.random() - 0.5) * 5,
                            size: Math.random() * 3 + 1,
                            color: '#00f0ff',
                            life: 20
                        });
                    }
                }
            });
        }

        let levelWon = false;

        function update() {
            let timeFactor = isSlowMo ? 0.25 : 1.0;

            if (isExploding) {
                fragments.forEach(f => {
                    f.x += f.vx * timeFactor;
                    f.y += f.vy * timeFactor;
                    f.vy += 0.35 * timeFactor;
                });
                return;
            }

            if (isRebuilding) {
                fragments.forEach(f => {
                    f.x += (f.originX - f.x) * 0.18;
                    f.y += (f.originY - f.y) * 0.18;
                });
                return;
            }

            if (respawnAuraTimer > 0) {
                respawnAuraTimer--;
            }

            if (keys.left) {
                player.vx = -player.speed;
                player.animTimer += 0.18; 
            } else if (keys.right) {
                player.vx = player.speed;
                player.animTimer += 0.18;
            } else {
                player.vx = 0;
                player.animTimer = 0;
            }

            if (!player.isGrounded) {
                player.animTimer += 0.18; 
            }

            if (keys.down) {
                player.height = 24.3; 
            } else {
                player.height = 40.5; 
            }

            player.x += player.vx;

            if (player.x < 0) player.x = 0;
            if (player.x > canvasWidth - player.width) player.x = canvasWidth - player.width;

            player.vy += player.gravity;
            player.y += player.vy;

            player.isGrounded = false;
            platforms.forEach(p => {
                if (p.type === 'hiddenTrap') {
                    let playerCenterX = player.x + player.width / 2;
                    if (!p.triggered && playerCenterX >= p.x && playerCenterX <= p.x + p.w && player.y + player.height >= p.y - 5) {
                        p.triggered = true; 
                        setTimeout(() => triggerExplosion(), 80);
                        return;
                    }
                    if (p.triggered) return; 
                }

                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 12
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            });

            if (player.y > canvasHeight + 100) {
                triggerExplosion();
            }

            checkCoins();

            let playerCenterInsideGoal = (player.x + player.width / 2 >= goal.x && player.x + player.width / 2 <= goal.x + goal.w);

            if (playerCenterInsideGoal && player.y + player.height >= goal.y) {
                if (!isDoorOpen) {
                    player.x = goal.x - player.width - 2; 
                    if (Math.random() < 0.05) { 
                        floatingTexts.push({ text: 'LOCKED!', x: player.x - 10, y: player.y - 10, alpha: 1, vy: -0.5 });
                    }
                } 
                else if (!levelWon) {
                    levelWon = true;
                    playSound('win');
                    
                    const modal = document.getElementById('notificationModal');
                    
                    if (currentLevel < 5) {
                        modal.innerText = "🎉 Yeto ashan tha! 🤪 Level " + currentLevel + " Cleared!";
                        modal.classList.add('show');
                        
                        let nextLvl = currentLevel + 1;
                        let savedMax = parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga')) || 1;
                        if (nextLvl > savedMax) {
                            localStorage.setItem('saveLevel_TumseNaHoPayga', nextLvl);
                        }

                        setTimeout(() => {
                            modal.classList.remove('show');
                            currentLevel = nextLvl;
                            levelWon = false;
                            updateGameLayout();
                        }, 2000);
                    } else {
                        // 🛠️ FIX 2: Level 5 pass hone par game2.html par le jayega
                        localStorage.setItem('saveLevel_TumseNaHoPayga', 6);
                        modal.innerText = "🏆 Yeto ashan tha! 🤪 LEVEL 5 COMPLETED! Opening game2.html...";
                        modal.classList.add('show');
                        setTimeout(() => {
                            window.location.href = "game2.html"; 
                        }, 2000);
                    }
                }
            } else if (!isDoorOpen && player.x + player.width >= goal.x) {
                player.x = goal.x - player.width;
            }

            let maxCoinsDisplay = (currentLevel === 2) ? 6 : 4;
            document.getElementById('scoreDisplay').innerText = "COINS: " + score + "/" + maxCoinsDisplay;

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.03;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Platforms
            platforms.forEach(p => {
                if (p.type === 'hiddenTrap' && p.triggered) return; 
                ctx.fillStyle = '#0c0d18';
                ctx.fillRect(p.x, p.y, p.w, p.h);

                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + p.w, p.y);
                ctx.stroke();
                ctx.shadowBlur = 0; 
            });

            // Coins
            coins.forEach((c) => {
                if (!c.collected) {
                    c.floatOffset += 0.08;
                    let floatY = c.y + Math.sin(c.floatOffset) * 3;

                    ctx.beginPath();
                    ctx.arc(c.x, floatY, c.radius + 3, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(c.x, floatY, c.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#00f0ff';
                    ctx.shadowColor = '#00f0ff';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                }
            });

            // 🚪 90%+ VISIBLE SCI-FI PORTAL GATE
            let gx = goal.x;
            let gy = goal.y;
            let gw = goal.w;
            let gh = goal.h;

            if (isDoorOpen) {
                ctx.fillStyle = 'rgba(0, 255, 204, 0.15)';
                ctx.fillRect(gx - 4, gy - 4, gw + 8, gh + 8);

                ctx.fillStyle = '#031c19';
                ctx.fillRect(gx, gy, gw, gh);

                let portalGrad = ctx.createLinearGradient(gx, gy, gx + gw, gy + gh);
                portalGrad.addColorStop(0, '#00ffcc');
                portalGrad.addColorStop(0.5, '#0072ff');
                portalGrad.addColorStop(1, '#7928ca');
                ctx.fillStyle = portalGrad;
                ctx.fillRect(gx + 4, gy + 4, gw - 8, gh - 4);

                ctx.strokeStyle = '#00ffcc';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 14;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(gx, gy, gw, gh);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(gx + gw / 2 - 1, gy + 8, 2, gh - 16);
            } else {
                ctx.fillStyle = 'rgba(255, 0, 127, 0.15)';
                ctx.fillRect(gx - 4, gy - 4, gw + 8, gh + 8);

                ctx.fillStyle = '#1c0310';
                ctx.fillRect(gx, gy, gw, gh);

                ctx.strokeStyle = '#ff007f';
                ctx.shadowColor = '#ff007f';
                ctx.shadowBlur = 14;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(gx, gy, gw, gh);
                ctx.shadowBlur = 0;

                ctx.strokeStyle = 'rgba(255, 0, 127, 0.7)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(gx + 6, gy + 6);
                ctx.lineTo(gx + gw - 6, gy + gh - 6);
                ctx.moveTo(gx + gw - 6, gy + 6);
                ctx.lineTo(gx + 6, gy + gh - 6);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(gx + gw / 2 - 3, gy + gh / 2 - 4, 6, 8);
            }

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Floating Numbers/Texts
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = 'bold 12px Orbitron, sans-serif';
                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 8;
                ctx.fillText(ft.text, ft.x - 8, ft.y);
                ctx.restore();
            });

            // ✨ NEW REASSEMBLY RENDERING
            if (isExploding || isRebuilding) {
                fragments.forEach(f => {
                    ctx.save();
                    ctx.fillStyle = f.color;
                    ctx.shadowColor = f.color;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(f.x, f.y, f.size, f.size);

                    if (isRebuilding) {
                        ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(f.x, f.y);
                        ctx.lineTo(f.originX, f.originY);
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                if (isRebuilding) {
                    let originX = (currentLevel === 3) ? 50 : 40;
                    let originY = (currentLevel === 3) ? (canvasHeight - 40 - 90) : 100;
                    ctx.beginPath();
                    ctx.arc(originX + player.width / 2, originY + player.height / 2, 26, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(0, 255, 204, 0.7)';
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            } else {
                let px = player.x;
                let py = player.y;

                if (respawnAuraTimer > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(px + player.width / 2, py + player.height / 2, 38 - respawnAuraTimer, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(0, 240, 255, ${respawnAuraTimer / 35})`;
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    ctx.restore();
                }

                if (shieldActive) {
                    ctx.beginPath();
                    ctx.arc(px + player.width/2, py + player.height/2, 23, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 0, 127, 0.25)';
                    ctx.fill();
                    ctx.strokeStyle = '#ff007f';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#ff007f';
                    ctx.shadowBlur = 14;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.beginPath();
                ctx.ellipse(px + player.width/2 + 1, py + player.height + 2, player.width/1.2, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                let legSwing = (player.vx !== 0 || !player.isGrounded) ? Math.sin(player.animTimer) * 4 : 0;
                let isJumpingOrAirborne = !player.isGrounded;
                let jumpStretch = isJumpingOrAirborne ? -2 : 0;

                let headRadius = 4.5;
                let headX = px + player.width/2;
                let headY = py + 5 + jumpStretch;
                
                let headGrad = ctx.createRadialGradient(headX - 1, headY - 1, 0.5, headX, headY, headRadius);
                headGrad.addColorStop(0, '#ffffff');
                headGrad.addColorStop(1, '#a0c4ff');
                
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
                ctx.fill();

                let torsoWidth = 6.3; 
                let torsoX = px + (player.width - torsoWidth) / 2;
                let chestGrad = ctx.createLinearGradient(torsoX, py + 10 + jumpStretch, torsoX + torsoWidth, py + 10 + jumpStretch);
                chestGrad.addColorStop(0, '#00f0ff');
                chestGrad.addColorStop(1, '#7928ca');
                ctx.fillStyle = chestGrad;
                ctx.fillRect(torsoX, py + 10 + jumpStretch, torsoWidth, 13);

                ctx.fillStyle = '#ff007f';
                ctx.fillRect(torsoX - 1, py + 23 + jumpStretch, torsoWidth + 2, 2.2);

                // Arms
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(torsoX - 3.5, py + 12 + jumpStretch, 2.2, 10);  
                ctx.fillRect(torsoX + torsoWidth + 0.8, py + 12 + jumpStretch, 2.2, 10); 

                // Legs
                let legHeight = player.height === 24.3 ? 7 : 12;
                ctx.fillStyle = '#00f0ff';
                ctx.fillRect(torsoX + 0.8 + legSwing, py + 25.2 + jumpStretch, 2.2, legHeight); 
                ctx.fillRect(torsoX + torsoWidth - 3 - legSwing, py + 25.2 + jumpStretch, 2.2, legHeight); 
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        function goHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Rage Platformer (Levels 1-10)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #030308;
            color: #ffffff;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 10px;
        }

        /* Master Wrapper to keep everything strictly inside screen bounds */
        .game-wrapper {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Top HUD Bar */
        .hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            z-index: 20;
            font-family: 'Orbitron', sans-serif;
        }

        .hud div {
            background: rgba(20, 15, 35, 0.8);
            border: 1px solid rgba(255, 0, 85, 0.4);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        /* Game Canvas Container (Auto Scaling) */
        .game-viewport {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 1; /* Automatically adjusts height based on width */
            max-height: 400px;
            background: linear-gradient(to bottom, #0a0818, #151026);
            border: 3px solid rgba(0, 255, 204, 0.4);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.15);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 50% Transparent LOJER Overlay */
        #lojerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(120, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }

        #lojerOverlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        #lojerOverlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 70px;
            font-weight: 900;
            color: #ff0000;
            text-shadow: 0 0 30px #000, 0 0 60px #ff0000;
            animation: shake 0.2s infinite alternate;
        }

        #lojerOverlay p {
            font-size: 18px;
            color: #ffcc00;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 2px 5px #000;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes shake {
            0% { transform: translate(3px, 3px) rotate(0deg); }
            100% { transform: translate(-3px, -3px) rotate(-2deg); }
        }

        /* Win Overlay */
        #winOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 50, 20, 0.6);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
        }

        #winOverlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        #winOverlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 40px;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
            margin-bottom: 15px;
            text-align: center;
        }

        .next-lvl-btn {
            background: linear-gradient(135deg, #00ff88, #00aa55);
            color: #000;
            border: none;
            padding: 14px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
        }

        /* Mobile 3D Glass Effect Controls (Fully Responsive & Fit) */
        .mobile-controls {
            display: none;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            z-index: 20;
            gap: 10px;
        }

        .control-group {
            display: flex;
            gap: 8px;
        }

        .glass-btn {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .glass-btn:active {
            background: rgba(0, 255, 204, 0.25);
            transform: scale(0.92);
        }

        .action-controls {
            display: flex;
            gap: 8px;
        }

        .glass-btn.action {
            background: rgba(255, 0, 119, 0.15);
            border-color: rgba(255, 0, 119, 0.4);
            font-size: 12px;
            border-radius: 12px;
            width: 65px;
            height: 52px;
        }

        .quit-btn {
            background: transparent;
            color: #8c8cb2;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 15px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
        }

        .quit-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Show mobile controls only on mobile screen widths */
        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- Troll Fail Overlay (LOJER) -->
    <div id="lojerOverlay">
        <h2>LOJER 🤪</h2>
        <p id="trollMsg">Achanak hamla ho gaya! Hahaha!</p>
    </div>

    <!-- Win / Next Level Overlay -->
    <div id="winOverlay">
        <h2 id="winTitle">🎉 LEVEL COMPLETED!</h2>
        <button class="next-lvl-btn" onclick="proceedToNextLevel()">NEXT LEVEL ➡</button>
    </div>

    <div class="game-wrapper">
        <div class="hud">
            <div id="hudLevel">LEVEL: 1 / 10</div>
            <div id="hudFail">FAILS: 0</div>
        </div>

        <div class="game-viewport">
            <canvas id="gameCanvas" width="900" height="450"></canvas>
        </div>

        <!-- 3D Glass Effect Mobile Controls -->
        <div class="mobile-controls">
            <div class="control-group">
                <button class="glass-btn" id="btnLeft">◀</button>
                <button class="glass-btn" id="btnRight">▶</button>
                <button class="glass-btn" id="btnDown">▼</button>
            </div>
            <div class="action-controls">
                <button class="glass-btn action" id="btnJump">JUMP</button>
                <button class="glass-btn action" id="btnClimb">CLIMB</button>
                <button class="glass-btn action" id="btnBox">BOX UP</button>
            </div>
        </div>

        <button class="quit-btn" onclick="goHome()">⬅ Quit to Home</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let currentLevel = parseInt(localStorage.getItem('zPajalRageLevel')) || 1;
        if (currentLevel > 10) currentLevel = 1;
        let failCount = 0;
        let levelFinished = false;

        let player = {
            x: 50,
            y: 320,
            width: 30,
            height: 40,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpPower: -10,
            gravity: 0.5,
            isGrounded: false,
            facing: 'right'
        };

        let levelData = {};
        
        function initLevel(lvl) {
            player.x = 50;
            player.y = 320;
            player.vx = 0;
            player.vy = 0;
            levelFinished = false;

            levelData = {
                platforms: [
                    { x: 0, y: 380, w: 900, h: 70, type: 'normal' },
                    { x: 200, y: 290, w: 120, h: 20, type: lvl >= 3 ? 'collapsing' : 'normal' },
                    { x: 400, y: 220, w: 120, h: 20, type: 'normal' },
                    { x: 600, y: 150, w: 120, h: 20, type: lvl >= 5 ? 'fake' : 'normal' }
                ],
                boxes: [
                    { x: 280, y: 340, w: 40, h: 40 },
                    { x: 500, y: 180, w: 40, h: 40 }
                ],
                spikes: [
                    { x: 320, y: 365, w: 60, h: 15 },
                    { x: 520, y: 205, w: 40, h: 15 }
                ],
                walls: [
                    { x: 800, y: 100, w: 20, h: 280 }
                ],
                gate: { x: 840, y: 310, w: 40, h: 70, fleeing: lvl >= 7 }
            };
        }

        // Keyboard Controls
        let keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') { e.preventDefault(); handleClimb(); }
            if (e.code === 'Enter') { e.preventDefault(); handleBoxUp(); }
            if (e.code === 'ArrowUp') { e.preventDefault(); handleJump(); }
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // Touch Controls
        document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
        document.getElementById('btnLeft').addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowLeft'] = false; });
        document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
        document.getElementById('btnRight').addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowRight'] = false; });
        document.getElementById('btnJump').addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(); });
        document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowDown'] = true; });
        document.getElementById('btnDown').addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowDown'] = false; });
        document.getElementById('btnClimb').addEventListener('touchstart', (e) => { e.preventDefault(); handleClimb(); });
        document.getElementById('btnBox').addEventListener('touchstart', (e) => { e.preventDefault(); handleBoxUp(); });

        function handleJump() {
            if (player.isGrounded && !levelFinished) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
            }
        }

        function handleClimb() {
            if (levelFinished) return;
            levelData.walls.forEach(wall => {
                if (player.x + player.width >= wall.x - 15 && player.x <= wall.x + wall.w + 15) {
                    player.vy = -6;
                }
            });
        }

        function handleBoxUp() {
            if (levelFinished) return;
            levelData.boxes.forEach(box => {
                if (Math.abs(player.x - box.x) < 50 && player.y > box.y - 60) {
                    player.vy = -9;
                    player.y = box.y - player.height - 5;
                }
            });
        }

        function playTrollLaughSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                [320, 220, 140].forEach((freq, idx) => {
                    setTimeout(() => {
                        if (audioCtx.state === 'suspended') audioCtx.resume();
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.3);
                    }, idx * 150);
                });
            } catch(e) {}
        }

        function playWellDoneSound() {
            try {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance("Well Done!");
                    utterance.rate = 1.1;
                    utterance.pitch = 1.2;
                    window.speechSynthesis.speak(utterance);
                }
            } catch(e) {}
        }

        function triggerFail(msg) {
            if (levelFinished) return;
            failCount++;
            document.getElementById('hudFail').innerText = `FAILS: ${failCount}`;
            document.getElementById('trollMsg').innerText = msg;
            
            const overlay = document.getElementById('lojerOverlay');
            overlay.classList.add('show');
            playTrollLaughSound();

            setTimeout(() => {
                overlay.classList.remove('show');
                initLevel(currentLevel);
            }, 2000);
        }

        function triggerWin() {
            if (levelFinished) return;
            levelFinished = true;
            playWellDoneSound();
            document.getElementById('winOverlay').classList.add('show');
        }

        function proceedToNextLevel() {
            document.getElementById('winOverlay').classList.remove('show');
            if (currentLevel < 10) {
                currentLevel++;
                localStorage.setItem('zPajalRageLevel', currentLevel);
                document.getElementById('hudLevel').innerText = `LEVEL: ${currentLevel} / 10`;
                initLevel(currentLevel);
            } else {
                alert("👑 BADHAI HO! Tumne saare 10 Rage Levels jeet liye!");
                currentLevel = 1;
                localStorage.setItem('zPajalRageLevel', 1);
                window.location.href = "home.html";
            }
        }

        function update() {
            if (levelFinished) return;

            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -player.speed;
                player.facing = 'left';
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = player.speed;
                player.facing = 'right';
            } else {
                player.vx = 0;
            }

            player.x += player.vx;
            player.vy += player.gravity;
            player.y += player.vy;

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            player.isGrounded = false;
            levelData.platforms.forEach(plat => {
                if (
                    player.x + player.width > plat.x &&
                    player.x < plat.x + plat.w &&
                    player.y + player.height >= plat.y &&
                    player.y + player.height <= plat.y + 15 &&
                    player.vy >= 0
                ) {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;

                    if (plat.type === 'collapsing') {
                        setTimeout(() => { plat.y += 500; }, 400);
                    }
                }
            });

            levelData.boxes.forEach(box => {
                if (
                    player.x + player.width > box.x &&
                    player.x < box.x + box.w &&
                    player.y + player.height >= box.y &&
                    player.y + player.height <= box.y + 10 &&
                    player.vy >= 0
                ) {
                    player.y = box.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            });

            levelData.spikes.forEach(spike => {
                if (
                    player.x + player.width > spike.x &&
                    player.x < spike.x + spike.w &&
                    player.y + player.height > spike.y &&
                    player.y < spike.y + spike.h
                ) {
                    triggerFail("Invisible spike ne attack kar diya! 🤪");
                }
            });

            if (player.y > canvas.height) {
                triggerFail("Zameen gayab ho gayi! Niche gir gaye!");
            }

            let gate = levelData.gate;
            if (gate.fleeing && Math.abs(player.x - gate.x) < 80) {
                gate.x += (Math.random() > 0.5 ? 40 : -40);
                if (gate.x < 600) gate.x = 600;
                if (gate.x > 850) gate.x = 850;
            }

            if (
                player.x + player.width > gate.x &&
                player.x < gate.x + gate.w &&
                player.y + player.height > gate.y &&
                player.y < gate.y + gate.h
            ) {
                triggerWin();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            levelData.platforms.forEach(plat => {
                ctx.fillStyle = plat.type === 'collapsing' ? '#ffaa00' : '#00ffcc';
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            });

            levelData.walls.forEach(wall => {
                ctx.fillStyle = '#9900ff';
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
            });

            levelData.boxes.forEach(box => {
                ctx.fillStyle = '#ff007f';
                ctx.fillRect(box.x, box.y, box.w, box.h);
            });

            levelData.spikes.forEach(spike => {
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.moveTo(spike.x, spike.y + spike.h);
                ctx.lineTo(spike.x + spike.w / 2, spike.y);
                ctx.lineTo(spike.x + spike.w, spike.y + spike.h);
                ctx.fill();
            });

            let gate = levelData.gate;
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(gate.x, gate.y, gate.w, gate.h);
            ctx.fillStyle = '#000';
            ctx.font = '10px Orbitron';
            ctx.fillText("GATE", gate.x + 6, gate.y + 40);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#000';
            let eyeOffset = player.facing === 'right' ? 18 : 6;
            ctx.fillRect(player.x + eyeOffset, player.y + 10, 6, 6);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function goHome() {
            window.location.href = "home.html";
        }

        initLevel(currentLevel);
        loop();
    </script>
</body>
</html>

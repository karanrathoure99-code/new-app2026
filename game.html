<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Level Devil Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #0d0221;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .arcade-cabinet {
            position: relative;
            background: #7209b7;
            border-radius: 14px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.7);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 620px;
            width: 100%;
            height: 95vh;
            max-height: 560px;
            border: 2px solid #f72585;
        }

        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #3a0ca3;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #4cc9f0;
            box-shadow: 0 3px 0px #170242;
        }

        .hud-tools {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #f72585;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #b5179e;
        }

        /* Puzzle Chamber */
        .puzzle-chamber {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        /* Maze Walls */
        .maze-wall {
            position: absolute;
            background: #3a0ca3;
            border-radius: 2px;
            box-shadow: 0 2px 0px #170242;
            transition: opacity 0.2s ease;
        }

        /* Level Devil Surprise Traps */
        .devil-trap {
            position: absolute;
            background: #f72585;
            border-radius: 2px;
            box-shadow: 0 0 8px #f72585;
        }

        /* Animated Character */
        .dummy-character {
            position: absolute;
            width: 14px;
            height: 22px;
            z-index: 10;
            transition: top 0.05s linear, left 0.05s linear;
        }

        .dummy-head {
            position: absolute;
            top: 0;
            left: 3px;
            width: 8px;
            height: 8px;
            background: #ffdbac;
            border-radius: 50%;
        }

        .dummy-body {
            position: absolute;
            top: 7px;
            left: 5px;
            width: 4px;
            height: 8px;
            background: #4cc9f0;
            border-radius: 1px;
        }

        .dummy-arm-left, .dummy-arm-right {
            position: absolute;
            top: 8px;
            width: 5px;
            height: 2px;
            background: #3a0ca3;
            border-radius: 1px;
            transition: transform 0.1s ease;
        }
        .dummy-arm-left { left: 0px; transform-origin: right center; }
        .dummy-arm-right { right: 0px; transform-origin: left center; }

        .dummy-leg-left, .dummy-leg-right {
            position: absolute;
            bottom: 0;
            width: 2.5px;
            height: 7px;
            background: #170242;
            border-radius: 1px;
            transition: transform 0.1s ease;
        }
        .dummy-leg-left { left: 3px; transform-origin: top center; }
        .dummy-leg-right { right: 3px; transform-origin: top center; }

        /* Walking Animation Classes */
        .walking-left .dummy-leg-left { transform: rotate(35deg); }
        .walking-left .dummy-leg-right { transform: rotate(-35deg); }
        .walking-right .dummy-leg-left { transform: rotate(-35deg); }
        .walking-right .dummy-leg-right { transform: rotate(35deg); }

        /* Jumping Animation Class */
        .jumping .dummy-arm-left { transform: rotate(-50deg); }
        .jumping .dummy-arm-right { transform: rotate(50deg); }
        .jumping .dummy-leg-left { transform: rotate(-25deg); }
        .jumping .dummy-leg-right { transform: rotate(25deg); }

        /* Trophy */
        .trophy-target {
            position: absolute;
            font-size: 18px;
            z-index: 5;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .clue-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #f72585;
            color: #fff;
            font-weight: 700;
            font-size: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 20;
            text-align: center;
            width: calc(100% - 12px);
        }

        .bottom-action-bar {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
            padding: 0 4px;
        }

        .control-btn {
            background: #4cc9f0;
            color: #170242;
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3a0ca3;
            text-align: center;
            font-weight: bold;
        }

        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #3a0ca3;
        }

        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #f8f9fa;
            border: 2px solid #7209b7;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 85%;
            max-width: 300px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.7);
        }

        .modal-btn {
            background: #7209b7;
            color: #fff;
            padding: 8px 12px;
            font-size: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud-bar">
            <div>
                <span id="lvlLabel">LEVEL: 1</span>
                <span style="margin-left: 10px;" id="failsLabel">FAILS: 0</span>
            </div>
            <div class="hud-tools">
                <button class="hud-btn" onclick="resetGame()">🔄 RESTART</button>
            </div>
        </div>

        <!-- Puzzle Chamber -->
        <div class="puzzle-chamber" id="chamber">
            <div class="clue-box" id="msgBox">Level Devil: रास्तों पर भरोसा मत करो!</div>
            
            <div id="levelContent"></div>

            <!-- Character -->
            <div class="dummy-character" id="dummy">
                <div class="dummy-head"></div>
                <div class="dummy-body"></div>
                <div class="dummy-arm-left"></div>
                <div class="dummy-arm-right"></div>
                <div class="dummy-leg-left"></div>
                <div class="dummy-leg-right"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="bottom-action-bar">
            <div></div>
            <button class="control-btn" onmousedown="moveChar(0, -10)" ontouchstart="moveChar(0, -10)">⬆️ UP</button>
            <div></div>
            <button class="control-btn" onmousedown="moveChar(-10, 0)" ontouchstart="moveChar(-10, 0)">⬅️ LEFT</button>
            <button class="control-btn" onmousedown="moveChar(0, 10)" ontouchstart="moveChar(0, 10)">⬇️ DOWN</button>
            <button class="control-btn" onmousedown="moveChar(10, 0)" ontouchstart="moveChar(10, 0)">➡️ RIGHT</button>
        </div>

        <!-- Modal -->
        <div class="popup-modal" id="winModal">
            <h2 id="modalTitle" style="color: #7209b7; font-size: 12px; margin-bottom: 8px;">🎉 LEVEL CLEARED!</h2>
            <p id="modalDesc" style="font-family: 'Chakra Petch'; font-size: 11px; margin-bottom: 10px; color: #170242;">अगले लेवल पर चलते हैं!</p>
            <button class="modal-btn" id="nextBtn" onclick="nextLevel()">AGAIN 🔄</button>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        let posX = 15;
        let posY = 15;
        let fails = 0;
        let isOver = false;

        const dummy = document.getElementById('dummy');
        const winModal = document.getElementById('winModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const failsLabel = document.getElementById('failsLabel');
        const lvlLabel = document.getElementById('lvlLabel');
        const levelContent = document.getElementById('levelContent');
        const msgBox = document.getElementById('msgBox');

        // 😈 LEVEL DEVIL & MULTI-LEVEL CONFIGURATION
        const levelsData = {
            1: {
                startPos: { x: 15, y: 15 },
                trophyPos: { top: '220px', right: '30px' },
                walls: [
                    { width: '10px', height: '170px', top: '40px', left: '70px', fake: false },
                    { width: '160px', height: '10px', top: '110px', left: '70px', fake: true, hint: "ओह! यहाँ की दीवार अचानक गायब हो गई!" },
                    { width: '10px', height: '130px', top: '40px', left: '230px', fake: false },
                    { width: '140px', height: '10px', top: '160px', left: '230px', fake: false }
                ],
                devilTraps: [
                    { width: '30px', height: '10px', top: '100px', left: '150px' }
                ]
            },
            2: {
                startPos: { x: 15, y: 250 },
                trophyPos: { top: '20px', right: '30px' },
                walls: [
                    { width: '220px', height: '10px', top: '180px', left: '30px', fake: false },
                    { width: '10px', height: '140px', top: '40px', left: '250px', fake: true, hint: "सतर्क रहो! डेविल ट्रैप एक्टिव हो गया!" },
                    { width: '180px', height: '10px', top: '80px', left: '150px', fake: false }
                ],
                devilTraps: [
                    { width: '10px', height: '40px', top: '100px', left: '200px' }
                ]
            },
            3: {
                startPos: { x: 280, y: 15 },
                trophyPos: { bottom: '20px', left: '30px' },
                walls: [
                    { width: '10px', height: '200px', top: '20px', left: '200px', fake: false },
                    { width: '150px', height: '10px', top: '120px', left: '50px', fake: true, hint: "ट्रॉफी आपको देखकर भाग रही है!" }
                ],
                devilTraps: []
            }
        };

        function loadLevel(lvl) {
            currentLevel = lvl;
            lvlLabel.innerText = "LEVEL: " + currentLevel;
            
            let data = levelsData[currentLevel] || levelsData[1];
            posX = data.startPos.x;
            posY = data.startPos.y;
            
            dummy.style.left = posX + 'px';
            dummy.style.top = posY + 'px';

            let html = `<div class="trophy-target" id="trophy" style="${data.trophyPos.top ? 'top:'+data.trophyPos.top : 'bottom:'+data.trophyPos.bottom}; ${data.trophyPos.right ? 'right:'+data.trophyPos.right : 'left:'+data.trophyPos.left}">🏆</div>`;
            
            data.walls.forEach((w, index) => {
                html += `<div class="maze-wall" id="wall_${index}" style="width:${w.width}; height:${w.height}; top:${w.top}; left:${w.left};"></div>`;
            });

            data.devilTraps.forEach((t, index) => {
                html += `<div class="devil-trap" id="trap_${index}" style="width:${t.width}; height:${t.height}; top:${t.top}; left:${t.left};"></div>`;
            });

            levelContent.innerHTML = html;
            winModal.style.display = "none";
            isOver = false;
        }

        function moveChar(dx, dy) {
            if (isOver) return;

            posX += dx;
            posY += dy;

            let chamber = document.getElementById('chamber');
            posX = Math.max(5, Math.min(posX, chamber.clientWidth - 20));
            posY = Math.max(5, Math.min(posY, chamber.clientHeight - 25));

            dummy.style.left = posX + 'px';
            dummy.style.top = posY + 'px';

            // Animation Trigger
            if (dx > 0) {
                dummy.className = "dummy-character walking-right";
            } else if (dx < 0) {
                dummy.className = "dummy-character walking-left";
            } else {
                dummy.className = "dummy-character jumping";
            }

            setTimeout(() => {
                if(!isOver) dummy.className = "dummy-character";
            }, 150);

            // Level Devil Fake Wall Mechanic
            let data = levelsData[currentLevel];
            data.walls.forEach((w, index) => {
                if (w.fake) {
                    let wallEl = document.getElementById(`wall_${index}`);
                    if (wallEl) {
                        let wRect = wallEl.getBoundingClientRect();
                        let dRect = dummy.getBoundingClientRect();
                        if (Math.abs(dRect.left - wRect.left) < 45 && Math.abs(dRect.top - wRect.top) < 45) {
                            wallEl.style.opacity = '0';
                            msgBox.innerText = w.hint;
                        }
                    }
                }
            });

            checkCollisions();
        }

        function checkCollisions() {
            const dRect = dummy.getBoundingClientRect();
            const walls = document.querySelectorAll('.maze-wall');
            
            let hitWall = false;
            walls.forEach(wall => {
                if (wall.style.opacity !== '0') {
                    const wRect = wall.getBoundingClientRect();
                    if (!(dRect.right < wRect.left || 
                          dRect.left > wRect.right || 
                          dRect.bottom < wRect.top || 
                          dRect.top > wRect.bottom)) {
                        hitWall = true;
                    }
                }
            });

            const traps = document.querySelectorAll('.devil-trap');
            traps.forEach(trap => {
                const tRect = trap.getBoundingClientRect();
                if (!(dRect.right < tRect.left || 
                      dRect.left > tRect.right || 
                      dRect.bottom < tRect.top || 
                      dRect.top > tRect.bottom)) {
                    hitWall = true;
                }
            });

            if (hitWall) {
                triggerFail("Level Devil के ट्रैप ने पकड़ लिया!");
                return;
            }

            const trophy = document.getElementById('trophy');
            if (trophy) {
                if (currentLevel === 3 && posX > 150 && Math.random() < 0.25) {
                    trophy.style.top = (Math.random() * 150 + 20) + 'px';
                    trophy.style.left = (Math.random() * 150 + 50) + 'px';
                    msgBox.innerText = "हाहा! ट्रॉफी अपनी जगह बदल रही है!";
                }

                const tRect = trophy.getBoundingClientRect();
                if (!(dRect.right < tRect.left || 
                      dRect.left > tRect.right || 
                      dRect.bottom < tRect.top || 
                      dRect.top > tRect.bottom)) {
                    triggerWin();
                }
            }
        }

        function triggerFail(reason) {
            if (isOver) return;
            isOver = true;
            fails++;
            failsLabel.innerText = "FAILS: " + fails;

            modalTitle.style.color = "#f72585";
            modalTitle.innerText = "💀 TROLLED! (FAIL)";
            modalDesc.innerText = reason + " ईगो हर्ट हुआ? फिर से कोशिश करो!";
            document.getElementById('nextBtn').innerText = "AGAIN 🔄";
            document.getElementById('nextBtn').onclick = () => loadLevel(currentLevel);
            winModal.style.display = "block";
        }

        function triggerWin() {
            if (isOver) return;
            isOver = true;
            modalTitle.style.color = "#4cc9f0";
            modalTitle.innerText = "🎉 LEVEL CLEARED!";
            modalDesc.innerText = "अद्भुत! आपने इस खतरनाक लेवल को पार कर लिया।";
            document.getElementById('nextBtn').innerText = "NEXT LEVEL ➡️";
            document.getElementById('nextBtn').onclick = () => {
                if(levelsData[currentLevel + 1]) {
                    loadLevel(currentLevel + 1);
                } else {
                    modalTitle.innerText = "🏆 GAME COMPLETED!";
                    modalDesc.innerText = "आपने सभी Level Devil लेवल्स जीत लिए!";
                    document.getElementById('nextBtn').innerText = "RESTART GAME 🔄";
                    document.getElementById('nextBtn').onclick = () => loadLevel(1);
                    winModal.style.display = "block";
                }
            };
            winModal.style.display = "block";
        }

        function resetGame() {
            loadLevel(currentLevel);
        }

        loadLevel(1);
    </script>
</body>
</html>

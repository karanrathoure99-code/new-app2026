<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tactical Dummy Mission - Dense Forest & Indoor Camera Fixed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #ui span {
            color: #4CAF50;
            font-weight: bold;
        }
        #health-bar-container {
            width: 150px;
            height: 12px;
            background: #555;
            border-radius: 6px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.2s;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            margin: -5px 0 0 -5px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">
        <strong>Health:</strong> 
        <div id="health-bar-container"><div id="health-bar"></div></div><br>
        <strong>Mission Status:</strong> <span id="status">Explore Dense Grass Forest, enter houses, get Gun & eliminate targets!</span><br>
        Targets Left: <span id="targetCount">12</span> | Weapon: <span id="weaponStatus">Unarmed</span>
    </div>
    <div id="crosshair"></div>

    <!-- Include Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let character;
        let head, torso, leftArm, rightArm, leftLeg, rightLeg;
        let obstacles = [];
        let doors = [];
        let enemies = [];
        let gunObject = null;
        let hasGun = false;
        let targetsRemaining = 12;
        let playerHealth = 100;
        let isGameOver = false;
        
        let velocityY = 0;
        let gravity = 0.012;
        let isGrounded = false;
        const moveSpeed = 0.13;
        const jumpForce = 0.42;
        
        let keys = { w: false, a: false, s: false, d: false, space: false };
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleX = 0, cameraAngleY = 0.85;

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
            dirLight.position.set(120, 180, 120);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -250;
            dirLight.shadow.camera.right = 250;
            dirLight.shadow.camera.top = 250;
            dirLight.shadow.camera.bottom = -250;
            scene.add(dirLight);

            // 5. Expanded Ground (500x500 Full Area)
            const mapSize = 500;
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e3f20, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 6. Boundary Walls
            const wallH = 8;
            const wMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 });
            createBoundaryWall(0, wallH/2, -mapSize/2, mapSize, wallH, 2, wMat);
            createBoundaryWall(0, wallH/2, mapSize/2, mapSize, wallH, 2, wMat);
            createBoundaryWall(-mapSize/2, wallH/2, 0, 2, wallH, mapSize, wMat);
            createBoundaryWall(mapSize/2, wallH/2, 0, 2, wallH, mapSize, wMat);

            // 7. Generate Dense Grass, Flowers, Trees, and Plants across 500x500
            generateDenseForestAndFlora(mapSize);

            // 8. Spread Multi-Story Houses Across 500x500 Area
            createHouse(-120, 0, -120, 1);
            createHouse(120, 0, -120, 2);
            createHouse(-120, 0, 120, 3);
            createHouse(120, 0, 120, 2);
            createHouse(0, 0, -180, 3);
            createHouse(0, 0, 180, 1);
            createHouse(-180, 0, 0, 2);
            createHouse(180, 0, 0, 3);

            // 9. Spread Cover Boxes Across 500x500 Area
            for(let x = -210; x <= 210; x += 60) {
                for(let z = -210; z <= 210; z += 60) {
                    if(Math.abs(x) > 40 || Math.abs(z) > 40) {
                        createCoverBox(x + (Math.random()*20 - 10), z + (Math.random()*20 - 10), 6.0, 2.5, 6.0);
                    }
                }
            }

            // 10. Place Gun Inside House (-120, 0, -120)
            createGun(-120, 0.3, -120);

            // 11. Spawn 12 Enemy Dummies Across the Map
            const enemyCoords = [
                {x: 100, z: -100}, {x: -100, z: 150}, {x: 150, z: 100}, 
                {x: -60, z: -180}, {x: 80, z: 180}, {x: -180, z: -60},
                {x: 40, z: 40}, {x: -120, z: 80}, {x: 180, z: -150}, {x: 0, z: -80},
                {x: -160, z: -160}, {x: 160, z: 160}
            ];
            enemyCoords.forEach(e => createEnemy(e.x, 0, e.z));

            // 12. Build Dummy Character
            character = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x337ab7 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

            torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), shirtMat);
            torso.position.y = 0.9; torso.castShadow = true;
            character.add(torso);

            head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), skinMat);
            head.position.y = 1.35; head.castShadow = true;
            character.add(head);

            const armGeo = new THREE.BoxGeometry(0.15, 0.5, 0.15);
            leftArm = new THREE.Mesh(armGeo, skinMat);
            leftArm.position.set(-0.35, 0.9, 0); character.add(leftArm);

            rightArm = new THREE.Mesh(armGeo, skinMat);
            rightArm.position.set(0.35, 0.9, 0); character.add(rightArm);

            const legGeo = new THREE.BoxGeometry(0.18, 0.6, 0.18);
            leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.set(-0.15, 0.3, 0); character.add(leftLeg);

            rightLeg = new THREE.Mesh(legGeo, pantsMat);
            rightLeg.position.set(0.15, 0.3, 0); character.add(rightLeg);

            character.position.set(0, 0, 220);
            scene.add(character);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            
            window.addEventListener('mousedown', (e) => {
                if (e.button === 0 && !isGameOver) {
                    isMouseDown = true;
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    shootGun();
                }
            });
            window.addEventListener('mouseup', () => { isMouseDown = false; });
            window.addEventListener('mousemove', onMouseMove);
        }

        // Procedural Dense Grass, Flowers & Trees Generator (Surface covered with 🌾)
        function generateDenseForestAndFlora(size) {
            const half = size / 2 - 15;
            
            // Generate massive dense grass patches (🌾) so surface is fully hidden
            for (let i = 0; i < 2500; i++) {
                let x = (Math.random() - 0.5) * half * 2;
                let z = (Math.random() - 0.5) * half * 2;
                if (Math.abs(x) < 30 && Math.abs(z) < 30) continue; // Keep center clear
                createGrassBlade(x, z);
            }

            // Generate trees, flowers, bushes (🎄🌹🌺🌵🪴🌿🌳🌲🌾🍄🌻💮🌸🪷🌷🌺)
            for (let i = 0; i < 200; i++) {
                let x = (Math.random() - 0.5) * half * 2;
                let z = (Math.random() - 0.5) * half * 2;
                if (Math.abs(x) < 35 && Math.abs(z) < 35) continue;

                let rand = Math.random();
                if (rand < 0.3) createPineTree(x, z);
                else if (rand < 0.55) createFruitTree(x, z);
                else if (rand < 0.75) createFlowerCluster(x, z);
                else if (rand < 0.9) createCactusOrPlant(x, z);
                else createMushroomCluster(x, z);
            }
        }

        function createGrassBlade(x, z) {
            const grassMat = new THREE.MeshBasicMaterial({ color: 0x3da35d, side: THREE.DoubleSide });
            const grassGeo = new THREE.PlaneGeometry(0.3, 0.8);
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.position.set(x + (Math.random()-0.5)*2, 0.4, z + (Math.random()-0.5)*2);
            grass.rotation.y = Math.random() * Math.PI;
            scene.add(grass);
        }

        function createPineTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
            trunk.position.set(x, 2, z); trunk.castShadow = true; scene.add(trunk);
            addObstacleBox(x, 2, z, 0.8, 4, 0.8);

            const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 6, 6), new THREE.MeshStandardMaterial({ color: 0x1e4620 }));
            leaves.position.set(x, 5.5, z); leaves.castShadow = true; scene.add(leaves);
        }

        function createFruitTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 4.5), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
            trunk.position.set(x, 2.25, z); trunk.castShadow = true; scene.add(trunk);
            addObstacleBox(x, 2.25, z, 1.0, 4.5, 1.0);

            const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.2, 6, 6), new THREE.MeshStandardMaterial({ color: 0x2e8b57 }));
            leaves.position.set(x, 5.2, z); leaves.castShadow = true; scene.add(leaves);

            for(let f = 0; f < 5; f++) {
                const fruit = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 6), new THREE.MeshStandardMaterial({ color: 0xff3300 }));
                fruit.position.set(x + (Math.random()-0.5)*2, 5 + (Math.random()-0.5)*1.5, z + (Math.random()-0.5)*2);
                scene.add(fruit);
            }
        }

        function createFlowerCluster(x, z) {
            const colors = [0xff69b4, 0xffff00, 0xff4500, 0xda70d6, 0xff1493, 0x9400d3];
            for(let c = 0; c < 6; c++) {
                let flower = new THREE.Mesh(new THREE.SphereGeometry(0.25, 5, 5), new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*colors.length)] }));
                flower.position.set(x + (Math.random()*1.5 - 0.75), 0.15, z + (Math.random()*1.5 - 0.75));
                scene.add(flower);
            }
        }

        function createCactusOrPlant(x, z) {
            const bush = new THREE.Mesh(new THREE.DodecahedronGeometry(1.0), new THREE.MeshStandardMaterial({ color: 0x2e8b57 }));
            bush.position.set(x, 0.5, z); bush.castShadow = true; scene.add(bush);
            addObstacleBox(x, 0.5, z, 1.5, 1.0, 1.5);
        }

        function createMushroomCluster(x, z) {
            const cap = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.3, 6), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
            cap.position.set(x, 0.3, z); scene.add(cap);
        }

        function createBoundaryWall(x, y, z, w, h, d, mat) {
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            addObstacleBox(x, y, z, w, h, d);
        }

        function createHouse(x, y, z, floors) {
            const houseWidth = 14;
            const floorHeight = 4.5;
            const houseDepth = 14;
            const wallThickness = 0.5;
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xd9c3b0, roughness: 0.7 });

            for(let f = 0; f < floors; f++) {
                let currentY = y + f * floorHeight;

                let backWall = new THREE.Mesh(new THREE.BoxGeometry(houseWidth, floorHeight, wallThickness), wallMat);
                backWall.position.set(x, currentY + floorHeight/2, z - houseDepth/2);
                scene.add(backWall);
                addObstacleBox(backWall.position.x, backWall.position.y, backWall.position.z, houseWidth, floorHeight, wallThickness);

                let leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, floorHeight, houseDepth), wallMat);
                leftWall.position.set(x - houseWidth/2, currentY + floorHeight/2, z);
                scene.add(leftWall);
                addObstacleBox(leftWall.position.x, leftWall.position.y, leftWall.position.z, wallThickness, floorHeight, houseDepth);

                let rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, floorHeight, houseDepth), wallMat);
                rightWall.position.set(x + houseWidth/2, currentY + floorHeight/2, z);
                scene.add(rightWall);
                addObstacleBox(rightWall.position.x, rightWall.position.y, rightWall.position.z, wallThickness, floorHeight, houseDepth);

                if (f === 0) {
                    let frontWall1 = new THREE.Mesh(new THREE.BoxGeometry(5, floorHeight, wallThickness), wallMat);
                    frontWall1.position.set(x - 4.5, currentY + floorHeight/2, z + houseDepth/2);
                    scene.add(frontWall1);
                    addObstacleBox(frontWall1.position.x, frontWall1.position.y, frontWall1.position.z, 5, floorHeight, wallThickness);

                    let frontWall2 = new THREE.Mesh(new THREE.BoxGeometry(5, floorHeight, wallThickness), wallMat);
                    frontWall2.position.set(x + 4.5, currentY + floorHeight/2, z + houseDepth/2);
                    scene.add(frontWall2);
                    addObstacleBox(frontWall2.position.x, frontWall2.position.y, frontWall2.position.z, 5, floorHeight, wallThickness);

                    let doorTop = new THREE.Mesh(new THREE.BoxGeometry(4, 1, wallThickness), wallMat);
                    doorTop.position.set(x, currentY + 4, z + houseDepth/2);
                    scene.add(doorTop);
                    addObstacleBox(doorTop.position.x, doorTop.position.y, doorTop.position.z, 4, 1, wallThickness);

                    // Real Hinge Door
                    const doorGroup = new THREE.Group();
                    const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 3.5, 0.2), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
                    doorMesh.position.set(2, 0, 0);
                    doorMesh.castShadow = true;
                    doorGroup.add(doorMesh);
                    doorGroup.position.set(x - 2, currentY + 1.75, z + houseDepth/2);
                    scene.add(doorGroup);

                    doors.push({
                        group: doorGroup,
                        closedRotY: 0,
                        openRotY: -Math.PI / 2,
                        closedX: x, closedZ: z + houseDepth/2
                    });
                } else {
                    let frontWall = new THREE.Mesh(new THREE.BoxGeometry(houseWidth, floorHeight, wallThickness), wallMat);
                    frontWall.position.set(x, currentY + floorHeight/2, z + houseDepth/2);
                    scene.add(frontWall);
                    addObstacleBox(frontWall.position.x, frontWall.position.y, frontWall.position.z, houseWidth, floorHeight, wallThickness);
                }

                if (f < floors - 1 || floors > 1) {
                    let floorSlab = new THREE.Mesh(new THREE.BoxGeometry(houseWidth - 0.5, 0.3, houseDepth - 0.5), wallMat);
                    floorSlab.position.set(x, currentY + floorHeight, z);
                    scene.add(floorSlab);
                    addObstacleBox(floorSlab.position.x, floorSlab.position.y, floorSlab.position.z, houseWidth - 0.5, 0.3, houseDepth - 0.5);
                }

                if (f < floors - 1) {
                    for (let s = 0; s < 8; s++) {
                        let stairStep = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x555 }));
                        stairStep.position.set(x - 4, currentY + 0.3 + s * 0.5, z - 4 + s * 0.6);
                        scene.add(stairStep);
                        addObstacleBox(stairStep.position.x, stairStep.position.y, stairStep.position.z, 2, 0.2, 0.6);
                    }
                }
            }

            const roofMat = new THREE.MeshStandardMaterial({ color: 0xa93226, roughness: 0.6 });
            let roof = new THREE.Mesh(new THREE.BoxGeometry(houseWidth + 1.5, 0.6, houseDepth + 1.5), roofMat);
            roof.position.set(x, y + floors * floorHeight + 0.3, z);
            roof.castShadow = true;
            scene.add(roof);
            addObstacleBox(roof.position.x, roof.position.y, roof.position.z, houseWidth + 1.5, 0.6, houseDepth + 1.5);
        }

        function createCoverBox(x, z, w, h, d) {
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.5 }));
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            addObstacleBox(x, h / 2, z, w, h, d);
        }

        function addObstacleBox(x, y, z, w, h, d) {
            obstacles.push({
                minX: x - w / 2, maxX: x + w / 2,
                minZ: z - d / 2, maxZ: z + d / 2,
                minY: y - h / 2, maxY: y + h / 2,
                topY: y + h / 2
            });
        }

        function createGun(x, y, z) {
            gunObject = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.2), new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.8 }));
            gunObject.position.set(x, y, z);
            scene.add(gunObject);
        }

        function createEnemy(x, y, z) {
            let enemyGroup = new THREE.Group();
            let torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), new THREE.MeshStandardMaterial({ color: 0xe74c3c }));
            torso.position.y = 0.9; torso.castShadow = true;
            enemyGroup.add(torso);

            let head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 1.35; head.castShadow = true;
            enemyGroup.add(head);

            enemyGroup.position.set(x, y, z);
            scene.add(enemyGroup);
            enemies.push(enemyGroup);
        }

        function handleKey(e, isDown) {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.w = isDown; break;
                case 'KeyS': case 'ArrowDown': keys.s = isDown; break;
                case 'KeyA': case 'ArrowLeft': keys.a = isDown; break;
                case 'KeyD': case 'ArrowRight': keys.d = isDown; break;
                case 'Space': 
                    if (isDown && isGrounded && !isGameOver) { velocityY = jumpForce; isGrounded = false; }
                    break;
            }
        }

        function onMouseMove(e) {
            if (!isMouseDown || isGameOver) return;
            cameraAngleX -= (e.clientX - mouseX) * 0.005;
            cameraAngleY = Math.max(0.2, Math.min(1.4, cameraAngleY - (e.clientY - mouseY) * 0.005));
            mouseX = e.clientX; mouseY = e.clientY;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function shootGun() {
            if (!hasGun || targetsRemaining <= 0) return;
            let raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            let enemyMeshes = [];
            enemies.forEach(en => { enemyMeshes.push(en.children[0]); enemyMeshes.push(en.children[1]); });

            let intersects = raycaster.intersectObjects(enemyMeshes);
            if (intersects.length > 0) {
                let hitEnemyGroup = intersects[0].object.parent;
                scene.remove(hitEnemyGroup);
                enemies = enemies.filter(e => e !== hitEnemyGroup);
                targetsRemaining--;
                document.getElementById('targetCount').innerText = targetsRemaining;
                if (targetsRemaining === 0) {
                    document.getElementById('status').innerHTML = '<span style="color:yellow;">Mission Complete! All targets eliminated!</span>';
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) return;

            let inputX = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
            let inputZ = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
            let moveX = 0, moveZ = 0;

            if (inputX !== 0 || inputZ !== 0) {
                let angle = cameraAngleX;
                moveX = (inputX * Math.cos(angle) + inputZ * Math.sin(angle)) * moveSpeed;
                moveZ = (inputZ * Math.cos(angle) - inputX * Math.sin(angle)) * moveSpeed;

                let nextX = character.position.x + moveX;
                let canMoveX = true;
                for (let obs of obstacles) {
                    if (nextX >= obs.minX - 0.35 && nextX <= obs.maxX + 0.35 &&
                        character.position.z >= obs.minZ - 0.35 && character.position.z <= obs.maxZ + 0.35 &&
                        character.position.y + 0.1 < obs.topY && character.position.y + 1.2 > obs.minY) {
                        canMoveX = false; break;
                    }
                }
                if (canMoveX) character.position.x = nextX;

                let nextZ = character.position.z + moveZ;
                let canMoveZ = true;
                for (let obs of obstacles) {
                    if (character.position.x >= obs.minX - 0.35 && character.position.x <= obs.maxX + 0.35 &&
                        nextZ >= obs.minZ - 0.35 && nextZ <= obs.maxZ + 0.35 &&
                        character.position.y + 0.1 < obs.topY && character.position.y + 1.2 > obs.minY) {
                        canMoveZ = false; break;
                    }
                }
                if (canMoveZ) character.position.z = nextZ;

                character.rotation.y = Math.atan2(moveX, moveZ);
            }

            // Enemy AI & Collision
            enemies.forEach(en => {
                let distToPlayer = en.position.distanceTo(character.position);
                if (distToPlayer < 30 && distToPlayer > 2) {
                    let dirX = (character.position.x - en.position.x) * 0.003;
                    let dirZ = (character.position.z - en.position.z) * 0.003;

                    let newEnemyX = en.position.x + dirX;
                    let canEnMoveX = true;
                    for (let obs of obstacles) {
                        if (newEnemyX >= obs.minX - 0.4 && newEnemyX <= obs.maxX + 0.4 &&
                            en.position.z >= obs.minZ - 0.4 && en.position.z <= obs.maxZ + 0.4 &&
                            en.position.y + 0.1 < obs.topY && en.position.y + 1.2 > obs.minY) {
                            canEnMoveX = false; break;
                        }
                    }
                    if (canEnMoveX) en.position.x = newEnemyX;

                    let newEnemyZ = en.position.z + dirZ;
                    let canEnMoveZ = true;
                    for (let obs of obstacles) {
                        if (en.position.x >= obs.minX - 0.4 && en.position.x <= obs.maxX + 0.4 &&
                            newEnemyZ >= obs.minZ - 0.4 && newEnemyZ <= obs.maxZ + 0.4 &&
                            en.position.y + 0.1 < obs.topY && en.position.y + 1.2 > obs.minY) {
                            canEnMoveZ = false; break;
                        }
                    }
                    if (canEnMoveZ) en.position.z = newEnemyZ;
                    en.rotation.y = Math.atan2(dirX, dirZ);
                }

                if (distToPlayer < 12) {
                    if (Math.random() < 0.03) {
                        playerHealth -= 4;
                        document.getElementById('health-bar').style.width = Math.max(0, playerHealth) + '%';
                        if (playerHealth <= 0) {
                            isGameOver = true;
                            document.getElementById('status').innerHTML = '<span style="color:red; font-size:15px;">GAME OVER! Refresh to restart.</span>';
                        }
                    }
                }
            });

            // Realistic Door Swing Animation
            doors.forEach(d => {
                let isOpen = character.position.distanceTo(new THREE.Vector3(d.closedX, 0, d.closedZ)) < 3.5;
                if(!isOpen) {
                    for(let en of enemies) {
                        if(en.position.distanceTo(new THREE.Vector3(d.closedX, 0, d.closedZ)) < 3.5) {
                            isOpen = true; break;
                        }
                    }
                }
                let targetRotY = isOpen ? d.openRotY : d.closedRotY;
                d.group.rotation.y += (targetRotY - d.group.rotation.y) * 0.1;
            });

            if (gunObject && !hasGun) {
                if (character.position.distanceTo(gunObject.position) < 2.0) {
                    scene.remove(gunObject);
                    gunObject = null;
                    hasGun = true;
                    document.getElementById('weaponStatus').innerText = 'Assault Rifle';
                    document.getElementById('status').innerText = 'Gun acquired! Explore forest & eliminate targets!';
                }
            }

            velocityY -= gravity;
            character.position.y += velocityY;

            let targetGroundY = 0;
            for (let obs of obstacles) {
                if (character.position.x >= obs.minX - 0.3 && character.position.x <= obs.maxX + 0.3 &&
                    character.position.z >= obs.minZ - 0.3 && character.position.z <= obs.maxZ + 0.3) {
                    if (character.position.y >= obs.topY - 0.6 && character.position.y <= obs.topY + 0.6) {
                        if (obs.topY > targetGroundY) targetGroundY = obs.topY;
                    }
                }
            }

            if (character.position.y <= targetGroundY) {
                character.position.y = targetGroundY;
                velocityY = 0;
                isGrounded = true;
            }

            // Smart Camera Distance Adjustment (Inside house vs outside)
            let isInsideHouse = false;
            for (let obs of obstacles) {
                // If character is inside a house bounding box footprint
                if (character.position.x >= obs.minX - 1 && character.position.x <= obs.maxX + 1 &&
                    character.position.z >= obs.minZ - 1 && character.position.z <= obs.maxZ + 1 &&
                    character.position.y >= obs.minY && character.position.y < obs.maxY) {
                    isInsideHouse = true;
                    break;
                }
            }

            const camDistance = isInsideHouse ? 3.2 : 6; // Pull camera closer when inside house so view doesn't clip outside walls
            let targetCamX = character.position.x + Math.sin(cameraAngleX) * camDistance * Math.cos(cameraAngleY);
            let targetCamY = character.position.y + Math.sin(cameraAngleY) * camDistance + (isInsideHouse ? 0.4 : 1.0);
            let targetCamZ = character.position.z + Math.cos(cameraAngleX) * camDistance * Math.cos(cameraAngleY);

            camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.1);
            camera.lookAt(character.position.x, character.position.y + 0.8, character.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free Fire Bermuda Exact Map Layout - 100% Same Surface</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #5294e2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        /* Customization Control Panel UI */
        #control-panel {
            position: absolute;
            top: 15px;
            left: 310px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            max-width: 260px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: block;
            margin-bottom: 4px;
            color: #cbd5e1;
        }
        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .control-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .control-btn:active {
            background: #1d4ed8;
        }
        /* Action Buttons */
        .action-btn {
            position: absolute;
            left: 15px;
            background: rgba(255, 85, 0, 0.9);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
            touch-action: manipulation;
        }
        .action-btn:active {
            transform: scale(0.95);
            background: rgba(200, 65, 0, 0.9);
        }
        #map-btn { top: 110px; }
        #zoom-in-btn { top: 165px; background: rgba(16, 185, 129, 0.9); }
        #zoom-out-btn { top: 215px; background: rgba(225, 29, 72, 0.9); }

        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Free Fire Bermuda Map Layout:</strong><br>
        Status: <span id="status-text">Exact Bermuda Terrain Loaded</span><br>
        <em>Tip: Click on terrain to modify height!</em>
    </div>

    <!-- Customization Panel -->
    <div id="control-panel">
        <strong>⚙️ Bermuda Layout Controls</strong>
        <div class="control-group" style="margin-top: 10px;">
            <label>Map Scale Size: <span id="val-size">15000</span></label>
            <input type="range" id="range-size" min="10000" max="25000" step="1000" value="15000">
        </div>
        <div class="control-group">
            <label>Terrain Elevation: <span id="val-roughness">90</span></label>
            <input type="range" id="range-roughness" min="30" max="200" step="10" value="90">
        </div>
        <button class="control-btn" onclick="regenerateMap()">🔄 Reset Bermuda Map</button>
    </div>

    <!-- Action Buttons -->
    <button id="map-btn" class="action-btn" onclick="toggleFullMap()">🗺️ Full Map View</button>
    <button id="zoom-in-btn" class="action-btn" onclick="zoomMap(0.8)">➕ Zoom In</button>
    <button id="zoom-out-btn" class="action-btn" onclick="zoomMap(1.25)">➖ Zoom Out</button>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let mapSize = 15000; // Bermuda Scale equivalent
        let terrainRoughness = 90;
        let groundMesh, terrainGeom;
        let minimapCtx, minimapCanvas;
        let isFullMap = false;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5294e2);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50000);
            camera.position.set(0, 1500, 3000);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(3000, 5000, 3000);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 30000;
            const d = 10000;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Ocean Surrounding (Bermuda island ocean boundary)
            const oceanGeo = new THREE.PlaneGeometry(90000, 90000);
            const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1b4f72, roughness: 0.2 });
            const ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -200;
            scene.add(ocean);

            buildBermudaTerrain();

            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            document.getElementById('range-size').addEventListener('input', (e) => {
                document.getElementById('val-size').innerText = e.target.value;
            });
            document.getElementById('range-roughness').addEventListener('input', (e) => {
                document.getElementById('val-roughness').innerText = e.target.value;
            });

            window.addEventListener('pointerdown', onMapClick);
            window.addEventListener('resize', onWindowResize);
        }

        function buildBermudaTerrain() {
            scene.children.forEach(child => {
                if (child.userData && child.userData.isBermudaWorld) {
                    scene.remove(child);
                }
            });

            const worldGroup = new THREE.Group();
            worldGroup.userData.isBermudaWorld = true;

            const segments = 300;
            terrainGeom = new THREE.PlaneGeometry(mapSize, mapSize, segments, segments);
            const posAttr = terrainGeom.attributes.position;
            let halfSize = mapSize / 2;

            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                
                // Bermuda Style Layout: Center Peak elevation + rolling bumpy terrain across the island
                let distFromCenter = Math.sqrt(vx*vx + vy*vy);
                let centerPeak = Math.max(0, (1 - distFromCenter / (mapSize * 0.35))) * (terrainRoughness * 4.5); // Peak in center

                let rollingHills = Math.abs(Math.sin(vx * 0.0012) * Math.cos(vy * 0.0012) * terrainRoughness * 1.8) 
                                 + Math.abs(Math.sin(vx * 0.005) * Math.sin(vy * 0.005) * (terrainRoughness * 0.7));

                let height = centerPeak + rollingHills + 15;

                // Raise outer boundary walls like Bermuda coastal mountains
                let maxDist = Math.max(Math.abs(vx), Math.abs(vy));
                let borderThreshold = halfSize - 2000;
                if (maxDist > borderThreshold) {
                    let factor = (maxDist - borderThreshold) / (2000);
                    height += Math.pow(factor, 2) * 1200;
                }

                posAttr.setZ(i, height);
            }
            terrainGeom.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ color: 0x315c1b, roughness: 0.88 });
            groundMesh = new THREE.Mesh(terrainGeom, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            worldGroup.add(groundMesh);

            scene.add(worldGroup);
        }

        function regenerateMap() {
            mapSize = parseInt(document.getElementById('range-size').value);
            terrainRoughness = parseInt(document.getElementById('range-roughness').value);
            buildBermudaTerrain();
        }

        function zoomMap(factor) {
            camera.position.y *= factor;
            camera.position.y = Math.max(300, Math.min(35000, camera.position.y));
        }

        function onMapClick(event) {
            if (event.target.closest('#control-panel') || event.target.closest('.action-btn')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            let intersects = raycaster.intersectObject(groundMesh);

            if (intersects.length > 0) {
                let point = intersects[0].point;
                let posAttr = terrainGeom.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    let vx = posAttr.getX(i);
                    let vy = posAttr.getY(i);
                    let dx = vx - point.x;
                    let dz = vy - (-point.z);
                    let dist = Math.sqrt(dx*dx + dz*dz);
                    if (dist < 1000) {
                        let currentZ = posAttr.getZ(i);
                        let bump = Math.cos((dist / 1000) * (Math.PI / 2)) * 100;
                        posAttr.setZ(i, currentZ + bump);
                    }
                }
                terrainGeom.computeVertexNormals();
                posAttr.needsUpdate = true;
            }
        }

        function toggleFullMap() {
            isFullMap = !isFullMap;
            const btn = document.getElementById('map-btn');
            if (isFullMap) {
                camera.position.set(0, mapSize * 0.9, 0); 
                camera.lookAt(0, 0, 0);
                btn.innerHTML = "🗺️ Normal View";
            } else {
                camera.position.set(0, 1500, 3000); 
                camera.lookAt(0, 0, 0);
                btn.innerHTML = "🗺️ Full Map View";
            }
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);
            minimapCtx.fillStyle = '#1b4f72';
            minimapCtx.fillRect(0, 0, w, h);

            minimapCtx.fillStyle = '#315c1b';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, w*0.42, 0, Math.PI*2);
            minimapCtx.fill();

            // Center Peak representation on minimap
            minimapCtx.fillStyle = '#475444';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 10, 0, Math.PI*2);
            minimapCtx.fill();

            minimapCtx.fillStyle = '#ff3300';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 4, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

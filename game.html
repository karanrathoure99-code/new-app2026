<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeFire Battle Royale Map - Exact Visual Style</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(10, 15, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px 24px;
            border-radius: 12px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
        }
        #instructions span {
            color: #ff5500;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <strong>FreeFire Map (Reference Style Match):</strong><br>
        Move: <span>W, A, S, D</span> or <span>Arrow Keys</span><br>
        Jump: <span>SPACEBAR</span><br>
        Look Around: <span>Mouse Click & Drag</span><br>
        <em>Explore Pine Trees, Large Houses, Roads, River & Ocean!</em>
    </div>

    <!-- Include Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let character;
        let leftArm, rightArm, leftLeg, rightLeg;
        let obstacles = [];
        
        let velocityY = 0;
        let gravity = 0.018;
        let isGrounded = false;
        const moveSpeed = 0.16;
        const jumpForce = 0.38;
        
        let keys = { w: false, a: false, s: false, d: false };
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleX = 0, cameraAngleY = 0.45;

        init();
        animate();

        function init() {
            // Scene & Sky Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x6aa6f8);
            scene.fog = new THREE.FogExp2(0x82b5f9, 0.001);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 3500);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = false; 
            document.body.appendChild(renderer.domElement);

            // Bright Ambient Lighting (No Shadows)
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.7);
            sunLight.position.set(300, 600, 300);
            scene.add(sunLight);

            // Ground Setup
            const groundGeo = new THREE.PlaneGeometry(1800, 1800, 120, 120);
            const posAttr = groundGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i);
                const vy = posAttr.getY(i);
                if (Math.abs(vx) > 80 || Math.abs(vy) > 80) {
                    posAttr.setZ(i, Math.sin(vx * 0.008) * Math.cos(vy * 0.008) * 8.5);
                }
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b5323, roughness: 0.92 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            buildFreeFireMap();

            // Character Setup (Grounded precisely, no air bug)
            character = new THREE.Group();
            
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5c6a5, roughness: 0.6 });
            const whiteShirtMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.5 }); 
            const blackPantsMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.4 }); 
            const blackShoeMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.3 }); 
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x221308, roughness: 0.8 });     

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.65, 0.3), whiteShirtMat);
            torso.position.y = 0.95;
            character.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), skinMat);
            head.position.y = 1.45;
            character.add(head);

            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.37, 0.14, 0.37), hairMat);
            hair.position.set(0, 1.66, 0);
            character.add(hair);

            const armGeo = new THREE.BoxGeometry(0.14, 0.52, 0.14);
            leftArm = new THREE.Mesh(armGeo, whiteShirtMat);
            leftArm.position.set(-0.35, 0.95, 0);
            character.add(leftArm);

            const fingerGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const leftHand = new THREE.Mesh(fingerGeo, skinMat);
            leftHand.position.set(0, -0.3, 0);
            leftArm.add(leftHand);

            rightArm = new THREE.Mesh(armGeo, whiteShirtMat);
            rightArm.position.set(0.35, 0.95, 0);
            character.add(rightArm);

            const rightHand = new THREE.Mesh(fingerGeo, skinMat);
            rightHand.position.set(0, -0.3, 0);
            rightArm.add(rightHand);

            const legGeo = new THREE.BoxGeometry(0.18, 0.5, 0.18);
            leftLeg = new THREE.Mesh(legGeo, blackPantsMat);
            leftLeg.position.set(-0.14, 0.45, 0);
            character.add(leftLeg);

            const shoeGeo = new THREE.BoxGeometry(0.2, 0.12, 0.27);
            const leftShoe = new THREE.Mesh(shoeGeo, blackShoeMat);
            leftShoe.position.set(0, -0.3, 0.03);
            leftLeg.add(leftShoe);

            rightLeg = new THREE.Mesh(legGeo, blackPantsMat);
            rightLeg.position.set(0.14, 0.45, 0);
            character.add(rightLeg);

            const rightShoe = new THREE.Mesh(shoeGeo, blackShoeMat);
            rightShoe.position.set(0, -0.3, 0.03);
            rightLeg.add(rightShoe);

            character.position.set(0, 0, 20);
            scene.add(character);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            
            window.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => { isMouseDown = false; });
            window.addEventListener('mousemove', onMouseMove);
        }

        function buildFreeFireMap() {
            // Roads
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x242424, roughness: 0.9 });
            const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(16, 1800), roadMat);
            roadNS.rotation.x = -Math.PI / 2;
            roadNS.position.set(0, 0.05, 0);
            scene.add(roadNS);

            const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(1800, 16), roadMat);
            roadEW.rotation.x = -Math.PI / 2;
            roadEW.position.set(0, 0.06, 0);
            scene.add(roadEW);

            // Ocean & River
            const ocean = new THREE.Mesh(new THREE.PlaneGeometry(800, 1800), new THREE.MeshStandardMaterial({ color: 0x1b4f72, roughness: 0.3 }));
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.set(-650, 0.02, 0);
            scene.add(ocean);

            const river = new THREE.Mesh(new THREE.PlaneGeometry(25, 1500), new THREE.MeshStandardMaterial({ color: 0x2980b9, roughness: 0.4 }));
            river.rotation.x = -Math.PI / 2;
            river.rotation.z = Math.PI / 6;
            river.position.set(200, 0.04, 0);
            scene.add(river);

            // Mountains
            createMountain(-550, 0, -550, 260, 130, 260, 0x3b4639);
            createMountain(550, 0, -600, 290, 145, 290, 0x323c30);
            createMountain(0, 0, -750, 360, 160, 320, 0x2a3328);
            createMountain(-650, 0, 250, 270, 130, 270, 0x374235);
            createMountain(680, 0, 300, 310, 145, 310, 0x303a2e);

            // Reference-style Pine & Leafy Trees (Matching Image 1 & 2)
            for (let i = 0; i < 70; i++) {
                const tx = (Math.random() - 0.5) * 1400;
                const tz = (Math.random() - 0.5) * 1400;
                if (Math.abs(tx) < 25 && Math.abs(tz) < 25) continue;

                if (i % 2 === 0) {
                    createPineTree(tx, tz); // Pine trees from Image 1
                } else {
                    createLeafyTree(tx, tz); // Round canopy trees from Image 2
                }
            }

            // FreeFire Houses with Doors & Stairs
            createFreeFireHouse(-45, -35, 0);
            createFreeFireHouse(55, -65, Math.PI / 2);
            createFreeFireHouse(-75, 55, Math.PI);
            createFreeFireHouse(65, 75, -Math.PI / 4);
            createFreeFireHouse(-100, -100, Math.PI / 3);
            createFreeFireHouse(100, 100, -Math.PI / 6);

            // Detailed Ground Grass Patches
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x477822, roughness: 0.9 });
            for (let i = 0; i < 250; i++) {
                const gx = (Math.random() - 0.5) * 1500;
                const gz = (Math.random() - 0.5) * 1500;
                if (Math.abs(gx) < 25 && Math.abs(gz) < 25) continue;
                
                const patch = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.0, 4), grassMat);
                patch.position.set(gx, 0.5, gz);
                scene.add(patch);
            }
        }

        // Pine Tree (Matching Image 1 reference)
        function createPineTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 5, 6), new THREE.MeshStandardMaterial({ color: 0x543d2b, roughness: 0.9 }));
            trunk.position.set(x, 2.5, z);
            scene.add(trunk);

            const pineMat = new THREE.MeshStandardMaterial({ color: 0x1e4620, roughness: 0.85 });
            for (let j = 0; j < 3; j++) {
                const tier = new THREE.Mesh(new THREE.ConeGeometry(2.2 - (j * 0.4), 2.5, 6), pineMat);
                tier.position.set(x, 4 + (j * 1.5), z);
                scene.add(tier);
            }

            obstacles.push({ minX: x - 0.8, maxX: x + 0.8, minZ: z - 0.8, maxZ: z + 0.8, topY: 0 });
        }

        // Leafy Tree (Matching Image 2 reference)
        function createLeafyTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.1, 5.5, 8), new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.85 }));
            trunk.position.set(x, 2.75, z);
            scene.add(trunk);

            const leaves = new THREE.Mesh(new THREE.SphereGeometry(3.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0x2d6829, roughness: 0.8 }));
            leaves.position.set(x, 6, z);
            scene.add(leaves);

            obstacles.push({ minX: x - 1.0, maxX: x + 1.0, minZ: z - 1.0, maxZ: z + 1.0, topY: 0 });
        }

        function createMountain(x, y, z, w, h, d, color) {
            const mountain = new THREE.Mesh(new THREE.ConeGeometry(w / 2, h, 8), new THREE.MeshStandardMaterial({ color: color, roughness: 0.95 }));
            mountain.position.set(x, h / 2, z);
            scene.add(mountain);
        }

        function createFreeFireHouse(x, z, rotationY) {
            const houseGroup = new THREE.Group();
            houseGroup.position.set(x, 0, z);
            houseGroup.rotation.y = rotationY;

            const base = new THREE.Mesh(new THREE.BoxGeometry(9, 5.5, 9), new THREE.MeshStandardMaterial({ color: 0xd6d3c4, roughness: 0.7 }));
            base.position.y = 2.75;
            houseGroup.add(base);

            const roof = new THREE.Mesh(new THREE.ConeGeometry(7.0, 3.5, 4), new THREE.MeshStandardMaterial({ color: 0x8a2f24, roughness: 0.6 }));
            roof.position.y = 7.25;
            roof.rotation.y = Math.PI / 4;
            houseGroup.add(roof);

            for (let i = 0; i < 3; i++) {
                const stair = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.3, 0.7), new THREE.MeshStandardMaterial({ color: 0x595959, roughness: 0.5 }));
                stair.position.set(0, i * 0.3 + 0.15, 4.8 + (2 - i) * 0.6);
                houseGroup.add(stair);

                const worldStairX = x + stair.position.x * Math.cos(rotationY) - stair.position.z * Math.sin(rotationY);
                const worldStairZ = z + stair.position.x * Math.sin(rotationY) + stair.position.z * Math.cos(rotationY);
                obstacles.push({
                    minX: worldStairX - 1.4, maxX: worldStairX + 1.4,
                    minZ: worldStairZ - 0.5, maxZ: worldStairZ + 0.5,
                    topY: stair.position.y + 0.15
                });
            }

            scene.add(houseGroup);

            obstacles.push({ minX: x - 4.7, maxX: x - 4.3, minZ: z - 4.5, maxZ: z + 4.5, topY: 5.5 });
            obstacles.push({ minX: x + 4.3, maxX: x + 4.7, minZ: z - 4.5, maxZ: z + 4.5, topY: 5.5 });
            obstacles.push({ minX: x - 4.5, maxX: x + 4.5, minZ: z - 4.7, maxZ: z - 4.3, topY: 5.5 });
            obstacles.push({ minX: x - 4.5, maxX: x - 1.3, minZ: z + 4.3, maxZ: z + 4.7, topY: 5.5 });
            obstacles.push({ minX: x + 1.3, maxX: x + 4.5, minZ: z + 4.3, maxZ: z + 4.7, topY: 5.5 });
        }

        function handleKey(e, isDown) {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.w = isDown; break;
                case 'KeyS': case 'ArrowDown': keys.s = isDown; break;
                case 'KeyA': case 'ArrowLeft': keys.a = isDown; break;
                case 'KeyD': case 'ArrowRight': keys.d = isDown; break;
                case 'Space': 
                    if (isDown && isGrounded) {
                        velocityY = jumpForce;
                        isGrounded = false;
                    }
                    break;
            }
        }

        function onMouseMove(e) {
            if (!isMouseDown) return;
            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;
            
            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(1.4, cameraAngleY - deltaY * 0.005));
            
            mouseX = e.clientX;
            mouseY = e.clientY;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            let inputX = 0;
            let inputZ = 0;

            if (keys.w) inputZ -= 1;
            if (keys.s) inputZ += 1;
            if (keys.a) inputX -= 1;
            if (keys.d) inputX += 1;

            if (inputX !== 0 || inputZ !== 0) {
                const moveX = (inputX * Math.cos(cameraAngleX) + inputZ * Math.sin(cameraAngleX)) * moveSpeed;
                const moveZ = (inputX * -Math.sin(cameraAngleX) + inputZ * Math.cos(cameraAngleX)) * moveSpeed;

                character.position.x += moveX;
                character.position.z += moveZ;

                const targetRotation = Math.atan2(moveX, moveZ);
                character.rotation.y = targetRotation;
            }

            // Gravity & Ground Collision
            velocityY -= gravity;
            character.position.y += velocityY;

            let targetGroundY = 0;

            for (let obs of obstacles) {
                if (character.position.x >= obs.minX && character.position.x <= obs.maxX &&
                    character.position.z >= obs.minZ && character.position.z <= obs.maxZ) {
                    if (character.position.y >= obs.topY - 0.5 && character.position.y <= obs.topY + 0.5) {
                        if (obs.topY > targetGroundY) {
                            targetGroundY = obs.topY;
                        }
                    }
                }
            }

            if (character.position.y <= targetGroundY) {
                character.position.y = targetGroundY;
                velocityY = 0;
                isGrounded = true;
            }

            // Walking & Jumping Animations
            const time = Date.now() * 0.01;
            const isMoving = (inputX !== 0 || inputZ !== 0) && isGrounded;

            if (!isGrounded) {
                leftArm.rotation.x = -Math.PI * 0.6;
                rightArm.rotation.x = -Math.PI * 0.6;
                leftLeg.rotation.x = Math.PI * 0.3;
                rightLeg.rotation.x = -Math.PI * 0.3;
            } else if (isMoving) {
                leftArm.rotation.x = Math.sin(time) * 0.8;
                rightArm.rotation.x = -Math.sin(time) * 0.8;
                leftLeg.rotation.x = -Math.sin(time) * 0.8;
                rightLeg.rotation.x = Math.sin(time) * 0.8;
            } else {
                leftArm.rotation.x = 0;
                rightArm.rotation.x = 0;
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
            }

            // Camera Tracking
            const camDistance = 7.0;
            const targetCamX = character.position.x + Math.sin(cameraAngleX) * camDistance * Math.cos(cameraAngleY);
            const targetCamY = character.position.y + Math.sin(cameraAngleY) * camDistance + 1.2;
            const targetCamZ = character.position.z + Math.cos(cameraAngleX) * camDistance * Math.cos(cameraAngleY);

            camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.1);
            camera.lookAt(character.position.x, character.position.y + 1.0, character.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

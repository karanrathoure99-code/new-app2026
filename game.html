<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ego Trap - Ghost Trail Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .hud {
      text-align: center;
      margin-bottom: 16px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f0f6fc;
      margin-bottom: 6px;
    }
    .rules {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 12px;
    }
    .counter-box {
      font-size: 18px;
      font-weight: bold;
      background: #161b22;
      border: 1px solid #30363d;
      padding: 6px 16px;
      border-radius: 6px;
      display: inline-block;
      color: #58a6ff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 65px);
      grid-template-rows: repeat(5, 65px);
      gap: 8px;
      background: #161b22;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #30363d;
    }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      border-radius: 6px;
      background: #21262d;
      cursor: pointer;
      position: relative;
      transition: background 0.15s ease, transform 0.1s ease;
      color: #8b949e;
    }
    .tile.valid-move:hover {
      background: #30363d;
      transform: scale(1.04);
    }
    .tile.player {
      background: #1f6feb !important;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(31, 111, 235, 0.8);
    }
    .tile.burned {
      background: #28151b !important;
      border: 1px dashed #da3633;
      color: #da3633;
    }
    /* Ghost Trail Style jab fail ho */
    .tile.ghost {
      background: #241822 !important;
      border: 1px solid #f85149;
      color: #ff7b72;
    }
    .step-badge {
      font-size: 11px;
      opacity: 0.85;
      font-weight: 500;
    }
    .tile.goal {
      border: 2px solid #238636;
      color: #2ea043;
    }
    .tile.coin {
      background: #2a2415;
      border: 1px solid #d29922;
      color: #e3b341;
    }
    .fail-card {
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 8px;
      background: #161b22;
      border: 1px solid #30363d;
      text-align: center;
      max-width: 360px;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .fail-card .cause {
      font-size: 14px;
      font-weight: 700;
      color: #f85149;
      margin-bottom: 4px;
    }
    .fail-card .mirror {
      font-size: 12px;
      color: #8b949e;
    }
    .fail-card.success .cause {
      color: #2ea043;
    }
    .restart-btn {
      margin-top: 12px;
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .restart-btn:hover {
      background: #30363d;
      color: #f0f6fc;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="title">THE EGO TRAP : GHOST TRAIL</div>
    <div class="rules">Reach Exit [E] in <b>EXACTLY 10 STEPS</b>. No retreading.</div>
    <div class="counter-box">
      Steps: <span id="step-count">0</span> / 10
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="fail-card" id="fail-card">
    <div class="cause" id="fail-cause">Path Clear</div>
    <div class="mirror" id="fail-mirror">Arrow keys or click adjacent tiles to move.</div>
  </div>

  <button class="restart-btn" onclick="initGame()">Instant Restart [R]</button>

  <script>
    const GRID_SIZE = 5;
    const TARGET_STEPS = 10;
    const START_POS = { r: 0, c: 0 };
    const GOAL_POS = { r: 4, c: 4 };
    const COIN_POS = { r: 1, c: 3 };

    let playerPos = { ...START_POS };
    let steps = 0;
    let pathHistory = []; // Tracks exact order of tiles: [{r, c, step}]
    let gameOver = false;

    const gridEl = document.getElementById("grid");
    const stepCountEl = document.getElementById("step-count");
    const failCauseEl = document.getElementById("fail-cause");
    const failMirrorEl = document.getElementById("fail-mirror");
    const failCardEl = document.getElementById("fail-card");

    function initGame() {
      playerPos = { ...START_POS };
      steps = 0;
      pathHistory = [{ r: START_POS.r, c: START_POS.c, step: 0 }];
      gameOver = false;
      failCardEl.className = "fail-card";
      failCauseEl.textContent = "Path Active";
      failCauseEl.style.color = "#58a6ff";
      failMirrorEl.textContent = "Arrow keys or click to navigate.";
      stepCountEl.textContent = steps;
      renderGrid();
    }

    function isAdjacent(r1, c1, r2, c2) {
      const dr = Math.abs(r1 - r2);
      const dc = Math.abs(c1 - c2);
      return (dr === 1 && dc === 0) || (dr === 0 && dc === 1);
    }

    function hasVisited(r, c) {
      return pathHistory.some(p => p.r === r && p.c === c);
    }

    function checkDeadlock() {
      const neighbors = [
        { r: playerPos.r + 1, c: playerPos.c },
        { r: playerPos.r - 1, c: playerPos.c },
        { r: playerPos.r, c: playerPos.c + 1 },
        { r: playerPos.r, c: playerPos.c - 1 }
      ];

      return !neighbors.some(n => 
        n.r >= 0 && n.r < GRID_SIZE && 
        n.c >= 0 && n.c < GRID_SIZE && 
        !hasVisited(n.r, n.c)
      );
    }

    function triggerFail(cause, realityCheck) {
      gameOver = true;
      failCardEl.className = "fail-card";
      failCauseEl.textContent = cause;
      failCauseEl.style.color = "#f85149";
      failMirrorEl.textContent = realityCheck;
      renderGrid(true); // render with Ghost Trail active
    }

    function triggerSuccess() {
      gameOver = true;
      failCardEl.className = "fail-card success";
      failCauseEl.textContent = "Unlocked with Perfection";
      failCauseEl.style.color = "#2ea043";
      failMirrorEl.textContent = "You maintained discipline and calculated every step.";
      renderGrid(false);
    }

    function onTileClick(r, c) {
      if (gameOver) return;

      if (!isAdjacent(playerPos.r, playerPos.c, r, c)) return;

      if (hasVisited(r, c)) {
        triggerFail(
          "Stepped On Your Own Footprint",
          `Look at tile (${r+1}, ${c+1}). You burned that bridge yourself.`
        );
        return;
      }

      steps++;
      playerPos = { r, c };
      pathHistory.push({ r, c, step: steps });
      stepCountEl.textContent = steps;

      // Check Outcome
      if (r === GOAL_POS.r && c === GOAL_POS.c) {
        if (steps === TARGET_STEPS) {
          triggerSuccess();
        } else if (steps < TARGET_STEPS) {
          triggerFail(
            `Rushed! Took ${steps} Steps, Needed ${TARGET_STEPS}`,
            "You ran straight for the exit without planning the required detour."
          );
        } else {
          triggerFail(
            `Greed Overload! Took ${steps} Steps`,
            "You wandered around collecting bait and exhausted your move limit."
          );
        }
      } else if (steps >= TARGET_STEPS) {
        triggerFail(
          "Ran Out of Steps",
          `You hit ${TARGET_STEPS} steps before even touching the exit door.`
        );
      } else if (checkDeadlock()) {
        triggerFail(
          "Cornered By Your Own Ego",
          "Every surrounding tile was visited by you earlier. No exit left."
        );
      } else {
        renderGrid(false);
      }
    }

    function renderGrid(showGhost = false) {
      gridEl.innerHTML = "";
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const tile = document.createElement("div");
          tile.classList.add("tile");

          const isPlayer = r === playerPos.r && c === playerPos.c;
          const isGoal = r === GOAL_POS.r && c === GOAL_POS.c;
          const isCoin = r === COIN_POS.r && c === COIN_POS.c;
          const historyEntry = pathHistory.find(p => p.r === r && p.c === c);
          const isVisited = !!historyEntry && !isPlayer;
          const canMove = !gameOver && isAdjacent(playerPos.r, playerPos.c, r, c) && !hasVisited(r, c);

          if (isPlayer) {
            tile.classList.add("player");
            tile.innerHTML = `P<span class="step-badge">#${steps}</span>`;
          } else if (showGhost && isVisited) {
            tile.classList.add("ghost");
            tile.innerHTML = `✕<span class="step-badge">#${historyEntry.step}</span>`;
          } else if (isVisited) {
            tile.classList.add("burned");
            tile.textContent = "✕";
          } else if (isGoal) {
            tile.classList.add("goal");
            tile.textContent = "EXIT";
          } else if (isCoin) {
            tile.classList.add("coin");
            tile.textContent = "★";
          }

          if (canMove) {
            tile.classList.add("valid-move");
          }

          tile.addEventListener("click", () => onTileClick(r, c));
          gridEl.appendChild(tile);
        }
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "r" || e.key === "R") {
        initGame();
        return;
      }

      let tr = playerPos.r;
      let tc = playerPos.c;
      if (e.key === "ArrowUp") tr--;
      else if (e.key === "ArrowDown") tr++;
      else if (e.key === "ArrowLeft") tc--;
      else if (e.key === "ArrowRight") tc++;
      else return;

      if (tr >= 0 && tr < GRID_SIZE && tc >= 0 && tc < GRID_SIZE) {
        onTileClick(tr, tc);
      }
    });

    initGame();
  </script>
</body>
</html>

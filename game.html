<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Adventure Game - Dogs, Snakes, Coins & Level Gate</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #ui span {
            color: #4CAF50;
            font-weight: bold;
        }
        #health-bar-container {
            width: 150px;
            height: 12px;
            background: #555;
            border-radius: 6px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.2s;
        }
        #crosshair-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            background-color: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
        }
        #touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 180px;
            pointer-events: none;
            display: none; 
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            z-index: 20;
        }
        .control-group {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 8px;
            pointer-events: auto;
        }
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
            justify-content: flex-end;
        }
        .t-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }
        .t-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        #btn-w { grid-column: 2; grid-row: 1; }
        #btn-a { grid-column: 1; grid-row: 2; }
        #btn-s { grid-column: 2; grid-row: 2; }
        #btn-d { grid-column: 3; grid-row: 2; }
        #btn-jump, #btn-down {
            width: 75px;
            height: 48px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <strong>Health:</strong> 
        <div id="health-bar-container"><div id="health-bar"></div></div><br>
        <strong>Coins Collected:</strong> <span id="coinCount">0</span> / 200<br>
        <strong>Status:</strong> <span id="status">Collect 200 Coins & Reach the Goal Gate! Watch out for Dogs & Snakes!</span>
    </div>
    <div id="crosshair-dot"></div>

    <div id="touch-controls">
        <div class="control-group">
            <div class="t-btn" id="btn-w">W</div>
            <div class="t-btn" id="btn-a">A</div>
            <div class="t-btn" id="btn-s">S</div>
            <div class="t-btn" id="btn-d">D</div>
        </div>
        <div class="action-group">
            <div class="t-btn" id="btn-jump">JUMP</div>
            <div class="t-btn" id="btn-down">DOWN</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let character;
        let head, torso, leftArm, rightArm, leftLeg, rightLeg;
        let obstacles = [];
        let doors = [];
        let enemies = [];
        let coins = [];
        let goalGate;
        
        let coinsCollected = 0;
        let playerHealth = 100;
        let isGameOver = false;
        let isGameWon = false;
        let isCrouching = false;
        
        let velocityY = 0;
        let gravity = 0.012;
        let isGrounded = false;
        const normalMoveSpeed = 0.13;
        const crouchMoveSpeed = 0.07;
        const jumpForce = 0.25;
        
        let keys = { w: false, a: false, s: false, d: false, space: false, ctrl: false };
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleX = 0, cameraAngleY = 0.75;

        init();
        animate();

        function init() {
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('touch-controls').style.display = 'flex';
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
            dirLight.position.set(120, 180, 120);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Terrain
            const mapSize = 500;
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize, 40, 40);
            groundGeo.rotateX(-Math.PI / 2);
            const pos = groundGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let px = pos.getX(i), pz = pos.getZ(i);
                let h = Math.sin(px * 0.02) * Math.cos(pz * 0.02) * 2.0;
                if (Math.abs(px) < 50 && Math.abs(pz) < 50) h = 0;
                pos.setY(i, h);
            }
            groundGeo.computeVertexNormals();
            const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x2e6f40, roughness: 0.9 }));
            ground.receiveShadow = true;
            scene.add(ground);

            window.getTerrainHeight = function(x, z) {
                return Math.sin(x * 0.02) * Math.cos(z * 0.02) * 2.0;
            };

            // Boundary Walls (Touching exact surface down to -5)
            const wallH = 15;
            const wMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 });
            createBoundaryWall(0, wallH/2 - 5, -mapSize/2, mapSize, wallH, 2, wMat);
            createBoundaryWall(0, wallH/2 - 5, mapSize/2, mapSize, wallH, 2, wMat);
            createBoundaryWall(-mapSize/2, wallH/2 - 5, 0, 2, wallH, mapSize, wMat);
            createBoundaryWall(mapSize/2, wallH/2 - 5, 0, 2, wallH, mapSize, wMat);

            generateDenseForestAndFlora(mapSize);
            generateDiverseHouses();
            generateColoredCoverBoxes();
            spawnCoins();
            spawnEnemiesAndAnimals();
            createGoalGate(0, getTerrainHeight(0, -200), -200);

            // Build Character with Face (Eyes, Eyebrows, Nose)
            character = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x337ab7 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

            torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), shirtMat);
            torso.position.y = 0.9; torso.castShadow = true; character.add(torso);
            
            head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), skinMat);
            head.position.y = 1.35; head.castShadow = true; 

            // Face Details (Eyes, Eyebrows, Nose)
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const leftEye = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.05), eyeMat);
            leftEye.position.set(-0.08, 0.05, 0.18); head.add(leftEye);
            const rightEye = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.05), eyeMat);
            rightEye.position.set(0.08, 0.05, 0.18); head.add(rightEye);

            const browMat = new THREE.MeshBasicMaterial({ color: 0x331a00 });
            const leftBrow = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.02, 0.05), browMat);
            leftBrow.position.set(-0.08, 0.12, 0.18); head.add(leftBrow);
            const rightBrow = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.02, 0.05), browMat);
            rightBrow.position.set(0.08, 0.12, 0.18); head.add(rightBrow);

            const nose = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 0.05), skinMat);
            nose.position.set(0, -0.02, 0.18); head.add(nose);

            character.add(head);

            const armGeo = new THREE.BoxGeometry(0.15, 0.5, 0.15);
            leftArm = new THREE.Mesh(armGeo, skinMat); leftArm.position.set(-0.35, 0.9, 0); character.add(leftArm);
            rightArm = new THREE.Mesh(armGeo, skinMat); rightArm.position.set(0.35, 0.9, 0); character.add(rightArm);

            const legGeo = new THREE.BoxGeometry(0.18, 0.6, 0.18);
            leftLeg = new THREE.Mesh(legGeo, pantsMat); leftLeg.position.set(-0.15, 0.3, 0); character.add(leftLeg);
            rightLeg = new THREE.Mesh(legGeo, pantsMat); rightLeg.position.set(0.15, 0.3, 0); character.add(rightLeg);

            character.position.set(0, getTerrainHeight(0, 200), 200);
            scene.add(character);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            
            window.addEventListener('mousedown', (e) => {
                if (e.button === 0) { isMouseDown = true; mouseX = e.clientX; mouseY = e.clientY; }
            });
            window.addEventListener('mouseup', () => { isMouseDown = false; });
            window.addEventListener('mousemove', onMouseMove);

            bindTouchButton('btn-w', 'w');
            bindTouchButton('btn-s', 's');
            bindTouchButton('btn-a', 'a');
            bindTouchButton('btn-d', 'd');
            
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isGrounded && !isGameOver && !isCrouching) { velocityY = jumpForce; isGrounded = false; }
            });
            document.getElementById('btn-jump').addEventListener('click', () => {
                if (isGrounded && !isGameOver && !isCrouching) { velocityY = jumpForce; isGrounded = false; }
            });

            document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); toggleCrouch(); });
            document.getElementById('btn-down').addEventListener('click', () => { toggleCrouch(); });
        }

        function toggleCrouch() {
            isCrouching = !isCrouching;
            character.scale.y = isCrouching ? 0.6 : 1.0;
            document.getElementById('btn-down').style.background = isCrouching ? 'rgba(255, 255, 255, 0.6)' : 'rgba(255, 255, 255, 0.25)';
        }

        function bindTouchButton(id, keyName) {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            el.addEventListener('mousedown', () => { keys[keyName] = true; });
            el.addEventListener('mouseup', () => { keys[keyName] = false; });
            el.addEventListener('mouseleave', () => { keys[keyName] = false; });
        }

        function generateDenseForestAndFlora(size) {
            const half = size / 2 - 20;
            for (let i = 0; i < 2000; i++) {
                let x = (Math.random() - 0.5) * half * 2;
                let z = (Math.random() - 0.5) * half * 2;
                if (Math.abs(x) < 40 && Math.abs(z) < 40) continue;
                let y = getTerrainHeight(x, z);
                const grass = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.8), new THREE.MeshBasicMaterial({ color: 0x3da35d, side: THREE.DoubleSide }));
                grass.position.set(x, y + 0.4, z); grass.rotation.y = Math.random() * Math.PI;
                scene.add(grass);
            }
        }

        function generateDiverseHouses() {
            const houseColors = [0xd9c3b0, 0xc0392b, 0x2980b9, 0x27ae60, 0xf39c12, 0x8e44ad];
            const roofColors = [0xa93226, 0x2c3e50, 0x7f8c8d, 0x1abc9c];

            for(let i = 0; i < 40; i++) {
                let hx = (Math.random() - 0.5) * 400;
                let hz = (Math.random() - 0.5) * 400;
                if(Math.abs(hx) < 60 && Math.abs(hz) < 60) hx += 140;
                createHouse(hx, getTerrainHeight(hx, hz), hz, Math.floor(Math.random() * 3) + 1, houseColors[Math.floor(Math.random() * houseColors.length)], roofColors[Math.floor(Math.random() * roofColors.length)]);
            }
        }

        function generateColoredCoverBoxes() {
            const boxColors = [0xe74c3c, 0x3498db, 0x2ecc71, 0xf1c40f, 0x9b59b6];
            for(let i = 0; i < 150; i++) {
                let bx = (Math.random() - 0.5) * 440;
                let bz = (Math.random() - 0.5) * 440;
                if(Math.abs(bx) < 40 && Math.abs(bz) < 40) continue;
                let w = Math.random() * 2 + 1.5, h = Math.random() * 1.5 + 1.0, d = Math.random() * 2 + 1.5;
                let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: boxColors[Math.floor(Math.random() * boxColors.length)] }));
                mesh.position.set(bx, getTerrainHeight(bx, bz) + h/2, bz);
                scene.add(mesh);
                addObstacleBox(bx, getTerrainHeight(bx, bz) + h/2, bz, w, h, d);
            }
        }

        // Spawn 200 Coins across the full map
        function spawnCoins() {
            const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
            for (let i = 0; i < 200; i++) {
                let cx = (Math.random() - 0.5) * 440;
                let cz = (Math.random() - 0.5) * 440;
                let cy = getTerrainHeight(cx, cz) + 0.3;
                let coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(cx, cy, cz);
                scene.add(coin);
                coins.push(coin);
            }
        }

        // Spawn Dogs and Snakes as Enemies
        function spawnEnemiesAndAnimals() {
            for (let i = 0; i < 15; i++) {
                let ex = (Math.random() - 0.5) * 380;
                let ez = (Math.random() - 0.5) * 380;
                let ey = getTerrainHeight(ex, ez);
                let isDog = Math.random() > 0.5;

                let group = new THREE.Group();
                if (isDog) {
                    let body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
                    body.position.y = 0.3; group.add(body);
                } else {
                    let body = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.2), new THREE.MeshStandardMaterial({ color: 0x556b2f }));
                    body.rotation.z = Math.PI / 2; body.position.y = 0.2; group.add(body);
                }
                group.position.set(ex, ey, ez);
                scene.add(group);
                enemies.push(group);
            }
        }

        // Goal Gate (Level Up)
        function createGoalGate(x, y, z) {
            const ringGeo = new THREE.TorusGeometry(3, 0.3, 16, 100);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.5 });
            goalGate = new THREE.Mesh(ringGeo, ringMat);
            goalGate.position.set(x, y + 3, z);
            scene.add(goalGate);
        }

        function createBoundaryWall(x, y, z, w, h, d, mat) {
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            addObstacleBox(x, y, z, w, h, d);
        }

        function createHouse(x, y, z, floors, wallCol, roofCol) {
            const houseWidth = 12, floorHeight = 4.2, houseDepth = 12, wallThickness = 0.4;
            const wallMat = new THREE.MeshStandardMaterial({ color: wallCol, roughness: 0.7 });

            for(let f = 0; f < floors; f++) {
                let currentY = y + f * floorHeight;

                let backWall = new THREE.Mesh(new THREE.BoxGeometry(houseWidth, floorHeight, wallThickness), wallMat);
                backWall.position.set(x, currentY + floorHeight/2, z - houseDepth/2);
                scene.add(backWall); addObstacleBox(backWall.position.x, backWall.position.y, backWall.position.z, houseWidth, floorHeight, wallThickness);

                let leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, floorHeight, houseDepth), wallMat);
                leftWall.position.set(x - houseWidth/2, currentY + floorHeight/2, z);
                scene.add(leftWall); addObstacleBox(leftWall.position.x, leftWall.position.y, leftWall.position.z, wallThickness, floorHeight, houseDepth);

                let rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, floorHeight, houseDepth), wallMat);
                rightWall.position.set(x + houseWidth/2, currentY + floorHeight/2, z);
                scene.add(rightWall); addObstacleBox(rightWall.position.x, rightWall.position.y, rightWall.position.z, wallThickness, floorHeight, houseDepth);

                if (f === 0) {
                    let frontWall1 = new THREE.Mesh(new THREE.BoxGeometry(4, floorHeight, wallThickness), wallMat);
                    frontWall1.position.set(x - 4, currentY + floorHeight/2, z + houseDepth/2);
                    scene.add(frontWall1); addObstacleBox(frontWall1.position.x, frontWall1.position.y, frontWall1.position.z, 4, floorHeight, wallThickness);

                    let frontWall2 = new THREE.Mesh(new THREE.BoxGeometry(4, floorHeight, wallThickness), wallMat);
                    frontWall2.position.set(x + 4, currentY + floorHeight/2, z + houseDepth/2);
                    scene.add(frontWall2); addObstacleBox(frontWall2.position.x, frontWall2.position.y, frontWall2.position.z, 4, floorHeight, wallThickness);

                    let doorTop = new THREE.Mesh(new THREE.BoxGeometry(4, 1, wallThickness), wallMat);
                    doorTop.position.set(x, currentY + 3.7, z + houseDepth/2);
                    scene.add(doorTop); addObstacleBox(doorTop.position.x, doorTop.position.y, doorTop.position.z, 4, 1, wallThickness);

                    const doorGroup = new THREE.Group();
                    const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 3.2, 0.2), new THREE.MeshStandardMaterial({ color: 0x5c3a21 }));
                    doorMesh.position.set(2, 0, 0); doorGroup.add(doorMesh);
                    doorGroup.position.set(x - 2, currentY + 1.6, z + houseDepth/2);
                    scene.add(doorGroup);
                    doors.push({ group: doorGroup, closedRotY: 0, openRotY: -Math.PI / 2, closedX: x, closedZ: z + houseDepth/2 });
                } else {
                    let frontWall = new THREE.Mesh(new THREE.BoxGeometry(houseWidth, floorHeight, wallThickness), wallMat);
                    frontWall.position.set(x, currentY + floorHeight/2, z + houseDepth/2);
                    scene.add(frontWall); addObstacleBox(frontWall.position.x, frontWall.position.y, frontWall.position.z, houseWidth, floorHeight, wallThickness);
                }

                let floorSlab = new THREE.Mesh(new THREE.BoxGeometry(houseWidth - 0.4, 0.3, houseDepth - 0.4), wallMat);
                floorSlab.position.set(x, currentY + floorHeight, z);
                scene.add(floorSlab); addObstacleBox(floorSlab.position.x, floorSlab.position.y, floorSlab.position.z, houseWidth - 0.4, 0.3, houseDepth - 0.4);

                if (f < floors - 1) {
                    for (let s = 0; s < 8; s++) {
                        let stairStep = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 0.5), new THREE.MeshStandardMaterial({ color: 0x555 }));
                        stairStep.position.set(x - 3.5, currentY + 0.3 + s * 0.5, z - 3 + s * 0.5);
                        scene.add(stairStep); addObstacleBox(stairStep.position.x, stairStep.position.y, stairStep.position.z, 2, 0.2, 0.5);
                    }
                }
            }

            let roof = new THREE.Mesh(new THREE.BoxGeometry(houseWidth + 1.2, 0.5, houseDepth + 1.2), new THREE.MeshStandardMaterial({ color: roofCol }));
            roof.position.set(x, y + floors * floorHeight + 0.25, z);
            scene.add(roof); addObstacleBox(roof.position.x, roof.position.y, roof.position.z, houseWidth + 1.2, 0.5, houseDepth + 1.2);
        }

        function addObstacleBox(x, y, z, w, h, d) {
            obstacles.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, minY: y - h / 2, maxY: y + h / 2, topY: y + h / 2 });
        }

        function handleKey(e, isDown) {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.w = isDown; break;
                case 'KeyS': case 'ArrowDown': keys.s = isDown; break;
                case 'KeyA': case 'ArrowLeft': keys.a = isDown; break;
                case 'KeyD': case 'ArrowRight': keys.d = isDown; break;
                case 'ControlLeft': case 'ControlRight':
                    if (isDown && !keys.ctrl) toggleCrouch();
                    keys.ctrl = isDown; break;
                case 'Space': 
                    if (isDown && isGrounded && !isGameOver && !isCrouching) { velocityY = jumpForce; isGrounded = false; }
                    break;
            }
        }

        function onMouseMove(e) {
            if (!isMouseDown || isGameOver) return;
            cameraAngleX -= (e.clientX - mouseX) * 0.005;
            cameraAngleY = Math.max(0.2, Math.min(1.4, cameraAngleY - (e.clientY - mouseY) * 0.005));
            mouseX = e.clientX; mouseY = e.clientY;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver || isGameWon) return;

            let currentSpeed = isCrouching ? crouchMoveSpeed : normalMoveSpeed;
            let inputX = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
            let inputZ = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
            let moveX = 0, moveZ = 0;
            let isMoving = (inputX !== 0 || inputZ !== 0);

            if (isMoving) {
                let angle = cameraAngleX;
                moveX = (inputX * Math.cos(angle) + inputZ * Math.sin(angle)) * currentSpeed;
                moveZ = (inputZ * Math.cos(angle) - inputX * Math.sin(angle)) * currentSpeed;

                let nextX = character.position.x + moveX;
                let canMoveX = true;
                for (let obs of obstacles) {
                    if (nextX >= obs.minX - 0.35 && nextX <= obs.maxX + 0.35 &&
                        character.position.z >= obs.minZ - 0.35 && character.position.z <= obs.maxZ + 0.35 &&
                        character.position.y + 0.1 < obs.topY && character.position.y + 1.2 > obs.minY) {
                        canMoveX = false; break;
                    }
                }
                if (canMoveX) character.position.x = nextX;

                let nextZ = character.position.z + moveZ;
                let canMoveZ = true;
                for (let obs of obstacles) {
                    if (character.position.x >= obs.minX - 0.35 && character.position.x <= obs.maxX + 0.35 &&
                        nextZ >= obs.minZ - 0.35 && nextZ <= obs.maxZ + 0.35 &&
                        character.position.y + 0.1 < obs.topY && character.position.y + 1.2 > obs.minY) {
                        canMoveZ = false; break;
                    }
                }
                if (canMoveZ) character.position.z = nextZ;

                character.rotation.y = Math.atan2(moveX, moveZ);
            }

            // Coin Collection Check
            coins.forEach((coin, index) => {
                if (character.position.distanceTo(coin.position) < 1.5) {
                    scene.remove(coin);
                    coins.splice(index, 1);
                    coinsCollected++;
                    document.getElementById('coinCount').innerText = coinsCollected;
                }
            });

            // Goal Gate Check (Level Up)
            if (goalGate && character.position.distanceTo(goalGate.position) < 2.5) {
                if (coinsCollected >= 200) {
                    isGameWon = true;
                    document.getElementById('status').innerHTML = '<span style="color:yellow; font-size:16px;">LEVEL UP! YOU WON THE GAME!</span>';
                } else {
                    document.getElementById('status').innerHTML = '<span style="color:orange;">Collect all 200 coins to pass the gate! (' + coinsCollected + '/200)</span>';
                }
            }

            // Enemies (Dogs & Snakes) Damage Check
            enemies.forEach(en => {
                let distToPlayer = en.position.distanceTo(character.position);
                if (distToPlayer < 25 && distToPlayer > 1.5) {
                    let dirX = (character.position.x - en.position.x) * 0.002;
                    let dirZ = (character.position.z - en.position.z) * 0.002;
                    en.position.x += dirX; en.position.z += dirZ;
                    en.rotation.y = Math.atan2(dirX, dirZ);
                }
                if (distToPlayer < 10 && Math.random() < 0.03) {
                    playerHealth -= 4;
                    document.getElementById('health-bar').style.width = Math.max(0, playerHealth) + '%';
                    if (playerHealth <= 0) {
                        isGameOver = true;
                        document.getElementById('status').innerHTML = '<span style="color:red; font-size:15px;">GAME OVER! Refresh to restart.</span>';
                    }
                }
            });

            doors.forEach(d => {
                let isOpen = character.position.distanceTo(new THREE.Vector3(d.closedX, 0, d.closedZ)) < 3.5;
                d.group.rotation.y += ((isOpen ? d.openRotY : d.closedRotY) - d.group.rotation.y) * 0.1;
            });

            velocityY -= gravity;
            character.position.y += velocityY;

            let targetGroundY = getTerrainHeight(character.position.x, character.position.z);
            for (let obs of obstacles) {
                if (character.position.x >= obs.minX - 0.3 && character.position.x <= obs.maxX + 0.3 &&
                    character.position.z >= obs.minZ - 0.3 && character.position.z <= obs.maxZ + 0.3) {
                    if (character.position.y >= obs.topY - 0.6 && character.position.y <= obs.topY + 0.6) {
                        if (obs.topY > targetGroundY) targetGroundY = obs.topY;
                    }
                }
            }

            if (character.position.y <= targetGroundY) {
                character.position.y = targetGroundY;
                velocityY = 0;
                isGrounded = true;
            }

            // Character Movement Animations
            const time = Date.now() * 0.015;
            if (!isGrounded) {
                leftArm.rotation.x = -Math.PI * 0.5;
                rightArm.rotation.x = -Math.PI * 0.5;
                leftLeg.rotation.x = Math.PI * 0.2;
                rightLeg.rotation.x = -Math.PI * 0.2;
            } else if (isMoving) {
                let speedFactor = isCrouching ? 0.5 : 0.9;
                leftArm.rotation.x = Math.sin(time) * speedFactor;
                rightArm.rotation.x = -Math.sin(time) * speedFactor;
                leftLeg.rotation.x = -Math.sin(time) * speedFactor;
                rightLeg.rotation.x = Math.sin(time) * speedFactor;
            } else {
                leftArm.rotation.x = 0; rightArm.rotation.x = 0;
                leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
            }

            let isInsideHouse = false;
            for (let obs of obstacles) {
                if (character.position.x >= obs.minX - 1 && character.position.x <= obs.maxX + 1 &&
                    character.position.z >= obs.minZ - 1 && character.position.z <= obs.maxZ + 1 &&
                    character.position.y >= obs.minY && character.position.y < obs.maxY) {
                    isInsideHouse = true; break;
                }
            }

            const camDistance = isInsideHouse ? 3.0 : 4.5;
            let targetCamX = character.position.x + Math.sin(cameraAngleX) * camDistance * Math.cos(cameraAngleY);
            let targetCamY = character.position.y + Math.sin(cameraAngleY) * camDistance + (isInsideHouse ? 0.4 : 0.8);
            let targetCamZ = character.position.z + Math.cos(cameraAngleX) * camDistance * Math.cos(cameraAngleY);

            camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.15);
            camera.lookAt(character.position.x, character.position.y + 0.8, character.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

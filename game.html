<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dummy Character & Level Design Prototype</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            user-select: none;
        }
        #instructions {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 18px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #instructions span {
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <strong>Controls:</strong><br>
        Move: <span>W, A, S, D</span> or <span>Arrow Keys</span><br>
        Jump: <span>SPACEBAR</span><br>
        Look Around: <span>Mouse Drag</span>
    </div>

    <!-- Include Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let character;
        let head, torso, leftArm, rightArm, leftLeg, rightLeg;
        let obstacles = [];
        
        // Physics & Movement variables
        let velocityY = 0;
        let gravity = 0.015;
        let isGrounded = false;
        const moveSpeed = 0.1;
        const jumpForce = 0.3;
        
        let keys = { w: false, a: false, s: false, d: false, space: false };
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleX = 0, cameraAngleY = 0.5;

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 5. Create Ground
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a7c59, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 6. Create Level Obstacles (Boxes to jump on / test collisions)
            createObstacle(0, 1, -10, 4, 2, 2, 0xd9534f);
            createObstacle(-6, 0.75, -5, 3, 1.5, 3, 0xf0ad4e);
            createObstacle(6, 1.5, -8, 2, 3, 4, 0x5bc0de);

            // 7. Build Dummy Character (~1.2 boxes height)
            character = new THREE.Group();
            
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x337ab7 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

            // Torso (Middle Area)
            const torsoGeo = new THREE.BoxGeometry(0.5, 0.6, 0.3);
            torso = new THREE.Mesh(torsoGeo, shirtMat);
            torso.position.y = 0.9;
            torso.castShadow = true;
            character.add(torso);

            // Head
            const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
            head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.35;
            head.castShadow = true;
            character.add(head);

            // Left Arm
            const armGeo = new THREE.BoxGeometry(0.15, 0.5, 0.15);
            leftArm = new THREE.Mesh(armGeo, skinMat);
            leftArm.position.set(-0.35, 0.9, 0);
            leftArm.castShadow = true;
            character.add(leftArm);

            // Right Arm
            rightArm = new THREE.Mesh(armGeo, skinMat);
            rightArm.position.set(0.35, 0.9, 0);
            rightArm.castShadow = true;
            character.add(rightArm);

            // Left Leg
            const legGeo = new THREE.BoxGeometry(0.18, 0.6, 0.18);
            leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.set(-0.15, 0.3, 0);
            leftLeg.castShadow = true;
            character.add(leftLeg);

            // Right Leg
            rightLeg = new THREE.Mesh(legGeo, pantsMat);
            rightLeg.position.set(0.15, 0.3, 0);
            rightLeg.castShadow = true;
            character.add(rightLeg);

            // Start position of character
            character.position.set(0, 0, 5);
            scene.add(character);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            
            window.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => { isMouseDown = false; });
            window.addEventListener('mousemove', onMouseMove);
        }

        function createObstacle(x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            
            // Store bounding box data for collision detection
            obstacles.push({
                minX: x - w / 2, maxX: x + w / 2,
                minZ: z - d / 2, maxZ: z + d / 2,
                topY: y + h / 2
            });
        }

        function handleKey(e, isDown) {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.w = isDown; break;
                case 'KeyS': case 'ArrowDown': keys.s = isDown; break;
                case 'KeyA': case 'ArrowLeft': keys.a = isDown; break;
                case 'KeyD': case 'ArrowRight': keys.d = isDown; break;
                case 'Space': 
                    if (isDown && isGrounded) {
                        velocityY = jumpForce;
                        isGrounded = false;
                    }
                    break;
            }
        }

        function onMouseMove(e) {
            if (!isMouseDown) return;
            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;
            
            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(1.4, cameraAngleY - deltaY * 0.005));
            
            mouseX = e.clientX;
            mouseY = e.clientY;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Character Movement Calculation
            let moveX = 0;
            let moveZ = 0;

            if (keys.w) moveZ -= moveSpeed;
            if (keys.s) moveZ += moveSpeed;
            if (keys.a) moveX -= moveSpeed;
            if (keys.d) moveX += moveSpeed;

            if (moveX !== 0 || moveZ !== 0) {
                character.position.x += moveX;
                character.position.z += moveZ;
                // Face towards movement direction
                character.rotation.y = Math.atan2(moveX, moveZ);
            }

            // Gravity & Vertical Physics
            velocityY -= gravity;
            character.position.y += velocityY;

            // Surface Collision Check (Prevent sinking into ground or obstacles)
            let targetGroundY = 0; // Default floor

            for (let obs of obstacles) {
                // Check if character is horizontally within the box boundaries
                if (character.position.x >= obs.minX && character.position.x <= obs.maxX &&
                    character.position.z >= obs.minZ && character.position.z <= obs.maxZ) {
                    // If the character is falling onto or standing on top of this obstacle
                    if (character.position.y >= obs.topY - 0.5 && character.position.y <= obs.topY + 0.5) {
                        if (obs.topY > targetGroundY) {
                            targetGroundY = obs.topY;
                        }
                    }
                }
            }

            // Ground collision resolution
            if (character.position.y <= targetGroundY) {
                character.position.y = targetGroundY;
                velocityY = 0;
                isGrounded = true;
            }

            // Animations (Walking & Jumping)
            const time = Date.now() * 0.01;
            const isMoving = (moveX !== 0 || moveZ !== 0) && isGrounded;

            if (!isGrounded) {
                // Jump Pose: Arms flying/raised up, legs bent
                leftArm.rotation.x = -Math.PI * 0.6;
                rightArm.rotation.x = -Math.PI * 0.6;
                leftLeg.rotation.x = Math.PI * 0.3;
                rightLeg.rotation.x = -Math.PI * 0.3;
            } else if (isMoving) {
                // Walk/Run Animation: Swing arms and legs symmetrically
                leftArm.rotation.x = Math.sin(time) * 0.8;
                rightArm.rotation.x = -Math.sin(time) * 0.8;
                leftLeg.rotation.x = -Math.sin(time) * 0.8;
                rightLeg.rotation.x = Math.sin(time) * 0.8;
            } else {
                // Idle Pose
                leftArm.rotation.x = 0;
                rightArm.rotation.x = 0;
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
            }

            // Smooth Third-Person Camera Follow
            const camDistance = 5;
            const targetCamX = character.position.x + Math.sin(cameraAngleX) * camDistance * Math.cos(cameraAngleY);
            const targetCamY = character.position.y + Math.sin(cameraAngleY) * camDistance + 0.5;
            const targetCamZ = character.position.z + Math.cos(cameraAngleX) * camDistance * Math.cos(cameraAngleY);

            camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.1);
            camera.lookAt(character.position.x, character.position.y + 0.8, character.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

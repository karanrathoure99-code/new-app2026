<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tactical Dummy Mission - Update 4 (Combat Edition)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #ui span {
            color: #4CAF50;
            font-weight: bold;
        }
        #health-bar-container {
            width: 150px;
            height: 12px;
            background: #555;
            border-radius: 6px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.2s;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            margin: -5px 0 0 -5px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">
        <strong>Health:</strong> 
        <div id="health-bar-container"><div id="health-bar"></div></div><br>
        <strong>Mission Status:</strong> <span id="status">Find the house with Gun, eliminate targets! Avoid enemy fire!</span><br>
        Targets Left: <span id="targetCount">10</span> | Weapon: <span id="weaponStatus">Unarmed</span>
    </div>
    <div id="crosshair"></div>

    <!-- Include Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let character;
        let head, torso, leftArm, rightArm, leftLeg, rightLeg;
        let obstacles = [];
        let doors = [];
        let enemies = [];
        let gunObject = null;
        let hasGun = false;
        let targetsRemaining = 10;
        let playerHealth = 100;
        let isGameOver = false;
        
        let velocityY = 0;
        let gravity = 0.015;
        let isGrounded = false;
        const moveSpeed = 0.12;
        const jumpForce = 0.32;
        
        let keys = { w: false, a: false, s: false, d: false, space: false };
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleX = 0, cameraAngleY = 0.85;

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.004);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(80, 120, 80);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -160;
            dirLight.shadow.camera.right = 160;
            dirLight.shadow.camera.top = 160;
            dirLight.shadow.camera.bottom = -160;
            scene.add(dirLight);

            // 5. Expanded Ground (300x300)
            const mapSize = 300;
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b6e4a, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 6. Boundary Walls
            const wallH = 6;
            const wMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 });
            createBoundaryWall(0, wallH/2, -mapSize/2, mapSize, wallH, 2, wMat);
            createBoundaryWall(0, wallH/2, mapSize/2, mapSize, wallH, 2, wMat);
            createBoundaryWall(-mapSize/2, wallH/2, 0, 2, wallH, mapSize, wMat);
            createBoundaryWall(mapSize/2, wallH/2, 0, 2, wallH, mapSize, wMat);

            // 7. Houses with Auto-Doors
            const houseCoords = [
                {x: -70, z: -70}, {x: 70, z: -70}, {x: -70, z: 70}, {x: 70, z: 70},
                {x: 0, z: -100}, {x: 0, z: 100}, {x: -100, z: 0}, {x: 100, z: 0}
            ];
            houseCoords.forEach(pos => createHouse(pos.x, 0, pos.z));

            // 8. Cover Boxes
            for(let x = -110; x <= 110; x += 40) {
                for(let z = -110; z <= 110; z += 40) {
                    if(Math.abs(x) > 20 || Math.abs(z) > 20) {
                        createCoverBox(x + (Math.random()*10 - 5), z + (Math.random()*10 - 5), 4.0, 2.2, 4.0);
                    }
                }
            }

            // 9. Gun Placement
            createGun(-70, 0.3, -70);

            // 10. Enemies
            const enemyCoords = [
                {x: 50, z: -50}, {x: -50, z: 90}, {x: 80, z: 50}, 
                {x: -30, z: -100}, {x: 40, z: 100}, {x: -90, z: -30},
                {x: 20, z: 20}, {x: -60, z: 40}, {x: 90, z: -80}, {x: 0, z: -40}
            ];
            enemyCoords.forEach(e => createEnemy(e.x, 0, e.z));

            // 11. Dummy Character
            character = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x337ab7 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

            torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), shirtMat);
            torso.position.y = 0.9; torso.castShadow = true;
            character.add(torso);

            head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), skinMat);
            head.position.y = 1.35; head.castShadow = true;
            character.add(head);

            const armGeo = new THREE.BoxGeometry(0.15, 0.5, 0.15);
            leftArm = new THREE.Mesh(armGeo, skinMat);
            leftArm.position.set(-0.35, 0.9, 0); character.add(leftArm);

            rightArm = new THREE.Mesh(armGeo, skinMat);
            rightArm.position.set(0.35, 0.9, 0); character.add(rightArm);

            const legGeo = new THREE.BoxGeometry(0.18, 0.6, 0.18);
            leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.set(-0.15, 0.3, 0); character.add(leftLeg);

            rightLeg = new THREE.Mesh(legGeo, pantsMat);
            rightLeg.position.set(0.15, 0.3, 0); character.add(rightLeg);

            character.position.set(0, 0, 120);
            scene.add(character);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            
            window.addEventListener('mousedown', (e) => {
                if (e.button === 0 && !isGameOver) {
                    isMouseDown = true;
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    shootGun();
                }
            });
            window.addEventListener('mouseup', () => { isMouseDown = false; });
            window.addEventListener('mousemove', onMouseMove);
        }

        function createBoundaryWall(x, y, z, w, h, d, mat) {
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            addObstacleBox(x, y, z, w, h, d);
        }

        function createHouse(x, y, z) {
            const houseWidth = 9, houseHeight = 4.5, houseDepth = 9, wallThickness = 0.4;
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xd9c3b0, roughness: 0.7 });

            let backWall = new THREE.Mesh(new THREE.BoxGeometry(houseWidth, houseHeight, wallThickness), wallMat);
            backWall.position.set(x, y + houseHeight/2, z - houseDepth/2);
            scene.add(backWall);
            addObstacleBox(backWall.position.x, backWall.position.y, backWall.position.z, houseWidth, houseHeight, wallThickness);

            let leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, houseHeight, houseDepth), wallMat);
            leftWall.position.set(x - houseWidth/2, y + houseHeight/2, z);
            scene.add(leftWall);
            addObstacleBox(leftWall.position.x, leftWall.position.y, leftWall.position.z, wallThickness, houseHeight, houseDepth);

            let rightWall1 = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, houseHeight, 3.5), wallMat);
            rightWall1.position.set(x + houseWidth/2, y + houseHeight/2, z - 2.75);
            scene.add(rightWall1);
            addObstacleBox(rightWall1.position.x, rightWall1.position.y, rightWall1.position.z, wallThickness, houseHeight, 3.5);

            let rightWall2 = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, houseHeight, 3.5), wallMat);
            rightWall2.position.set(x + houseWidth/2, y + houseHeight/2, z + 2.75);
            scene.add(rightWall2);
            addObstacleBox(rightWall2.position.x, rightWall2.position.y, rightWall2.position.z, wallThickness, houseHeight, 3.5);

            let winBottom = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, 1.2, 2), wallMat);
            winBottom.position.set(x + houseWidth/2, y + 0.6, z);
            scene.add(winBottom);
            addObstacleBox(winBottom.position.x, winBottom.position.y, winBottom.position.z, wallThickness, 1.2, 2);

            let winTop = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, 1.2, 2), wallMat);
            winTop.position.set(x + houseWidth/2, y + houseHeight - 0.6, z);
            scene.add(winTop);
            addObstacleBox(winTop.position.x, winTop.position.y, winTop.position.z, wallThickness, 1.2, 2);

            let frontWall1 = new THREE.Mesh(new THREE.BoxGeometry(3, houseHeight, wallThickness), wallMat);
            frontWall1.position.set(x - 3, y + houseHeight/2, z + houseDepth/2);
            scene.add(frontWall1);
            addObstacleBox(frontWall1.position.x, frontWall1.position.y, frontWall1.position.z, 3, houseHeight, wallThickness);

            let frontWall2 = new THREE.Mesh(new THREE.BoxGeometry(3, houseHeight, wallThickness), wallMat);
            frontWall2.position.set(x + 3, y + houseHeight/2, z + houseDepth/2);
            scene.add(frontWall2);
            addObstacleBox(frontWall2.position.x, frontWall2.position.y, frontWall2.position.z, 3, houseHeight, wallThickness);

            let doorTop = new THREE.Mesh(new THREE.BoxGeometry(3, 1, wallThickness), wallMat);
            doorTop.position.set(x, y + 4, z + houseDepth/2);
            scene.add(doorTop);
            addObstacleBox(doorTop.position.x, doorTop.position.y, doorTop.position.z, 3, 1, wallThickness);

            let doorMesh = new THREE.Mesh(new THREE.BoxGeometry(3, 3.5, 0.2), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
            doorMesh.position.set(x, y + 1.75, z + houseDepth/2);
            scene.add(doorMesh);

            doors.push({
                mesh: doorMesh,
                closedX: x, closedY: y + 1.75, closedZ: z + houseDepth/2,
                openZ: z + houseDepth/2 + 2.5
            });

            let roof = new THREE.Mesh(new THREE.BoxGeometry(houseWidth + 1, 0.5, houseDepth + 1), new THREE.MeshStandardMaterial({ color: 0xa93226 }));
            roof.position.set(x, y + houseHeight + 0.25, z);
            scene.add(roof);
        }

        function createCoverBox(x, z, w, h, d) {
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.5 }));
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            addObstacleBox(x, h / 2, z, w, h, d);
        }

        function addObstacleBox(x, y, z, w, h, d) {
            obstacles.push({
                minX: x - w / 2, maxX: x + w / 2,
                minZ: z - d / 2, maxZ: z + d / 2,
                minY: y - h / 2, maxY: y + h / 2,
                topY: y + h / 2
            });
        }

        function createGun(x, y, z) {
            gunObject = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.2), new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.8 }));
            gunObject.position.set(x, y, z);
            scene.add(gunObject);
        }

        function createEnemy(x, y, z) {
            let enemyGroup = new THREE.Group();
            let torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), new THREE.MeshStandardMaterial({ color: 0xe74c3c }));
            torso.position.y = 0.9;
            enemyGroup.add(torso);

            let head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 1.35;
            enemyGroup.add(head);

            enemyGroup.position.set(x, y, z);
            scene.add(enemyGroup);
            enemies.push(enemyGroup);
        }

        function handleKey(e, isDown) {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.w = isDown; break;
                case 'KeyS': case 'ArrowDown': keys.s = isDown; break;
                case 'KeyA': case 'ArrowLeft': keys.a = isDown; break;
                case 'KeyD': case 'ArrowRight': keys.d = isDown; break;
                case 'Space': 
                    if (isDown && isGrounded && !isGameOver) { velocityY = jumpForce; isGrounded = false; }
                    break;
            }
        }

        function onMouseMove(e) {
            if (!isMouseDown || isGameOver) return;
            cameraAngleX -= (e.clientX - mouseX) * 0.005;
            cameraAngleY = Math.max(0.2, Math.min(1.4, cameraAngleY - (e.clientY - mouseY) * 0.005));
            mouseX = e.clientX; mouseY = e.clientY;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function shootGun() {
            if (!hasGun || targetsRemaining <= 0) return;
            let raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            let enemyMeshes = [];
            enemies.forEach(en => { enemyMeshes.push(en.children[0]); enemyMeshes.push(en.children[1]); });

            let intersects = raycaster.intersectObjects(enemyMeshes);
            if (intersects.length > 0) {
                let hitEnemyGroup = intersects[0].object.parent;
                scene.remove(hitEnemyGroup);
                enemies = enemies.filter(e => e !== hitEnemyGroup);
                targetsRemaining--;
                document.getElementById('targetCount').innerText = targetsRemaining;
                if (targetsRemaining === 0) {
                    document.getElementById('status').innerHTML = '<span style="color:yellow;">Mission Complete! All targets eliminated!</span>';
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) return;

            let inputX = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
            let inputZ = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
            let moveX = 0, moveZ = 0;

            if (inputX !== 0 || inputZ !== 0) {
                let angle = cameraAngleX;
                moveX = (inputX * Math.cos(angle) + inputZ * Math.sin(angle)) * moveSpeed;
                moveZ = (inputZ * Math.cos(angle) - inputX * Math.sin(angle)) * moveSpeed;

                character.position.x += moveX;
                character.position.z += moveZ;
                character.rotation.y = Math.atan2(moveX, moveZ);
            }

            // Enemy Attack / Damage Mechanics (If enemy is close to player)
            enemies.forEach(en => {
                let distToPlayer = en.position.distanceTo(character.position);
                if (distToPlayer < 12) {
                    // Enemy shoots player if close
                    if (Math.random() < 0.03) {
                        playerHealth -= 5;
                        document.getElementById('health-bar').style.width = Math.max(0, playerHealth) + '%';
                        if (playerHealth <= 0) {
                            isGameOver = true;
                            document.getElementById('status').innerHTML = '<span style="color:red; font-size:16px;">GAME OVER! Refresh page to restart.</span>';
                        }
                    }
                }
            });

            doors.forEach(d => {
                let isOpen = character.position.distanceTo(new THREE.Vector3(d.closedX, d.closedY, d.closedZ)) < 2.5;
                if(!isOpen) {
                    for(let en of enemies) {
                        if(en.position.distanceTo(new THREE.Vector3(d.closedX, d.closedY, d.closedZ)) < 2.5) {
                            isOpen = true;
                            break;
                        }
                    }
                }
                let targetZ = isOpen ? d.openZ : d.closedZ;
                d.mesh.position.z += (targetZ - d.mesh.position.z) * 0.1;
            });

            if (gunObject && !hasGun) {
                if (character.position.distanceTo(gunObject.position) < 1.8) {
                    scene.remove(gunObject);
                    gunObject = null;
                    hasGun = true;
                    document.getElementById('weaponStatus').innerText = 'Assault Rifle';
                    document.getElementById('status').innerText = 'Gun acquired! Eliminate targets & avoid enemy fire!';
                }
            }

            velocityY -= gravity;
            character.position.y += velocityY;

            let targetGroundY = 0;
            for (let obs of obstacles) {
                if (character.position.x >= obs.minX - 0.3 && character.position.x <= obs.maxX + 0.3 &&
                    character.position.z >= obs.minZ - 0.3 && character.position.z <= obs.maxZ + 0.3) {
                    if (character.position.y >= obs.topY - 0.6 && character.position.y <= obs.topY + 0.6) {
                        if (obs.topY > targetGroundY) targetGroundY = obs.topY;
                    }
                }
            }

            if (character.position.y <= targetGroundY) {
                character.position.y = targetGroundY;
                velocityY = 0;
                isGrounded = true;
            }

            const camDistance = 6;
            let targetCamX = character.position.x + Math.sin(cameraAngleX) * camDistance * Math.cos(cameraAngleY);
            let targetCamY = character.position.y + Math.sin(cameraAngleY) * camDistance + 1.0;
            let targetCamZ = character.position.z + Math.cos(cameraAngleX) * camDistance * Math.cos(cameraAngleY);

            camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.1);
            camera.lookAt(character.position.x, character.position.y + 0.8, character.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

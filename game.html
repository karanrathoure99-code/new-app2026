<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Massive Open-World Map - 5x Size, Outer Ocean & Real Mountains</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Massive Open-World Map (5x Size):</strong><br>
        Map Area: <span>20,000 x 20,000 Units</span><br>
        Status: <span>Outer Ocean, Real Mountains & Clean Land Loaded</span>
    </div>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let mapSize = 20000; // 5x Expanded Size
        let minimapCtx, minimapCanvas;

        init();
        animate();

        function init() {
            // 1. Scene & Sky Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5294e2);
            scene.fog = new THREE.FogExp2(0x75aff7, 0.00015); // Adjusted fog for massive 20k scale

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 30000);
            camera.position.set(0, 1200, 2500);
            camera.lookAt(0, 0, 0);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(2000, 3000, 2000);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 15000;
            const d = 4000;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // 5. Endless Ocean Surrounding Outside Mountains (10,000+ units away from center)
            const oceanGeo = new THREE.PlaneGeometry(50000, 50000);
            const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1b4f72, roughness: 0.2 });
            const ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -5;
            scene.add(ocean);

            // 6. Massive Map Terrain Ground (Clean land, no internal water/rivers)
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize, 250, 250);
            const posAttr = groundGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                // Gentle rolling hills across the massive land
                let height = Math.sin(vx * 0.001) * Math.cos(vy * 0.001) * 60;
                posAttr.setZ(i, height);
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ color: 0x315c1b, roughness: 0.88 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 7. Build World Features (Real Organic Mountain Ranges & Center Peak)
            buildWorldFeatures();

            // Setup Minimap
            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            window.addEventListener('resize', onWindowResize);
        }

        // Real Natural Mountain Generator (Cluster of organic rock formations instead of single cones)
        function createRealMountainRange(x, z, width, length, maxHeight, colorHex) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.95, flatShading: true });
            
            // Create multiple overlapping organic rock mounds
            for (let i = 0; i < 6; i++) {
                let rW = width * (0.4 + Math.random() * 0.4);
                let rH = maxHeight * (0.6 + Math.random() * 0.4);
                let rD = length * (0.4 + Math.random() * 0.4);

                let geo = new THREE.ConeGeometry(rW, rH, 14, 10, true);
                let pos = geo.attributes.position;
                for (let j = 0; j < pos.count; j++) {
                    let vx = pos.getX(j);
                    let vy = pos.getY(j);
                    let vz = pos.getZ(j);
                    if (vy > 0) {
                        let noise = Math.sin(vx * 0.05) * Math.cos(vz * 0.05) * 20 + (Math.random() - 0.5) * 15;
                        pos.setX(j, vx + noise);
                        pos.setZ(j, vz + noise);
                    }
                }
                geo.computeVertexNormals();

                let mesh = new THREE.Mesh(geo, mat);
                let offsetX = (Math.random() - 0.5) * (width * 0.6);
                let offsetZ = (Math.random() - 0.5) * (length * 0.6);
                mesh.position.set(offsetX, rH / 2, offsetZ);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                group.add(mesh);
            }

            scene.add(group);
        }

        function buildWorldFeatures() {
            let halfMap = mapSize / 2 - 800;
            let step = 1800;

            // A. MAP KE CHARO AUR BOUNDARY PAR ASLI VISHAL PAHAAD (Seamless Mountain Wall)
            for (let x = -halfMap; x <= halfMap; x += step) {
                createRealMountainRange(x, -halfMap - 600, 1200, 1200, 1100, 0x434c40); // North Range
                createRealMountainRange(x, halfMap + 600, 1200, 1200, 1100, 0x3f483c);  // South Range
            }
            for (let z = -halfMap; z <= halfMap; z += step) {
                createRealMountainRange(-halfMap - 600, z, 1200, 1200, 1100, 0x475444); // West Range
                createRealMountainRange(halfMap + 600, z, 1200, 1200, 1100, 0x3b4338);  // East Range
            }

            // B. MAP KE BILKUL BEECH MEIN 1 VISHAL MUKHYA PAHAAD (Center Peak like Bermuda)
            createRealMountainRange(0, 0, 1800, 1800, 1400, 0x525c4e);

            // C. SURFACE PAR CHOTE-CHOTE PAHAADI AREA (Rolling Hills across 20k map)
            createRealMountainRange(-4000, -3500, 800, 800, 500, 0x4a5446);
            createRealMountainRange(4000, 3500, 900, 900, 550, 0x485244);
            createRealMountainRange(-4500, 4000, 850, 850, 520, 0x4f5a4b);
            createRealMountainRange(3500, -4000, 800, 800, 480, 0x465042);

            // D. Scattered Realistic Trees across the massive land
            for (let i = 0; i < 300; i++) {
                let tx = (Math.random() - 0.5) * (mapSize - 3000);
                let tz = (Math.random() - 0.5) * (mapSize - 3000);
                if (Math.abs(tx) < 1200 && Math.abs(tz) < 1200) continue; // Keep center peak clear
                createRealisticTree(tx, tz);
            }
        }

        function createRealisticTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.2, 12, 8), trunkMat);
            trunk.position.set(x, 6, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1d4722, roughness: 0.7 });
            const top = new THREE.Mesh(new THREE.SphereGeometry(6, 8, 8), foliageMat);
            top.position.set(x, 13, z);
            top.castShadow = true;
            scene.add(top);
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);
            minimapCtx.fillStyle = '#1b4f72'; // Ocean blue background
            minimapCtx.fillRect(0, 0, w, h);

            // Land mass representation (Massive 20k area)
            minimapCtx.fillStyle = '#315c1b';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, w*0.42, 0, Math.PI*2);
            minimapCtx.fill();

            // Center Peak Dot
            minimapCtx.fillStyle = '#525c4e';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 10, 0, Math.PI*2);
            minimapCtx.fill();

            // Center indicator
            minimapCtx.fillStyle = '#ff3300';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 4, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            let time = Date.now() * 0.0001;
            camera.position.x = Math.sin(time) * 4500;
            camera.position.z = Math.cos(time) * 4500;
            camera.lookAt(0, 300, 0);

            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

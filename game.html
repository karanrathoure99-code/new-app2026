<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Ultimate Level Devil Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #0f051d;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .arcade-cabinet {
            position: relative;
            background: #240046;
            border-radius: 14px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.8);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 620px;
            width: 100%;
            height: 95vh;
            max-height: 570px;
            border: 3px solid #7b2cbf;
        }

        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #3c096c;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #e0aaff;
            box-shadow: 0 3px 0px #10002b;
        }

        .hud-tools {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #ff5400;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #993300;
        }

        /* Puzzle Chamber */
        .puzzle-chamber {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #10002b;
            border-radius: 10px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.9);
            overflow: hidden;
            border: 2px solid #5a189a;
        }

        /* Maze & Devil Walls */
        .devil-wall {
            position: absolute;
            background: #7b2cbf;
            border-radius: 2px;
            box-shadow: 0 2px 0px #3c096c;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        /* Spikes / Traps */
        .devil-spike {
            position: absolute;
            background: #ff3333;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            box-shadow: 0 0 6px #ff0000;
        }

        /* Moving Hazard Blocks */
        .moving-hazard {
            position: absolute;
            background: #ff5400;
            border-radius: 3px;
            box-shadow: 0 0 8px #ff5400;
        }

        /* Animated Character */
        .dummy-character {
            position: absolute;
            width: 16px;
            height: 24px;
            z-index: 20;
            transition: top 0.04s linear, left 0.04s linear;
        }

        .dummy-head {
            position: absolute;
            top: 0;
            left: 4px;
            width: 8px;
            height: 8px;
            background: #ffdbac;
            border-radius: 50%;
        }

        .dummy-body {
            position: absolute;
            top: 8px;
            left: 6px;
            width: 4px;
            height: 9px;
            background: #ff5400;
            border-radius: 1px;
        }

        .dummy-arm-left, .dummy-arm-right {
            position: absolute;
            top: 9px;
            width: 5px;
            height: 2px;
            background: #7b2cbf;
            border-radius: 1px;
            transition: transform 0.1s ease;
        }
        .dummy-arm-left { left: 1px; transform-origin: right center; }
        .dummy-arm-right { right: 1px; transform-origin: left center; }

        .dummy-leg-left, .dummy-leg-right {
            position: absolute;
            bottom: 0;
            width: 2.5px;
            height: 7px;
            background: #fff;
            border-radius: 1px;
            transition: transform 0.1s ease;
        }
        .dummy-leg-left { left: 4px; transform-origin: top center; }
        .dummy-leg-right { right: 4px; transform-origin: top center; }

        /* Animation classes for Walking & Jumping */
        .walking-right .dummy-leg-left { transform: rotate(-35deg); }
        .walking-right .dummy-leg-right { transform: rotate(35deg); }
        .walking-left .dummy-leg-left { transform: rotate(35deg); }
        .walking-left .dummy-leg-right { transform: rotate(-35deg); }
        .jumping .dummy-arm-left { transform: rotate(-50deg); }
        .jumping .dummy-arm-right { transform: rotate(50deg); }
        .jumping .dummy-leg-left { transform: rotate(-20deg); }
        .jumping .dummy-leg-right { transform: rotate(20deg); }

        /* Trophy / Goal */
        .trophy-target {
            position: absolute;
            font-size: 20px;
            z-index: 10;
            filter: drop-shadow(0 0 6px #ffcc00);
        }

        .clue-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #7b2cbf;
            color: #fff;
            font-weight: 700;
            font-size: 8px;
            padding: 5px 8px;
            border-radius: 4px;
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 30;
            text-align: center;
            width: calc(100% - 12px);
            border: 1px solid #e0aaff;
        }

        .bottom-action-bar {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
            padding: 0 4px;
        }

        .control-btn {
            background: #7b2cbf;
            color: #fff;
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 9px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3c096c;
            text-align: center;
            font-weight: bold;
        }

        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #3c096c;
        }

        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #240046;
            border: 2px solid #ff5400;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 85%;
            max-width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }

        .modal-btn {
            background: #ff5400;
            color: #fff;
            padding: 8px 12px;
            font-size: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud-bar">
            <div>
                <span id="lvlLabel">LEVEL: 1</span>
                <span style="margin-left: 10px;" id="failsLabel">FAILS: 0</span>
            </div>
            <div class="hud-tools">
                <button class="hud-btn" onclick="resetGame()">🔄 RESTART</button>
            </div>
        </div>

        <!-- Puzzle Chamber -->
        <div class="puzzle-chamber" id="chamber">
            <div class="clue-box" id="msgBox">Level Devil: रास्तों और दीवारों पर भरोसा मत करो!</div>
            
            <div id="levelContent"></div>

            <!-- Character -->
            <div class="dummy-character" id="dummy">
                <div class="dummy-head"></div>
                <div class="dummy-body"></div>
                <div class="dummy-arm-left"></div>
                <div class="dummy-arm-right"></div>
                <div class="dummy-leg-left"></div>
                <div class="dummy-leg-right"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="bottom-action-bar">
            <div></div>
            <button class="control-btn" onmousedown="moveChar(0, -12)" ontouchstart="moveChar(0, -12)">⬆️ UP</button>
            <div></div>
            <button class="control-btn" onmousedown="moveChar(-12, 0)" ontouchstart="moveChar(-12, 0)">⬅️ LEFT</button>
            <button class="control-btn" onmousedown="moveChar(0, 12)" ontouchstart="moveChar(0, 12)">⬇️ DOWN</button>
            <button class="control-btn" onmousedown="moveChar(12, 0)" ontouchstart="moveChar(12, 0)">➡️ RIGHT</button>
        </div>

        <!-- Modal -->
        <div class="popup-modal" id="winModal">
            <h2 id="modalTitle" style="color: #ff5400; font-size: 12px; margin-bottom: 8px;">🎉 PASSED!</h2>
            <p id="modalDesc" style="font-family: 'Chakra Petch'; font-size: 11px; margin-bottom: 10px; color: #e0aaff;">अगले लेवल पर चलते हैं!</p>
            <button class="modal-btn" id="nextBtn" onclick="nextLevel()">NEXT ➡️</button>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        let posX = 15;
        let posY = 15;
        let fails = 0;
        let isOver = false;

        const dummy = document.getElementById('dummy');
        const winModal = document.getElementById('winModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const failsLabel = document.getElementById('failsLabel');
        const lvlLabel = document.getElementById('lvlLabel');
        const levelContent = document.getElementById('levelContent');
        const msgBox = document.getElementById('msgBox');

        // 😈 ULTIMATE LEVELS DATABASE (Level Devil + Maze + Traps + Running Trophy)
        const devilLevels = {
            1: {
                startPos: { x: 15, y: 15 },
                trophyPos: { top: '220px', right: '25px' },
                hint: "लेवल 1: पास जाते ही सामने वाली दीवार गायब हो जाएगी!",
                walls: [
                    { width: '15px', height: '170px', top: '30px', left: '70px', fake: false },
                    { width: '160px', height: '15px', top: '100px', left: '70px', fake: true },
                    { width: '15px', height: '140px', top: '30px', left: '240px', fake: false }
                ],
                spikes: [
                    { width: '25px', height: '20px', top: '150px', left: '150px' }
                ],
                movingBlocks: []
            },
            2: {
                startPos: { x: 15, y: 250 },
                trophyPos: { top: '25px', right: '25px' },
                hint: "लेवल 2: घूमते हुए खतरों और छिपे हुए काँटों से बचो!",
                walls: [
                    { width: '240px', height: '15px', top: '170px', left: '30px', fake: false },
                    { width: '15px', height: '150px', top: '40px', left: '270px', fake: true }
                ],
                spikes: [
                    { width: '25px', height: '20px', top: '140px', left: '100px' },
                    { width: '25px', height: '20px', top: '140px', left: '180px' }
                ],
                movingBlocks: [
                    { width: '20px', height: '20px', top: '80px', left: '120px', range: 80, speed: 3 }
                ]
            },
            3: {
                startPos: { x: 280, y: 15 },
                trophyPos: { bottom: '25px', left: '25px' },
                hint: "लेवल 3: यहाँ ट्रॉफी आपको देखकर खुद अपनी जगह बदल लेगी!",
                walls: [
                    { width: '15px', height: '210px', top: '20px', left: '180px', fake: false },
                    { width: '140px', height: '15px', top: '130px', left: '40px', fake: true }
                ],
                spikes: [
                    { width: '25px', height: '20px', top: '80px', left: '100px' }
                ],
                movingBlocks: [
                    { width: '20px', height: '20px', top: '180px', left: '220px', range: 60, speed: 4 }
                ]
            }
            // 💡 आप यहाँ `4: { ... }` जोड़कर और भी नए लेवल्स बना सकते हैं!
        };

        function loadLevel(lvl) {
            currentLevel = lvl;
            lvlLabel.innerText = "LEVEL: " + currentLevel;
            
            let data = devilLevels[currentLevel] || devilLevels[1];
            posX = data.startPos.x;
            posY = data.startPos.y;
            
            dummy.style.left = posX + 'px';
            dummy.style.top = posY + 'px';
            msgBox.innerText = data.hint;

            let html = `<div class="trophy-target" id="trophy" style="${data.trophyPos.top ? 'top:'+data.trophyPos.top : 'bottom:'+data.trophyPos.bottom}; ${data.trophyPos.right ? 'right:'+data.trophyPos.right : 'left:'+data.trophyPos.left}">🏆</div>`;
            
            data.walls.forEach((w, index) => {
                html += `<div class="devil-wall" id="wall_${index}" style="width:${w.width}; height:${w.height}; top:${w.top}; left:${w.left};"></div>`;
            });

            data.spikes.forEach((s, index) => {
                html += `<div class="devil-spike" id="spike_${index}" style="width:${s.width}; height:${s.height}; top:${s.top}; left:${s.left};"></div>`;
            });

            data.movingBlocks.forEach((m, index) => {
                html += `<div class="moving-hazard" id="moving_${index}" data-base="${m.left}" data-range="${m.range}" data-speed="${m.speed}" style="width:${m.width}; height:${m.height}; top:${m.top}; left:${m.left};"></div>`;
            });

            levelContent.innerHTML = html;
            winModal.style.display = "none";
            isOver = false;
        }

        // Moving blocks loop
        setInterval(() => {
            if (isOver) return;
            const movingBlocks = document.querySelectorAll('.moving-hazard');
            movingBlocks.forEach(block => {
                let base = parseInt(block.dataset.base);
                let range = parseInt(block.dataset.range);
                let speed = parseFloat(block.dataset.speed);
                let time = Date.now() * 0.005 * speed;
                let newLeft = base + Math.sin(time) * range;
                block.style.left = newLeft + 'px';
            });
        }, 30);

        function moveChar(dx, dy) {
            if (isOver) return;

            posX += dx;
            posY += dy;

            let chamber = document.getElementById('chamber');
            posX = Math.max(5, Math.min(posX, chamber.clientWidth - 20));
            posY = Math.max(5, Math.min(posY, chamber.clientHeight - 25));

            dummy.style.left = posX + 'px';
            dummy.style.top = posY + 'px';

            // Animation
            if (dx > 0) {
                dummy.className = "dummy-character walking-right";
            } else if (dx < 0) {
                dummy.className = "dummy-character walking-left";
            } else {
                dummy.className = "dummy-character jumping";
            }

            setTimeout(() => {
                if(!isOver) dummy.className = "dummy-character";
            }, 150);

            // Fake Wall / Vanishing Wall Trick
            let data = devilLevels[currentLevel];
            if(data && data.walls) {
                data.walls.forEach((w, index) => {
                    if (w.fake) {
                        let wallEl = document.getElementById(`wall_${index}`);
                        if (wallEl) {
                            let wRect = wallEl.getBoundingClientRect();
                            let dRect = dummy.getBoundingClientRect();
                            if (Math.abs(dRect.left - wRect.left) < 50 && Math.abs(dRect.top - wRect.top) < 50) {
                                wallEl.style.opacity = '0';
                                msgBox.innerText = "⚠️ धोखा! रास्ता गायब हो गया!";
                            }
                        }
                    }
                });
            }

            checkCollisions();
        }

        function checkCollisions() {
            const dRect = dummy.getBoundingClientRect();
            
            // Check Walls
            const walls = document.querySelectorAll('.devil-wall');
            let hit = false;
            walls.forEach(wall => {
                if (wall.style.opacity !== '0') {
                    let wRect = wall.getBoundingClientRect();
                    if (!(dRect.right < wRect.left || dRect.left > wRect.right || dRect.bottom < wRect.top || dRect.top > wRect.bottom)) {
                        hit = true;
                    }
                }
            });

            // Check Spikes
            const spikes = document.querySelectorAll('.devil-spike');
            spikes.forEach(spike => {
                let sRect = spike.getBoundingClientRect();
                if (!(dRect.right < sRect.left || dRect.left > sRect.right || dRect.bottom < sRect.top || dRect.top > sRect.bottom)) {
                    hit = true;
                }
            });

            // Check Moving Blocks
            const movings = document.querySelectorAll('.moving-hazard');
            movings.forEach(m => {
                let mRect = m.getBoundingClientRect();
                if (!(dRect.right < mRect.left || dRect.left > mRect.right || dRect.bottom < mRect.top || dRect.top > mRect.bottom)) {
                    hit = true;
                }
            });

            if (hit) {
                triggerFail("Level Devil के ट्रैप में फंस गए!");
                return;
            }

            // Check Trophy
            const trophy = document.getElementById('trophy');
            if (trophy) {
                // Troll in Level 3: Trophy runs away!
                if (currentLevel === 3 && posX > 100 && Math.random() < 0.25) {
                    trophy.style.top = (Math.random() * 150 + 20) + 'px';
                    trophy.style.left = (Math.random() * 150 + 30) + 'px';
                    msgBox.innerText = "🏆 हाहा! ट्रॉफी भाग रही है!";
                }

                let tRect = trophy.getBoundingClientRect();
                if (!(dRect.right < tRect.left || dRect.left > tRect.right || dRect.bottom < tRect.top || dRect.top > tRect.bottom)) {
                    triggerWin();
                }
            }
        }

        function triggerFail(reason) {
            if (isOver) return;
            isOver = true;
            fails++;
            failsLabel.innerText = "FAILS: " + fails;

            modalTitle.style.color = "#ff3333";
            modalTitle.innerText = "💀 WASTED!";
            modalDesc.innerText = reason + " ईगो हर्ट हुआ? फिर से ट्राई करो!";
            document.getElementById('nextBtn').innerText = "AGAIN 🔄";
            document.getElementById('nextBtn').onclick = () => loadLevel(currentLevel);
            winModal.style.display = "block";
        }

        function triggerWin() {
            if (isOver) return;
            isOver = true;
            modalTitle.style.color = "#00ffcc";
            modalTitle.innerText = "🎉 LEVEL CLEARED!";
            modalDesc.innerText = "शानदार! आपने डेविल लेवल पार कर लिया।";
            document.getElementById('nextBtn').innerText = "NEXT LEVEL ➡️";
            document.getElementById('nextBtn').onclick = () => {
                if(devilLevels[currentLevel + 1]) {
                    loadLevel(currentLevel + 1);
                } else {
                    modalTitle.innerText = "🏆 GAME COMPLETED!";
                    modalDesc.innerText = "आपने सारे Level Devil लेवल्स जीत लिए!";
                    document.getElementById('nextBtn').innerText = "RESTART 🔄";
                    document.getElementById('nextBtn').onclick = () => loadLevel(1);
                    winModal.style.display = "block";
                }
            };
            winModal.style.display = "block";
        }

        function resetGame() {
            loadLevel(currentLevel);
        }

        loadLevel(1);
    </script>
</body>
</html>

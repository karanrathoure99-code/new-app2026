<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤪 Z PAJAL - Level Devil Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #a26916;
      --corridor-bg: #fca240;
      --player-color: #111111;
      --door-frame: #3b2200;
      --door-fill: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Press Start 2P', monospace;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-outer);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      padding: 8px 10px 14px 10px;
    }

    .top-header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
    }

    .level-badge {
      background: #4a2d04;
      color: #fca240;
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      outline: none;
      box-shadow: 0 4px 0 #281700;
      letter-spacing: 1px;
    }

    .levels-btn {
      background: #fca240;
      color: #3b2200;
      font-size: 10px;
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #b86e18;
      transition: transform 0.08s ease;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
    }

    .levels-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b86e18;
    }

    #gameCanvas {
      background-color: var(--bg-outer);
      image-rendering: pixelated;
      display: block;
      border-radius: 4px;
      max-width: 98vw;
      max-height: 72vh;
    }

    /* On-Screen Touch Buttons (Phone/Tablet me visible) */
    .controls-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 10;
    }

    .dpad {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .ctrl-btn {
      width: 72px;
      height: 52px;
      background: rgba(252, 162, 64, 0.6);
      border: 3px solid rgba(74, 45, 4, 0.7);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      color: #3b2200;
      cursor: pointer;
      touch-action: manipulation;
    }

    .ctrl-btn:active {
      background: rgba(252, 162, 64, 0.95);
      transform: scale(0.94);
    }

    /* Desktop mouse users ke liye hide, mobile/tablet me compulsory show */
    @media (min-width: 1025px) and (hover: hover) and (pointer: fine) {
      .controls-container {
        display: none !important;
      }
      body {
        justify-content: center;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="level-badge" id="levelDisplay">LEVEL 1 / 2</div>
    <!-- 404 fix: level.html set kar diya gaya hai -->
    <a href="level.html" class="levels-btn">📑 LEVEL</a>
  </div>

  <canvas id="gameCanvas" width="960" height="400"></canvas>

  <!-- Mobile & Tablet Controls -->
  <div class="controls-container" id="touchControls">
    <div class="dpad">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnDown">▼</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <button class="ctrl-btn" id="btnJump">▲</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('levelDisplay');

    // Auto Fullscreen & Landscape on tap/click anywhere
    async function triggerAutoFullscreen() {
      try {
        const docEl = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (docEl.requestFullscreen) {
            await docEl.requestFullscreen();
          } else if (docEl.webkitRequestFullscreen) {
            await docEl.webkitRequestFullscreen();
          }
        }
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape').catch(() => {});
        }
      } catch (e) {}
    }

    window.addEventListener('click', triggerAutoFullscreen, { once: true });
    window.addEventListener('touchstart', triggerAutoFullscreen, { once: true });

    // Phone / Tablet Check to ensure buttons never disappear on touch devices
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (isTouchDevice) {
      document.getElementById('touchControls').style.display = 'flex';
    }

    // Corridor Play Area
    const corridor = {
      x: 40,
      y: 125,
      width: 880,
      height: 145
    };

    const STORAGE_KEY = 'saveLevel_TumseNaHoPayga';
    let currentSavedLevel = parseInt(localStorage.getItem(STORAGE_KEY)) || 1;
    if (currentSavedLevel > 2) currentSavedLevel = 1;
    let currentLevelIdx = currentSavedLevel - 1;
    let deathFlashTimer = 0;

    let doorState = {
      isClosing: false,
      closeProgress: 0,
      speed: 0.08 // 80% Fast close
    };

    const levels = [
      {
        id: 1,
        playerStart: { x: 80 },
        door: { x: 820, behavior: 'none' },
        pits: [
          { x: 620, width: 52, triggerX: 500, opened: false }
        ],
        spikes: [],
        invert: false
      },
      {
        id: 2,
        playerStart: { x: 80 },
        door: { x: 700, behavior: 'jump_away', triggerDist: 150, jumped: false },
        pits: [],
        spikes: [],
        invert: false
      }
    ];

    // Character State
    const NORMAL_HEIGHT = 36;
    const CROUCH_HEIGHT = 22;

    const player = {
      x: 80,
      y: 0,
      width: 24, // 70% solid body
      height: NORMAL_HEIGHT,
      vx: 0,
      vy: 0,
      facing: 1,
      walkCycle: 0,
      speed: 3.8,
      jumpPower: -9.4,
      grounded: false,
      isCrouching: false,
      enteredDoor: false
    };

    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // Touch button listeners
    const setupBtn = (id, keyName) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
      btn.addEventListener('mousedown', () => keys[keyName] = true);
      btn.addEventListener('mouseup', () => keys[keyName] = false);
    };
    setupBtn('btnLeft', 'ArrowLeft');
    setupBtn('btnRight', 'ArrowRight');
    setupBtn('btnDown', 'ArrowDown');
    setupBtn('btnJump', 'Space');

    function playBeep(freq, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initLevel(idx) {
      if (idx >= levels.length) idx = 0;
      currentLevelIdx = idx;

      const lvl = levels[currentLevelIdx];
      levelDisplay.innerText = `LEVEL ${lvl.id} / ${levels.length}`;
      localStorage.setItem(STORAGE_KEY, lvl.id);

      player.height = NORMAL_HEIGHT;
      player.x = lvl.playerStart.x;
      player.y = corridor.y + corridor.height - player.height;
      player.vx = 0;
      player.vy = 0;
      player.walkCycle = 0;
      player.facing = 1;
      player.isCrouching = false;
      player.enteredDoor = false;

      doorState.isClosing = false;
      doorState.closeProgress = 0;

      lvl.pits.forEach(p => p.opened = false);
      lvl.spikes.forEach(s => s.active = false);
      if (lvl.door.behavior === 'jump_away') lvl.door.jumped = false;
    }

    function triggerDeath() {
      playBeep(180, 0.12);
      deathFlashTimer = 16;
      initLevel(currentLevelIdx);
    }

    function drawDoor(x, y, w, h, closeProgress) {
      ctx.save();
      ctx.fillStyle = '#3b2200';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + 14, w / 2, Math.PI, 0);
      ctx.rect(x, y + 14, w, h - 14);
      ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + 16, (w - 8) / 2, Math.PI, 0);
      ctx.rect(x + 4, y + 16, w - 8, h - 16);
      ctx.fill();

      if (closeProgress > 0) {
        ctx.fillStyle = '#3b2200';
        const shutterHeight = (h - 16) * Math.min(1, closeProgress);
        ctx.fillRect(x + 4, y + 16, w - 8, shutterHeight);
      }
      ctx.restore();
    }

    // Authentic Game Character: Devil with Horns, Eye, Torso & Boots
    function drawDummy(p) {
      ctx.save();
      const cx = p.x + p.width / 2;
      const f = p.facing;

      ctx.fillStyle = '#111111';
      ctx.strokeStyle = '#111111';
      ctx.lineCap = 'round';

      if (p.isCrouching) {
        // Crouched / Sitting Character
        const headRadius = 7;
        const headY = p.y + headRadius;

        // Devil Horns
        ctx.beginPath();
        ctx.moveTo(cx - 5 * f, headY - 4);
        ctx.lineTo(cx - 7 * f, headY - 10);
        ctx.lineTo(cx - 2 * f, headY - 6);
        ctx.moveTo(cx + 1 * f, headY - 6);
        ctx.lineTo(cx + 4 * f, headY - 10);
        ctx.lineTo(cx + 3 * f, headY - 4);
        ctx.fill();

        // Head
        ctx.beginPath();
        ctx.arc(cx, headY, headRadius, 0, Math.PI * 2);
        ctx.fill();

        // Eye slit (Devil look)
        ctx.fillStyle = '#fca240';
        ctx.fillRect(cx + 2 * f, headY - 1, 2.5, 2.5);

        // Body squatted
        ctx.fillStyle = '#111111';
        ctx.fillRect(cx - 8, headY + 5, 16, p.height - (headRadius + 5));

      } else {
        // Standing / Running Game Character
        const headRadius = 7.5;
        const headY = p.y + headRadius + 3;

        // 1. Devil Horns (Sharp devil points)
        ctx.beginPath();
        ctx.moveTo(cx - 5, headY - 4);
        ctx.lineTo(cx - 7, headY - 11);
        ctx.lineTo(cx - 2, headY - 6);
        ctx.moveTo(cx + 2, headY - 6);
        ctx.lineTo(cx + 7, headY - 11);
        ctx.lineTo(cx + 5, headY - 4);
        ctx.fill();

        // 2. Devil Round Head
        ctx.beginPath();
        ctx.arc(cx, headY, headRadius, 0, Math.PI * 2);
        ctx.fill();

        // 3. Eye Slit
        ctx.fillStyle = '#fca240';
        ctx.fillRect(cx + 2 * f, headY - 1, 2.5, 2.5);

        // 4. Solid Torso
        ctx.fillStyle = '#111111';
        const torsoTop = headY + headRadius - 1;
        const torsoH = 11;
        ctx.fillRect(cx - 7, torsoTop, 14, torsoH);

        // 5. Animated Legs
        const hipY = torsoTop + torsoH;
        ctx.lineWidth = 5;

        if (!p.grounded) {
          // In-air jump pose
          ctx.beginPath();
          ctx.moveTo(cx - 3, hipY);
          ctx.lineTo(cx - 8 * f, p.y + p.height - 2);
          ctx.moveTo(cx + 3, hipY);
          ctx.lineTo(cx + 7 * f, p.y + p.height - 4);
          ctx.stroke();
        } else if (Math.abs(p.vx) > 0.1) {
          // Real running cycle
          const swing = Math.sin(p.walkCycle) * 7.5;
          ctx.beginPath();
          ctx.moveTo(cx - 3, hipY);
          ctx.lineTo(cx - 3 + swing, p.y + p.height);
          ctx.moveTo(cx + 3, hipY);
          ctx.lineTo(cx + 3 - swing, p.y + p.height);
          ctx.stroke();
        } else {
          // Standing idle boots
          ctx.beginPath();
          ctx.moveTo(cx - 4, hipY);
          ctx.lineTo(cx - 4, p.y + p.height);
          ctx.moveTo(cx + 4, hipY);
          ctx.lineTo(cx + 4, p.y + p.height);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function update() {
      const lvl = levels[currentLevelIdx];
      const groundY = corridor.y + corridor.height;

      // Door Closing Logic
      if (doorState.isClosing) {
        doorState.closeProgress += doorState.speed;
        if (doorState.closeProgress >= 1) {
          doorState.closeProgress = 1;
          playBeep(700, 0.1);
          initLevel(currentLevelIdx + 1);
          return;
        }
      }

      // Movement
      let move = 0;
      if (!player.enteredDoor) {
        const wantsCrouch = (keys['ArrowDown'] || keys['KeyS']) && player.grounded;
        if (wantsCrouch && !player.isCrouching) {
          player.isCrouching = true;
          player.height = CROUCH_HEIGHT;
          player.y = groundY - player.height;
        } else if (!wantsCrouch && player.isCrouching) {
          player.isCrouching = false;
          player.height = NORMAL_HEIGHT;
          player.y = groundY - player.height;
        }

        if (keys['ArrowRight'] || keys['KeyD']) move += 1;
        if (keys['ArrowLeft'] || keys['KeyA']) move -= 1;
        if (lvl.invert) move *= -1;

        const currentSpeed = player.isCrouching ? player.speed * 0.5 : player.speed;
        player.vx = move * currentSpeed;

        if (move !== 0) {
          player.facing = move > 0 ? 1 : -1;
          player.walkCycle += 0.35;
        } else {
          player.walkCycle = 0;
        }

        if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded && !player.isCrouching) {
          player.vy = player.jumpPower;
          player.grounded = false;
          playBeep(450, 0.05);
        }
      } else {
        player.vx = 0;
      }

      // Physics
      player.vy += 0.44;
      player.x += player.vx;
      player.y += player.vy;

      if (player.x < corridor.x) player.x = corridor.x;

      lvl.pits.forEach(p => {
        if (player.x > p.triggerX) p.opened = true;
      });

      let doorX = lvl.door.x;
      if (lvl.door.behavior === 'jump_away' && Math.abs(player.x - lvl.door.x) < lvl.door.triggerDist) {
        lvl.door.jumped = true;
      }
      if (lvl.door.jumped) doorX = corridor.x + corridor.width - 55;

      let fallingInPit = false;
      lvl.pits.forEach(p => {
        if (p.opened && (player.x + player.width > p.x && player.x < p.x + p.width)) {
          fallingInPit = true;
        }
      });

      const floorY = groundY - player.height;
      if (!fallingInPit && player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.grounded = true;
      }

      if (player.y > canvas.height + 40) {
        triggerDeath();
      }

      const doorW = 38;
      const doorH = 46;
      const doorY = groundY - doorH;

      if (!player.enteredDoor &&
          player.x + player.width / 2 > doorX + 10 &&
          player.x < doorX + doorW &&
          player.y + player.height >= doorY) {
        player.enteredDoor = true;
        player.x = doorX + (doorW - player.width) / 2;
        doorState.isClosing = true;
        playBeep(320, 0.15);
      }

      // Drawing
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#a26916';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fca240';
      ctx.fillRect(corridor.x, corridor.y, corridor.width, corridor.height);

      lvl.pits.forEach(p => {
        if (p.opened) {
          ctx.fillStyle = '#a26916';
          ctx.fillRect(p.x, corridor.y, p.width, corridor.height + 150);
        }
      });

      drawDoor(doorX, doorY, doorW, doorH, 0);
      drawDummy(player);

      if (doorState.closeProgress > 0) {
        drawDoor(doorX, doorY, doorW, doorH, doorState.closeProgress);
      }

      if (deathFlashTimer > 0) {
        ctx.fillStyle = 'rgba(59, 34, 0, 0.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        deathFlashTimer--;
      }

      requestAnimationFrame(update);
    }

    initLevel(currentLevelIdx);
    update();
  </script>
</body>
</html>

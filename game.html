<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic Open-World Map with Live Minimap</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        /* Live Minimap UI Style */
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Open-World Map (Bermuda Scale+):</strong><br>
        Map Area: <span>4000 x 4000 Units</span><br>
        Status: <span>Realistic Trees & Grass Loaded</span>
    </div>

    <!-- Live Minimap UI -->
    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let mapSize = 4000;
        let dummyMarker;
        let minimapCtx, minimapCanvas;

        init();
        animate();

        function init() {
            // 1. Scene & Sky Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5294e2); // Realistic Sky Blue
            scene.fog = new THREE.FogExp2(0x75aff7, 0.0006); // Atmospheric depth fog for massive scale

            // 2. Camera Setup (Overview angle to inspect the massive realistic map)
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 8000);
            camera.position.set(0, 150, 250);
            camera.lookAt(0, 0, 0);

            // 3. Renderer Setup with Shadows & High-End Tone Mapping
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting (Sun & Ambient Glow for smooth leaf/branch highlights)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(500, 800, 500);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 3000;
            const d = 600;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // 5. Massive Realistic Surface (Ground / Terrain)
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize, 180, 180);
            const posAttr = groundGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                // Natural rolling hills and terrain variation across the massive map
                let height = Math.sin(vx * 0.004) * Math.cos(vy * 0.004) * 25;
                if(Math.abs(vx) > 300 || Math.abs(vy) > 300) {
                    height += Math.sin(vx * 0.01) * 10;
                }
                posAttr.setZ(i, height);
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x315c1b, 
                roughness: 0.88, 
                metalness: 0.03 
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 6. Build Realistic Environment (Mountains, Detailed Trees & Tall Grass)
            buildRealisticEnvironment();

            // Setup Minimap Canvas Context
            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            window.addEventListener('resize', onWindowResize);
        }

        // Environment Builder: Realistic Mountains, Smooth Trees & Long Grass Tuplets
        function buildRealisticEnvironment() {
            // A. Mountains surrounding the massive perimeter
            createMountain(-1500, 0, -1500, 700, 350, 700, 0x3b4639);
            createMountain(1500, 0, -1600, 800, 380, 800, 0x323c30);
            createMountain(0, 0, -1800, 900, 420, 850, 0x2a3328);
            createMountain(-1600, 0, 1200, 750, 360, 750, 0x374235);
            createMountain(1600, 0, 1300, 850, 400, 850, 0x303a2e);

            // B. Realistic Smooth Trees with clear trunk, branches and glossy leaves
            for (let i = 0; i < 150; i++) {
                let tx = (Math.random() - 0.5) * (mapSize - 400);
                let tz = (Math.random() - 0.5) * (mapSize - 400);
                if (Math.abs(tx) < 100 && Math.abs(tz) < 100) continue; // Keep center clear
                
                if (i % 2 === 0) {
                    createRealisticPineTree(tx, tz);
                } else {
                    createRealisticLeafyTree(tx, tz);
                }
            }

            // C. Tall Realistic Grass Patches (Multiple Varieties)
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x3a7018, roughness: 0.85 });
            for (let i = 0; i < 800; i++) {
                let gx = (Math.random() - 0.5) * (mapSize - 200);
                let gz = (Math.random() - 0.5) * (mapSize - 200);
                if (Math.abs(gx) < 80 && Math.abs(gz) < 80) continue;

                const grass = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.8, 5), grassMat);
                grass.position.set(gx, 0.9, gz);
                grass.castShadow = true;
                scene.add(grass);
            }
        }

        // Realistic Pine Tree with smooth trunk & layered foliage
        function createRealisticPineTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 8, 8), trunkMat);
            trunk.position.set(x, 4, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1d4722, roughness: 0.7, metalness: 0.1 });
            for (let j = 0; j < 4; j++) {
                let tier = new THREE.Mesh(new THREE.ConeGeometry(3.5 - (j * 0.7), 3.5, 7), foliageMat);
                tier.position.set(x, 6 + (j * 2.2), z);
                tier.castShadow = true;
                scene.add(tier);
            }
        }

        // Realistic Leafy Tree with distinct smooth branches and lush glossy leaves
        function createRealisticLeafyTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x543d2b, roughness: 0.85 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.5, 9, 8), trunkMat);
            trunk.position.set(x, 4.5, z);
            trunk.castShadow = true;
            scene.add(trunk);

            // Multiple glossy canopy clusters for realistic leaf appearance
            const canopyMat = new THREE.MeshStandardMaterial({ color: 0x28632b, roughness: 0.65, metalness: 0.05 });
            const top = new THREE.Mesh(new THREE.SphereGeometry(4.5, 8, 8), canopyMat);
            top.position.set(x, 9.5, z);
            top.castShadow = true;
            scene.add(top);

            const side1 = new THREE.Mesh(new THREE.SphereGeometry(2.8, 7, 7), canopyMat);
            side1.position.set(x + 2.2, 8.2, z);
            side1.castShadow = true;
            scene.add(side1);

            const side2 = new THREE.Mesh(new THREE.SphereGeometry(2.8, 7, 7), canopyMat);
            side2.position.set(x - 2.2, 8.2, z);
            side2.castShadow = true;
            scene.add(side2);
        }

        function createMountain(x, y, z, w, h, d, color) {
            const mountain = new THREE.Mesh(new THREE.ConeGeometry(w / 2, h, 8), new THREE.MeshStandardMaterial({ color: color, roughness: 0.95 }));
            mountain.position.set(x, h / 2, z);
            mountain.castShadow = true;
            mountain.receiveShadow = true;
            scene.add(mountain);
        }

        // Live Minimap Rendering function
        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);

            // Background of minimap (Map area representation)
            minimapCtx.fillStyle = '#223816';
            minimapCtx.fillRect(0, 0, w, h);

            // Draw roads representation on minimap
            minimapCtx.strokeStyle = '#111111';
            minimapCtx.lineWidth = 3;
            minimapCtx.beginPath();
            minimapCtx.moveTo(w/2, 0); minimapCtx.lineTo(w/2, h);
            minimapCtx.moveTo(0, h/2); minimapCtx.lineTo(w, h/2);
            minimapCtx.stroke();

            // Draw Camera/Center indicator (Simulated character position at origin/center for now)
            minimapCtx.fillStyle = '#ff3300'; // Bright Red Dot for Live Position
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 5, 0, Math.PI * 2);
            minimapCtx.fill();
            minimapCtx.strokeStyle = '#ffffff';
            minimapCtx.lineWidth = 1.5;
            minimapCtx.stroke();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Slowly rotate camera around the massive map for scenic preview
            let time = Date.now() * 0.0002;
            camera.position.x = Math.sin(time) * 450;
            camera.position.z = Math.cos(time) * 450;
            camera.lookAt(0, 20, 0);

            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

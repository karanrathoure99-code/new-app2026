<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - The Gaslighting Trap</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #18001d;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .arcade-cabinet {
            position: relative;
            background: #7b2cbf;
            border-radius: 14px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.6);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 620px;
            width: 100%;
            height: 95vh;
            max-height: 550px;
            border: 2px solid #e0aaff;
        }

        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #5a189a;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #e0aaff;
            box-shadow: 0 3px 0px #3c096c;
        }

        .hud-tools {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #3c096c;
            color: #e0aaff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #240046;
        }

        /* Puzzle Chamber */
        .puzzle-chamber {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #240046;
            border-radius: 10px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .hazard {
            position: absolute;
            background: #ff5400;
            border-radius: 4px;
            box-shadow: 0 0 8px #ff5400;
        }

        /* Character */
        .dummy-character {
            position: absolute;
            width: 18px;
            height: 26px;
            bottom: 12px;
            left: 20px;
            z-index: 10;
            transform-style: preserve-3d;
            transition: left 0.05s linear, bottom 0.15s ease;
        }

        .dummy-head {
            position: absolute;
            top: 0;
            left: 4px;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 3px 3px, #fff, #7b2cbf);
            border-radius: 50%;
        }

        .dummy-body {
            position: absolute;
            top: 9px;
            left: 7px;
            width: 4px;
            height: 10px;
            background: #e0aaff;
            border-radius: 2px;
        }

        .dummy-arm-left, .dummy-arm-right {
            position: absolute;
            top: 10px;
            width: 6px;
            height: 2px;
            background: #fff;
            border-radius: 1px;
        }
        .dummy-arm-left { left: 1px; }
        .dummy-arm-right { right: 1px; }

        .dummy-leg-left, .dummy-leg-right {
            position: absolute;
            bottom: 0;
            width: 3px;
            height: 7px;
            background: #fff;
            border-radius: 1px;
        }
        .dummy-leg-left { left: 5px; }
        .dummy-leg-right { right: 5px; }

        /* Target Gate */
        .target-gate {
            width: 26px;
            height: 30px;
            background: linear-gradient(135deg, #38b000, #007200);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 11px;
            position: absolute;
            bottom: 12px;
            right: 15px;
            z-index: 5;
            box-shadow: 0 0 10px #38b000;
        }

        .clue-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #ff5400;
            color: #fff;
            font-weight: 700;
            font-size: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 20;
            text-align: center;
            width: calc(100% - 12px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .bottom-action-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
            gap: 6px;
        }

        .control-btn {
            flex: 1;
            background: #5a189a;
            color: #e0aaff;
            padding: 12px 6px;
            border-radius: 8px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3c096c;
            text-align: center;
            border: 1px solid #7b2cbf;
        }

        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #3c096c;
        }

        .danger-btn {
            background: #ff5400;
            color: #fff;
            border: 1px solid #ff751a;
            box-shadow: 0 4px 0px #cc4400;
        }

        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #3c096c;
            border: 2px solid #e0aaff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 85%;
            max-width: 300px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.9);
        }

        .modal-btn {
            background: #7b2cbf;
            color: #fff;
            padding: 8px 12px;
            font-size: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud-bar">
            <div>
                <span id="lvlLabel">LEVEL: OUT OF BODY</span>
                <span style="margin-left: 10px;" id="failsLabel">FAILS: 0</span>
            </div>
            <div class="hud-tools">
                <button class="hud-btn" onclick="resetGame()">🔄 RESTART</button>
            </div>
        </div>

        <!-- Maze Chamber -->
        <div class="puzzle-chamber" id="chamber">
            <div class="clue-box" id="gaslightText">Mission: ऐप छोड़कर फोन की Home Screen चेक करो!</div>
            
            <div class="hazard" style="width: 45px; height: 12px; bottom: 12px; left: 150px;"></div>

            <!-- Character -->
            <div class="dummy-character" id="dummy">
                <div class="dummy-head"></div>
                <div class="dummy-body"></div>
                <div class="dummy-arm-left"></div>
                <div class="dummy-arm-right"></div>
                <div class="dummy-leg-left"></div>
                <div class="dummy-leg-right"></div>
            </div>

            <!-- Target Gate -->
            <div class="target-gate" id="gate">🚪</div>
        </div>

        <!-- Controls -->
        <div class="bottom-action-bar">
            <button class="control-btn" onclick="movePlayer(-15)">◀ LEFT</button>
            <button class="control-btn danger-btn" onclick="jumpPlayer()">JUMP ⬆️</button>
            <button class="control-btn" onclick="movePlayer(15)">RIGHT ▶</button>
        </div>

        <!-- Modal -->
        <div class="popup-modal" id="winModal">
            <h2 id="modalTitle" style="color: #38b000; font-size: 12px; margin-bottom: 8px;">🎉 SURVIVED!</h2>
            <p id="modalDesc" style="font-family: 'Chakra Petch'; font-size: 11px; margin-bottom: 10px; color: #e0aaff;">तुमने गेम के दायरे को ही तोड़ दिया!</p>
            <button class="modal-btn" onclick="resetGame()">AGAIN 🔄</button>
        </div>
    </div>

    <script>
        let posX = 20;
        let posY = 12;
        let fails = 0;
        let isOver = false;
        
        const dummy = document.getElementById('dummy');
        const winModal = document.getElementById('winModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const failsLabel = document.getElementById('failsLabel');
        const gaslightText = document.getElementById('gaslightText');

        // NEW: Detect when the user minimizes the game or switches tabs (Visibility API)
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && !isOver) {
                // Player fell for the trap and left the game/tab!
                triggerFail("तुम गेम छोड़कर होम स्क्रीन देखने चले गए! तुम्हें लगा वहाँ कोई सीक्रेट की है?");
            }
        });

        function movePlayer(val) {
            if (isOver) return;
            posX += val;
            posX = Math.max(10, Math.min(posX, 430));
            dummy.style.left = posX + 'px';
            checkCollisions();
        }

        function jumpPlayer() {
            if (isOver) return;
            posY = 75;
            dummy.style.bottom = posY + 'px';

            setTimeout(() => {
                posY = 12;
                dummy.style.bottom = posY + 'px';
                checkCollisions();
            }, 300);
        }

        function checkCollisions() {
            // Pit is around 150px to 195px
            if (posX >= 140 && posX <= 195 && posY <= 15) {
                triggerFail("बिना सोचे-समझे सीधे खाई में कूद पड़े!");
            } else if (posX >= 410) {
                triggerWin();
            }
        }

        function triggerFail(reason) {
            if (isOver) return;
            isOver = true;
            fails++;
            failsLabel.innerText = "FAILS: " + fails;
            
            modalTitle.style.color = "#ff5400";
            modalTitle.innerText = "💀 GASLIT & DEAD!";
            modalDesc.innerText = reason + " प्लेयर का ईगो पूरी तरह टूट गया ना? फिर से ट्राई करो!";
            winModal.style.display = "block";
        }

        function triggerWin() {
            if (isOver) return;
            isOver = true;
            modalTitle.style.color = "#38b000";
            modalTitle.innerText = "🎉 ABSOLUTE GENIUS!";
            modalDesc.innerText = "तुमने इस साइकोलॉजिकल टॉर्चर को पार कर लिया!";
            winModal.style.display = "block";
        }

        function resetGame() {
            posX = 20;
            posY = 12;
            isOver = false;
            dummy.style.left = posX + 'px';
            dummy.style.bottom = posY + 'px';
            winModal.style.display = "none";
            gaslightText.innerText = "Mission: ऐप छोड़कर फोन की Home Screen चेक करो!";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤪 Z PAJAL - Playable Troll Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .arcade-cabinet {
            position: relative;
            background: #ffb356;
            border: 5px solid #523500;
            border-radius: 14px;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.45);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 660px;
            width: 100%;
        }

        .hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 11px;
            color: #523500;
        }

        canvas {
            background: #ffe3b3;
            border: 4px solid #523500;
            border-radius: 8px;
            display: block;
        }

        .on-screen-controls {
            margin-top: 14px;
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: space-between;
        }

        .ctrl-group {
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            background: #523500;
            color: #ffb356;
            border: 3px solid #3b2500;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.4);
        }

        .ctrl-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.4);
        }

        /* Troll Message Overlay */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border: 4px solid #523500;
            border-radius: 10px;
            box-shadow: 6px 6px 0px #000;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 50;
            width: 85%;
            max-width: 400px;
        }

        .overlay h2 {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .overlay p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud">
            <span id="lvlDisplay">LVL: 1</span>
            <span id="trollDisplay">RUNAWAY DOOR</span>
            <span id="deathDisplay">DEATHS: 0</span>
        </div>

        <canvas id="gameCanvas" width="600" height="260"></canvas>

        <!-- Touch / On-screen Buttons for Mobile -->
        <div class="on-screen-controls">
            <div class="ctrl-group">
                <button class="ctrl-btn" id="btnLeft">◀ LEFT</button>
                <button class="ctrl-btn" id="btnRight">RIGHT ▶</button>
            </div>
            <button class="ctrl-btn" id="btnJump" style="background: #911212; color: #fff;">JUMP ⬆</button>
        </div>

        <!-- Failure Card -->
        <div class="overlay" id="failBox">
            <h2 style="color: #911212;">💀 TROLLED!</h2>
            <p id="failMsg">Darwaaza dekh kar itna excited mat ho!</p>
            <button class="ctrl-btn" onclick="retry()">RETRY LEVEL 🔄</button>
        </div>

        <!-- Victory Card -->
        <div class="overlay" id="winBox">
            <h2 style="color: #116b0d;">🎉 LEVEL SURVIVED!</h2>
            <p>Agla trap dimaag hila dega!</p>
            <button class="ctrl-btn" onclick="next()">NEXT LEVEL ➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const lvlDisplay = document.getElementById('lvlDisplay');
        const trollDisplay = document.getElementById('trollDisplay');
        const deathDisplay = document.getElementById('deathDisplay');
        const failBox = document.getElementById('failBox');
        const winBox = document.getElementById('winBox');
        const failMsg = document.getElementById('failMsg');

        let deathCount = 0;
        let currentLvl = 1;
        let isOver = false;

        // Player Physical Entity
        let player = {
            x: 40,
            y: 190,
            w: 20,
            h: 20,
            vx: 0,
            vy: 0,
            speed: 3.6,
            jumpForce: -8.6,
            onGround: false
        };

        // Level Details
        let door = { x: 520, y: 180, w: 26, h: 36 };
        let spikes = [];
        let fakeFloor = null;
        let doorRan = false;

        function loadLevel(lvl) {
            currentLvl = lvl;
            isOver = false;
            doorRan = false;
            player.x = 40;
            player.y = 190;
            player.vx = 0;
            player.vy = 0;
            failBox.style.display = "none";
            winBox.style.display = "none";

            if (lvl === 1) {
                // Trap: Door runs away to the left when you get close
                door = { x: 520, y: 180, w: 26, h: 36 };
                spikes = [{ x: 280, y: 204, w: 32, h: 14 }];
                fakeFloor = null;
                lvlDisplay.innerText = "LVL: 1";
                trollDisplay.innerText = "RUNAWAY DOOR";
            } else if (lvl === 2) {
                // Trap: Floor collapses under you in the middle
                door = { x: 520, y: 180, w: 26, h: 36 };
                spikes = [];
                fakeFloor = { x: 230, y: 218, w: 90, h: 42, active: true };
                lvlDisplay.innerText = "LVL: 2";
                trollDisplay.innerText = "HOLE IN REALITY";
            }
        }

        // Keyboard Controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === "ArrowLeft") keys['a'] = true;
            if (e.key === "ArrowRight") keys['d'] = true;
            if (e.key === "ArrowUp" || e.key === " ") keys['w'] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            if (e.key === "ArrowLeft") keys['a'] = false;
            if (e.key === "ArrowRight") keys['d'] = false;
            if (e.key === "ArrowUp" || e.key === " ") keys['w'] = false;
        });

        // Touch Control Bindings
        setupBtn('btnLeft', 'a');
        setupBtn('btnRight', 'd');
        setupBtn('btnJump', 'w');

        function setupBtn(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener('mousedown', () => { keys[key] = true; });
            el.addEventListener('mouseup', () => { keys[key] = false; });
        }

        function triggerDeath(msg) {
            if (isOver) return;
            isOver = true;
            deathCount++;
            deathDisplay.innerText = "DEATHS: " + deathCount;
            failMsg.innerText = msg;
            failBox.style.display = "block";
        }

        function triggerWin() {
            if (isOver) return;
            isOver = true;
            winBox.style.display = "block";
        }

        window.retry = () => loadLevel(currentLvl);
        window.next = () => loadLevel(currentLvl === 1 ? 2 : 1);

        // Core Physics Update
        function update() {
            if (isOver) return;

            // Horizontal Movement
            player.vx = 0;
            if (keys['a']) player.vx = -player.speed;
            if (keys['d']) player.vx = player.speed;

            // Jump
            if (keys['w'] && player.onGround) {
                player.vy = player.jumpForce;
                player.onGround = false;
            }

            // Gravity
            player.vy += 0.44;
            player.x += player.vx;
            player.y += player.vy;

            // Ground & Floor Logic
            let floorY = 218;

            // Level 2 Trap: Floor vanishes
            if (fakeFloor && fakeFloor.active) {
                if (player.x > 210 && player.x < 310) {
                    fakeFloor.active = false; // Floor disappear
                }
            }

            if (fakeFloor && !fakeFloor.active && player.x + player.w > fakeFloor.x && player.x < fakeFloor.x + fakeFloor.w) {
                floorY = 320; // Player falls through the void
            }

            if (player.y + player.h >= floorY) {
                player.y = floorY - player.h;
                player.vy = 0;
                player.onGround = true;
            }

            // Void Death
            if (player.y > 270) {
                triggerDeath("Pairon tale zameen khisak gayi! 😂");
            }

            // Level 1 Trap: Runaway door
            if (currentLvl === 1 && player.x > 380 && !doorRan) {
                door.x -= 8;
                if (door.x <= 40) {
                    door.x = 40;
                    doorRan = true; // Teleported behind player
                }
            }

            // Spikes collision
            spikes.forEach(s => {
                if (player.x < s.x + s.w && player.x + player.w > s.x &&
                    player.y < s.y + s.h && player.y + player.h > s.y) {
                    triggerDeath("Spike par pair rakh diya!");
                }
            });

            // Door Goal collision
            if (player.x < door.x + door.w && player.x + player.w > door.x &&
                player.y < door.y + door.h && player.y + player.h > door.y) {
                triggerWin();
            }
        }

        // Canvas Rendering
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = "#523500";
            if (fakeFloor && !fakeFloor.active) {
                ctx.fillRect(0, 218, fakeFloor.x, 42);
                ctx.fillRect(fakeFloor.x + fakeFloor.w, 218, canvas.width, 42);
            } else {
                ctx.fillRect(0, 218, canvas.width, 42);
            }

            // Spikes
            spikes.forEach(s => {
                ctx.fillStyle = "#a81313";
                ctx.beginPath();
                ctx.moveTo(s.x, s.y + s.h);
                ctx.lineTo(s.x + s.w / 2, s.y);
                ctx.lineTo(s.x + s.w, s.y + s.h);
                ctx.fill();
            });

            // Exit Door
            ctx.fillStyle = "#3b2500";
            ctx.fillRect(door.x, door.y, door.w, door.h);
            ctx.fillStyle = "#2db300";
            ctx.fillRect(door.x + 3, door.y + 3, door.w - 6, door.h - 6);

            // Character (Devil)
            ctx.fillStyle = "#523500";
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = "#d11a1a";
            ctx.fillRect(player.x + 2, player.y - 4, 4, 4);
            ctx.fillRect(player.x + 14, player.y - 4, 4, 4);
            ctx.fillStyle = "#fff";
            ctx.fillRect(player.x + 4, player.y + 6, 3, 3);
            ctx.fillRect(player.x + 13, player.y + 6, 3, 3);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loadLevel(1);
        loop();
    </script>
</body>
</html>

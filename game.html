<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Level 1 Game Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #2b1a09 0%, #0f0803 50%, #1a0f03 100%);
            background-attachment: fixed;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }

        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(43, 26, 9, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(210, 140, 60, 0.3);
            border-radius: 15px;
            padding: 8px 20px;
            margin-bottom: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: #ffaa00;
            text-shadow: 0 0 8px rgba(255,170,0,0.5);
        }

        .hud-stats {
            display: flex;
            gap: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #ffcc66;
        }

        .arena-container {
            flex: 1;
            background: rgba(20, 12, 5, 0.85);
            border: 2px solid rgba(210, 140, 60, 0.4);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(210, 140, 60, 0.1), 0 10px 30px rgba(0,0,0,0.6);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 70% Transparent Tekken Style Controls (Hidden on Laptop, visible on Mobile/Tablet) */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
            pointer-events: none;
        }

        @media (min-width: 1024px) {
            .controls-overlay {
                display: none; /* Hide touch buttons on laptop/desktop */
            }
        }

        .control-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
            align-items: center;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            width: 55px;
            height: 55px;
            border-radius: 14px; /* Tekken style rectangular rounded shape */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s, background 0.2s;
        }

        .ctrl-btn:active {
            transform: scale(0.92);
            background: rgba(210, 140, 60, 0.5);
            border-color: #ffaa00;
        }

        .ctrl-btn.wide {
            width: 85px;
            border-radius: 16px;
            font-size: 10px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #d0b090;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .back-btn:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="game-hud">
            <div class="hud-title">⚡ LEVEL 1: BROWN ARENA</div>
            <div class="hud-stats">
                <span id="scoreDisplay">COINS: 0</span>
                <span id="shieldDisplay">SHIELD: OFF</span>
            </div>
            <button class="back-btn" onclick="goHome()">QUIT</button>
        </div>

        <div class="arena-container">
            <canvas id="gameCanvas"></canvas>

            <div class="controls-overlay">
                <!-- Left Hand Controls -->
                <div class="control-group">
                    <button class="ctrl-btn" id="leftBtn">◀</button>
                    <button class="ctrl-btn" id="rightBtn">▶</button>
                    <button class="ctrl-btn wide" id="jumpBtn">JUMP/UP</button>
                    <button class="ctrl-btn" id="downBtn">▼</button>
                </div>

                <!-- Right Hand Controls (Shield active only on hold) -->
                <div class="control-group">
                    <button class="ctrl-btn wide" id="shieldBtn" style="background: rgba(255,170,0,0.25);">SHIELD</button>
                    <button class="ctrl-btn wide" id="crackBtn" style="background: rgba(210,140,60,0.25);">CRACK</button>
                    <button class="ctrl-btn wide" id="coinBtn" style="background: rgba(255,0,127,0.25);">COLLECT</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let shieldActive = false;

        let player = {
            x: 50,
            y: canvas.height - 180,
            width: 36,
            height: 68,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpForce: -11,
            gravity: 0.5,
            isGrounded: false
        };

        // Simple Surface Platform (No pits, no extra floating obstacles)
        let platforms = [
            { x: 0, y: canvas.height - 60, w: 3000, h: 60, type: 'ground' }
        ];

        let coins = [
            { x: 400, y: canvas.height - 110, collected: false },
            { x: 800, y: canvas.height - 110, collected: false },
            { x: 1200, y: canvas.height - 110, collected: false },
            { x: 1600, y: canvas.height - 110, collected: false },
            { x: 2000, y: canvas.height - 110, collected: false }
        ];

        let goal = { x: 2600, y: canvas.height - 140, w: 40, h: 80 };
        let cameraX = 0;
        let keys = { left: false, right: false };

        // Touch Listeners
        document.getElementById('leftBtn').addEventListener('touchstart', () => keys.left = true);
        document.getElementById('leftBtn').addEventListener('touchend', () => keys.left = false);
        document.getElementById('rightBtn').addEventListener('touchstart', () => keys.right = true);
        document.getElementById('rightBtn').addEventListener('touchend', () => keys.right = false);
        
        document.getElementById('jumpBtn').addEventListener('touchstart', () => {
            if (player.isGrounded) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
            }
        });

        // Shield active only while holding the button down
        const shieldBtn = document.getElementById('shieldBtn');
        shieldBtn.addEventListener('touchstart', () => {
            shieldActive = true;
            document.getElementById('shieldDisplay').innerText = "SHIELD: ON";
            document.getElementById('shieldDisplay').style.color = "#ffaa00";
        });
        shieldBtn.addEventListener('touchend', () => {
            shieldActive = false;
            document.getElementById('shieldDisplay').innerText = "SHIELD: OFF";
            document.getElementById('shieldDisplay').style.color = "#ffcc66";
        });

        document.getElementById('crackBtn').addEventListener('click', () => {
            score += 10;
        });

        document.getElementById('coinBtn').addEventListener('click', () => {
            coins.forEach(c => {
                if (!c.collected && Math.abs(c.x - player.x) < 70) {
                    c.collected = true;
                    score += 50;
                }
            });
        });

        // Keyboard Support for Laptop/PC
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && player.isGrounded) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
            }
            if (e.key === 's' || e.key === 'Shift') {
                shieldActive = true;
                document.getElementById('shieldDisplay').innerText = "SHIELD: ON";
                document.getElementById('shieldDisplay').style.color = "#ffaa00";
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 's' || e.key === 'Shift') {
                shieldActive = false;
                document.getElementById('shieldDisplay').innerText = "SHIELD: OFF";
                document.getElementById('shieldDisplay').style.color = "#ffcc66";
            }
        });

        function update() {
            if (keys.left) player.vx = -player.speed;
            else if (keys.right) player.vx = player.speed;
            else player.vx = 0;

            player.x += player.vx;
            player.vy += player.gravity;
            player.y += player.vy;

            player.isGrounded = false;
            platforms.forEach(p => {
                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 10
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            });

            cameraX = player.x - canvas.width / 3;
            if (cameraX < 0) cameraX = 0;

            coins.forEach(c => {
                if (!c.collected && Math.hypot((player.x + player.width/2) - c.x, (player.y + player.height/2) - c.y) < 40) {
                    c.collected = true;
                    score += 50;
                }
            });

            if (player.x >= goal.x) {
                alert("🎉 Level 1 Cleared Successfully!");
                window.location.href = "index.html";
            }

            document.getElementById('scoreDisplay').innerText = "COINS: " + score;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Draw Simple Brown Surface Platform
            platforms.forEach(p => {
                ctx.fillStyle = '#3d2314';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#d28c3c';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            // Draw Coins
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 10, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                }
            });

            // Draw Goal Portal
            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);

            // Draw Fully White Dummy Character (Thin body parts)
            let px = player.x;
            let py = player.y;

            if (shieldActive) {
                ctx.beginPath();
                ctx.arc(px + 18, py + 34, 42, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
                ctx.fill();
                ctx.strokeStyle = '#ffaa00';
                ctx.stroke();
            }

            // Head (White)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(px + 18, py + 10, 10, 0, Math.PI * 2);
            ctx.fill();

            // Torso (Thin & White)
            ctx.fillRect(px + 14, py + 20, 8, 28);

            // Hands (Thin White Lines)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(px + 14, py + 24);
            ctx.lineTo(px + 2, py + 36);
            ctx.moveTo(px + 22, py + 24);
            ctx.lineTo(px + 34, py + 36);
            ctx.stroke();

            // Legs (Thin White Lines)
            ctx.beginPath();
            ctx.moveTo(px + 15, py + 48);
            ctx.lineTo(px + 10, py + 68);
            ctx.moveTo(px + 21, py + 48);
            ctx.lineTo(px + 26, py + 68);
            ctx.stroke();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        function goHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>

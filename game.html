<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - The Guardian's Burden</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #4a154b;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .arcade-cabinet {
            position: relative;
            background: #ffb356;
            border-radius: 14px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.45);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 620px;
            width: 100%;
            height: 95vh;
            max-height: 550px;
        }

        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #523500;
            box-shadow: 0 3px 0px #523500;
        }

        .hud-tools {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #523500;
            color: #ffb356;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #3b2500;
        }

        /* Puzzle Chamber */
        .puzzle-chamber {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #fff8eb;
            border-radius: 10px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        /* Obstacles & Traps */
        .hazard {
            position: absolute;
            background: #d90429;
            border-radius: 4px;
            box-shadow: 0 2px 0px #780016;
        }

        .platform {
            position: absolute;
            background: #8c6239;
            border-radius: 3px;
        }

        /* Stubborn AI Kid Character */
        .dummy-character {
            position: absolute;
            width: 18px;
            height: 26px;
            bottom: 12px;
            left: 20px;
            z-index: 10;
            transform-style: preserve-3d;
            transition: left 0.05s linear, bottom 0.15s ease;
        }

        .dummy-head {
            position: absolute;
            top: 0;
            left: 4px;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 3px 3px, #ffdbac, #b5651d);
            border-radius: 50%;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        .dummy-body {
            position: absolute;
            top: 9px;
            left: 7px;
            width: 4px;
            height: 10px;
            background: #d90429;
            border-radius: 2px;
        }

        .dummy-arm-left, .dummy-arm-right {
            position: absolute;
            top: 10px;
            width: 6px;
            height: 2px;
            background: #b5651d;
            border-radius: 1px;
        }
        .dummy-arm-left { left: 1px; }
        .dummy-arm-right { right: 1px; }

        .dummy-leg-left, .dummy-leg-right {
            position: absolute;
            bottom: 0;
            width: 3px;
            height: 7px;
            background: #003049;
            border-radius: 1px;
        }
        .dummy-leg-left { left: 5px; }
        .dummy-leg-right { right: 5px; }

        /* Target Gate */
        .target-gate {
            width: 26px;
            height: 30px;
            background: linear-gradient(135deg, #2db300, #186600);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 11px;
            position: absolute;
            bottom: 12px;
            right: 15px;
            z-index: 5;
            box-shadow: 0 2px 0px #0e3b00;
        }

        .clue-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #d90429;
            color: #fff;
            font-weight: 700;
            font-size: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 20;
            text-align: center;
            width: calc(100% - 12px);
        }

        .bottom-action-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
            gap: 6px;
        }

        .control-btn {
            flex: 1;
            background: #523500;
            color: #ffb356;
            padding: 12px 6px;
            border-radius: 8px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3b2500;
            text-align: center;
        }

        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #3b2500;
        }

        .danger-btn {
            background: #8f1111;
            color: #fff;
            box-shadow: 0 4px 0px #540808;
        }

        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 85%;
            max-width: 300px;
            box-shadow: 0 10px 0px rgba(0,0,0,0.5);
        }

        .modal-btn {
            background: #523500;
            color: #ffb356;
            padding: 8px 12px;
            font-size: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud-bar">
            <div>
                <span id="lvlLabel">LEVEL: AI TODDLER</span>
                <span style="margin-left: 10px;" id="failsLabel">FAILS: 0</span>
            </div>
            <div class="hud-tools">
                <button class="hud-btn" onclick="resetGame()">🔄 RESTART</button>
            </div>
        </div>

        <!-- Maze Chamber -->
        <div class="puzzle-chamber" id="chamber">
            <div class="clue-box" id="aiStatus">AI Kid: "Mujhe kahin nahi jana, main ziddi hoon!"</div>
            
            <!-- Traps & Pits -->
            <div class="hazard" style="width: 45px; height: 12px; bottom: 12px; left: 140px;"></div>
            <div class="hazard" style="width: 50px; height: 12px; bottom: 12px; left: 280px;"></div>

            <!-- Platforms -->
            <div class="platform" style="width: 70px; height: 8px; bottom: 60px; left: 190px;"></div>

            <!-- Stubborn AI Kid Character -->
            <div class="dummy-character" id="dummy">
                <div class="dummy-head"></div>
                <div class="dummy-body"></div>
                <div class="dummy-arm-left"></div>
                <div class="dummy-arm-right"></div>
                <div class="dummy-leg-left"></div>
                <div class="dummy-leg-right"></div>
            </div>

            <!-- Target Gate -->
            <div class="target-gate" id="gate">🚪</div>
        </div>

        <!-- Controls (Interference buttons that annoy the AI) -->
        <div class="bottom-action-bar">
            <button class="control-btn" onclick="forcePush(-15)">PULL BACK ◀</button>
            <button class="control-btn danger-btn" onclick="makeKidJump()">FORCE JUMP ⬆️</button>
            <button class="control-btn" onclick="forcePush(15)">PUSH FORWARD ▶</button>
        </div>

        <!-- Win / Fail Modal -->
        <div class="popup-modal" id="winModal">
            <h2 id="modalTitle" style="color: #116b0d; font-size: 12px; margin-bottom: 8px;">🎉 BACHA BACH GAYA!</h2>
            <p id="modalDesc" style="font-family: 'Chakra Petch'; font-size: 11px; margin-bottom: 10px;">नासमझ AI बच्चे को आखिरकार गेट तक पहुँचा दिया!</p>
            <button class="modal-btn" onclick="resetGame()">AGAIN 🔄</button>
        </div>
    </div>

    <script>
        let posX = 20;
        let posY = 12;
        let isJumping = false;
        let fails = 0;
        let isOver = false;
        
        const dummy = document.getElementById('dummy');
        const winModal = document.getElementById('winModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const aiStatus = document.getElementById('aiStatus');
        const failsLabel = document.getElementById('failsLabel');

        // AI Kid keeps moving on his own stupidity!
        let aiBrain = setInterval(() => {
            if (isOver) return;

            // AI sometimes ignores you or moves backwards out of spite
            let stubbornMove = Math.random() < 0.35 ? -3 : 2; 
            posX += stubbornMove;
            
            // Boundaries
            posX = Math.max(10, Math.min(posX, 430));
            dummy.style.left = posX + 'px';

            // Random sarcastic AI dialogues
            if (Math.random() < 0.05) {
                const dialogues = [
                    'AI Kid: "Mujhe ye game pasand nahi!"',
                    'AI Kid: "Main nahi chalunga, mujhe neend aa rahi hai!"',
                    'AI Kid: "Haha, dekho main khai ki taraf ja raha hoon!"',
                    'AI Kid: "Developer kitना bewakoof hai jo mujhe control kar raha hai!"'
                ];
                aiStatus.innerText = dialogues[Math.floor(Math.random() * dialogues.length)];
            }

            checkHazards();
        }, 50);

        function forcePush(val) {
            if (isOver) return;
            // Player tries to help, but AI resists and goes opposite or trips!
            posX += val * -0.5; // Troll physics: pushing forward might drag him backward!
            aiStatus.innerText = 'AI Kid: "Meri marzi, main ulta jaunga!"';
        }

        function makeKidJump() {
            if (isOver || isJumping) return;
            isJumping = true;
            posY = 70;
            dummy.style.bottom = posY + 'px';
            aiStatus.innerText = 'AI Kid: "Mujhe koodna nahi pasand, aaaaah!"';

            setTimeout(() => {
                posY = 12;
                dummy.style.bottom = posY + 'px';
                isJumping = false;
                checkHazards();
            }, 350);
        }

        function checkHazards() {
            // Check if fallen in pit (Hazards are at x: 140-185 and 280-330)
            let chamberWidth = document.getElementById('chamber').clientWidth;
            if (posX > 135 && posX < 185 && posY <= 15) {
                triggerFail("AI Kid khai mein gir gaya!");
            } else if (posX > 275 && posX < 330 && posY <= 15) {
                triggerFail("AI Kid kaante par chad gaya!");
            } else if (posX >= 410) {
                triggerWin();
            }
        }

        function triggerFail(reason) {
            if (isOver) return;
            isOver = true;
            fails++;
            failsLabel.innerText = "FAILS: " + fails;
            
            modalTitle.style.color = "#d90429";
            modalTitle.innerText = "💀 KHATAM! (FAIL)";
            modalDesc.innerText = reason + " आपका ईगो हर्ट हुआ ना? फिर से ट्राई करो!";
            winModal.style.display = "block";
        }

        function triggerWin() {
            if (isOver) return;
            isOver = true;
            modalTitle.style.color = "#116b0d";
            modalTitle.innerText = "🎉 GAIBE JEET GAYE!";
            modalDesc.innerText = "असंभव को संभव कर दिखाया! इस नासमझ AI को बचा लिया!";
            winModal.style.display = "block";
        }

        function resetGame() {
            posX = 20;
            posY = 12;
            isOver = false;
            dummy.style.left = posX + 'px';
            dummy.style.bottom = posY + 'px';
            winModal.style.display = "none";
            aiStatus.innerText = "AI Kid: 'Mujhe firse harane aaye ho?'";
        }
    </script>
</body>
</html>

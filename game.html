<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Real Devil Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .game-frame {
            position: relative;
            background: #ffb356;
            border-radius: 12px;
            box-shadow: 0 8px 0px rgba(0, 0, 0, 0.45);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 660px;
            width: 100%;
        }

        /* Top HUD */
        .hud-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            font-size: 10px;
            color: #523500;
            box-shadow: 0 2px 0px #523500;
        }

        .hud-actions {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #523500;
            color: #ffb356;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #3b2500;
        }

        .hud-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Canvas Screen */
        canvas {
            background: #ffe2b3;
            border-radius: 8px;
            display: block;
            box-shadow: 0 4px 0px #523500;
            width: 100%;
            max-width: 600px;
            height: auto;
            aspect-ratio: 600 / 260;
        }

        /* Responsive Mobile Touch Controllers */
        .touch-container {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
        }

        .left-controls {
            display: flex;
            gap: 10px;
        }

        .touch-key {
            background: #523500;
            color: #ffb356;
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3b2500;
            touch-action: manipulation;
        }

        .touch-key:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #3b2500;
            background: #6e4600;
        }

        .touch-jump {
            background: #8f1111;
            color: #fff;
            box-shadow: 0 4px 0px #540808;
            padding: 14px 24px;
        }

        .touch-jump:active {
            background: #b51717;
            box-shadow: 0 1px 0px #540808;
        }

        /* Popups */
        .popup-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border-radius: 10px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.5);
            padding: 18px 24px;
            text-align: center;
            display: none;
            z-index: 50;
            width: 85%;
            max-width: 380px;
        }

        .popup-card h2 {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .popup-card p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 14px;
        }

        .popup-btn {
            background: #523500;
            color: #ffb356;
            border: none;
            padding: 10px 14px;
            font-size: 9px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 0px #3b2500;
            margin: 0 4px;
        }

        .popup-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="game-frame">
        <div class="hud-row">
            <div>
                <span id="levelDisplay">LVL: 1</span>
                <span style="margin-left: 10px;" id="deathDisplay">💀 0</span>
            </div>
            <div class="hud-actions">
                <button class="hud-btn" onclick="retryLevel()">🔄 RESTART</button>
                <button class="hud-btn" onclick="goToMenu()">📜 LEVELS</button>
                <button class="hud-btn" onclick="toggleScreen()">⛶ FULL</button>
            </div>
        </div>

        <!-- Real 2D Canvas Game Screen -->
        <canvas id="canvas" width="600" height="260"></canvas>

        <!-- Touch Buttons for Mobile -->
        <div class="touch-container">
            <div class="left-controls">
                <button class="touch-key" id="leftBtn">◀ LEFT</button>
                <button class="touch-key" id="rightBtn">RIGHT ▶</button>
            </div>
            <button class="touch-key touch-jump" id="jumpBtn">JUMP ⬆</button>
        </div>

        <!-- Fail Screen -->
        <div class="popup-card" id="failBox">
            <h2 style="color: #8f1111;">💀 TROLLED!</h2>
            <p id="failText">Spike par gir gaye!</p>
            <button class="popup-btn" onclick="retryLevel()">RETRY 🔄</button>
            <button class="popup-btn" onclick="goToMenu()">LEVELS 📜</button>
        </div>

        <!-- Victory Screen -->
        <div class="popup-card" id="winBox">
            <h2 style="color: #116b0d;">🎉 STAGE CLEARED!</h2>
            <p>Sahi bache! Agla level dimaag kharab karega!</p>
            <button class="popup-btn" onclick="nextStage()">NEXT ➡️</button>
            <button class="popup-btn" onclick="goToMenu()">LEVELS 📜</button>
        </div>
    </div>

    <script>
        // Fullscreen & Landscape API
        async function toggleScreen() {
            const el = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }
        window.addEventListener('click', toggleScreen, { once: true });
        window.addEventListener('touchstart', toggleScreen, { once: true });

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const levelDisplay = document.getElementById('levelDisplay');
        const deathDisplay = document.getElementById('deathDisplay');
        const failBox = document.getElementById('failBox');
        const winBox = document.getElementById('winBox');
        const failText = document.getElementById('failText');

        let deaths = 0;
        let isDead = false;

        // Player Physical Entity
        let p = {
            x: 40,
            y: 180,
            w: 22,
            h: 22,
            vx: 0,
            vy: 0,
            speed: 3.8,
            jumpStrength: -9.2,
            onGround: false
        };

        // 3 Real Playable Troll Levels
        const stages = [
            {
                id: 1,
                name: "THE RUNAWAY DOOR",
                quote: "Door ke paas gaye aur door piche bhag gaya! 😂",
                floorY: 220,
                spikes: [{ x: 270, y: 204, w: 32, h: 16 }],
                door: { x: 530, y: 172, w: 28, h: 48 },
                trolled: false,
                run: (lvl) => {
                    // Jab player door ke kareeb pahunchta hai, door piche bhagta hai
                    if (p.x > 380 && !lvl.trolled) {
                        lvl.door.x -= 9;
                        if (lvl.door.x <= 40) {
                            lvl.door.x = 40;
                            lvl.trolled = true;
                        }
                    }
                }
            },
            {
                id: 2,
                name: "INVISIBLE BRICK",
                quote: "Hawa mein sir adrishya pathar se thok liya!",
                floorY: 220,
                spikes: [{ x: 280, y: 204, w: 46, h: 16 }],
                blocks: [{ x: 285, y: 120, w: 36, h: 20, shown: false }],
                door: { x: 530, y: 172, w: 28, h: 48 },
                run: (lvl) => {
                    // Spike ke upar hawa mein invisible block sir pe lagta hai
                    lvl.blocks.forEach(b => {
                        if (p.x + p.w > b.x && p.x < b.x + b.w && p.y <= b.y + b.h && p.y >= b.y) {
                            b.shown = true;
                            p.vy = 4.5;
                        }
                    });
                }
            },
            {
                id: 3,
                name: "COLLAPSING FLOOR",
                quote: "Daudne se pehle socha nahi? Zameen gayab!",
                floorY: 220,
                fakeGround: { x: 220, y: 220, w: 140, h: 40, active: true },
                spikes: [],
                door: { x: 530, y: 172, w: 28, h: 48 },
                run: (lvl) => {
                    // Beech ki zameen par pair padte hi zameen toot jati hai
                    if (p.x > 200 && p.x < 360 && lvl.fakeGround.active) {
                        lvl.fakeGround.active = false;
                    }
                }
            }
        ];

        let curIndex = 0;
        let curLevel = null;

        function loadLevel(idx) {
            curIndex = idx;
            curLevel = JSON.parse(JSON.stringify(stages[idx]));
            isDead = false;

            p.x = 40;
            p.y = 180;
            p.vx = 0;
            p.vy = 0;
            p.onGround = true;

            levelDisplay.innerText = "LVL: " + curLevel.id;
            failBox.style.display = "none";
            winBox.style.display = "none";
        }

        // Keyboard Inputs
        const keys = { left: false, right: false, jump: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = true;
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = true;
            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w" || e.key === " ") keys.jump = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = false;
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = false;
            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w" || e.key === " ") keys.jump = false;
        });

        // Touch Control Helper
        function setupTouch(id, keyName) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => { keys[keyName] = true; });
            btn.addEventListener('mouseup', () => { keys[keyName] = false; });
        }
        setupTouch('leftBtn', 'left');
        setupTouch('rightBtn', 'right');
        setupTouch('jumpBtn', 'jump');

        function triggerDeath(msg) {
            if (isDead) return;
            isDead = true;
            deaths++;
            deathDisplay.innerText = "💀 " + deaths;
            failText.innerText = msg || curLevel.quote;
            failBox.style.display = "block";
        }

        function triggerWin() {
            if (isDead) return;
            isDead = true;
            winBox.style.display = "block";
        }

        window.retryLevel = () => loadLevel(curIndex);
        window.nextStage = () => {
            if (curIndex + 1 < stages.length) loadLevel(curIndex + 1);
            else { alert("SHABASH! Teeno level clear kar liye!"); loadLevel(0); }
        };
        window.goToMenu = () => { window.location.href = "level.html"; };

        // Game Physics Loop
        function update() {
            if (isDead) return;

            // Horizontal Move
            p.vx = 0;
            if (keys.left) p.vx = -p.speed;
            if (keys.right) p.vx = p.speed;

            // Jump
            if (keys.jump && p.onGround) {
                p.vy = p.jumpStrength;
                p.onGround = false;
            }

            // Gravity
            p.vy += 0.44;
            p.x += p.vx;
            p.y += p.vy;

            // Execute Stage Trap Script
            curLevel.run(curLevel);

            // Ground Collision
            let groundY = curLevel.floorY;

            // Level 3 Fake Ground
            if (curLevel.fakeGround && !curLevel.fakeGround.active) {
                if (p.x + p.w > curLevel.fakeGround.x && p.x < curLevel.fakeGround.x + curLevel.fakeGround.w) {
                    groundY = 320; // Player neeche void mein gir jata hai
                }
            }

            if (p.y + p.h >= groundY) {
                p.y = groundY - p.h;
                p.vy = 0;
                p.onGround = true;
            }

            // Void Death
            if (p.y > 270) {
                triggerDeath("Zameen toot gayi aur tum gir gaye! 😂");
            }

            // Spike Hit Collision
            if (curLevel.spikes) {
                curLevel.spikes.forEach(s => {
                    if (p.x < s.x + s.w && p.x + p.w > s.x && p.y < s.y + s.h && p.y + p.h > s.y) {
                        triggerDeath();
                    }
                });
            }

            // Green Door Collision
            let d = curLevel.door;
            if (p.x < d.x + d.w && p.x + p.w > d.x && p.y < d.y + d.h && p.y + p.h > d.y) {
                triggerWin();
            }
        }

        // Canvas Visual Drawing
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Zameen (Solid Ground)
            ctx.fillStyle = "#523500";
            if (curLevel.fakeGround && !curLevel.fakeGround.active) {
                ctx.fillRect(0, 220, curLevel.fakeGround.x, 40);
                ctx.fillRect(curLevel.fakeGround.x + curLevel.fakeGround.w, 220, canvas.width, 40);
            } else {
                ctx.fillRect(0, 220, canvas.width, 40);
            }

            // 2. Hidden blocks (Level 2)
            if (curLevel.blocks) {
                curLevel.blocks.forEach(b => {
                    if (b.shown) {
                        ctx.fillStyle = "#523500";
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.fillStyle = "#ffb356";
                        ctx.fillText("?", b.x + 12, b.y + 14);
                    }
                });
            }

            // 3. Spikes (Red Triangles)
            if (curLevel.spikes) {
                ctx.fillStyle = "#8f1111";
                curLevel.spikes.forEach(s => {
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y + s.h);
                    ctx.lineTo(s.x + s.w / 2, s.y);
                    ctx.lineTo(s.x + s.w, s.y + s.h);
                    ctx.fill();
                });
            }

            // 4. Green Exit Door
            let d = curLevel.door;
            ctx.fillStyle = "#523500";
            ctx.fillRect(d.x, d.y, d.w, d.h);
            ctx.fillStyle = "#2db300";
            ctx.fillRect(d.x + 3, d.y + 3, d.w - 6, d.h - 6);

            // 5. Devil Player Character
            ctx.fillStyle = "#523500";
            ctx.fillRect(p.x, p.y, p.w, p.h);
            // Red Horns
            ctx.fillStyle = "#8f1111";
            ctx.fillRect(p.x + 2, p.y - 4, 4, 4);
            ctx.fillRect(p.x + p.w - 6, p.y - 4, 4, 4);
            // White Eyes
            ctx.fillStyle = "#fff";
            ctx.fillRect(p.x + 4, p.y + 6, 3, 3);
            ctx.fillRect(p.x + 14, p.y + 6, 3, 3);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Pehla level shuru karein
        loadLevel(0);
        gameLoop();
    </script>
</body>
</html>

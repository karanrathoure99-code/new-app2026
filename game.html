<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤪 Z PAJAL - Rage Mode (Levels 1-10)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #05050a;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 85, 0.1) 0%, transparent 60%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .game-container {
            background: rgba(20, 15, 35, 0.9);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 0, 85, 0.4);
            border-radius: 25px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.2);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .level-badge {
            display: inline-block;
            background: linear-gradient(90deg, #ff0055, #9900ff);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: #ff0055;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 12px;
            color: #ffaa00;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .question-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 18px;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 17px;
            font-weight: 600;
            color: #00ffff;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 18px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        .input-box:focus {
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: #fff;
            border: none;
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }

        .action-btn:hover {
            transform: scale(1.02);
        }

        .next-btn {
            background: linear-gradient(135deg, #00ff88, #00aa55) !important;
            color: #000 !important;
            display: none; /* Jab tak level clear na ho, hide rahega */
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
        }

        .back-btn {
            background: transparent;
            color: #8c8cb2;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        /* 50% Transparent LOJER Overlay */
        #lojerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(100, 0, 0, 0.5); /* 50% Transparent Red/Dark */
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }

        #lojerOverlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        #lojerOverlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 900;
            color: #ff0000;
            text-shadow: 0 0 30px #000, 0 0 60px #ff0000;
            letter-spacing: 5px;
            animation: shake 0.2s infinite alternate;
        }

        #lojerOverlay p {
            font-size: 20px;
            color: #ffcc00;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 2px 5px #000;
        }

        @keyframes shake {
            0% { transform: translate(3px, 3px) rotate(0deg); }
            100% { transform: translate(-3px, -3px) rotate(-2deg); }
        }

        .stats {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Troll Overlay (LOJER) -->
    <div id="lojerOverlay">
        <h2 id="lojerText">LOJER 🤪</h2>
        <p id="trollReason">Hahaha! Kitna asaan samajh raha tha?</p>
    </div>

    <div class="game-container">
        <div class="level-badge" id="levelBadge">🎮 LEVEL 1 / 10</div>
        <h1>Z PAJAL - RAGE MODE</h1>
        <div class="subtitle" id="subTitle">Warning: Ye game tumhara ego hurt karegi!</div>

        <div class="question-box" id="questionText">
            Loading Trap...
        </div>

        <input type="text" id="userAnswer" class="input-box" placeholder="Type your answer..." autocomplete="off">
        
        <button class="action-btn" id="submitBtn" onclick="checkAnswer()">SUBMIT ANSWER</button>
        <button class="action-btn next-btn" id="nextBtn" onclick="nextLevel()">NEXT LEVEL ➡</button>
        
        <div class="stats" id="failStats">Fail Count: 0 | Taunt Level: Safe</div>
        <button class="back-btn" onclick="goHome()">⬅ Quit to Home</button>
    </div>

    <script>
        let currentLevel = parseInt(localStorage.getItem('zPajalRageLevel')) || 1;
        if (currentLevel > 10) currentLevel = 1;

        let failCount = 0;
        let currentQuestionData = {};

        // Web Audio API se achanak hasne wali/trolling aawaz generate karne ke liye
        function playTrollSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // 3 descending buzz notes to mimic a mocking laugh/sound
                [300, 200, 150].forEach((freq, index) => {
                    setTimeout(() => {
                        if (audioCtx.state === 'suspended') audioCtx.resume();
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.3);
                    }, index * 150);
                });
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        function triggerLojer(reasonText) {
            failCount++;
            document.getElementById('failStats').innerText = `Fail Count: ${failCount} | Status: Raging 🔥`;
            document.getElementById('trollReason').innerText = reasonText;
            
            const overlay = document.getElementById('lojerOverlay');
            overlay.classList.add('show');
            playTrollSound();

            // Exactly 2 seconds ke baad LOJER screen gayab ho jayegi
            setTimeout(() => {
                overlay.classList.remove('show');
            }, 2000);
        }

        function loadLevel() {
            document.getElementById('levelBadge').innerText = `🎮 LEVEL ${currentLevel} / 10`;
            document.getElementById('userAnswer').value = "";
            document.getElementById('submitBtn').style.display = "block";
            document.getElementById('nextBtn').style.display = "none";

            currentQuestionData = getLevelPuzzle(currentLevel);
            document.getElementById('questionText').innerHTML = currentQuestionData.q;
        }

        // Levels 1 to 10 with tricky traps & ego-hurt logic
        function getLevelPuzzle(lvl) {
            switch(lvl) {
                case 1:
                    return { q: "What is 2 + 2 × 2 ?<br><small style='color:#ff5555'>(Hint: Bodmas mat bhulna!)</small>", a: "6" };
                case 2:
                    return { q: "Acha? Agar 5 + 3 = 28, 9 + 1 = 810, toh 7 + 3 = ?", a: "410" }; // Logic: (5-3)(5+3) = 28
                case 3:
                    return { q: "Spell 'IDIOT' backwards in your mind and type the middle letter:", a: "i" };
                case 4:
                    return { q: "If yesterday was the day before Saturday, what day is today?", a: "sunday" };
                case 5:
                    return { q: "Jaldi batao! 10 birds sitting on a tree, hunter shot 1. How many left?", a: "0" }; // Sare ud gaye!
                case 6:
                    return { q: "Which number comes next? 3, 7, 15, 31, ?", a: "63" }; // x2 + 1
                case 7:
                    return { q: "Find the hidden color code by typing opposite of 'WHITE':", a: "black" };
                case 8:
                    return { q: "A monkey climbs 3m up a pole during day, slips 2m down at night. Height 10m. Days taken?", a: "8" };
                case 9:
                    return { q: "What has keys, but no locks; space, but no room; and you can enter, but not go outside?", a: "keyboard" };
                case 10:
                    return { q: "FINAL BOSS LEVEL 10:<br>Solve: (100 - 50) × 0 + 25 = ?", a: "25" };
                default:
                    return { q: "What is 1 + 1 ?", a: "2" };
            }
        }

        function checkAnswer() {
            const userAns = document.getElementById('userAnswer').value.toLowerCase().trim();

            if (userAns === "") {
                triggerLojer("Answer khali chhod diya? Itna darr gaye?");
                return;
            }

            // Har level par 1-3 baar fail hone ka maza tab aayega jab user pehli baar me galat answer de ya trap me fase
            // Yahan hum check karenge ki kya answer sahi hai ya nahi
            if (userAns === currentQuestionData.a) {
                // Sahi jawab par hi Next Level ka button khulega
                document.getElementById('submitBtn').style.display = "none";
                document.getElementById('nextBtn').style.display = "block";
                document.getElementById('questionText').innerHTML = "🎉 <span style='color:#00ff88'>Sahi pakde hain! Level Clear!</span> Ab next level dabao.";
            } else {
                // Galat jawab par LOJER overlay + 2 second delay + laugh sound
                let taunts = [
                    "Galat jawab! Thoda dimaag use kar lo bhai!",
                    "Haha! Itna asaan sawal aur itna ganda jawab!",
                    "Tumse na ho payega! Ego hurt ho gaya na?",
                    "Acha try tha... par ho tum pure LOJER!"
                ];
                let randomTaunt = taunts[Math.floor(Math.random() * taunts.length)];
                triggerLojer(randomTaunt);
            }
        }

        function nextLevel() {
            if (currentLevel < 10) {
                currentLevel++;
                localStorage.setItem('zPajalRageLevel', currentLevel);
                loadLevel();
            } else {
                alert("🏆 KAMAAL KAR DIYA! Tumne saare 10 Rage Levels paas kar liye! Ab asli game shuru hogi!");
                localStorage.setItem('zPajalRageLevel', 10);
                window.location.href = "home.html";
            }
        }

        function goHome() {
            window.location.href = "home.html";
        }

        window.onload = loadLevel;
    </script>
</body>
</html>

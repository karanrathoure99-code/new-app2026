<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free Fire Bermuda - Solid Base, Connected Mountains & Adam</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e293b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        /* Action UI Buttons */
        .ui-btn {
            position: absolute;
            left: 15px;
            background: rgba(255, 85, 0, 0.9);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
            touch-action: manipulation;
        }
        .ui-btn:active {
            transform: scale(0.95);
            background: rgba(200, 65, 0, 0.9);
        }
        #map-btn { top: 95px; }
        #height-up-btn { top: 155px; background: rgba(16, 185, 129, 0.9); }
        #height-down-btn { top: 210px; background: rgba(59, 130, 246, 0.9); }

        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Free Fire Bermuda + Adam:</strong><br>
        Controls: <span>W, A, S, D to Walk</span><br>
        Status: <span>Solid White Base & Connected Perimeter Mountains</span>
    </div>

    <!-- UI Buttons -->
    <button id="map-btn" class="ui-btn" onclick="toggleFullMap()">🗺️ Full Map View</button>
    <button id="height-up-btn" class="ui-btn" onclick="adjustHeight(150)">🔼 Height Up (+)</button>
    <button id="height-down-btn" class="ui-btn" onclick="adjustHeight(-150)">🔽 Height Down (-)</button>

    <!-- Live Minimap -->
    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let baseSize = 20000;
        let mapSize = 15000;
        let minimapCtx, minimapCanvas;
        let isFullMap = false;

        let adam;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let adamSpeed = 12;
        let cameraOffsetHeight = 400;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 60000);
            camera.position.set(0, 1000, 1800);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(4000, 8000, 4000);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 35000;
            const d = 15000;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // 1. BOTTOM LAYER: 20,000 x 20,000 Solid White Base Surface
            const baseGeo = new THREE.PlaneGeometry(baseSize, baseSize);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
            const baseSurface = new THREE.Mesh(baseGeo, baseMat);
            baseSurface.rotation.x = -Math.PI / 2;
            baseSurface.position.y = -20;
            baseSurface.receiveShadow = true;
            scene.add(baseSurface);

            // 2. TOP LAYER: 15,000 x 15,000 Bermuda Solid Terrain with Lowered Edges and Connected High Perimeter Mountains
            const segments = 350;
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize, segments, segments);
            const posAttr = groundGeo.attributes.position;
            let halfSize = mapSize / 2;

            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                
                // Rolling hills inside the map
                let height = Math.sin(vx * 0.001) * Math.cos(vy * 0.001) * 180 
                           + Math.sin(vx * 0.004) * Math.sin(vy * 0.004) * 70;

                // River valley depression in center
                if (Math.abs(vx) < 350) {
                    height -= 60;
                }

                // Lowered edges smoothly blending into high solid perimeter mountains rising from the white base
                let distFromCenter = Math.sqrt(vx * vx + vy * vy);
                let innerRadius = halfSize - 3500; 
                if (distFromCenter > innerRadius) {
                    let factor = (distFromCenter - innerRadius) / (3500);
                    let mountainRise = Math.pow(factor, 1.8) * 1800; // High solid perimeter mountains
                    height += mountainRise;
                }

                posAttr.setZ(i, Math.max(0, height));
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ color: 0x315c1b, roughness: 0.85, flatShading: false });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            ground.receiveShadow = true;
            scene.add(ground);

            // 3. River Flow
            const riverGeo = new THREE.PlaneGeometry(350, mapSize);
            const riverMat = new THREE.MeshStandardMaterial({ color: 0x2980b9, roughness: 0.3 });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.rotation.x = -Math.PI / 2;
            river.position.set(0, 5, 0);
            scene.add(river);

            // 4. Dam
            const damGeo = new THREE.BoxGeometry(450, 240, 120);
            const damMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.6 });
            const dam = new THREE.Mesh(damGeo, damMat);
            dam.position.set(0, 120, 0);
            dam.castShadow = true;
            dam.receiveShadow = true;
            scene.add(dam);

            // 5. Giant Rocks / Mountains
            createGiantRock(-3000, 2500, 700, 600, 0x475444);
            createGiantRock(3500, -3000, 800, 700, 0x434c40);
            createGiantRock(-2500, -3500, 900, 800, 0x3b4338);
            createGiantRock(3000, 3000, 750, 650, 0x525c4e);

            // 6. ADAM CHARACTER
            adam = createAdamCharacter();
            adam.position.set(0, 50, 500);
            scene.add(adam);

            // Keyboard Controls
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') moveForward = true;
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') moveBackward = true;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') moveForward = false;
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') moveBackward = false;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = false;
            });

            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            window.addEventListener('resize', onWindowResize);
        }

        function createAdamCharacter() {
            const charGroup = new THREE.Group();
            const matSkin = new THREE.MeshStandardMaterial({ color: 0xf5d0b1, roughness: 0.6 });
            const matShirt = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.7 });
            const matPants = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.8 });

            const head = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), matSkin);
            head.position.y = 45;
            head.castShadow = true;
            charGroup.add(head);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(14, 18, 8), matShirt);
            torso.position.y = 30;
            torso.castShadow = true;
            charGroup.add(torso);

            const lArm = new THREE.Mesh(new THREE.BoxGeometry(4, 16, 4), matSkin);
            lArm.position.set(-10, 30, 0);
            lArm.castShadow = true;
            charGroup.add(lArm);

            const rArm = new THREE.Mesh(new THREE.BoxGeometry(4, 16, 4), matSkin);
            rArm.position.set(10, 30, 0);
            rArm.castShadow = true;
            charGroup.add(rArm);

            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(5, 18, 5), matPants);
            lLeg.position.set(-4, 10, 0);
            lLeg.castShadow = true;
            charGroup.add(lLeg);

            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(5, 18, 5), matPants);
            rLeg.position.set(4, 10, 0);
            rLeg.castShadow = true;
            charGroup.add(rLeg);

            return charGroup;
        }

        function createGiantRock(x, z, radius, height, colorHex) {
            const rockGeo = new THREE.ConeGeometry(radius, height, 12, 6, true);
            const pos = rockGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let vx = pos.getX(i);
                let vy = pos.getY(i);
                let vz = pos.getZ(i);
                if (vy > 0) {
                    let noise = Math.sin(vx * 0.05) * Math.cos(vz * 0.05) * 50 + (Math.random() - 0.5) * 40;
                    pos.setX(i, vx + noise);
                    pos.setZ(i, vz + noise);
                }
            }
            rockGeo.computeVertexNormals();

            const rockMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.9, flatShading: true });
            const rockMesh = new THREE.Mesh(rockGeo, rockMat);
            rockMesh.position.set(x, height / 2, z);
            rockMesh.castShadow = true;
            rockMesh.receiveShadow = true;
            scene.add(rockMesh);
        }

        function adjustHeight(amount) {
            cameraOffsetHeight += amount;
            cameraOffsetHeight = Math.max(200, Math.min(3000, cameraOffsetHeight));
        }

        function toggleFullMap() {
            isFullMap = !isFullMap;
            const btn = document.getElementById('map-btn');
            if (isFullMap) {
                camera.position.set(0, 24000, 0); 
                camera.lookAt(0, 0, 0);
                btn.innerHTML = "🗺️ Adam View";
            } else {
                btn.innerHTML = "🗺️ Full Map View";
            }
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);
            minimapCtx.fillStyle = '#1e293b';
            minimapCtx.fillRect(0, 0, w, h);

            minimapCtx.fillStyle = '#ffffff';
            minimapCtx.fillRect(w * 0.05, h * 0.05, w * 0.9, h * 0.9);

            minimapCtx.fillStyle = '#315c1b';
            minimapCtx.fillRect(w * 0.15, h * 0.15, w * 0.7, h * 0.7);

            if (adam) {
                let normX = (adam.position.x / mapSize + 0.5) * w;
                let normZ = (adam.position.z / mapSize + 0.5) * h;
                minimapCtx.fillStyle = '#ff3300';
                minimapCtx.beginPath();
                minimapCtx.arc(normX, normZ, 5, 0, Math.PI * 2);
                minimapCtx.fill();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (adam) {
                if (moveForward) adam.position.z -= adamSpeed;
                if (moveBackward) adam.position.z += adamSpeed;
                if (moveLeft) adam.position.x -= adamSpeed;
                if (moveRight) adam.position.x += adamSpeed;

                // Terrain height matching the solid perimeter mountains and lowered edges
                let vx = adam.position.x;
                let vy = adam.position.z;
                let h = Math.sin(vx * 0.001) * Math.cos(vy * 0.001) * 180 
                      + Math.sin(vx * 0.004) * Math.sin(vy * 0.004) * 70;
                if (Math.abs(vx) < 350) h -= 60;

                let distFromCenter = Math.sqrt(vx * vx + vy * vy);
                let halfSize = mapSize / 2;
                let innerRadius = halfSize - 3500;
                if (distFromCenter > innerRadius) {
                    let factor = (distFromCenter - innerRadius) / (3500);
                    let mountainRise = Math.pow(factor, 1.8) * 1800;
                    h += mountainRise;
                }

                adam.position.y = Math.max(10, h + 20);

                if (!isFullMap) {
                    camera.position.set(adam.position.x, adam.position.y + cameraOffsetHeight, adam.position.z + cameraOffsetHeight * 1.8);
                    camera.lookAt(adam.position.x, adam.position.y, adam.position.z);
                }
            }

            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

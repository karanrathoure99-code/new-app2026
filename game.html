<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Game Level Creator & Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- Top Bar -->
    <header class="max-w-5xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-4 flex flex-wrap items-center justify-between gap-4">
        <div>
            <h1 class="text-xl font-bold text-indigo-400"><i class="fa-solid fa-paintbrush mr-2"></i>Custom Level Builder</h1>
            <p class="text-xs text-slate-400">Design your own level and test-play it instantly!</p>
        </div>

        <!-- Mode Switcher & Controls -->
        <div class="flex items-center space-x-2">
            <button id="editorModeBtn" onclick="setMode('editor')" class="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white shadow-md transition">
                <i class="fa-solid fa-pen-ruler mr-1.5"></i> Editor Mode
            </button>
            <button id="playModeBtn" onclick="setMode('play')" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                <i class="fa-solid fa-play mr-1.5"></i> Play Level
            </button>
            <button onclick="clearLevel()" class="px-3 py-2 rounded-xl text-sm font-medium bg-rose-950/50 text-rose-400 border border-rose-800/50 hover:bg-rose-900/50 transition" title="Clear All">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-4 gap-4">
        
        <!-- Sidebar Tools (Only active in Editor Mode) -->
        <div id="sidebarTools" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col space-y-4">
            <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider border-b border-slate-800 pb-2">Select Tool</h3>
            
            <div class="space-y-2">
                <button onclick="setSelectedTool('platform')" id="tool-platform" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium bg-indigo-600/20 border border-indigo-500 text-indigo-300 transition tool-btn">
                    <i class="fa-solid fa-cube text-indigo-400 w-5"></i>
                    <span>Platform Block</span>
                </button>
                <button onclick="setSelectedTool('spike')" id="tool-spike" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium bg-slate-800 border border-slate-700 text-slate-400 hover:bg-slate-800/80 transition tool-btn">
                    <i class="fa-solid fa-triangle-exclamation text-rose-400 w-5"></i>
                    <span>Spike / Hazard</span>
                </button>
                <button onclick="setSelectedTool('coin')" id="tool-coin" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium bg-slate-800 border border-slate-700 text-slate-400 hover:bg-slate-800/80 transition tool-btn">
                    <i class="fa-solid fa-coins text-amber-400 w-5"></i>
                    <span>Gold Coin</span>
                </button>
                <button onclick="setSelectedTool('goal')" id="tool-goal" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium bg-slate-800 border border-slate-700 text-slate-400 hover:bg-slate-800/80 transition tool-btn">
                    <i class="fa-solid fa-flag-checkered text-emerald-400 w-5"></i>
                    <span>Goal Flag</span>
                </button>
            </div>

            <div class="mt-auto bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-400 space-y-1.5">
                <p class="font-semibold text-slate-300"><i class="fa-solid fa-circle-info mr-1 text-indigo-400"></i> How to build:</p>
                <p>• <b>Click</b> on the grid to place the selected item.</p>
                <p>• <b>Right-click</b> on any item to delete it.</p>
                <p>• Switch to <b>Play Level</b> to test your creation!</p>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="lg:col-span-3 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col items-center relative overflow-hidden">
            <div class="relative">
                <canvas id="gameCanvas" width="700" height="400" class="bg-slate-950 rounded-xl border border-slate-800 cursor-crosshair shadow-inner"></canvas>
                
                <!-- Play Mode HUD -->
                <div id="playHud" class="absolute top-3 left-3 hidden items-center space-x-4 bg-slate-900/90 backdrop-blur-sm border border-slate-700 px-4 py-1.5 rounded-xl text-sm">
                    <span>Score: <strong id="scoreVal" class="text-amber-400">0</strong></span>
                </div>

                <!-- Game Over / Victory Overlay -->
                <div id="gameOverlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm hidden flex-col items-center justify-center text-center p-6">
                    <h2 id="overlayTitle" class="text-2xl font-bold mb-2 text-emerald-400">Victory!</h2>
                    <p id="overlayText" class="text-sm text-slate-300 mb-4">You successfully beat your custom level.</p>
                    <button onclick="setMode('play')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition">Try Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Grid snap size
        const GRID_SIZE = 20;

        // Mode: 'editor' or 'play'
        let currentMode = 'editor';
        let selectedTool = 'platform'; // 'platform', 'spike', 'coin', 'goal'

        // Level Elements Array
        let levelData = {
            platforms: [
                { x: 0, y: 380, w: 700, h: 20 }, // Default Ground
                { x: 150, y: 300, w: 100, h: 20 },
                { x: 300, y: 220, w: 120, h: 20 }
            ],
            spikes: [
                { x: 260, y: 360, w: 20, h: 20 }
            ],
            coins: [
                { x: 180, y: 260, radius: 8, collected: false },
                { x: 350, y: 180, radius: 8, collected: false }
            ],
            goal: { x: 620, y: 320, w: 30, h: 60 }
        };

        // Player State (for Play Mode)
        let player = {
            x: 40,
            y: 330,
            width: 20,
            height: 30,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpPower: -9,
            grounded: false
        };
        const gravity = 0.45;
        let score = 0;
        let isGameOver = false;
        let isGameWon = false;

        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Switch Mode
        function setMode(mode) {
            currentMode = mode;
            const sidebar = document.getElementById('sidebarTools');
            const editorBtn = document.getElementById('editorModeBtn');
            const playBtn = document.getElementById('playModeBtn');
            const hud = document.getElementById('playHud');
            const overlay = document.getElementById('gameOverlay');

            overlay.classList.add('hidden');
            overlay.classList.remove('flex');

            if (mode === 'editor') {
                sidebar.classList.remove('opacity-50', 'pointer-events-none');
                editorBtn.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white shadow-md transition";
                playBtn.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition";
                hud.classList.add('hidden');
                canvas.style.cursor = "crosshair";
            } else {
                sidebar.classList.add('opacity-50', 'pointer-events-none');
                playBtn.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-600 text-white shadow-md transition";
                editorBtn.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 transition";
                hud.classList.remove('hidden');
                hud.classList.add('flex');
                canvas.style.cursor = "default";

                // Reset Player & Coins
                player.x = 40;
                player.y = 330;
                player.vx = 0;
                player.vy = 0;
                score = 0;
                isGameOver = false;
                isGameWon = false;
                levelData.coins.forEach(c => c.collected = false);
                document.getElementById('scoreVal').textContent = score;
            }
        }

        // Tool Selection
        function setSelectedTool(tool) {
            selectedTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium bg-slate-800 border border-slate-700 text-slate-400 hover:bg-slate-800/80 transition tool-btn";
            });
            const activeBtn = document.getElementById(`tool-${tool}`);
            activeBtn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium bg-indigo-600/20 border border-indigo-500 text-indigo-300 transition tool-btn";
        }

        // Clear All Level Elements
        function clearLevel() {
            if (confirm("Are you sure you want to clear your entire level?")) {
                levelData.platforms = [{ x: 0, y: 380, w: 700, h: 20 }]; // Keep ground
                levelData.spikes = [];
                levelData.coins = [];
                levelData.goal = { x: 620, y: 320, w: 30, h: 60 };
            }
        }

        // Canvas Click Handler (Building)
        canvas.addEventListener('click', e => {
            if (currentMode !== 'editor') return;

            const rect = canvas.getBoundingClientRect();
            const clickX = Math.floor((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
            const clickY = Math.floor((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;

            if (selectedTool === 'platform') {
                levelData.platforms.push({ x: clickX, y: clickY, w: 60, h: 20 });
            } else if (selectedTool === 'spike') {
                levelData.spikes.push({ x: clickX, y: clickY, w: 20, h: 20 });
            } else if (selectedTool === 'coin') {
                levelData.coins.push({ x: clickX + 10, y: clickY + 10, radius: 8, collected: false });
            } else if (selectedTool === 'goal') {
                levelData.goal = { x: clickX, y: clickY, w: 30, h: 60 };
            }
        });

        // Right Click to Delete Elements
        canvas.addEventListener('contextmenu', e => {
            e.preventDefault();
            if (currentMode !== 'editor') return;

            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            // Check platforms
            levelData.platforms = levelData.platforms.filter(p => !(mx >= p.x && mx <= p.x + p.w && my >= p.y && my <= p.y + p.h));
            // Check spikes
            levelData.spikes = levelData.spikes.filter(s => !(mx >= s.x && mx <= s.x + s.w && my >= s.y && my <= s.y + s.h));
            // Check coins
            levelData.coins = levelData.coins.filter(c => Math.hypot(mx - c.x, my - c.y) > c.radius + 5);
        });

        // Game Update Loop (Physics & Collision)
        function updateGame() {
            if (currentMode !== 'play' || isGameOver || isGameWon) return;

            // Horizontal Movement
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -player.speed;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = player.speed;
            } else {
                player.vx = 0;
            }

            // Jumping
            if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            // Gravity
            player.vy += gravity;
            player.x += player.vx;
            player.y += player.vy;

            // Boundaries
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Platform Collisions
            player.grounded = false;
            levelData.platforms.forEach(p => {
                if (
                    player.x < p.x + p.w &&
                    player.x + player.width > p.x &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            });

            // Spike / Hazard Collisions (Game Over)
            levelData.spikes.forEach(s => {
                if (
                    player.x < s.x + s.w &&
                    player.x + player.width > s.x &&
                    player.y < s.y + s.h &&
                    player.y + player.height > s.y
                ) {
                    isGameOver = true;
                    showOverlay("Game Over!", "You hit a spike!", "text-rose-400");
                }
            });

            // Abyss Fall
            if (player.y > canvas.height) {
                isGameOver = true;
                showOverlay("Game Over!", "You fell into the abyss!", "text-rose-400");
            }

            // Coin Collection
            levelData.coins.forEach(c => {
                if (!c.collected) {
                    let distX = (player.x + player.width / 2) - c.x;
                    let distY = (player.y + player.height / 2) - c.y;
                    if (Math.hypot(distX, distY) < player.width / 2 + c.radius) {
                        c.collected = true;
                        score += 100;
                        document.getElementById('scoreVal').textContent = score;
                    }
                }
            });

            // Goal Collision (Victory)
            let g = levelData.goal;
            if (
                player.x < g.x + g.w &&
                player.x + player.width > g.x &&
                player.y < g.y + g.h &&
                player.y + player.height > g.y
            ) {
                isGameWon = true;
                showOverlay("Victory! 🎉", `Level cleared with score: ${score}`, "text-emerald-400");
            }
        }

        function showOverlay(title, text, titleColor) {
            const overlay = document.getElementById('gameOverlay');
            document.getElementById('overlayTitle').textContent = title;
            document.getElementById('overlayTitle').className = `text-2xl font-bold mb-2 ${titleColor}`;
            document.getElementById('overlayText').textContent = text;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        // Render Graphics
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Editor Grid Lines
            if (currentMode === 'editor') {
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += GRID_SIZE) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += GRID_SIZE) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }
            }

            // Draw Platforms
            levelData.platforms.forEach(p => {
                ctx.fillStyle = '#334155';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#475569';
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            // Draw Spikes
            levelData.spikes.forEach(s => {
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.moveTo(s.x, s.y + s.h);
                ctx.lineTo(s.x + s.w / 2, s.y);
                ctx.lineTo(s.x + s.w, s.y + s.h);
                ctx.closePath();
                ctx.fill();
            });

            // Draw Coins
            levelData.coins.forEach(c => {
                if (!c.collected || currentMode === 'editor') {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#fbbf24';
                    ctx.fill();
                    ctx.strokeStyle = '#d97706';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Draw Goal Flag
            let g = levelData.goal;
            ctx.fillStyle = '#10b981';
            ctx.fillRect(g.x, g.y, g.w, g.h);
            ctx.fillStyle = '#ffffff';
            ctx.font = '10px Inter';
            if (currentMode === 'editor') {
                ctx.fillText('GOAL', g.x + 2, g.y + 35);
            }

            // Draw Player (Only in Play Mode)
            if (currentMode === 'play') {
                ctx.fillStyle = '#6366f1';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
        }

        // Main Loop
        function loop() {
            updateGame();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>

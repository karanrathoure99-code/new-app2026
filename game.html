<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Deception Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .dashboard-container {
            position: relative;
            width: 100%;
            max-width: 580px;
            background: #ffb356;
            border: 5px solid #523500;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 10px;
            color: #523500;
        }

        .instruction-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #ffe3b3;
            border: 3px solid #523500;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 14px;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 3x3 Interactive Grid */
        .grid-arena {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #523500;
            padding: 14px;
            border-radius: 10px;
            border: 3px solid #3b2500;
            margin-bottom: 14px;
        }

        .tile-btn {
            background: #ffa742;
            border: 3px solid #7d540f;
            border-radius: 8px;
            aspect-ratio: 1;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 4px 4px 0px #3b2500;
            transition: transform 0.08s ease, background 0.15s ease;
        }

        .tile-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #3b2500;
        }

        /* Active / Highlight States */
        .tile-btn.flash {
            background: #fff !important;
            box-shadow: 0 0 14px #fff;
        }

        .tile-btn.player-press {
            background: #2cb02c !important;
        }

        .tile-btn.error-flash {
            background: #c71b1b !important;
        }

        /* Status / Ego Modal */
        .modal-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border: 4px solid #523500;
            box-shadow: 6px 6px 0px #000;
            border-radius: 10px;
            padding: 16px 20px;
            display: none;
            z-index: 10;
            width: 85%;
            max-width: 380px;
        }

        .modal-box h3 {
            font-size: 12px;
            margin-bottom: 8px;
        }

        .modal-box p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 14px;
        }

        .play-again-btn {
            background: #523500;
            color: #ffb356;
            border: 2px solid #3b2500;
            padding: 10px 14px;
            font-size: 10px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="hud-bar">
            <span id="hudLevel">LVL: 1</span>
            <span id="hudGimmick">MEMORIZE</span>
            <span id="hudFails">FAILS: 0</span>
        </div>

        <div class="instruction-box" id="instructionText">Pattern dhyan se dekho...</div>

        <div class="grid-arena" id="gridArena">
            <div class="tile-btn" data-id="0">💀</div>
            <div class="tile-btn" data-id="1">⚡</div>
            <div class="tile-btn" data-id="2">🔥</div>
            <div class="tile-btn" data-id="3">👾</div>
            <div class="tile-btn" data-id="4">🎯</div>
            <div class="tile-btn" data-id="5">💣</div>
            <div class="tile-btn" data-id="6">👁️</div>
            <div class="tile-btn" data-id="7">🎲</div>
            <div class="tile-btn" data-id="8">👹</div>
        </div>

        <!-- Popups -->
        <div class="modal-box" id="failModal">
            <h3 style="color: #911212;">💀 EGO SHATTERED!</h3>
            <p id="failQuote">Yaadash kamzor hai ya focus nahi?</p>
            <button class="play-again-btn" onclick="retryLevel()">RETRY 🔄</button>
        </div>

        <div class="modal-box" id="winModal">
            <h3 style="color: #126b00;">🎉 SURVIVED!</h3>
            <p id="winQuote">Chalo, agla trap jhelo ab!</p>
            <button class="play-again-btn" onclick="nextLevel()">NEXT LEVEL ➡️</button>
        </div>
    </div>

    <script>
        const hudLevel = document.getElementById('hudLevel');
        const hudGimmick = document.getElementById('hudGimmick');
        const hudFails = document.getElementById('hudFails');
        const instructionText = document.getElementById('instructionText');
        const tiles = Array.from(document.querySelectorAll('.tile-btn'));
        const failModal = document.getElementById('failModal');
        const winModal = document.getElementById('winModal');
        const failQuote = document.getElementById('failQuote');

        let level = 1;
        let failCount = 0;
        let pattern = [];
        let playerStep = 0;
        let isInputLocked = true;

        // Har level ka unique deception / devil rule
        const levelConfig = {
            1: { length: 3, trap: "none", hint: "Pattern dhyan se dekho aur repeat karo." },
            2: { length: 4, trap: "none", hint: "Simple 4 steps memory." },
            3: { length: 4, trap: "reverse", hint: "😈 TWIST: Pattern ULTA (Reverse) enter karo!" },
            4: { length: 4, trap: "swap", hint: "Dhyan se! Pattern ke baad buttons swap honge!" },
            5: { length: 5, trap: "mirror", hint: "😈 Left ka Right, Right ka Left enter karo!" },
            6: { length: 5, trap: "fake_flash", hint: "Beech mein ek fake flash aayega, ignore karna!" },
            7: { length: 6, trap: "reverse", hint: "Ulta order + 6 sequence!" },
            8: { length: 5, trap: "invisible", hint: "Icons gayab ho jayenge click karte waqt!" },
            9: { length: 6, trap: "swap", hint: "Full shuffle ke baad memory test!" },
            10: { length: 7, trap: "ultimate", hint: "Reverse order + Swap chaos!" }
        };

        function startLevel(lvl) {
            level = lvl;
            playerStep = 0;
            isInputLocked = true;
            failModal.style.display = "none";
            winModal.style.display = "none";

            const cfg = levelConfig[lvl] || { length: 5, trap: "reverse", hint: "Koshish karke dekh lo!" };

            hudLevel.innerText = "LVL: " + lvl;
            hudGimmick.innerText = cfg.trap.toUpperCase();
            instructionText.innerText = "Pattern yaad rakho...";

            // Random pattern generate
            pattern = [];
            for (let i = 0; i < cfg.length; i++) {
                pattern.push(Math.floor(Math.random() * 9));
            }

            playSequence(cfg);
        }

        async function playSequence(cfg) {
            await sleep(600);

            for (let i = 0; i < pattern.length; i++) {
                let id = pattern[i];
                let tile = tiles[id];
                tile.classList.add('flash');
                await sleep(400);
                tile.classList.remove('flash');
                await sleep(250);
            }

            // Fake Flash Trap (Level 6)
            if (cfg.trap === "fake_flash") {
                let fakeId = (pattern[pattern.length - 1] + 2) % 9;
                tiles[fakeId].classList.add('flash');
                await sleep(150);
                tiles[fakeId].classList.remove('flash');
            }

            // Swap Trap (Level 4, 9, 10)
            if (cfg.trap === "swap" || cfg.trap === "ultimate") {
                instructionText.innerText = "🔄 SHUFFLING TILES...";
                await sleep(300);
                shuffleGrid();
            }

            instructionText.innerText = cfg.hint;
            isInputLocked = false;
        }

        function shuffleGrid() {
            const grid = document.getElementById('gridArena');
            for (let i = grid.children.length; i >= 0; i--) {
                grid.appendChild(grid.children[Math.random() * i | 0]);
            }
        }

        // Mirror Map for Level 5 (Col 0 <-> Col 2)
        const mirrorMap = { 0: 2, 1: 1, 2: 0, 3: 5, 4: 4, 5: 3, 6: 8, 7: 7, 8: 6 };

        tiles.forEach(tile => {
            tile.addEventListener('click', () => {
                if (isInputLocked) return;

                const clickedId = parseInt(tile.getAttribute('data-id'));
                const cfg = levelConfig[level] || { trap: "none" };

                // Target identification according to trap
                let expectedId;
                if (cfg.trap === "reverse" || cfg.trap === "ultimate") {
                    expectedId = pattern[pattern.length - 1 - playerStep];
                } else if (cfg.trap === "mirror") {
                    expectedId = mirrorMap[pattern[playerStep]];
                } else {
                    expectedId = pattern[playerStep];
                }

                if (clickedId === expectedId) {
                    tile.classList.add('player-press');
                    setTimeout(() => tile.classList.remove('player-press'), 180);
                    playerStep++;

                    if (playerStep === pattern.length) {
                        isInputLocked = true;
                        setTimeout(showWin, 250);
                    }
                } else {
                    tile.classList.add('error-flash');
                    setTimeout(() => tile.classList.remove('error-flash'), 300);
                    isInputLocked = true;
                    setTimeout(showFail, 300);
                }
            });
        });

        function showFail() {
            failCount++;
            hudFails.innerText = "FAILS: " + failCount;
            failModal.style.display = "block";
        }

        function showWin() {
            winModal.style.display = "block";
            let saved = parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga')) || 1;
            if (level + 1 > saved) {
                localStorage.setItem('saveLevel_TumseNaHoPayga', level + 1);
            }
        }

        window.retryLevel = function() {
            startLevel(level);
        };

        window.nextLevel = function() {
            if (level < 10) {
                startLevel(level + 1);
            } else {
                alert("LEGEND GRAND MASTER! Saare deceptive memory levels paar kar liye!");
            }
        };

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Start
        startLevel(1);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Schrödinger's Quantum Trap</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #0b090a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .arcade-cabinet {
            position: relative;
            background: #161a1d;
            border-radius: 14px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.8);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 620px;
            width: 100%;
            height: 95vh;
            max-height: 550px;
            border: 2px solid #e5383b;
        }

        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #212529;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #f8f9fa;
            box-shadow: 0 3px 0px #000;
        }

        .hud-tools {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #e5383b;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #a4161a;
        }

        /* Puzzle Chamber */
        .puzzle-chamber {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #03071e;
            border-radius: 10px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Quantum Hazards & Walls that Shift */
        .hazard {
            position: absolute;
            background: #e5383b;
            border-radius: 4px;
            box-shadow: 0 0 8px #e5383b;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .platform {
            position: absolute;
            background: #4d908e;
            border-radius: 3px;
        }

        /* Character */
        .dummy-character {
            position: absolute;
            width: 18px;
            height: 26px;
            bottom: 12px;
            left: 20px;
            z-index: 10;
            transform-style: preserve-3d;
            transition: left 0.05s linear, bottom 0.15s ease;
        }

        .dummy-head {
            position: absolute;
            top: 0;
            left: 4px;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 3px 3px, #fff, #4d908e);
            border-radius: 50%;
            box-shadow: 0 0 5px #4d908e;
        }

        .dummy-body {
            position: absolute;
            top: 9px;
            left: 7px;
            width: 4px;
            height: 10px;
            background: #4d908e;
            border-radius: 2px;
        }

        .dummy-arm-left, .dummy-arm-right {
            position: absolute;
            top: 10px;
            width: 6px;
            height: 2px;
            background: #fff;
            border-radius: 1px;
        }
        .dummy-arm-left { left: 1px; }
        .dummy-arm-right { right: 1px; }

        .dummy-leg-left, .dummy-leg-right {
            position: absolute;
            bottom: 0;
            width: 3px;
            height: 7px;
            background: #fff;
            border-radius: 1px;
        }
        .dummy-leg-left { left: 5px; }
        .dummy-leg-right { right: 5px; }

        /* Target Gate */
        .target-gate {
            width: 26px;
            height: 30px;
            background: linear-gradient(135deg, #43aa8b, #257960);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 11px;
            position: absolute;
            bottom: 12px;
            right: 15px;
            z-index: 5;
            box-shadow: 0 0 10px #43aa8b;
        }

        .clue-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #e5383b;
            color: #fff;
            font-weight: 700;
            font-size: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 20;
            text-align: center;
            width: calc(100% - 12px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .bottom-action-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
            gap: 6px;
        }

        .control-btn {
            flex: 1;
            background: #212529;
            color: #f8f9fa;
            padding: 12px 6px;
            border-radius: 8px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0px #000;
            text-align: center;
            border: 1px solid #4d908e;
        }

        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #000;
        }

        .danger-btn {
            background: #e5383b;
            color: #fff;
            border: 1px solid #ff4d4d;
            box-shadow: 0 4px 0px #a4161a;
        }

        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #161a1d;
            border: 2px solid #e5383b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 85%;
            max-width: 300px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.9);
        }

        .modal-btn {
            background: #4d908e;
            color: #fff;
            padding: 8px 12px;
            font-size: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud-bar">
            <div>
                <span id="lvlLabel">LEVEL: QUANTUM SHIFT</span>
                <span style="margin-left: 10px;" id="failsLabel">FAILS: 0</span>
            </div>
            <div class="hud-tools">
                <button class="hud-btn" onclick="resetGame()">🔄 RESTART</button>
            </div>
        </div>

        <!-- Maze Chamber -->
        <div class="puzzle-chamber" id="chamber">
            <div class="clue-box" id="quantumText">Quantum State: रास्ते देखते ही गायब/बदल जाते हैं!</div>
            
            <!-- Quantum Hazards (Ye chup-chap apni jagah badal lenge) -->
            <div class="hazard" id="trap1" style="width: 40px; height: 12px; bottom: 12px; left: 130px;"></div>
            <div class="hazard" id="trap2" style="width: 40px; height: 12px; bottom: 12px; left: 260px;"></div>

            <!-- Character -->
            <div class="dummy-character" id="dummy">
                <div class="dummy-head"></div>
                <div class="dummy-body"></div>
                <div class="dummy-arm-left"></div>
                <div class="dummy-arm-right"></div>
                <div class="dummy-leg-left"></div>
                <div class="dummy-leg-right"></div>
            </div>

            <!-- Target Gate -->
            <div class="target-gate" id="gate">🚪</div>
        </div>

        <!-- Controls -->
        <div class="bottom-action-bar">
            <button class="control-btn" onclick="movePlayer(-15)">◀ LEFT</button>
            <button class="control-btn danger-btn" onclick="quantumJump()">QUANTUM JUMP ⬆️</button>
            <button class="control-btn" onclick="movePlayer(15)">RIGHT ▶</button>
        </div>

        <!-- Modal -->
        <div class="popup-modal" id="winModal">
            <h2 id="modalTitle" style="color: #43aa8b; font-size: 12px; margin-bottom: 8px;">🎉 LEVEL CLEARED!</h2>
            <p id="modalDesc" style="font-family: 'Chakra Petch'; font-size: 11px; margin-bottom: 10px; color: #f8f9fa;">क्वांटम ट्रैप को पार कर लिया!</p>
            <button class="modal-btn" onclick="resetGame()">AGAIN 🔄</button>
        </div>
    </div>

    <script>
        let posX = 20;
        let posY = 12;
        let fails = 0;
        let isOver = false;
        
        const dummy = document.getElementById('dummy');
        const winModal = document.getElementById('winModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const failsLabel = document.getElementById('failsLabel');
        const trap1 = document.getElementById('trap1');
        const trap2 = document.getElementById('trap2');
        const quantumText = document.getElementById('quantumText');

        // Quantum physics gimmick: Hazards teleport or change positions unpredictably!
        let quantumEngine = setInterval(() => {
            if (isOver) return;

            // Randomly teleport traps when player moves
            if (Math.random() < 0.4) {
                let randomPos1 = Math.floor(Math.random() * 120) + 100;
                let randomPos2 = Math.floor(Math.random() * 120) + 240;
                trap1.style.left = randomPos1 + 'px';
                trap2.style.left = randomPos2 + 'px';
                
                quantumText.innerText = "⚠️ Quantum Fluctuation! काँटों की जगह बदल गई!";
                setTimeout(() => {
                    quantumText.innerText = "Quantum State: सावधानी से आगे बढ़ो!";
                }, 800);
            }
            checkCollisions();
        }, 600);

        function movePlayer(val) {
            if (isOver) return;
            posX += val;
            posX = Math.max(10, Math.min(posX, 430));
            dummy.style.left = posX + 'px';
            checkCollisions();
        }

        function quantumJump() {
            if (isOver) return;
            posY = 75;
            dummy.style.bottom = posY + 'px';

            setTimeout(() => {
                posY = 12;
                dummy.style.bottom = posY + 'px';
                checkCollisions();
            }, 300);
        }

        function checkCollisions() {
            let t1Left = parseInt(trap1.style.left);
            let t2Left = parseInt(trap2.style.left);

            // Check if hit moving/teleporting traps
            if (((posX >= t1Left - 10 && posX <= t1Left + 35) || 
                 (posX >= t2Left - 10 && posX <= t2Left + 35)) && posY <= 15) {
                triggerFail("आप क्वांटम काँटे पर आ गिरे!");
            } else if (posX >= 410) {
                triggerWin();
            }
        }

        function triggerFail(reason) {
            if (isOver) return;
            isOver = true;
            fails++;
            failsLabel.innerText = "FAILS: " + fails;
            
            modalTitle.style.color = "#e5383b";
            modalTitle.innerText = "💀 QUANTUM DESTRUCTION!";
            modalDesc.innerText = reason + " ईगो हर्ट हुआ? क्वांटम फिजिक्स इतनी आसान नहीं है!";
            winModal.style.display = "block";
        }

        function triggerWin() {
            if (isOver) return;
            isOver = true;
            modalTitle.style.color = "#43aa8b";
            modalTitle.innerText = "🎉 GENIUS!";
            modalDesc.innerText = तुमने क्वांटम दुनिया को हरा दिया!";
            winModal.style.display = "block";
        }

        function resetGame() {
            posX = 20;
            posY = 12;
            isOver = false;
            dummy.style.left = posX + 'px';
            dummy.style.bottom = posY + 'px';
            trap1.style.left = '130px';
            trap2.style.left = '260px';
            winModal.style.display = "none";
            quantumText.innerText = "Quantum State: रास्ते देखते ही गायब/बदल जाते हैं!";
        }
    </script>
</body>
</html>

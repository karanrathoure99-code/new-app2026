<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free Fire Bermuda - Smooth Surface & View Controls</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #5294e2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        /* Full Map View Button */
        #map-btn {
            position: absolute;
            top: 95px;
            left: 15px;
            background: rgba(255, 85, 0, 0.9);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
            touch-action: manipulation;
        }
        #map-btn:active {
            transform: scale(0.95);
            background: rgba(200, 65, 0, 0.9);
        }
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Free Fire Bermuda Map:</strong><br>
        Map Area: <span>20,000 x 20,000 Units</span><br>
        Status: <span>Smooth Surface & Drag View Enabled</span>
    </div>

    <!-- Full Map View Button -->
    <button id="map-btn" onclick="toggleFullMap()">🗺️ Full Map View</button>

    <!-- Live Minimap -->
    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let mapSize = 20000;
        let minimapCtx, minimapCanvas;
        let isFullMap = false;

        // Interaction variables for dragging/panning
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraTarget = new THREE.Vector3(0, 0, 0);

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5294e2);

            // 2. Camera Setup
            camera = new THREE.PerspectiveSystem ? null : new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50000);
            camera.position.set(0, 3000, 5000);
            camera.lookAt(cameraTarget);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(3000, 6000, 3000);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 30000;
            const d = 12000;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // 5. Endless Ocean Surrounding Outside
            const oceanGeo = new THREE.PlaneGeometry(90000, 90000);
            const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1b4f72, roughness: 0.2 });
            const ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -200;
            scene.add(ocean);

            // 6. Smooth Bermuda Surface Generation (High segment count for zero visible grid lines/grooves)
            const segments = 400;
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize, segments, segments);
            const posAttr = groundGeo.attributes.position;
            let halfSize = mapSize / 2;

            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                
                let distFromCenter = Math.sqrt(vx*vx + vy*vy);
                let centerPeak = Math.max(0, (1 - distFromCenter / (mapSize * 0.3))) * 1100;

                let rollingHills = Math.abs(Math.sin(vx * 0.001) * Math.cos(vy * 0.001) * 180) 
                                 + Math.abs(Math.sin(vx * 0.004) * Math.sin(vy * 0.004) * 80);

                let height = centerPeak + rollingHills + 20;

                let maxDist = Math.max(Math.abs(vx), Math.abs(vy));
                let borderThreshold = halfSize - 2000;
                if (maxDist > borderThreshold) {
                    let factor = (maxDist - borderThreshold) / (2000);
                    height += Math.pow(factor, 2) * 1400;
                }

                posAttr.setZ(i, height);
            }
            groundGeo.computeVertexNormals();

            // Smooth shading to remove all harsh polygon grooves/lines
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x315c1b, roughness: 0.85, flatShading: false });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Mouse / Touch Event Listeners for dragging and zooming across the map
            window.addEventListener('mousedown', (e) => {
                if(e.target.closest('#map-btn') || e.target.closest('#minimap-container')) return;
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let deltaX = e.clientX - previousMousePosition.x;
                let deltaY = e.clientY - previousMousePosition.y;

                cameraTarget.x -= deltaX * 3.5;
                cameraTarget.z -= deltaY * 3.5;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            window.addEventListener('wheel', (e) => {
                camera.position.y += e.deltaY * 3.0;
                camera.position.y = Math.max(400, Math.min(25000, camera.position.y));
            });

            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            window.addEventListener('resize', onWindowResize);
        }

        function toggleFullMap() {
            isFullMap = !isFullMap;
            const btn = document.getElementById('map-btn');
            if (isFullMap) {
                camera.position.set(0, 16000, 0); 
                cameraTarget.set(0, 0, 0);
                btn.innerHTML = "🗺️ Normal View";
            } else {
                camera.position.set(0, 3000, 5000); 
                cameraTarget.set(0, 0, 0);
                btn.innerHTML = "🗺️ Full Map View";
            }
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);
            minimapCtx.fillStyle = '#1b4f72';
            minimapCtx.fillRect(0, 0, w, h);

            minimapCtx.fillStyle = '#315c1b';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, w*0.42, 0, Math.PI*2);
            minimapCtx.fill();

            minimapCtx.fillStyle = '#475444';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 10, 0, Math.PI*2);
            minimapCtx.fill();

            minimapCtx.fillStyle = '#ff3300';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 4, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            camera.lookAt(cameraTarget);
            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Pure Troll Platformer</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .arcade-box {
            position: relative;
            background: #ffb356;
            border-radius: 12px;
            box-shadow: 0 8px 0px rgba(0, 0, 0, 0.45);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 680px;
            width: 100%;
        }

        /* Top HUD Bar */
        .hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            font-size: 10px;
            color: #523500;
            box-shadow: 0 2px 0px #523500;
        }

        .hud-actions {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #523500;
            color: #ffb356;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #3b2500;
        }

        .hud-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Canvas Stage */
        canvas {
            background: #ffe2b3;
            border-radius: 8px;
            display: block;
            box-shadow: 0 4px 0px #523500;
        }

        /* Mobile Touch Controls */
        .touch-pad {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
        }

        .move-group {
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            background: #523500;
            color: #ffb356;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3b2500;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #3b2500;
            background: #6e4600;
        }

        .jump-btn {
            background: #8f1111;
            color: #fff;
            box-shadow: 0 4px 0px #540808;
            padding: 14px 24px;
        }

        .jump-btn:active {
            background: #b51717;
            box-shadow: 0 1px 0px #540808;
        }

        /* Death & Win Popups */
        .overlay-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border-radius: 10px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.5);
            padding: 18px 24px;
            text-align: center;
            display: none;
            z-index: 50;
            width: 85%;
            max-width: 400px;
        }

        .overlay-popup h2 {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .overlay-popup p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 14px;
        }

        .popup-btn {
            background: #523500;
            color: #ffb356;
            padding: 10px 14px;
            font-size: 9px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 0px #3b2500;
            margin: 0 4px;
        }

        .popup-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="arcade-box">
        <div class="hud">
            <div>
                <span id="lvlLabel">LVL: 1</span>
                <span style="margin-left: 8px;" id="deathLabel">💀 0</span>
            </div>
            <div class="hud-actions">
                <button class="hud-btn" onclick="resetLevel()">🔄 RESTART</button>
                <button class="hud-btn" onclick="goToLevelMenu()">📜 LEVELS</button>
                <button class="hud-btn" onclick="toggleFullscreen()">⛶ FULL</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="600" height="260"></canvas>

        <!-- Touch / Phone Controls -->
        <div class="touch-pad">
            <div class="move-group">
                <button class="ctrl-btn" id="btnLeft">◀ LEFT</button>
                <button class="ctrl-btn" id="btnRight">RIGHT ▶</button>
            </div>
            <button class="ctrl-btn jump-btn" id="btnJump">JUMP ⬆</button>
        </div>

        <!-- Failure Modal -->
        <div class="overlay-popup" id="failModal">
            <h2 style="color: #8f1111;">💀 TROLLED!</h2>
            <p id="failQuote">Kaisa laga dhoka?</p>
            <button class="popup-btn" onclick="resetLevel()">RETRY 🔄</button>
            <button class="popup-btn" onclick="goToLevelMenu()">LEVELS 📜</button>
        </div>

        <!-- Win Modal -->
        <div class="overlay-popup" id="winModal">
            <h2 style="color: #116b0d;">🎉 STAGE CLEARED!</h2>
            <p>Agla level aur zyada gussa dilayega!</p>
            <button class="popup-btn" onclick="nextStage()">NEXT ➡️</button>
            <button class="popup-btn" onclick="goToLevelMenu()">LEVELS 📜</button>
        </div>
    </div>

    <script>
        // Fullscreen API Logic
        async function toggleFullscreen() {
            const doc = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (doc.requestFullscreen) await doc.requestFullscreen();
                    else if (doc.webkitRequestFullscreen) await doc.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {}
        }
        window.addEventListener('click', toggleFullscreen, { once: true });
        window.addEventListener('touchstart', toggleFullscreen, { once: true });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const lvlLabel = document.getElementById('lvlLabel');
        const deathLabel = document.getElementById('deathLabel');
        const failModal = document.getElementById('failModal');
        const winModal = document.getElementById('winModal');
        const failQuote = document.getElementById('failQuote');

        let deaths = 0;
        let isOver = false;

        // Player Physical Body
        let player = {
            x: 40,
            y: 190,
            w: 22,
            h: 22,
            vx: 0,
            vy: 0,
            speed: 3.6,
            jumpStrength: -8.8,
            onGround: false
        };

        // Complete 5 Troll Levels with Platforms, Spikes, and Traps
        const stages = [
            {
                id: 1,
                name: "THE RUNAWAY DOOR",
                quote: "Door ke paas jaoge toh wo bhag kar shuruat mein aa jayega!",
                platforms: [
                    { x: 0, y: 224, w: 600, h: 36 } // Main ground
                ],
                spikes: [
                    { x: 260, y: 206, w: 32, h: 18 }
                ],
                door: { x: 520, y: 176, w: 28, h: 48 },
                trolled: false,
                action: (lvl) => {
                    // Troll: Gate bhagta hai
                    if (player.x > 380 && !lvl.trolled) {
                        lvl.door.x -= 8;
                        if (lvl.door.x <= 40) {
                            lvl.door.x = 40;
                            lvl.trolled = true;
                        }
                    }
                }
            },
            {
                id: 2,
                name: "INVISIBLE BRICK",
                quote: "Hawa mein adrishya eent se sir takra gaya!",
                platforms: [
                    { x: 0, y: 224, w: 600, h: 36 }
                ],
                spikes: [
                    { x: 280, y: 206, w: 46, h: 18 }
                ],
                hiddenBlocks: [
                    { x: 285, y: 120, w: 36, h: 20, shown: false }
                ],
                door: { x: 520, y: 176, w: 28, h: 48 },
                action: (lvl) => {
                    // Troll: Head bump over spike
                    lvl.hiddenBlocks.forEach(b => {
                        if (player.x + player.w > b.x && player.x < b.x + b.w && player.y <= b.y + b.h && player.y >= b.y) {
                            b.shown = true;
                            player.vy = 4.5; // Bump down into spike
                        }
                    });
                }
            },
            {
                id: 3,
                name: "FLOOR COLLAPSE",
                quote: "Daudne se pehle socha nahi? Zameen gayab!",
                platforms: [
                    { x: 0, y: 224, w: 200, h: 36 },
                    { x: 380, y: 224, w: 220, h: 36 }
                ],
                fakeFloor: { x: 200, y: 224, w: 180, h: 36, alive: true },
                spikes: [],
                door: { x: 520, y: 176, w: 28, h: 48 },
                action: (lvl) => {
                    if (player.x > 190 && player.x < 370 && lvl.fakeFloor.alive) {
                        lvl.fakeFloor.alive = false; // Floor vanishes
                    }
                }
            },
            {
                id: 4,
                name: "THE AIR MISSILE",
                quote: "Zameen ka spike hawa mein rocket ban gaya!",
                platforms: [
                    { x: 0, y: 224, w: 600, h: 36 },
                    { x: 260, y: 160, w: 80, h: 16 } // Floating step
                ],
                spikes: [
                    { x: 320, y: 206, w: 26, h: 18, flying: false }
                ],
                door: { x: 520, y: 176, w: 28, h: 48 },
                action: (lvl) => {
                    let s = lvl.spikes[0];
                    if (!player.onGround && player.x > 180) s.flying = true;
                    if (s.flying) {
                        s.x -= 6.5;
                        s.y -= 1.8;
                    }
                }
            },
            {
                id: 5,
                name: "REVERSE HELL",
                quote: "Right dabane se left mein kood gaye!",
                platforms: [
                    { x: 0, y: 224, w: 600, h: 36 }
                ],
                spikes: [
                    { x: 420, y: 206, w: 34, h: 18 }
                ],
                door: { x: 520, y: 176, w: 28, h: 48 },
                reversed: false,
                action: (lvl) => {
                    if (player.x > 240 && !lvl.reversed) {
                        lvl.reversed = true;
                    }
                }
            }
        ];

        let curIdx = 0;
        let activeStage = null;

        function loadStage(idx) {
            curIdx = idx;
            activeStage = JSON.parse(JSON.stringify(stages[idx]));
            isOver = false;

            player.x = 40;
            player.y = 180;
            player.vx = 0;
            player.vy = 0;
            player.onGround = true;

            lvlLabel.innerText = "LVL: " + activeStage.id;
            failModal.style.display = "none";
            winModal.style.display = "none";
        }

        // Input Setup (Keyboard + Buttons)
        const keys = { left: false, right: false, jump: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w' || e.key === ' ') keys.jump = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w' || e.key === ' ') keys.jump = false;
        });

        function bindTouch(btnId, keyName) {
            const b = document.getElementById(btnId);
            b.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            b.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            b.addEventListener('mousedown', () => { keys[keyName] = true; });
            b.addEventListener('mouseup', () => { keys[keyName] = false; });
        }

        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnJump', 'jump');

        function triggerDeath(text) {
            if (isOver) return;
            isOver = true;
            deaths++;
            deathLabel.innerText = "💀 " + deaths;
            failQuote.innerText = text || activeStage.quote;
            failModal.style.display = "block";
        }

        function triggerWin() {
            if (isOver) return;
            isOver = true;
            winModal.style.display = "block";
        }

        window.resetLevel = () => loadStage(curIdx);
        window.nextStage = () => {
            if (curIdx + 1 < stages.length) loadStage(curIdx + 1);
            else { alert("SHABASH! Saare Troll Levels Paar Kar Liye!"); goToLevelMenu(); }
        };
        window.goToLevelMenu = () => { window.location.href = "level.html"; };

        // Physics Update
        function update() {
            if (isOver) return;

            // Left / Right Run
            let dir = 0;
            if (keys.left) dir -= 1;
            if (keys.right) dir += 1;

            if (activeStage.reversed) dir = -dir; // Controls reversed

            player.vx = dir * player.speed;

            // Jump
            if (keys.jump && player.onGround) {
                player.vy = player.jumpStrength;
                player.onGround = false;
            }

            // Gravity
            player.vy += 0.44;
            player.x += player.vx;
            player.y += player.vy;

            // Stage Troll Scripts
            activeStage.action(activeStage);

            // Ground & Platform Collisions
            player.onGround = false;

            let allPlats = [...activeStage.platforms];
            if (activeStage.fakeFloor && activeStage.fakeFloor.alive) {
                allPlats.push(activeStage.fakeFloor);
            }

            allPlats.forEach(plat => {
                if (player.x + player.w > plat.x && player.x < plat.x + plat.w) {
                    if (player.y + player.h >= plat.y && player.y + player.h <= plat.y + 12 && player.vy >= 0) {
                        player.y = plat.y - player.h;
                        player.vy = 0;
                        player.onGround = true;
                    }
                }
            });

            // Fallen in Void
            if (player.y > 270) triggerDeath("Zameen ke neeche gir gaye! 😂");

            // Spikes Collisions
            if (activeStage.spikes) {
                activeStage.spikes.forEach(s => {
                    if (player.x < s.x + s.w && player.x + player.w > s.x &&
                        player.y < s.y + s.h && player.y + player.h > s.y) {
                        triggerDeath();
                    }
                });
            }

            // Door Collision
            let d = activeStage.door;
            if (player.x < d.x + d.w && player.x + player.w > d.x &&
                player.y < d.y + d.h && player.y + player.h > d.y) {
                triggerWin();
            }
        }

        // Draw Canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Platforms (Brown)
            ctx.fillStyle = "#523500";
            activeStage.platforms.forEach(plat => {
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            });

            // Draw Fake Floor if active
            if (activeStage.fakeFloor && activeStage.fakeFloor.alive) {
                ctx.fillRect(activeStage.fakeFloor.x, activeStage.fakeFloor.y, activeStage.fakeFloor.w, activeStage.fakeFloor.h);
            }

            // 2. Draw Hidden Blocks (if hit)
            if (activeStage.hiddenBlocks) {
                activeStage.hiddenBlocks.forEach(b => {
                    if (b.shown) {
                        ctx.fillStyle = "#523500";
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.fillStyle = "#ffb356";
                        ctx.fillText("?", b.x + 12, b.y + 14);
                    }
                });
            }

            // 3. Draw Spikes (Red)
            if (activeStage.spikes) {
                ctx.fillStyle = "#8f1111";
                activeStage.spikes.forEach(s => {
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y + s.h);
                    ctx.lineTo(s.x + s.w / 2, s.y);
                    ctx.lineTo(s.x + s.w, s.y + s.h);
                    ctx.fill();
                });
            }

            // 4. Draw Door (Green Exit)
            let d = activeStage.door;
            ctx.fillStyle = "#523500";
            ctx.fillRect(d.x, d.y, d.w, d.h);
            ctx.fillStyle = "#2db300";
            ctx.fillRect(d.x + 3, d.y + 3, d.w - 6, d.h - 6);

            // 5. Draw Player Devil Character
            ctx.fillStyle = "#523500";
            ctx.fillRect(player.x, player.y, player.w, player.h);
            // Horns
            ctx.fillStyle = "#8f1111";
            ctx.fillRect(player.x + 2, player.y - 4, 4, 4);
            ctx.fillRect(player.x + player.w - 6, player.y - 4, 4, 4);
            // Eyes
            ctx.fillStyle = "#fff";
            ctx.fillRect(player.x + 4, player.y + 6, 3, 3);
            ctx.fillRect(player.x + 14, player.y + 6, 3, 3);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        loadStage(0);
        gameLoop();
    </script>
</body>
</html>

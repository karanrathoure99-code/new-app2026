<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>🤪 Z PAJAL - Play Level</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .game-wrapper {
            position: relative;
            background: #ffb356;
            border: 5px solid #523500;
            border-radius: 12px;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.4);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 720px;
            width: 100%;
        }

        /* Top HUD Bar */
        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #523500;
        }

        .hud-moves.danger {
            color: #d11a1a;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        /* Canvas Game Box */
        canvas {
            background: #ffe2b3;
            border: 4px solid #523500;
            border-radius: 6px;
            display: block;
        }

        /* Modal Overlay for Ego / Death Popups */
        .overlay-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border: 4px solid #523500;
            border-radius: 10px;
            box-shadow: 6px 6px 0px #000;
            padding: 16px 20px;
            text-align: center;
            display: none;
            z-index: 20;
            width: 85%;
            max-width: 400px;
        }

        .overlay-card h2 {
            font-size: 13px;
            color: #911212;
            margin-bottom: 8px;
        }

        .overlay-card p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .modal-btn {
            background: #523500;
            color: #ffb356;
            border: 2px solid #3b2500;
            padding: 10px 14px;
            font-size: 10px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.4);
        }

        .modal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.4);
        }

        /* Controls Instructions */
        .controls-hint {
            margin-top: 8px;
            font-size: 8px;
            color: #523500;
            letter-spacing: 0.5px;
        }
    </style>
</head>

            let key = e.key.toLowerCase();
            if (keys[key]) return; // prevent holding move abuse
            keys[key] = true;

            let moveCost = false;

            // Inverted trap check
            let leftKey = activeLevel.trap === "inverted_controls" ? ('d' || 'arrowright') : ('a' || 'arrowleft');
            let rightKey = activeLevel.trap === "inverted_controls" ? ('a' || 'arrowleft') : ('d' || 'arrowright');

                player.vx = activeLevel.trap === "inverted_controls" ? 3.5 : -3.5;

            let key = e.key.toLowerCase();
            keys[key] = false;
            if (key === 'a' || key === 'd' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                player.vx = 0;
            }
        });

        function triggerFail(customText) {
            if (isGameOver) return;
            isGameOver = true;
            failQuote.innerText = customText || activeLevel.failQuote;
            failModal.style.display = "block";
        }

        function triggerWin() {
            if (isGameOver) return;
            isGameOver = true;
            winModal.style.display = "block";
            // LocalStorage level save
            let nextId = activeLevel.id + 1;
            let saved = parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga')) || 1;
            if (nextId > saved) {
                localStorage.setItem('saveLevel_TumseNaHoPayga', nextId);
            }
        }

        window.retryLevel = function() {
            initLevel(currentLevelIdx);
        };

        window.nextLevel = function() {
            if (currentLevelIdx + 1 < levels.length) {
                initLevel(currentLevelIdx + 1);
            } else {
                alert("CONGRATULATIONS! Phase 1 clear kar liya! Phase 2 jald aayega!");
            }
        };

        // Physics & Game Loop
        function update() {
            if (isGameOver) return;

            // Gravity
            player.vy += 0.45;
            player.x += player.vx;
            checkHorizontalCollisions();
            player.y += player.vy;
            checkVerticalCollisions();

            // Trap Mechanics
            if (activeLevel.trap === "teleport_door" && !doorMoved) {
                // If player comes within 100px of the door, door shifts to start
                let dist = Math.hypot(player.x - doorPos.x, player.y - doorPos.y);
                if (dist < 100) {
                    doorPos.x = 2 * TILE_SIZE; // teleport behind player
                    doorMoved = true;
                }
            }

            // Door overlap check
            if (
                player.x < doorPos.x + TILE_SIZE &&
                player.x + player.w > doorPos.x &&
                player.y < doorPos.y + TILE_SIZE &&
                player.y + player.h > doorPos.y
            ) {
                if (activeLevel.trap === "exact_moves" && remainingMoves !== 0) {
                    triggerFail("Gate tabhi khulega jab EXACT 0 moves bachenge!");
                    return;
                }
                triggerWin();
            }
        }

        function checkHorizontalCollisions() {
            let leftTile = Math.floor(player.x / TILE_SIZE);
            let rightTile = Math.floor((player.x + player.w) / TILE_SIZE);
            let topTile = Math.floor(player.y / TILE_SIZE);
            let bottomTile = Math.floor((player.y + player.h - 1) / TILE_SIZE);

            for (let r = topTile; r <= bottomTile; r++) {
                for (let c = leftTile; c <= rightTile; c++) {
                    if (r >= 0 && r < 10 && c >= 0 && c < 20) {
                        let tile = mapData[r][c];
                        if (tile === 1) { // Wall
                            if (player.vx > 0) player.x = c * TILE_SIZE - player.w;
                            else if (player.vx < 0) player.x = (c + 1) * TILE_SIZE;
                        } else if (tile === 2) { // Spike
                            triggerFail();
                        }
                    }
                }
            }
        }

        function checkVerticalCollisions() {
            let leftTile = Math.floor(player.x / TILE_SIZE);
            let rightTile = Math.floor((player.x + player.w - 1) / TILE_SIZE);
            let topTile = Math.floor(player.y / TILE_SIZE);
            let bottomTile = Math.floor((player.y + player.h) / TILE_SIZE);

            player.onGround = false;

            for (let r = topTile; r <= bottomTile; r++) {
                for (let c = leftTile; c <= rightTile; c++) {
                    if (r >= 0 && r < 10 && c >= 0 && c < 20) {
                        let tile = mapData[r][c];
                        if (tile === 1 || tile === 3) { // Solid or Crumble
                            if (player.vy > 0) {
                                player.y = r * TILE_SIZE - player.h;
                                player.vy = 0;
                                player.onGround = true;

                                // Crumble floor handling
                                if (tile === 3) {
                                    setTimeout(() => {
                                        if (mapData[r] && mapData[r][c]) mapData[r][c] = 0;
                                    }, 200);
                                }
                            } else if (player.vy < 0) {
                                player.y = (r + 1) * TILE_SIZE;
                                player.vy = 0;
                            }
                        } else if (tile === 2) {
                            triggerFail();
                        }
                    }
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Tiles
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 20; c++) {
                    let tile = mapData[r][c];
                    let tx = c * TILE_SIZE;
                    let ty = r * TILE_SIZE;

                    if (tile === 1) {
                        ctx.fillStyle = "#523500";
                        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = "#ffa742";
                        ctx.fillRect(tx + 2, ty + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else if (tile === 2) { // Spike
                        ctx.fillStyle = "#911212";
                        ctx.beginPath();
                        ctx.moveTo(tx, ty + TILE_SIZE);
                        ctx.lineTo(tx + TILE_SIZE / 2, ty + 6);
                        ctx.lineTo(tx + TILE_SIZE, ty + TILE_SIZE);
                        ctx.fill();
                    } else if (tile === 3) { // Crumble floor
                        ctx.fillStyle = "#c27d00";
                        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = "#523500";
                        ctx.strokeRect(tx + 1, ty + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                    } else if (tile === 5) { // Key
                        ctx.fillStyle = "#ffd700";
                        ctx.fillRect(tx + 8, ty + 8, 14, 14);
                    }
                }
            }

            // Draw Exit Door
            ctx.fillStyle = "#000";
            ctx.fillRect(doorPos.x + 4, doorPos.y + 2, 22, 28);
            ctx.fillStyle = "#38b000";
            ctx.fillRect(doorPos.x + 6, doorPos.y + 4, 18, 26);

            // Draw Devil Player
            ctx.fillStyle = "#523500";
            ctx.fillRect(player.x, player.y, player.w, player.h);
            // Player Horns
            ctx.fillStyle = "#d11a1a";
            ctx.fillRect(player.x + 2, player.y - 4, 4, 4);
            ctx.fillRect(player.x + 14, player.y - 4, 4, 4);
            // Eyes
            ctx.fillStyle = "#fff";
            ctx.fillRect(player.x + 4, player.y + 5, 4, 4);
            ctx.fillRect(player.x + 12, player.y + 5, 4, 4);
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Initialize Level 1
        initLevel(0);
        gameLoop();
    </script>
</body>
</html>

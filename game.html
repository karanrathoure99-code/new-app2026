<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - True Maze Trophy Hunt</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #1a0f00;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .arcade-cabinet {
            position: relative;
            background: #d4a373;
            border-radius: 14px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.6);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 620px;
            width: 100%;
            height: 95vh;
            max-height: 550px;
            border: 2px solid #523500;
        }

        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #faedcd;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #523500;
            box-shadow: 0 3px 0px #bc6c25;
        }

        .hud-tools {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #bc6c25;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #854d0e;
        }

        /* Puzzle Chamber */
        .puzzle-chamber {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #fefae0;
            border-radius: 10px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Maze Walls (भूल-भुलैया की ठोस दीवारें) */
        .maze-wall {
            position: absolute;
            background: #523500;
            border-radius: 2px;
            box-shadow: 0 2px 0px #2b1c00;
        }

        /* Character (छोटा डमी जो भूल-भुलैया के अंदर चलेगा) */
        .dummy-character {
            position: absolute;
            width: 12px;
            height: 16px;
            top: 15px;
            left: 15px;
            z-index: 10;
            transition: top 0.05s linear, left 0.05s linear;
        }

        .dummy-head {
            position: absolute;
            top: 0;
            left: 2px;
            width: 8px;
            height: 8px;
            background: #ffdbac;
            border-radius: 50%;
        }

        .dummy-body {
            position: absolute;
            top: 7px;
            left: 4px;
            width: 4px;
            height: 6px;
            background: #d90429;
            border-radius: 1px;
        }

        .dummy-leg-left, .dummy-leg-right {
            position: absolute;
            bottom: 0;
            width: 2px;
            height: 3px;
            background: #333;
        }
        .dummy-leg-left { left: 3px; }
        .dummy-leg-right { right: 3px; }

        /* Trophy (मंजिल - नीचे या दूसरे कोने पर) */
        .trophy-target {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 18px;
            z-index: 5;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .clue-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #d90429;
            color: #fff;
            font-weight: 700;
            font-size: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 20;
            text-align: center;
            width: calc(100% - 12px);
        }

        .bottom-action-bar {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
            padding: 0 4px;
        }

        .control-btn {
            background: #bc6c25;
            color: #fff;
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0px #854d0e;
            text-align: center;
        }

        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #854d0e;
        }

        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #faedcd;
            border: 2px solid #bc6c25;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 85%;
            max-width: 300px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .modal-btn {
            background: #bc6c25;
            color: #fff;
            padding: 8px 12px;
            font-size: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud-bar">
            <div>
                <span id="lvlLabel">LEVEL: TRUE MAZE</span>
                <span style="margin-left: 10px;" id="failsLabel">FAILS: 0</span>
            </div>
            <div class="hud-tools">
                <button class="hud-btn" onclick="resetGame()">🔄 RESTART</button>
            </div>
        </div>

        <!-- Puzzle Chamber -->
        <div class="puzzle-chamber" id="chamber">
            <div class="clue-box" id="msgBox">भूल-भुलैया के रास्तों से होते हुए 🏆 ट्रॉफी तक पहुँचो!</div>
            
            <!-- True Maze Walls (सटीक भूल-भुलैया की दीवारें जिनके बीच से रास्ता निकलेगा) -->
            <!-- Vertical & Horizontal Walls creating actual corridors -->
            <div class="maze-wall" style="width: 10px; height: 180px; top: 40px; left: 50px;" id="w1"></div>
            <div class="maze-wall" style="width: 180px; height: 10px; top: 120px; left: 50px;" id="w2"></div>
            <div class="maze-wall" style="width: 10px; height: 140px; top: 40px; left: 220px;" id="w3"></div>
            <div class="maze-wall" style="width: 130px; height: 10px; top: 170px; left: 220px;" id="w4"></div>
            <div class="maze-wall" style="width: 10px; height: 120px; bottom: 0; left: 340px;" id="w5"></div>

            <!-- Character (Start Top-Left) -->
            <div class="dummy-character" id="dummy">
                <div class="dummy-head"></div>
                <div class="dummy-body"></div>
                <div class="dummy-leg-left"></div>
                <div class="dummy-leg-right"></div>
            </div>

            <!-- Trophy (End Bottom-Right) -->
            <div class="trophy-target" id="trophy">🏆</div>
        </div>

        <!-- Controls -->
        <div class="bottom-action-bar">
            <div></div>
            <button class="control-btn" onclick="moveChar(0, -8)">⬆️ UP</button>
            <div></div>
            <button class="control-btn" onclick="moveChar(-8, 0)">⬅️ LEFT</button>
            <button class="control-btn" onclick="moveChar(0, 8)">⬇️ DOWN</button>
            <button class="control-btn" onclick="moveChar(8, 0)">➡️ RIGHT</button>
        </div>

        <!-- Modal -->
        <div class="popup-modal" id="winModal">
            <h2 id="modalTitle" style="color: #bc6c25; font-size: 12px; margin-bottom: 8px;">🎉 JEET GAYE!</h2>
            <p id="modalDesc" style="font-family: 'Chakra Petch'; font-size: 11px; margin-bottom: 10px; color: #523500;">ट्रॉफी मिल गई!</p>
            <button class="modal-btn" onclick="resetGame()">AGAIN 🔄</button>
        </div>
    </div>

    <script>
        let posX = 15;
        let posY = 15; // Top-left start
        let fails = 0;
        let isOver = false;

        const dummy = document.getElementById('dummy');
        const winModal = document.getElementById('winModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const failsLabel = document.getElementById('failsLabel');
        const msgBox = document.getElementById('msgBox');

        function moveChar(dx, dy) {
            if (isOver) return;

            posX += dx;
            posY += dy;

            // Screen Boundaries (चैंबर के अंदर ही रहे)
            posX = Math.max(5, Math.min(posX, document.getElementById('chamber').clientWidth - 20));
            posY = Math.max(5, Math.min(posY, document.getElementById('chamber').clientHeight - 20));

            dummy.style.left = posX + 'px';
            dummy.style.top = posY + 'px';

            checkCollisions();
        }

        function checkCollisions() {
            // Walls get bounding client rects for precise collision
            const dRect = dummy.getBoundingClientRect();
            const walls = document.querySelectorAll('.maze-wall');
            
            let hitWall = false;
            walls.forEach(wall => {
                const wRect = wall.getBoundingClientRect();
                if (!(dRect.right < wRect.left || 
                      dRect.left > wRect.right || 
                      dRect.bottom < wRect.top || 
                      dRect.top > wRect.bottom)) {
                    hitWall = true;
                }
            });

            if (hitWall) {
                triggerFail("दीवार से टकरा गए! भूल-भुलैया के अंदर संभल कर चलो।");
                return;
            }

            // Check Trophy (Bottom-right area)
            const tRect = document.getElementById('trophy').getBoundingClientRect();
            if (!(dRect.right < tRect.left || 
                  dRect.left > tRect.right || 
                  dRect.bottom < tRect.top || 
                  dRect.top > tRect.bottom)) {
                triggerWin();
            }
        }

        function triggerFail(reason) {
            if (isOver) return;
            isOver = true;
            fails++;
            failsLabel.innerText = "FAILS: " + fails;

            modalTitle.style.color = "#d90429";
            modalTitle.innerText = "💀 KHATAM! (FAIL)";
            modalDesc.innerText = reason + " ईगो हर्ट हुआ? दोबारा ट्राई करो!";
            winModal.style.display = "block";
        }

        function triggerWin() {
            if (isOver) return;
            isOver = true;
            modalTitle.style.color = "#38b000";
            modalTitle.innerText = "🏆 CHAMPION!";
            modalDesc.innerText = "शानदार! तुमने भूल-भुलैया के रास्तों को पार करके ट्रॉफी जीत ली!";
            winModal.style.display = "block";
        }

        function resetGame() {
            posX = 15;
            posY = 15;
            isOver = false;
            dummy.style.left = posX + 'px';
            dummy.style.top = posY + 'px';
            winModal.style.display = "none";
            msgBox.innerText = "भूल-भुलैया के रास्तों से होते हुए 🏆 ट्रॉफी तक पहुँचो!";
        }
    </script>
</body>
</html>

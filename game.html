<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - UI Sabotage</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        /* Arcade Frame */
        .arcade-cabinet {
            position: relative;
            background: #ffb356;
            border-radius: 14px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.45);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 620px;
            width: 100%;
            height: 95vh;
            max-height: 480px;
        }

        /* Top HUD Bar */
        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #523500;
            box-shadow: 0 3px 0px #523500;
        }

        .hud-tools {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #523500;
            color: #ffb356;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #3b2500;
        }

        .hud-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Active Puzzle Sandbox Chamber */
        .puzzle-chamber {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #ffe2b3;
            border-radius: 10px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Puzzle Interactive Objects */
        .devil-entity {
            width: 48px;
            height: 48px;
            background: #523500;
            color: #ffb356;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 0px #3b2500;
            position: absolute;
            transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            cursor: pointer;
            z-index: 10;
        }

        .target-gate {
            width: 54px;
            height: 64px;
            background: #2db300;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 18px;
            box-shadow: 0 4px 0px #186600;
            position: absolute;
            cursor: pointer;
            z-index: 5;
        }

        /* Status Text Box */
        .clue-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #ffa742;
            color: #523500;
            font-weight: 700;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 0px #523500;
            position: absolute;
            top: 10px;
            text-align: center;
        }

        /* Bottom Controls Bar */
        .bottom-action-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
        }

        .control-btn {
            background: #523500;
            color: #ffb356;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3b2500;
            touch-action: manipulation;
        }

        .control-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #3b2500;
        }

        .danger-btn {
            background: #8f1111;
            color: #fff;
            box-shadow: 0 4px 0px #540808;
        }

        /* Modals */
        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border-radius: 12px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.5);
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 85%;
            max-width: 360px;
        }

        .popup-modal h2 {
            font-size: 13px;
            margin-bottom: 10px;
        }

        .popup-modal p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 16px;
        }

        .modal-btn {
            background: #523500;
            color: #ffb356;
            padding: 10px 16px;
            font-size: 9px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 0px #3b2500;
            margin: 0 4px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud-bar">
            <div>
                <span id="lvlLabel">LVL: 1</span>
                <span style="margin-left: 10px;" id="failsLabel">FAILS: 0</span>
            </div>
            <div class="hud-tools">
                <button class="hud-btn" id="restartBtn" onclick="onRestartClick()">🔄 RESTART</button>
                <button class="hud-btn" onclick="goToLevels()">📜 LEVELS</button>
                <button class="hud-btn" onclick="toggleScreen()">⛶ FULL</button>
            </div>
        </div>

        <!-- The Room / Chamber -->
        <div class="puzzle-chamber" id="chamber">
            <div class="clue-box" id="clueText">Character ko jump karke Gate tak pahunchao!</div>
            <!-- Dynamic elements -->
            <div class="devil-entity" id="devil">😈</div>
            <div class="target-gate" id="gate">🚪</div>
        </div>

        <!-- Bottom Controller Bar -->
        <div class="bottom-action-bar">
            <button class="control-btn" id="leftBtn" onclick="triggerAction('left')">◀ LEFT</button>
            <button class="control-btn danger-btn" id="trollActionBtn" onclick="triggerAction('jump')">JUMP ⬆️</button>
            <button class="control-btn" id="rightBtn" onclick="triggerAction('right')">RIGHT ▶</button>
        </div>

        <!-- Popups -->
        <div class="popup-modal" id="failModal">
            <h2 style="color: #8f1111;">💀 OOPS!</h2>
            <p id="failDesc">Aap gir gaye!</p>
            <button class="modal-btn" onclick="reloadStage()">RETRY 🔄</button>
            <button class="modal-btn" onclick="goToLevels()">LEVELS 📜</button>
        </div>

        <div class="popup-modal" id="winModal">
            <h2 style="color: #116b0d;">🎉 LEVEL CLEARED!</h2>
            <p id="winDesc">आपने गेट तक पहुंचा दिया!</p>
            <button class="modal-btn" onclick="reloadStage()">PLAY AGAIN 🔄</button>
            <button class="modal-btn" onclick="goToLevels()">LEVELS 📜</button>
        </div>
    </div>

    <script>
        // Fullscreen & Orientation Lock
        async function toggleScreen() {
            const el = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }
        window.addEventListener('click', toggleScreen, { once: true });
        window.addEventListener('touchstart', toggleScreen, { once: true });

        const chamber = document.getElementById('chamber');
        const devil = document.getElementById('devil');
        const gate = document.getElementById('gate');
        const clueText = document.getElementById('clueText');
        const lvlLabel = document.getElementById('lvlLabel');
        const failsLabel = document.getElementById('failsLabel');
        const failModal = document.getElementById('failModal');
        const winModal = document.getElementById('winModal');
        const failDesc = document.getElementById('failDesc');
        const trollActionBtn = document.getElementById('trollActionBtn');

        let curLvl = 1;
        let failCount = 0;
        let isStageOver = false;

        // Sirf Level 1 टेस्टिंग के लिए
        const levels = [
            {
                id: 1,
                name: "JUMP TO THE GATE",
                clue: "Character ko jump karake upar-dahine gate tak le jao!",
                init: () => {
                    // कैरेक्टर सबसे नीचे (Bottom)
                    devil.style.left = "40px";
                    devil.style.bottom = "20px";
                    devil.style.top = "auto";
                    
                    // गेट सबसे ऊपर, दाहिने कोने (Top Right Corner) में[cite: 1]
                    gate.style.right = "20px";
                    gate.style.top = "50px";
                    gate.style.left = "auto";
                    
                    trollActionBtn.innerText = "JUMP ⬆️";
                },
                onAction: (act) => {
                    let curLeft = parseInt(devil.style.left) || 40;
                    let curBottom = parseInt(devil.style.bottom) || 20;

                    if (act === 'right') {
                        devil.style.left = Math.min(curLeft + 30, 320) + "px";
                    } else if (act === 'left') {
                        devil.style.left = Math.max(curLeft - 30, 20) + "px";
                    } else if (act === 'jump') {
                        // जंप करने पर कैरेक्टर ऊपर जाएगा
                        devil.style.bottom = (curBottom + 80) + "px";
                        setTimeout(() => {
                            if (!isStageOver) {
                                // चेक करें कि क्या कैरेक्टर गेट के पास पहुँच गया है
                                let finalLeft = parseInt(devil.style.left) || 40;
                                let finalBottom = parseInt(devil.style.bottom) || 20;
                                if (finalLeft >= 240 && finalBottom >= 80) {
                                    triggerWin();
                                } else {
                                    // वापस नीचे गिरना
                                    devil.style.bottom = "20px";
                                }
                            }
                        }, 400);
                    }
                }
            }
        ];

        function loadStage(lvlNum) {
            curLvl = lvlNum;
            isStageOver = false;
            lvlLabel.innerText = "LVL: " + curLvl;
            failModal.style.display = "none";
            winModal.style.display = "none";

            let stage = levels[0];
            clueText.innerText = stage.clue;
            stage.init();
        }

        window.triggerAction = function(act) {
            if (isStageOver) return;
            levels[0].onAction(act);
        };

        window.onRestartClick = function() {
            reloadStage();
        };

        function triggerFail(msg) {
            if (isStageOver) return;
            isStageOver = true;
            failCount++;
            failsLabel.innerText = "FAILS: " + failCount;
            failDesc.innerText = msg;
            failModal.style.display = "block";
        }

        function triggerWin() {
            if (isStageOver) return;
            isStageOver = true;
            winModal.style.display = "block";
        }

        window.reloadStage = () => loadStage(1);
        window.goToLevels = () => { window.location.href = "level.html"; };

        loadStage(1);
    </script>
</body>
</html>

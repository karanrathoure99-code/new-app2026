<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Red Light Lie - Auto-pilot Trap</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090c10;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .hud {
      text-align: center;
      margin-bottom: 12px;
      max-width: 520px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f0f6fc;
    }
    .rule-box {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.4;
      background: #161b22;
      border: 1px solid #30363d;
      padding: 8px 14px;
      border-radius: 6px;
      color: #8b949e;
    }
    .rule-box b {
      color: #ff7b72;
    }

    .eye-scanner {
      margin: 14px 0 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .eye-lens {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #21262d;
      border: 4px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      transition: background 0.1s, box-shadow 0.1s, border-color 0.1s;
    }
    .eye-lens.green {
      background: #238636;
      border-color: #3fb950;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(63, 185, 80, 0.7);
    }
    .eye-lens.red {
      background: #da3633;
      border-color: #f85149;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(248, 81, 73, 0.7);
    }
    .eye-mode {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      height: 16px;
    }

    .canvas-container {
      border: 2px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .fail-card {
      margin-top: 14px;
      width: 520px;
      padding: 12px 16px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      text-align: center;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .fail-card .title-msg {
      font-size: 14px;
      font-weight: 800;
    }
    .fail-card .desc-msg {
      font-size: 12px;
      color: #8b949e;
      margin-top: 3px;
    }

    .controls-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #6e7681;
    }
    .restart-btn {
      margin-top: 10px;
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 22px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .restart-btn:hover {
      background: #30363d;
      color: #f0f6fc;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="title">THE EYE IS A LIAR</div>
    <div class="rule-box">
      Standard: <b>GREEN = RUN</b> | <b>RED = STOP</b><br />
      If Eye flashes <b>"LIAR MODE"</b>: Rules REVERSE! (Red = Run, Green = Stop)
    </div>
  </div>

  <div class="eye-scanner">
    <div class="eye-lens" id="eyeLens">WAIT</div>
    <div class="eye-mode" id="eyeModeText" style="color: #8b949e;">INITIALIZING...</div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="520" height="150"></canvas>
  </div>

  <div class="fail-card" id="failCard">
    <div class="title-msg" id="failTitle" style="color: #58a6ff;">READY</div>
    <div class="fail-desc" id="failDesc">Hold RIGHT ARROW or D to sprint towards the exit.</div>
  </div>

  <div class="controls-hint">Hold [→] or [D] to move | Release to freeze | [R] to retry</div>
  <button class="restart-btn" onclick="initGame()">Instant Restart [R]</button>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const eyeLens = document.getElementById("eyeLens");
    const eyeModeText = document.getElementById("eyeModeText");
    const failTitle = document.getElementById("failTitle");
    const failDesc = document.getElementById("failDesc");

    let player = { x: 30, y: 85, w: 22, h: 22, speed: 2.2 };
    const goalX = 470;

    // States: 'GREEN' or 'RED'
    let currentSignal = 'GREEN';
    let isLiarMode = false;
    let cycleTimer = 0;
    let switchInterval = 140; // frames before changing signal

    let keys = {};
    let gameOver = false;
    let gameWon = false;

    function initGame() {
      player.x = 30;
      currentSignal = 'GREEN';
      isLiarMode = false;
      cycleTimer = 0;
      gameOver = false;
      gameWon = false;

      failTitle.textContent = "CORRIDOR ACTIVE";
      failTitle.style.color = "#58a6ff";
      failDesc.textContent = "Keep your eyes on the scanner. Trust logic, not reflex.";

      updateEyeVisuals();
    }

    function updateEyeVisuals() {
      eyeLens.className = "eye-lens " + (currentSignal === 'GREEN' ? 'green' : 'red');
      eyeLens.textContent = currentSignal;

      if (isLiarMode) {
        eyeModeText.textContent = "⚠️️ LIAR MODE ACTIVE ⚠️";
        eyeModeText.style.color = "#ff7b72";
      } else {
        eyeModeText.textContent = "HONEST SCAN";
        eyeModeText.style.color = "#3fb950";
      }
    }

    function switchSignal() {
      // Toggle signal
      currentSignal = currentSignal === 'GREEN' ? 'RED' : 'GREEN';

      // Near the exit, increase chances of Liar Mode to bait reflex failure
      const distanceRatio = player.x / goalX;
      if (distanceRatio > 0.45) {
        isLiarMode = Math.random() < 0.65; // High chance of deceit near the gate
      } else {
        isLiarMode = Math.random() < 0.2;
      }

      // Faster switches as player gets closer
      switchInterval = Math.max(75, 130 - Math.floor(distanceRatio * 60));
      updateEyeVisuals();
    }

    function checkFailure(isMoving) {
      // Under honest mode: moving during RED or stopping during GREEN (floor drops)
      // Under Liar mode: rules flipped!
      let mustBeMoving = false;

      if (!isLiarMode) {
        mustBeMoving = (currentSignal === 'GREEN');
      } else {
        mustBeMoving = (currentSignal === 'RED');
      }

      // 1. Moving when you were supposed to freeze
      if (isMoving && !mustBeMoving) {
        gameOver = true;
        if (!isLiarMode) {
          failTitle.textContent = "BLOWN TO PIECES (IMPULSIVE)";
          failDesc.textContent = "Scanner was RED (Honest). Your muscle memory pushed forward without thinking.";
        } else {
          failTitle.textContent = "FELL FOR THE LIE (AUTO-PILOT)";
          failDesc.textContent = "Scanner showed GREEN, but LIAR MODE was ON! Green meant FREEZE. You moved anyway.";
        }
        failTitle.style.color = "#f85149";
      }

      // 2. Frozen when you were supposed to move (Floor collapses if standing still too long)
      if (!isMoving && mustBeMoving) {
        // give 40 frames grace window before crushing
        if (cycleTimer > 35) {
          gameOver = true;
          if (isLiarMode) {
            failTitle.textContent = "FROZE ON RED LIKE A STATUE";
            failDesc.textContent = "Liar Mode was ON! Red meant RUN, but your reflex made you freeze in fear.";
          } else {
            failTitle.textContent = "TOO SLOW";
            failDesc.textContent = "Green signal was clear. Hesitation caught you.";
          }
          failTitle.style.color = "#f85149";
        }
      }
    }

    function update() {
      if (gameOver || gameWon) return;

      cycleTimer++;
      if (cycleTimer >= switchInterval) {
        cycleTimer = 0;
        switchSignal();
      }

      let isMoving = false;
      if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
        player.x += player.speed;
        isMoving = true;
      }

      // Boundary
      player.x = Math.max(20, Math.min(canvas.width - player.w - 15, player.x));

      // Real-time compliance check
      checkFailure(isMoving);

      // Check Exit reached
      if (player.x + player.w >= goalX) {
        gameWon = true;
        failTitle.textContent = "EXIT BREACHED (BRAIN OVER HABIT)";
        failTitle.style.color = "#2ea043";
        failDesc.textContent = "You conquered your subconscious muscle memory. Exceptional discipline!";
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Floor & Wall Track
      ctx.fillStyle = "#161b22";
      ctx.fillRect(0, 110, canvas.width, 40);

      // Exit Door
      ctx.fillStyle = gameWon ? "#2ea043" : "#238636";
      ctx.fillRect(goalX, 60, 24, 50);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 10px sans-serif";
      ctx.fillText("EXIT", goalX + 1, 52);

      // Distance Markers on Floor
      ctx.fillStyle = "#21262d";
      for (let x = 60; x < goalX; x += 60) {
        ctx.fillRect(x, 115, 2, 20);
      }

      // Player
      ctx.fillStyle = gameOver ? "#da3633" : (gameWon ? "#3fb950" : "#58a6ff");
      ctx.fillRect(player.x, player.y, player.w, player.h);

      // Laser grid line above
      ctx.strokeStyle = currentSignal === 'GREEN' ? "rgba(63, 185, 80, 0.25)" : "rgba(248, 81, 73, 0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 45);
      ctx.lineTo(canvas.width, 45);
      ctx.stroke();

      requestAnimationFrame(() => {
        update();
        draw();
      });
    }

    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      if (e.key === "r" || e.key === "R") initGame();
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    initGame();
    draw();
  </script>
</body>
</html>

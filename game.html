<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ego Trap - 10 Steps Puzzle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f111a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .hud {
      text-align: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .rules {
      font-size: 14px;
      color: #9aa0a6;
      margin-bottom: 12px;
    }
    .counter-box {
      font-size: 20px;
      font-weight: bold;
      background: #1a1e2e;
      border: 1px solid #2e354f;
      padding: 8px 18px;
      border-radius: 8px;
      display: inline-block;
      color: #64b5f6;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 65px);
      grid-template-rows: repeat(5, 65px);
      gap: 8px;
      background: #171b26;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      background: #252c3d;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #8892b0;
    }
    .tile.valid-move:hover {
      background: #36415d;
      transform: scale(1.05);
    }
    .tile.player {
      background: #2196f3 !important;
      color: white;
      box-shadow: 0 0 15px rgba(33, 150, 243, 0.6);
    }
    .tile.burned {
      background: #3b1d28 !important;
      border: 1px dashed #d32f2f;
      cursor: not-allowed;
    }
    .tile.goal {
      border: 2px solid #00e676;
      color: #00e676;
    }
    .tile.coin {
      background: #332b1a;
      border: 1px solid #ffd54f;
      color: #ffd54f;
    }
    .status-msg {
      margin-top: 18px;
      height: 24px;
      font-weight: 600;
      font-size: 15px;
    }
    .restart-btn {
      margin-top: 14px;
      background: #2e384d;
      color: #fff;
      border: none;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .restart-btn:hover {
      background: #3f4d6b;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="title">THE ETIQUETTE LOCK</div>
    <div class="rules">Reach Exit [E] in <b>EXACTLY 10 STEPS</b>. Don't step on visited tiles.</div>
    <div class="counter-box">
      Steps: <span id="step-count">0</span> / 10
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="status-msg" id="status-msg"></div>
  <button class="restart-btn" onclick="initGame()">Restart Level (Press R)</button>

  <script>
    const GRID_SIZE = 5;
    const TARGET_STEPS = 10;
    const START_POS = { r: 0, c: 0 };
    const GOAL_POS = { r: 4, c: 4 };
    const COIN_POS = { r: 1, c: 3 }; // Greed bait

    let playerPos = { ...START_POS };
    let steps = 0;
    let visited = new Set();
    let gameOver = false;

    const gridEl = document.getElementById("grid");
    const stepCountEl = document.getElementById("step-count");
    const statusMsgEl = document.getElementById("status-msg");

    function coordKey(r, c) {
      return `${r},${c}`;
    }

    function initGame() {
      playerPos = { ...START_POS };
      steps = 0;
      visited = new Set();
      visited.add(coordKey(START_POS.r, START_POS.c));
      gameOver = false;
      statusMsgEl.textContent = "";
      statusMsgEl.style.color = "#e0e0e0";
      stepCountEl.textContent = steps;
      renderGrid();
    }

    function isAdjacent(r1, c1, r2, c2) {
      const dr = Math.abs(r1 - r2);
      const dc = Math.abs(c1 - c2);
      return (dr === 1 && dc === 0) || (dr === 0 && dc === 1);
    }

    function checkDeadlock() {
      // Check if player has any adjacent unvisited tile left
      const neighbors = [
        { r: playerPos.r + 1, c: playerPos.c },
        { r: playerPos.r - 1, c: playerPos.c },
        { r: playerPos.r, c: playerPos.c + 1 },
        { r: playerPos.r, c: playerPos.c - 1 }
      ];

      const movesLeft = neighbors.some(n => 
        n.r >= 0 && n.r < GRID_SIZE && 
        n.c >= 0 && n.c < GRID_SIZE && 
        !visited.has(coordKey(n.r, n.c))
      );

      return !movesLeft;
    }

    function onTileClick(r, c) {
      if (gameOver) return;

      const key = coordKey(r, c);

      // Rule: Must be adjacent and not already visited
      if (!isAdjacent(playerPos.r, playerPos.c, r, c)) {
        return;
      }

      if (visited.has(key)) {
        statusMsgEl.textContent = "Tile already broken! Can't step here.";
        statusMsgEl.style.color = "#ff5252";
        return;
      }

      // Valid move
      steps++;
      playerPos = { r, c };
      visited.add(key);
      stepCountEl.textContent = steps;

      // Win / Loss evaluation
      if (r === GOAL_POS.r && c === GOAL_POS.c) {
        gameOver = true;
        if (steps === TARGET_STEPS) {
          statusMsgEl.textContent = "Perfect! Door Unlocked.";
          statusMsgEl.style.color = "#00e676";
        } else {
          statusMsgEl.textContent = `Door locked! Exactly ${TARGET_STEPS} steps needed (You took ${steps}).`;
          statusMsgEl.style.color = "#ff5252";
        }
      } else if (steps > TARGET_STEPS) {
        gameOver = true;
        statusMsgEl.textContent = `Overstepped! Limit was ${TARGET_STEPS} steps.`;
        statusMsgEl.style.color = "#ff5252";
      } else if (checkDeadlock()) {
        gameOver = true;
        statusMsgEl.textContent = "Trapped in your own footsteps! No way out.";
        statusMsgEl.style.color = "#ff5252";
      }

      renderGrid();
    }

    function renderGrid() {
      gridEl.innerHTML = "";
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const tile = document.createElement("div");
          tile.classList.add("tile");
          const key = coordKey(r, c);

          const isPlayer = r === playerPos.r && c === playerPos.c;
          const isGoal = r === GOAL_POS.r && c === GOAL_POS.c;
          const isCoin = r === COIN_POS.r && c === COIN_POS.c;
          const isBurned = visited.has(key) && !isPlayer;
          const canMove = !gameOver && isAdjacent(playerPos.r, playerPos.c, r, c) && !visited.has(key);

          if (isPlayer) {
            tile.classList.add("player");
            tile.textContent = "P";
          } else if (isBurned) {
            tile.classList.add("burned");
            tile.textContent = "✕";
          } else if (isGoal) {
            tile.classList.add("goal");
            tile.textContent = "EXIT";
          } else if (isCoin) {
            tile.classList.add("coin");
            tile.textContent = "★";
          }

          if (canMove) {
            tile.classList.add("valid-move");
          }

          tile.addEventListener("click", () => onTileClick(r, c));
          gridEl.appendChild(tile);
        }
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "r" || e.key === "R") {
        initGame();
        return;
      }

      // Arrow keys navigation
      let targetR = playerPos.r;
      let targetC = playerPos.c;

      if (e.key === "ArrowUp") targetR--;
      else if (e.key === "ArrowDown") targetR++;
      else if (e.key === "ArrowLeft") targetC--;
      else if (e.key === "ArrowRight") targetC++;
      else return;

      if (targetR >= 0 && targetR < GRID_SIZE && targetC >= 0 && targetC < GRID_SIZE) {
        onTileClick(targetR, targetC);
      }
    });

    initGame();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - UI Sabotage</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        /* Arcade Frame */
        .arcade-cabinet {
            position: relative;
            background: #ffb356;
            border-radius: 14px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.45);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 620px;
            width: 100%;
            height: 95vh;
            max-height: 480px;
        }

        /* Top HUD Bar */
        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #523500;
            box-shadow: 0 3px 0px #523500;
        }

        .hud-tools {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #523500;
            color: #ffb356;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #3b2500;
        }

        .hud-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Active Puzzle Sandbox Chamber */
        .puzzle-chamber {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #ffe2b3;
            border-radius: 10px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Puzzle Interactive Objects */
        .devil-entity {
            width: 48px;
            height: 48px;
            background: #523500;
            color: #ffb356;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 0px #3b2500;
            position: absolute;
            transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            cursor: pointer;
            z-index: 10;
        }

        .target-gate {
            width: 54px;
            height: 64px;
            background: #2db300;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 18px;
            box-shadow: 0 4px 0px #186600;
            position: absolute;
            cursor: pointer;
            z-index: 5;
        }

        .troll-block {
            background: #ffa742;
            color: #523500;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 0px #523500;
            font-size: 11px;
            position: absolute;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .troll-block:active {
            transform: scale(0.95);
        }

        /* Status Text Box */
        .clue-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #ffa742;
            color: #523500;
            font-weight: 700;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 0px #523500;
            position: absolute;
            top: 10px;
            text-align: center;
        }

        /* Bottom Controls Bar */
        .bottom-action-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
        }

        .control-btn {
            background: #523500;
            color: #ffb356;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3b2500;
            touch-action: manipulation;
        }

        .control-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #3b2500;
        }

        .danger-btn {
            background: #8f1111;
            color: #fff;
            box-shadow: 0 4px 0px #540808;
        }

        /* Modals */
        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border-radius: 12px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.5);
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 85%;
            max-width: 360px;
        }

        .popup-modal h2 {
            font-size: 13px;
            margin-bottom: 10px;
        }

        .popup-modal p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 16px;
        }

        .modal-btn {
            background: #523500;
            color: #ffb356;
            padding: 10px 16px;
            font-size: 9px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 0px #3b2500;
            margin: 0 4px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud-bar">
            <div>
                <span id="lvlLabel">LVL: 1</span>
                <span style="margin-left: 10px;" id="failsLabel">FAILS: 0</span>
            </div>
            <div class="hud-tools">
                <button class="hud-btn" id="restartBtn" onclick="onRestartClick()">🔄 RESTART</button>
                <button class="hud-btn" onclick="goToLevels()">📜 LEVELS</button>
                <button class="hud-btn" onclick="toggleScreen()">⛶ FULL</button>
            </div>
        </div>

        <!-- The Room / Chamber -->
        <div class="puzzle-chamber" id="chamber">
            <div class="clue-box" id="clueText">Devil ko Gate tak pahunchao!</div>
            <!-- Dynamic elements spawn here -->
            <div class="devil-entity" id="devil">😈</div>
            <div class="target-gate" id="gate">🚪</div>
        </div>

        <!-- Bottom Controller Bar -->
        <div class="bottom-action-bar">
            <button class="control-btn" id="leftBtn" onclick="triggerAction('left')">◀ PUSH</button>
            <button class="control-btn danger-btn" id="trollActionBtn" onclick="triggerAction('special')">DO NOT TOUCH ⚡</button>
            <button class="control-btn" id="rightBtn" onclick="triggerAction('right')">PULL ▶</button>
        </div>

        <!-- Popups -->
        <div class="popup-modal" id="failModal">
            <h2 style="color: #8f1111;">💀 TROLLED!</h2>
            <p id="failDesc">Trap mein phas gaye!</p>
            <button class="modal-btn" onclick="reloadStage()">RETRY 🔄</button>
            <button class="modal-btn" onclick="goToLevels()">LEVELS 📜</button>
        </div>

        <div class="popup-modal" id="winModal">
            <h2 style="color: #116b0d;">🎉 LEVEL CLEARED!</h2>
            <p id="winDesc">Dimaag tez nikla aapka!</p>
            <button class="modal-btn" onclick="nextStage()">NEXT ➡️</button>
            <button class="modal-btn" onclick="goToLevels()">LEVELS 📜</button>
        </div>
    </div>

    <script>
        // Fullscreen & Orientation Lock
        async function toggleScreen() {
            const el = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }
        window.addEventListener('click', toggleScreen, { once: true });
        window.addEventListener('touchstart', toggleScreen, { once: true });

        const chamber = document.getElementById('chamber');
        const devil = document.getElementById('devil');
        const gate = document.getElementById('gate');
        const clueText = document.getElementById('clueText');
        const lvlLabel = document.getElementById('lvlLabel');
        const failsLabel = document.getElementById('failsLabel');
        const failModal = document.getElementById('failModal');
        const winModal = document.getElementById('winModal');
        const failDesc = document.getElementById('failDesc');
        const trollActionBtn = document.getElementById('trollActionBtn');

        let curLvl = 1;
        let failCount = 0;
        let isStageOver = false;

        // Custom Never-Seen-Before Levels Logic
        const levels = [
            {
                id: 1,
                name: "THE REVERSED PULL",
                clue: "Door tak seedha nahi ja sakte!",
                init: () => {
                    devil.style.left = "40px";
                    devil.style.top = "120px";
                    gate.style.left = "80%";
                    gate.style.top = "110px";
                    trollActionBtn.innerText = "DO NOT TOUCH ⚡";
                },
                onAction: (act) => {
                    let curLeft = parseInt(devil.style.left) || 40;
                    if (act === 'right') {
                        // Troll: Pushing right throws him left!
                        devil.style.left = (curLeft - 30) + "px";
                        if (curLeft <= 20) triggerFail("Peeche wall se takra kar crush ho gaye!");
                    } else if (act === 'left') {
                        // Pulling left actually pushes right
                        devil.style.left = (curLeft + 60) + "px";
                        if (parseInt(devil.style.left) >= 320) triggerWin();
                    } else if (act === 'special') {
                        triggerFail("Likhha tha na: DO NOT TOUCH!");
                    }
                }
            },
            {
                id: 2,
                name: "THE ESCAPE BUTTON",
                clue: "Gate ko rok kar dikhao!",
                init: () => {
                    devil.style.left = "40px";
                    devil.style.top = "120px";
                    gate.style.left = "75%";
                    gate.style.top = "110px";
                    trollActionBtn.innerText = "FREEZE TIME ❄️";
                },
                onAction: (act) => {
                    if (act === 'right') {
                        let curLeft = parseInt(devil.style.left) || 40;
                        devil.style.left = (curLeft + 40) + "px";
                        // Gate bhaagta hai
                        let gLeft = parseInt(gate.style.left) || 75;
                        gate.style.left = "20px";
                        triggerFail("Gate aapke peeche bhaag gaya!");
                    } else if (act === 'special') {
                        // Freeze gate
                        gate.style.background = "#0088cc";
                        gate.innerText = "🧊";
                        clueText.innerText = "Gate jam chuka hai! Ab aage badho!";
                        trollActionBtn.onclick = null;
                        devil.style.left = "75%";
                        setTimeout(triggerWin, 400);
                    }
                }
            },
            {
                id: 3,
                name: "RESTART IS THE KEY",
                clue: "Koi rasta nahi bacha? Restart karo!",
                init: () => {
                    devil.style.left = "40px";
                    devil.style.top = "120px";
                    gate.style.display = "none"; // Gate invisible hai
                    trollActionBtn.innerText = "SUICIDE 💀";
                },
                onAction: (act) => {
                    if (act === 'special' || act === 'left' || act === 'right') {
                        triggerFail("Galat button! Kuch alag socho!");
                    }
                },
                onRestart: () => {
                    // Troll secret: Top Restart button dabane se gate spawn hoga!
                    gate.style.display = "flex";
                    gate.style.left = "50%";
                    gate.style.top = "110px";
                    devil.style.left = "50%";
                    setTimeout(triggerWin, 300);
                    return true; // Cancel normal restart
                }
            },
            {
                id: 4,
                name: "DRAG THE UNTOUCHABLE",
                clue: "Devil ko haath lagao aur chalao!",
                init: () => {
                    devil.style.left = "30px";
                    devil.style.top = "120px";
                    gate.style.left = "78%";
                    gate.style.top = "120px";
                    gate.style.display = "flex";
                    trollActionBtn.innerText = "TELEPORT 🌀";

                    // Drag mechanics
                    devil.onpointerdown = (e) => {
                        devil.style.left = "78%";
                        setTimeout(triggerWin, 350);
                    };
                },
                onAction: (act) => {
                    if (act === 'special') triggerFail("Teleport fail ho gaya!");
                }
            },
            {
                id: 5,
                name: "THE HUD HIJACK",
                clue: "Target screen ke bahar hai!",
                init: () => {
                    devil.style.left = "40px";
                    devil.style.top = "120px";
                    gate.style.display = "none";
                    clueText.innerText = "Top HUD mein 'LEVELS' button hi asli Gate hai!";
                    
                    // Top Levels button becomes target
                    const lvlBtn = document.querySelector('.hud-tools button:nth-child(2)');
                    lvlBtn.style.background = "#2db300";
                    lvlBtn.onclick = (e) => {
                        e.preventDefault();
                        triggerWin();
                    };
                },
                onAction: () => {
                    triggerFail("Chamber ke andar dhoondhna bekaar hai!");
                }
            }
        ];

        function loadStage(lvlNum) {
            curLvl = lvlNum;
            isStageOver = false;
            lvlLabel.innerText = "LVL: " + curLvl;
            failModal.style.display = "none";
            winModal.style.display = "none";

            devil.onpointerdown = null;
            const lvlBtn = document.querySelector('.hud-tools button:nth-child(2)');
            lvlBtn.style.background = "#523500";
            lvlBtn.onclick = goToLevels;

            let stage = levels[curLvl - 1];
            clueText.innerText = stage.clue;
            stage.init();
        }

        window.triggerAction = function(act) {
            if (isStageOver) return;
            levels[curLvl - 1].onAction(act);
        };

        window.onRestartClick = function() {
            if (levels[curLvl - 1].onRestart) {
                let handled = levels[curLvl - 1].onRestart();
                if (handled) return;
            }
            reloadStage();
        };

        function triggerFail(msg) {
            if (isStageOver) return;
            isStageOver = true;
            failCount++;
            failsLabel.innerText = "FAILS: " + failCount;
            failDesc.innerText = msg;
            failModal.style.display = "block";
        }

        function triggerWin() {
            if (isStageOver) return;
            isStageOver = true;
            winModal.style.display = "block";
        }

        window.reloadStage = () => loadStage(curLvl);
        window.nextStage = () => {
            if (curLvl < levels.length) loadStage(curLvl + 1);
            else { alert("LEGEND! Saare Out-of-the-Box levels khatam!"); goToLevels(); }
        };
        window.goToLevels = () => { window.location.href = "level.html"; };

        loadStage(1);
    </script>
</body>
</html>

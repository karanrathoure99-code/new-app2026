<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤪 Z PAJAL - Level Devil Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Aapke theme ke exact colors */
      --bg-outer: #916000;
      --corridor-bg: #ffb356;
      --player-color: #000000;
      --door-fill: #cbd5e1;
      --trap-spike: #b91c1c;
      --btn-dark: #221400;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Press Start 2P', monospace;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-outer);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 10px;
    }

    .top-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 0 10px;
    }

    /* Level Devil Style Buttons & Badges (Clean, no outline, solid 3D click feel) */
    .level-badge {
      background: #523500;
      color: #ffb356;
      font-size: 11px;
      padding: 10px 18px;
      border-radius: 4px;
      border: none;
      outline: none;
      box-shadow: 0 4px 0 #332000;
      letter-spacing: 1px;
    }

    .home-btn {
      background: #ffb356;
      color: #523500;
      font-size: 10px;
      padding: 10px 16px;
      border-radius: 4px;
      border: none;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #cc8430;
      transition: all 0.08s ease;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
    }

    .home-btn:hover {
      background: #ffbe6b;
    }

    .home-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #cc8430;
    }

    #gameCanvas {
      background-color: var(--bg-outer);
      image-rendering: pixelated;
      display: block;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="level-badge" id="levelDisplay">LEVEL 1 / 50</div>
    <a href="home.html" class="home-btn">🏠 HOME</a>
  </div>

  <canvas id="gameCanvas" width="900" height="380"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('levelDisplay');

    // Corridor Play Area
    const corridor = {
      x: 50,
      y: 130,
      width: 800,
      height: 120
    };

    const STORAGE_KEY = 'saveLevel_TumseNaHoPayga';
    let currentSavedLevel = parseInt(localStorage.getItem(STORAGE_KEY)) || 1;
    let currentLevelIdx = currentSavedLevel - 1;
    let deathFlashTimer = 0;

    // 50 Levels Trap Roadmap
    const levels = [];
    for (let i = 1; i <= 50; i++) {
      let lvl = {
        id: i,
        playerStart: { x: 100 },
        door: { x: 740, behavior: 'none' },
        pits: [],
        spikes: [],
        invert: false
      };

      if (i % 5 === 1) {
        lvl.pits.push({ x: 560, width: 70, triggerX: 450, opened: false });
      } else if (i % 5 === 2) {
        lvl.door.behavior = 'jump_away';
        lvl.door.triggerDist = 120;
        lvl.door.jumped = false;
      } else if (i % 5 === 3) {
        lvl.spikes.push({ x: 480, width: 45, height: 20, triggerX: 380, active: false });
        lvl.pits.push({ x: 620, width: 60, triggerX: 520, opened: false });
      } else if (i % 5 === 4) {
        lvl.invert = true;
        lvl.pits.push({ x: 420, width: 65, triggerX: 300, opened: false });
      } else if (i % 5 === 0) {
        lvl.door.behavior = 'teleport';
        lvl.door.triggerDist = 95;
        lvl.door.teleported = false;
        lvl.spikes.push({ x: 660, width: 40, height: 18, triggerX: 550, active: false });
      }

      levels.push(lvl);
    }

    // Player State
    const player = {
      x: 100,
      y: 0,
      width: 14,
      height: 28,
      vx: 0,
      vy: 0,
      speed: 3.6,
      jumpPower: -8.6,
      grounded: false
    };

    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    function playBeep(freq, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.1;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initLevel(idx) {
      if (idx >= levels.length) idx = 0;
      currentLevelIdx = idx;
      
      const lvl = levels[currentLevelIdx];
      levelDisplay.innerText = `LEVEL ${lvl.id} / 50`;
      
      localStorage.setItem(STORAGE_KEY, lvl.id);

      player.x = lvl.playerStart.x;
      player.y = corridor.y + corridor.height - player.height;
      player.vx = 0;
      player.vy = 0;

      lvl.pits.forEach(p => p.opened = false);
      lvl.spikes.forEach(s => s.active = false);
      if (lvl.door.behavior === 'jump_away') lvl.door.jumped = false;
      if (lvl.door.behavior === 'teleport') lvl.door.teleported = false;
    }

    function triggerDeath() {
      playBeep(180, 0.12);
      deathFlashTimer = 18;
      initLevel(currentLevelIdx);
    }

    // Flat Arch Door (No Outlines)
    function drawDoor(x, y, w, h) {
      ctx.fillStyle = '#523500';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + 10, w / 2, Math.PI, 0);
      ctx.rect(x, y + 10, w, h - 10);
      ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + 12, (w - 6) / 2, Math.PI, 0);
      ctx.rect(x + 3, y + 12, w - 6, h - 12);
      ctx.fill();
    }

    // Spikes (No Outlines)
    function drawSpikes(x, y, w, h) {
      ctx.fillStyle = '#b91c1c';
      const count = 3;
      const step = w / count;
      for (let i = 0; i < count; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * step, y);
        ctx.lineTo(x + (i + 0.5) * step, y - h);
        ctx.lineTo(x + (i + 1) * step, y);
        ctx.fill();
      }
    }

    function update() {
      const lvl = levels[currentLevelIdx];
      const floorY = corridor.y + corridor.height - player.height;

      // 1. Controls
      let move = 0;
      if (keys['ArrowRight'] || keys['KeyD']) move += 1;
      if (keys['ArrowLeft'] || keys['KeyA']) move -= 1;
      if (lvl.invert) move *= -1;

      player.vx = move * player.speed;

      if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
        playBeep(450, 0.05);
      }

      // 2. Physics
      player.vy += 0.42;
      player.x += player.vx;
      player.y += player.vy;

      if (player.x < corridor.x) player.x = corridor.x;

      // 3. Traps Trigger
      lvl.pits.forEach(p => {
        if (player.x > p.triggerX) p.opened = true;
      });

      lvl.spikes.forEach(s => {
        if (player.x > s.triggerX) s.active = true;
      });

      let doorX = lvl.door.x;
      if (lvl.door.behavior === 'jump_away' && Math.abs(player.x - lvl.door.x) < lvl.door.triggerDist) {
        lvl.door.jumped = true;
      }
      if (lvl.door.jumped) doorX = corridor.x + corridor.width - 45;

      if (lvl.door.behavior === 'teleport' && Math.abs(player.x - lvl.door.x) < lvl.door.triggerDist) {
        lvl.door.teleported = true;
      }
      if (lvl.door.teleported) doorX = corridor.x + 30;

      // 4. Collisions
      let fallingInPit = false;
      lvl.pits.forEach(p => {
        if (p.opened && (player.x + player.width > p.x && player.x < p.x + p.width)) {
          fallingInPit = true;
        }
      });

      if (!fallingInPit && player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.grounded = true;
      }

      // Spike Touch
      lvl.spikes.forEach(s => {
        if (s.active) {
          const sTop = corridor.y + corridor.height - s.height;
          if (player.x + player.width > s.x && player.x < s.x + s.width && player.y + player.height > sTop) {
            triggerDeath();
          }
        }
      });

      // Pit Death
      if (player.y > canvas.height + 50) {
        triggerDeath();
      }

      // Door Clear
      const doorY = corridor.y + corridor.height - 36;
      if (player.x + player.width > doorX && player.x < doorX + 32 && player.y + player.height >= doorY) {
        playBeep(700, 0.1);
        initLevel(currentLevelIdx + 1);
      }

      // ================= DRAW SCENE (Outline Free) =================
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Outer Background
      ctx.fillStyle = '#916000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Play Corridor (Flat, Clean - No Stroke)
      ctx.fillStyle = '#ffb356';
      ctx.fillRect(corridor.x, corridor.y, corridor.width, corridor.height);

      // 3. Pits (Direct color cut-in, no outlines)
      lvl.pits.forEach(p => {
        if (p.opened) {
          ctx.fillStyle = '#916000';
          ctx.fillRect(p.x, corridor.y + corridor.height - 18, p.width, 22);
        }
      });

      // 4. Spikes
      lvl.spikes.forEach(s => {
        if (s.active) {
          drawSpikes(s.x, corridor.y + corridor.height, s.width, s.height);
        }
      });

      // 5. Door
      drawDoor(doorX, corridor.y + corridor.height - 36, 32, 36);

      // 6. Player
      ctx.fillStyle = '#000000';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // 7. Death Flash
      if (deathFlashTimer > 0) {
        ctx.fillStyle = 'rgba(82, 53, 0, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        deathFlashTimer--;
      }

      requestAnimationFrame(update);
    }

    initLevel(currentLevelIdx);
    update();
  </script>
</body>
</html>

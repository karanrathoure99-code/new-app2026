<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Multi-Level Maze with Animations</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #1a0f00;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .arcade-cabinet {
            position: relative;
            background: #d4a373;
            border-radius: 14px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.6);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 620px;
            width: 100%;
            height: 95vh;
            max-height: 560px;
            border: 2px solid #523500;
        }

        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #faedcd;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #523500;
            box-shadow: 0 3px 0px #bc6c25;
        }

        .hud-tools {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #bc6c25;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #854d0e;
        }

        /* Puzzle Chamber */
        .puzzle-chamber {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #fefae0;
            border-radius: 10px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Maze Walls */
        .maze-wall {
            position: absolute;
            background: #523500;
            border-radius: 2px;
            box-shadow: 0 2px 0px #2b1c00;
        }

        /* Animated Character */
        .dummy-character {
            position: absolute;
            width: 14px;
            height: 22px;
            z-index: 10;
            transition: top 0.05s linear, left 0.05s linear;
        }

        .dummy-head {
            position: absolute;
            top: 0;
            left: 3px;
            width: 8px;
            height: 8px;
            background: #ffdbac;
            border-radius: 50%;
        }

        .dummy-body {
            position: absolute;
            top: 7px;
            left: 5px;
            width: 4px;
            height: 8px;
            background: #d90429;
            border-radius: 1px;
        }

        .dummy-arm-left, .dummy-arm-right {
            position: absolute;
            top: 8px;
            width: 5px;
            height: 2px;
            background: #523500;
            border-radius: 1px;
            transition: transform 0.1s ease;
        }
        .dummy-arm-left { left: 0px; transform-origin: right center; }
        .dummy-arm-right { right: 0px; transform-origin: left center; }

        .dummy-leg-left, .dummy-leg-right {
            position: absolute;
            bottom: 0;
            width: 2.5px;
            height: 7px;
            background: #333;
            border-radius: 1px;
            transition: transform 0.1s ease;
        }
        .dummy-leg-left { left: 3px; transform-origin: top center; }
        .dummy-leg-right { right: 3px; transform-origin: top center; }

        /* Walking Animation Classes */
        .walking-left .dummy-leg-left { transform: rotate(30deg); }
        .walking-left .dummy-leg-right { transform: rotate(-30deg); }
        .walking-right .dummy-leg-left { transform: rotate(-30deg); }
        .walking-right .dummy-leg-right { transform: rotate(30deg); }

        /* Jumping Animation Class */
        .jumping .dummy-arm-left { transform: rotate(-45deg); }
        .jumping .dummy-arm-right { transform: rotate(45deg); }
        .jumping .dummy-leg-left { transform: rotate(-20deg); }
        .jumping .dummy-leg-right { transform: rotate(20deg); }

        /* Trophy */
        .trophy-target {
            position: absolute;
            font-size: 18px;
            z-index: 5;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .clue-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #d90429;
            color: #fff;
            font-weight: 700;
            font-size: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 20;
            text-align: center;
            width: calc(100% - 12px);
        }

        .bottom-action-bar {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
            padding: 0 4px;
        }

        .control-btn {
            background: #bc6c25;
            color: #fff;
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0px #854d0e;
            text-align: center;
        }

        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #854d0e;
        }

        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #faedcd;
            border: 2px solid #bc6c25;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 85%;
            max-width: 300px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .modal-btn {
            background: #bc6c25;
            color: #fff;
            padding: 8px 12px;
            font-size: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud-bar">
            <div>
                <span id="lvlLabel">LEVEL: 1</span>
                <span style="margin-left: 10px;" id="failsLabel">FAILS: 0</span>
            </div>
            <div class="hud-tools">
                <button class="hud-btn" onclick="resetGame()">🔄 RESTART</button>
            </div>
        </div>

        <!-- Puzzle Chamber -->
        <div class="puzzle-chamber" id="chamber">
            <div class="clue-box" id="msgBox">भूल-भुलैया पार करके 🏆 ट्रॉफी तक पहुँचो!</div>
            
            <!-- Dynamic Walls & Trophy will be loaded via JavaScript for each Level -->
            <div id="levelContent"></div>

            <!-- Character -->
            <div class="dummy-character" id="dummy">
                <div class="dummy-head"></div>
                <div class="dummy-body"></div>
                <div class="dummy-arm-left"></div>
                <div class="dummy-arm-right"></div>
                <div class="dummy-leg-left"></div>
                <div class="dummy-leg-right"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="bottom-action-bar">
            <div></div>
            <button class="control-btn" onmousedown="moveChar(0, -10)" ontouchstart="moveChar(0, -10)">⬆️ UP</button>
            <div></div>
            <button class="control-btn" onmousedown="moveChar(-10, 0)" ontouchstart="moveChar(-10, 0)">⬅️ LEFT</button>
            <button class="control-btn" onmousedown="moveChar(0, 10)" ontouchstart="moveChar(0, 10)">⬇️ DOWN</button>
            <button class="control-btn" onmousedown="moveChar(10, 0)" ontouchstart="moveChar(10, 0)">➡️ RIGHT</button>
        </div>

        <!-- Modal -->
        <div class="popup-modal" id="winModal">
            <h2 id="modalTitle" style="color: #bc6c25; font-size: 12px; margin-bottom: 8px;">🎉 LEVEL CLEARED!</h2>
            <p id="modalDesc" style="font-family: 'Chakra Petch'; font-size: 11px; margin-bottom: 10px; color: #523500;">अगले लेवल पर चलते हैं!</p>
            <button class="modal-btn" id="nextBtn" onclick="nextLevel()">AGAIN 🔄</button>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        let posX = 15;
        let posY = 15;
        let fails = 0;
        let isOver = false;

        const dummy = document.getElementById('dummy');
        const winModal = document.getElementById('winModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const failsLabel = document.getElementById('failsLabel');
        const lvlLabel = document.getElementById('lvlLabel');
        const levelContent = document.getElementById('levelContent');

        // 🗺️ LEVELS CONFIGURATION (यहाँ आप आसानी से नए लेवल्स जोड़ सकते हैं!)
        const levelsData = {
            1: {
                startPos: { x: 15, y: 15 },
                trophyPos: { top: '220px', right: '30px' },
                walls: [
                    { width: '10px', height: '170px', top: '40px', left: '70px' },
                    { width: '160px', height: '10px', top: '110px', left: '70px' },
                    { width: '10px', height: '130px', top: '40px', left: '230px' },
                    { width: '140px', height: '10px', top: '160px', left: '230px' }
                ]
            },
            2: {
                startPos: { x: 15, y: 250 },
                trophyPos: { top: '20px', right: '30px' },
                walls: [
                    { width: '220px', height: '10px', top: '180px', left: '30px' },
                    { width: '10px', height: '140px', top: '40px', left: '250px' },
                    { width: '180px', height: '10px', top: '80px', left: '150px' },
                    { width: '10px', height: '100px', top: '90px', left: '100px' }
                ]
            },
            3: {
                startPos: { x: 280, y: 15 },
                trophyPos: { bottom: '20px', left: '30px' },
                walls: [
                    { width: '10px', height: '200px', top: '20px', left: '200px' },
                    { width: '150px', height: '10px', top: '120px', left: '50px' },
                    { width: '10px', height: '130px', top: '120px', left: '100px' },
                    { width: '120px', height: '10px', top: '200px', left: '150px' }
                ]
            }
            // 💡 नया लेवल जोड़ने के लिए यहाँ बस { 4: { ... } } जोड़ सकते हैं!
        };

        function loadLevel(lvl) {
            currentLevel = lvl;
            lvlLabel.innerText = "LEVEL: " + currentLevel;
            
            let data = levelsData[currentLevel] || levelsData[1];
            posX = data.startPos.x;
            posY = data.startPos.y;
            
            dummy.style.left = posX + 'px';
            dummy.style.top = posY + 'px';

            // Render Walls & Trophy dynamically
            let html = `<div class="trophy-target" id="trophy" style="${data.trophyPos.top ? 'top:'+data.trophyPos.top : 'bottom:'+data.trophyPos.bottom}; ${data.trophyPos.right ? 'right:'+data.trophyPos.right : 'left:'+data.trophyPos.left}">🏆</div>`;
            
            data.walls.forEach(w => {
                html += `<div class="maze-wall" style="width:${w.width}; height:${w.height}; top:${w.top}; left:${w.left};"></div>`;
            });

            levelContent.innerHTML = html;
            winModal.style.display = "none";
            isOver = false;
        }

        function moveChar(dx, dy) {
            if (isOver) return;

            posX += dx;
            posY += dy;

            // Boundaries
            let chamber = document.getElementById('chamber');
            posX = Math.max(5, Math.min(posX, chamber.clientWidth - 20));
            posY = Math.max(5, Math.min(posY, chamber.clientHeight - 25));

            dummy.style.left = posX + 'px';
            dummy.style.top = posY + 'px';

            // Leg Animation during movement
            if (dx > 0) {
                dummy.className = "dummy-character walking-right";
            } else if (dx < 0) {
                dummy.className = "dummy-character walking-left";
            } else {
                dummy.className = "dummy-character jumping";
            }

            setTimeout(() => {
                if(!isOver) dummy.className = "dummy-character";
            }, 150);

            checkCollisions();
        }

        function checkCollisions() {
            const dRect = dummy.getBoundingClientRect();
            const walls = document.querySelectorAll('.maze-wall');
            
            let hitWall = false;
            walls.forEach(wall => {
                const wRect = wall.getBoundingClientRect();
                if (!(dRect.right < wRect.left || 
                      dRect.left > wRect.right || 
                      dRect.bottom < wRect.top || 
                      dRect.top > wRect.bottom)) {
                    hitWall = true;
                }
            });

            if (hitWall) {
                triggerFail("दीवार से टकरा गए!");
                return;
            }

            // Check Trophy
            const trophy = document.getElementById('trophy');
            if (trophy) {
                const tRect = trophy.getBoundingClientRect();
                if (!(dRect.right < tRect.left || 
                      dRect.left > tRect.right || 
                      dRect.bottom < tRect.top || 
                      dRect.top > tRect.bottom)) {
                    triggerWin();
                }
            }
        }

        function triggerFail(reason) {
            if (isOver) return;
            isOver = true;
            fails++;
            failsLabel.innerText = "FAILS: " + fails;

            modalTitle.style.color = "#d90429";
            modalTitle.innerText = "💀 KHATAM! (FAIL)";
            modalDesc.innerText = reason + " ईगो हर्ट हुआ? दोबारा कोशिश करो!";
            document.getElementById('nextBtn').innerText = "AGAIN 🔄";
            document.getElementById('nextBtn').onclick = () => loadLevel(currentLevel);
            winModal.style.display = "block";
        }

        function triggerWin() {
            if (isOver) return;
            isOver = true;
            modalTitle.style.color = "#38b000";
            modalTitle.innerText = "🎉 LEVEL CLEARED!";
            modalDesc.innerText = "शानदार! आपने यह लेवल पार कर लिया।";
            document.getElementById('nextBtn').innerText = "NEXT LEVEL ➡️";
            document.getElementById('nextBtn').onclick = () => {
                if(levelsData[currentLevel + 1]) {
                    loadLevel(currentLevel + 1);
                } else {
                    modalTitle.innerText = "🏆 GAME COMPLETED!";
                    modalDesc.innerText = "आपने सारे लेवल्स जीत लिए!";
                    document.getElementById('nextBtn').innerText = "RESTART GAME 🔄";
                    document.getElementById('nextBtn').onclick = () => loadLevel(1);
                    winModal.style.display = "block";
                }
            };
            winModal.style.display = "block";
        }

        function resetGame() {
            loadLevel(currentLevel);
        }

        // Initialize Level 1 on load
        loadLevel(1);
    </script>
</body>
</html>

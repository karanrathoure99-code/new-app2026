<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Gameplay</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1f1208 0%, #0d0603 50%, #2b180a 100%);
            background-attachment: fixed;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
            transition: transform 0.2s ease;
        }

        @media (max-width: 1023px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .game-wrapper {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(var(--scale-factor, 0.65));
                width: 1280px;
                height: 720px;
                justify-content: flex-start;
                padding: 10px;
                transform-origin: center center;
            }
        }

        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(50, 28, 10, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 163, 115, 0.4);
            border-radius: 15px;
            padding: 8px 20px;
            margin-bottom: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #d4a373;
            text-shadow: 0 0 10px rgba(212,163,115,0.6);
        }

        .hud-stats {
            display: flex;
            gap: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #faedcd;
            align-items: center;
        }

        .hud-right-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .arena-container {
            flex: 1;
            background: rgba(20, 11, 5, 0.95);
            border: 3px solid rgba(140, 88, 48, 0.85);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(140, 88, 48, 0.25), 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 8px;
        }

        .distractor-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(212, 163, 115, 0.15) 0%, rgba(140, 88, 48, 0.1) 40%, transparent 70%),
                        repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 40px, rgba(212, 163, 115, 0.05) 40px, rgba(212, 163, 115, 0.05) 42px),
                        linear-gradient(45deg, rgba(140, 88, 48, 0.05) 25%, transparent 25%, transparent 75%, rgba(140, 88, 48, 0.05) 75%, rgba(140, 88, 48, 0.05)),
                        linear-gradient(45deg, rgba(140, 88, 48, 0.05) 25%, transparent 25%, transparent 75%, rgba(140, 88, 48, 0.05) 75%, rgba(140, 88, 48, 0.05));
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-position: 0 0, 0 0, 0 0, 30px 30px;
            animation: pulseBg 6s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulseBg {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        #gameCanvas {
            width: 100%;
            height: 410px;
            display: block;
            position: relative;
            z-index: 2;
        }

        .controls-overlay {
            display: none;
        }

        @media (max-width: 1023px) {
            .controls-overlay {
                position: relative;
                bottom: 0;
                left: 0;
                width: 100%;
                margin-top: 2px;
                padding: 0 4px;
                pointer-events: auto;
                background: transparent;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 30;
            }
        }

        .control-group {
            display: flex;
            gap: 6px;
            pointer-events: auto;
            align-items: center;
        }

        @media (max-width: 1023px) {
            .control-group.right-group {
                display: flex;
                flex-direction: row;
                gap: 6px;
                align-items: center;
            }
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-bottom: 3px solid rgba(0, 0, 0, 0.2);
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            width: 95px;
            height: 70px;
            font-size: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
            position: relative;
        }

        .ctrl-btn:active, .ctrl-btn.pressed {
            transform: translateY(2px);
            background: rgba(140, 88, 48, 0.25);
            border-color: rgba(212, 163, 115, 0.5);
        }

        .btn-logo {
            font-size: 12px;
            font-weight: 900;
            color: rgba(255, 204, 0, 0.45);
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }

        .btn-label {
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            color: rgba(255, 255, 255, 0.4);
        }

        .back-btn, .prev-lvl-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #faedcd;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
        }
        .back-btn:hover, .prev-lvl-btn:hover {
            color: #fff;
            border-color: #d4a373;
            background: rgba(212, 163, 115, 0.2);
        }

        #notificationModal {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(43, 24, 10, 0.95);
            border: 2px solid #d4a373;
            padding: 16px 28px;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #ffcc00;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notificationModal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="notificationModal">🎉 Level Cleared!</div>

    <div class="game-wrapper">
        <div class="game-hud">
            <div class="hud-title" id="levelTitle">⚡ LEVEL 1 ⚡</div>
            <div class="hud-stats">
                <span id="scoreDisplay">COINS: 0/4</span>
                <span id="shieldDisplay">SHIELD: OFF</span>
            </div>
            <div class="hud-right-group">
                <button class="prev-lvl-btn" onclick="goToPrevLevel()">◀ BACK</button>
                <button class="back-btn" onclick="goHome()">QUIT</button>
            </div>
        </div>

        <div class="arena-container">
            <div class="distractor-bg"></div>
            <canvas id="gameCanvas"></canvas>

            <div class="controls-overlay" id="mobileControls">
                <div class="control-group">
                    <button class="ctrl-btn" id="leftBtnM">◀</button>
                    <button class="ctrl-btn" id="rightBtnM">▶</button>
                </div>
                <div class="control-group right-group">
                    <button class="ctrl-btn" id="jumpBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">JUMP</span>
                    </button>
                    <button class="ctrl-btn" id="rightDownBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">DOWN</span>
                    </button>
                    <button class="ctrl-btn" id="shieldBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">SHLD</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const currentPageFile = window.location.pathname.split("/").pop() || "game.html";
        localStorage.setItem('lastActiveFile', currentPageFile);

        function handleScreenFit(e) {
            if (e.target.closest('button') || e.target.closest('.ctrl-btn') || e.target.closest('.game-hud')) {
                return;
            }
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        window.addEventListener('click', handleScreenFit);
        window.addEventListener('touchstart', handleScreenFit);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let canvasWidth = 1280;
        let canvasHeight = 410;

        function checkDeviceControls() {
            const isMobileOrTablet = window.innerWidth <= 1023;
            document.getElementById('mobileControls').style.display = isMobileOrTablet ? 'flex' : 'none';
        }

        function resizeCanvas() {
            if (window.innerWidth <= 1023) {
                const scaleX = window.innerWidth / 1280;
                const scaleY = window.innerHeight / 720;
                const scale = Math.min(scaleX, scaleY) * 0.95;
                document.documentElement.style.setProperty('--scale-factor', scale);
            }
            canvasWidth = 1280;
            canvasHeight = 410;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';

            updateGameLayout();
            checkDeviceControls();
        }

        let currentLevel = parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga')) || 1;
        
        let isDoorOpen = true; 
        let score = 0;
        let shieldActive = false;
        let isExploding = false;
        let isSlowMo = false;
        let fragments = [];
        let particles = [];
        let floatingTexts = [];

        // ⚡ PLAYER STATS UPDATED: Sirf speed ko 2.8 kiya gaya hai
        let player = {
            x: 40,
            y: 100,
            width: 13.0,     
            height: 40.5,    
            vx: 0,
            vy: 0,
            speed: 2.8,        
            jumpForce: -6.6,  
            gravity: 0.38,    
            isGrounded: false,
            animTimer: 0
        };

        let platforms = [];
        let coins = [];
        let goal = { x: 0, y: 0, w: 38, h: 54 };

        function updateGameLayout() {
            score = 0;
            
            localStorage.setItem('saveLevel_TumseNaHoPayga', currentLevel);
            localStorage.setItem('lastActiveFile', currentPageFile);

            const surfaceTop = canvasHeight - 40;
            const surfaceHeight = 40;

            if (currentLevel === 1) {
                document.getElementById('levelTitle').innerText = "⚡『 🪙 COLLECT MOSTLY COIN 』- Lvl 1 ⚡";
            } else if (currentLevel === 2) {
                document.getElementById('levelTitle').innerText = "🎯『 💎 COLLECT MOSTLY COIN 』- Lvl 2 ⚡";
            } else if (currentLevel === 3) {
                document.getElementById('levelTitle').innerText = "🚀『 💰 COLLECT MOSTLY COIN 』- Lvl 3 ⚡";
            } else if (currentLevel === 4) {
                document.getElementById('levelTitle').innerText = "🔥『 🏆 COLLECT 1 COIN TO UNLOCK 』- Lvl 4 ⚡";
            } else if (currentLevel === 5) {
                document.getElementById('levelTitle').innerText = "👑『 ✨ DON'T TOUCH ANY COIN! 』- Lvl 5 ⚡";
            }

            let totalCoinsInLevel = (currentLevel === 2) ? 6 : 4;
            document.getElementById('scoreDisplay').innerText = "COINS: " + score + "/" + totalCoinsInLevel;

            platforms = [
                { x: 0, y: surfaceTop, w: canvasWidth, h: surfaceHeight, type: 'ground' }
            ];

            if (currentLevel === 1) {
                platforms.push({ x: Math.floor(canvasWidth * 0.45), y: surfaceTop, w: 90, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                isDoorOpen = true;
                player.x = 40;
                player.y = 100;
            } 
            else if (currentLevel === 2) {
                platforms.push({ x: Math.floor(canvasWidth * 0.7), y: surfaceTop, w: 90, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                isDoorOpen = false;
                player.x = 40;
                player.y = 100;
            }
            else if (currentLevel === 3) {
                let sWidth = 80;
                let sHeight = 16;
                let sY = surfaceTop - 50;
                
                platforms.push({ x: 220, y: sY, w: sWidth, h: sHeight, type: 'secondSurface' });
                platforms.push({ x: 480, y: sY, w: sWidth, h: sHeight, type: 'secondSurface' });
                platforms.push({ x: 740, y: sY, w: sWidth, h: sHeight, type: 'secondSurface' });
                platforms.push({ x: 1000, y: sY, w: sWidth, h: sHeight, type: 'secondSurface' });

                isDoorOpen = false;
                player.x = 50;
                player.y = surfaceTop - 90;
            }
            else if (currentLevel === 4) {
                platforms.push({ x: Math.floor(canvasWidth * 0.3), y: surfaceTop - 55, w: 120, h: 18, type: 'secondSurface' });
                platforms.push({ x: Math.floor(canvasWidth * 0.65), y: surfaceTop - 65, w: 120, h: 18, type: 'secondSurface' });
                isDoorOpen = false;
                player.x = 40;
                player.y = 100;
            }
            else if (currentLevel === 5) {
                platforms.push({ x: Math.floor(canvasWidth * 0.2), y: surfaceTop - 50, w: 100, h: 18, type: 'secondSurface' });
                platforms.push({ x: Math.floor(canvasWidth * 0.5), y: surfaceTop - 65, w: 100, h: 18, type: 'secondSurface' });
                platforms.push({ x: Math.floor(canvasWidth * 0.8), y: surfaceTop - 55, w: 100, h: 18, type: 'secondSurface' });
                isDoorOpen = true;
                player.x = 40;
                player.y = 100;
            }

            coins = [];
            let startMargin = 160; 
            let endMargin = 160;   
            let usableWidth = canvasWidth - startMargin - endMargin;
            let coinSpacing = totalCoinsInLevel > 1 ? usableWidth / (totalCoinsInLevel - 1) : 0;

            let boomIndices = [];
            if (currentLevel === 3) {
                boomIndices = [1, 2];
            } else if (currentLevel === 4) {
                boomIndices = [0, 1, 3];
            } else if (currentLevel === 5) {
                boomIndices = [1, 2];
            }

            for (let i = 1; i <= totalCoinsInLevel; i++) {
                let hasBoom = boomIndices.includes(i - 1);
                coins.push({
                    x: startMargin + (i - 1) * coinSpacing,
                    y: surfaceTop - 25,
                    collected: false,
                    radius: 5,
                    isBoom: hasBoom,
                    floatOffset: Math.random() * Math.PI
                });
            }

            goal.y = surfaceTop - goal.h;
            goal.x = canvasWidth - goal.w - 14;
        }

        function goToPrevLevel() {
            if (currentLevel > 1) {
                currentLevel--;
                player.vx = 0;
                player.vy = 0;
                updateGameLayout();
            } else {
                const modal = document.getElementById('notificationModal');
                modal.innerText = "⚠ Yeh pehla level hai!";
                modal.classList.add('show');
                setTimeout(() => modal.classList.remove('show'), 1500);
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let keys = { left: false, right: false, down: false };

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        window.addEventListener('click', initAudio);
        window.addEventListener('touchstart', initAudio);
        window.addEventListener('keydown', initAudio);

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(350, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'coin') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, now); 
                    osc.frequency.setValueAtTime(880, now + 0.08); 
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'blast') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(15, now + 0.5);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        const bindButton = (id, onStart, onEnd) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const handleStart = (e) => {
                if (e) e.preventDefault();
                initAudio();
                btn.classList.add('pressed');
                onStart();
            };
            const handleEnd = (e) => {
                if (e) e.preventDefault();
                btn.classList.remove('pressed');
                onEnd();
            };
            btn.addEventListener('touchstart', handleStart, { passive: false });
            btn.addEventListener('touchend', handleEnd, { passive: false });
            btn.addEventListener('touchcancel', handleEnd, { passive: false });
            btn.addEventListener('mousedown', handleStart);
            btn.addEventListener('mouseup', handleEnd);
            btn.addEventListener('mouseleave', handleEnd);
        };

        bindButton('leftBtnM', () => keys.left = true, () => keys.left = false);
        bindButton('rightBtnM', () => keys.right = true, () => keys.right = false);
        bindButton('rightDownBtnM', () => keys.down = true, () => keys.down = false);

        function triggerJump() {
            if (player.isGrounded && !isExploding) {
                let activeJumpForce = -6.6; 

                player.vy = activeJumpForce;
                player.isGrounded = false;
                playSound('jump');
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: player.x + player.width / 2,
                        y: player.y + player.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: -Math.random() * 1.5,
                        size: Math.random() * 3 + 1,
                        color: 'rgba(212, 163, 115, 0.7)',
                        life: 25
                    });
                }
            }
        }

        const jumpBtnM = document.getElementById('jumpBtnM');
        if (jumpBtnM) {
            const handleJumpAction = (e) => {
                if (e) e.preventDefault();
                initAudio();
                jumpBtnM.classList.add('pressed');
                setTimeout(() => jumpBtnM.classList.remove('pressed'), 150);
                triggerJump();
            };
            jumpBtnM.addEventListener('touchstart', handleJumpAction, { passive: false });
            jumpBtnM.addEventListener('mousedown', handleJumpAction);
        }

        const shieldBtnM = document.getElementById('shieldBtnM');
        if (shieldBtnM) {
            const activateShield = (e) => {
                if (e) e.preventDefault();
                initAudio();
                shieldBtnM.classList.add('pressed');
                shieldActive = true;
                document.getElementById('shieldDisplay').innerText = "SHIELD: ON";
                document.getElementById('shieldDisplay').style.color = "#ffaa00";
            };
            const deactivateShield = (e) => {
                if (e) e.preventDefault();
                shieldBtnM.classList.remove('pressed');
                shieldActive = false;
                document.getElementById('shieldDisplay').innerText = "SHIELD: OFF";
                document.getElementById('shieldDisplay').style.color = "#d8b4fe";
            };
            shieldBtnM.addEventListener('touchstart', activateShield, { passive: false });
            shieldBtnM.addEventListener('touchend', deactivateShield, { passive: false });
            shieldBtnM.addEventListener('touchcancel', deactivateShield, { passive: false });
            shieldBtnM.addEventListener('mousedown', activateShield);
            shieldBtnM.addEventListener('mouseup', deactivateShield);
            shieldBtnM.addEventListener('mouseleave', deactivateShield);
        }

        window.addEventListener('keydown', e => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'Shift') {
                shieldActive = true;
                document.getElementById('shieldDisplay').innerText = "SHIELD: ON";
                document.getElementById('shieldDisplay').style.color = "#ffaa00";
            }
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === 'Shift') {
                shieldActive = false;
                document.getElementById('shieldDisplay').innerText = "SHIELD: OFF";
                document.getElementById('shieldDisplay').style.color = "#d8b4fe";
            }
        });

        function triggerExplosion() {
            if (currentLevel !== 3 && currentLevel !== 4 && currentLevel !== 5 && shieldActive) return;
            if (isExploding) return;
            
            isExploding = true;
            isSlowMo = true;
            playSound('blast');

            fragments = [
                { x: player.x, y: player.y, vx: -4, vy: -5, color: '#ffffff' },
                { x: player.x + 4, y: player.y + 10, vx: 4, vy: -6, color: '#ffffff' },
                { x: player.x + 2, y: player.y + 18, vx: -5, vy: 2, color: '#e0e0e0' },
                { x: player.x + 6, y: player.y + 22, vx: 5, vy: 3, color: '#ffffff' }
            ];

            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height / 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 5 + 2,
                    color: Math.random() > 0.5 ? '#ff9f1c' : '#ffffff',
                    life: 40
                });
            }

            setTimeout(() => {
                isExploding = false;
                isSlowMo = false;
                updateGameLayout();
            }, 2000);
        }

        function checkCoins() {
            coins.forEach(c => {
                if (!c.collected && Math.hypot((player.x + player.width/2) - c.x, (player.y + player.height/2) - c.y) < 22) {
                    c.collected = true;

                    if (c.isBoom) {
                        playSound('blast');
                        triggerExplosion();
                        return;
                    }

                    score += 1; 
                    playSound('coin');
                    
                    floatingTexts.push({ text: '+1', x: c.x, y: c.y - 10, alpha: 1, vy: -1 });

                    if (currentLevel === 2) {
                        let allCollected = coins.every(coin => coin.collected);
                        if (allCollected) {
                            isDoorOpen = true; 
                            floatingTexts.push({ text: 'GATE UNLOCKED!', x: player.x - 30, y: player.y - 20, alpha: 1, vy: -1 });
                        }
                    }
                    else if (currentLevel === 3 && score >= 2) {
                        isDoorOpen = true; 
                        floatingTexts.push({ text: 'GATE UNLOCKED!', x: player.x - 30, y: player.y - 20, alpha: 1, vy: -1 });
                    } 
                    else if (currentLevel === 4 && score >= 1) {
                        isDoorOpen = true; 
                        floatingTexts.push({ text: 'GATE UNLOCKED!', x: player.x - 30, y: player.y - 20, alpha: 1, vy: -1 });
                    }
                    else if (currentLevel === 5 && score >= 1) {
                        isDoorOpen = false;
                        floatingTexts.push({ text: 'GATE LOCKED!', x: player.x - 30, y: player.y - 20, alpha: 1, vy: -1 });
                    }

                    for (let i = 0; i < 8; i++) {
                        particles.push({
                            x: c.x,
                            y: c.y,
                            vx: (Math.random() - 0.5) * 5,
                            vy: (Math.random() - 0.5) * 5,
                            size: Math.random() * 3 + 1,
                            color: '#ffcc00',
                            life: 20
                        });
                    }
                }
            });
        }

        let levelWon = false;

        function update() {
            let timeFactor = isSlowMo ? 0.25 : 1.0;

            if (isExploding) {
                fragments.forEach(f => {
                    f.x += f.vx * timeFactor;
                    f.y += f.vy * timeFactor;
                    f.vy += 0.45 * timeFactor; 
                });
                return;
            }

            if (keys.left) {
                player.vx = -player.speed;
                player.animTimer += 0.22; 
            } else if (keys.right) {
                player.vx = player.speed;
                player.animTimer += 0.22;
            } else {
                player.vx = 0;
                player.animTimer = 0;
            }

            if (!player.isGrounded) {
                player.animTimer += 0.22; 
            }

            if (keys.down) {
                player.height = 24.3; 
            } else {
                player.height = 40.5; 
            }

            player.x += player.vx;

            let maxRightLimit = goal.x + goal.w - player.width - 2;
            if (player.x < 0) player.x = 0;
            if (player.x > maxRightLimit) player.x = maxRightLimit;

            player.vy += player.gravity;
            player.y += player.vy;

            player.isGrounded = false;
            platforms.forEach(p => {
                if (p.type === 'hiddenTrap') {
                    let playerCenterX = player.x + player.width / 2;
                    if (!p.triggered && playerCenterX >= p.x && playerCenterX <= p.x + p.w && player.y + player.height >= p.y - 5) {
                        p.triggered = true; 
                        setTimeout(() => triggerExplosion(), 80);
                        return;
                    }
                    if (p.triggered) return; 
                }

                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 12
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            });

            if (player.y > canvasHeight + 100) {
                triggerExplosion();
            }

            checkCoins();

            let playerCenter = player.x + player.width / 2;
            let touchesGate = (player.x + player.width >= goal.x && player.x <= goal.x + goal.w);

            if (touchesGate && player.y + player.height >= goal.y) {
                if (!isDoorOpen) {
                    player.x = goal.x - player.width - 1; 
                    if (Math.random() < 0.05) { 
                        floatingTexts.push({ text: 'LOCKED!', x: player.x - 10, y: player.y - 10, alpha: 1, vy: -0.5 });
                    }
                } 
                else if (playerCenter >= goal.x + 8 && !levelWon) {
                    levelWon = true;
                    playSound('win');
                    
                    const modal = document.getElementById('notificationModal');
                    
                    if (currentLevel < 5) {
                        modal.innerText = "🎉 Yeto ashan tha! 🤪 Level " + currentLevel + " Cleared!";
                        modal.classList.add('show');
                        
                        let nextLvl = currentLevel + 1;
                        localStorage.setItem('saveLevel_TumseNaHoPayga', nextLvl);
                        localStorage.setItem('lastActiveFile', 'game.html');

                        setTimeout(() => {
                            modal.classList.remove('show');
                            currentLevel = nextLvl;
                            levelWon = false;
                            updateGameLayout();
                        }, 2000);
                    } else {
                        modal.innerText = "🏆 Yeto ashan tha! 🤪 LEVEL 5 COMPLETED! Opening game2.html...";
                        modal.classList.add('show');
                        
                        localStorage.setItem('lastActiveFile', 'game2.html');
                        localStorage.setItem('saveLevel_TumseNaHoPayga', 1);

                        setTimeout(() => {
                            window.location.href = "game2.html"; 
                        }, 2000);
                    }
                }
            }

            let maxCoinsDisplay = (currentLevel === 2) ? 6 : 4;
            document.getElementById('scoreDisplay').innerText = "COINS: " + score + "/" + maxCoinsDisplay;

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.03;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            platforms.forEach(p => {
                if (p.type === 'hiddenTrap' && p.triggered) return; 
                ctx.fillStyle = '#2b180a';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#d4a373';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + p.w, p.y);
                ctx.stroke();
            });

            coins.forEach((c) => {
                if (!c.collected) {
                    c.floatOffset += 0.08;
                    let floatY = c.y + Math.sin(c.floatOffset) * 3;

                    ctx.beginPath();
                    ctx.arc(c.x, floatY, c.radius + 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 204, 0, 0.25)';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(c.x, floatY, c.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                }
            });

            // 🚪 THEMED SCI-FI PORTAL GATE
            let gx = goal.x;
            let gy = goal.y;
            let gw = goal.w;
            let gh = goal.h;

            if (isDoorOpen) {
                let auraGrad = ctx.createRadialGradient(gx + gw/2, gy + gh/2, 5, gx + gw/2, gy + gh/2, gw);
                auraGrad.addColorStop(0, 'rgba(255, 170, 0, 0.45)');
                auraGrad.addColorStop(0.7, 'rgba(212, 163, 115, 0.2)');
                auraGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = auraGrad;
                ctx.fillRect(gx - 8, gy - 8, gw + 16, gh + 14);

                let portalGrad = ctx.createLinearGradient(gx, gy, gx + gw, gy + gh);
                portalGrad.addColorStop(0, '#2b180a');
                portalGrad.addColorStop(0.5, '#4a2800');
                portalGrad.addColorStop(1, '#ffaa00');
                ctx.fillStyle = portalGrad;
                ctx.fillRect(gx, gy, gw, gh);

                ctx.strokeStyle = 'rgba(255, 230, 160, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.ellipse(gx + gw/2, gy + gh/2, gw/3.2, gh/3, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(gx + 10, gy + gh/2);
                ctx.lineTo(gx + gw - 12, gy + gh/2);
                ctx.moveTo(gx + gw - 18, gy + gh/2 - 6);
                ctx.lineTo(gx + gw - 12, gy + gh/2);
                ctx.lineTo(gx + gw - 18, gy + gh/2 + 6);
                ctx.stroke();

                ctx.strokeStyle = '#d4a373';
                ctx.lineWidth = 3;
                ctx.strokeRect(gx, gy, gw, gh);

                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 2;
                ctx.strokeRect(gx - 1, gy - 1, 6, 6);
                ctx.strokeRect(gx + gw - 5, gy - 1, 6, 6);
                ctx.strokeRect(gx - 1, gy + gh - 5, 6, 6);
                ctx.strokeRect(gx + gw - 5, gy + gh - 5, 6, 6);

                ctx.font = '900 10px Orbitron, sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('ENTER', gx + 1, gy - 7);
            } else {
                let warnGrad = ctx.createRadialGradient(gx + gw/2, gy + gh/2, 5, gx + gw/2, gy + gh/2, gw);
                warnGrad.addColorStop(0, 'rgba(180, 50, 10, 0.35)');
                warnGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = warnGrad;
                ctx.fillRect(gx - 6, gy - 6, gw + 12, gh + 12);

                let metalGrad = ctx.createLinearGradient(gx, gy, gx + gw, gy);
                metalGrad.addColorStop(0, '#1a0e05');
                metalGrad.addColorStop(0.5, '#2e190b');
                metalGrad.addColorStop(1, '#150b04');
                ctx.fillStyle = metalGrad;
                ctx.fillRect(gx, gy, gw, gh);

                ctx.strokeStyle = 'rgba(140, 88, 48, 0.7)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(gx + 3, gy + 3);
                ctx.lineTo(gx + gw - 3, gy + gh - 3);
                ctx.moveTo(gx + gw - 3, gy + 3);
                ctx.lineTo(gx + 3, gy + gh - 3);
                ctx.stroke();

                ctx.fillStyle = '#3a200e';
                ctx.fillRect(gx + 4, gy + gh/2 - 7, gw - 8, 14);
                ctx.strokeStyle = '#8c5830';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(gx + 4, gy + gh/2 - 7, gw - 8, 14);

                let lx = gx + gw/2 - 5;
                let ly = gy + gh/2 - 4;
                
                ctx.strokeStyle = '#d4a373';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(lx + 5, ly - 2, 4, Math.PI, 0);
                ctx.stroke();

                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(lx, ly, 10, 8);
                ctx.fillStyle = '#1f1208';
                ctx.fillRect(lx + 3.5, ly + 2.5, 3, 3);

                ctx.strokeStyle = '#8c5830';
                ctx.lineWidth = 3;
                ctx.strokeRect(gx, gy, gw, gh);

                ctx.fillStyle = '#d4a373';
                ctx.fillRect(gx + 2, gy + 2, 2.5, 2.5);
                ctx.fillRect(gx + gw - 4.5, gy + 2, 2.5, 2.5);
                ctx.fillRect(gx + 2, gy + gh - 4.5, 2.5, 2.5);
                ctx.fillRect(gx + gw - 4.5, gy + gh - 4.5, 2.5, 2.5);

                ctx.font = '900 10px Orbitron, sans-serif';
                ctx.fillStyle = '#d4a373';
                ctx.fillText('LOCKED', gx - 3, gy - 7);
            }

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = 'bold 12px Orbitron, sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText(ft.text, ft.x - 8, ft.y);
                ctx.restore();
            });

            if (isExploding) {
                fragments.forEach(f => {
                    ctx.fillStyle = f.color;
                    ctx.fillRect(f.x, f.y, 4, 4);
                });
            } else {
                let px = player.x;
                let py = player.y;

                if (shieldActive) {
                    ctx.beginPath();
                    ctx.arc(px + player.width/2, py + player.height/2, 23, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
                    ctx.fill();
                    ctx.strokeStyle = '#ffaa00';
                    ctx.stroke();
                }

                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath();
                ctx.ellipse(px + player.width/2 + 1, py + player.height + 2, player.width/1.2, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                let legSwing = (player.vx !== 0 || !player.isGrounded) ? Math.sin(player.animTimer) * 4 : 0;
                let isJumpingOrAirborne = !player.isGrounded;
                let jumpStretch = isJumpingOrAirborne ? -2 : 0;

                let headRadius = 4.5;
                let headX = px + player.width/2;
                let headY = py + 5 + jumpStretch;
                
                let headGrad = ctx.createRadialGradient(headX - 1, headY - 1, 0.5, headX, headY, headRadius);
                headGrad.addColorStop(0, '#ffffff');
                headGrad.addColorStop(1, '#c0c0c0');
                
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
                ctx.fill();

                let torsoWidth = 6.3; 
                let torsoX = px + (player.width - torsoWidth) / 2;
                let chestGrad = ctx.createLinearGradient(torsoX, py + 10 + jumpStretch, torsoX + torsoWidth, py + 10 + jumpStretch);
                chestGrad.addColorStop(0, '#ffffff');
                chestGrad.addColorStop(1, '#b0b0b0');
                ctx.fillStyle = chestGrad;
                ctx.fillRect(torsoX, py + 10 + jumpStretch, torsoWidth, 13);

                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(torsoX - 1, py + 23 + jumpStretch, torsoWidth + 2, 2.2);

                // Hath (Arms) still rahenge
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(torsoX - 3.5, py + 12 + jumpStretch, 2.2, 10);  
                ctx.fillRect(torsoX + torsoWidth + 0.8, py + 12 + jumpStretch, 2.2, 10); 

                // Pair chalenge
                let legHeight = player.height === 24.3 ? 7 : 12;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(torsoX + 0.8 + legSwing, py + 25.2 + jumpStretch, 2.2, legHeight); 
                ctx.fillRect(torsoX + torsoWidth - 3 - legSwing, py + 25.2 + jumpStretch, 2.2, legHeight); 
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        function goHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>

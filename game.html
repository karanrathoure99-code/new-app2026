<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Level 1 Game Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1f1208 0%, #0d0603 50%, #2b180a 100%);
            background-attachment: fixed;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }

        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(50, 28, 10, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 163, 115, 0.4);
            border-radius: 15px;
            padding: 8px 20px;
            margin-bottom: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: #d4a373;
            text-shadow: 0 0 10px rgba(212,163,115,0.6);
        }

        .hud-stats {
            display: flex;
            gap: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #faedcd;
        }

        .arena-container {
            flex: 1;
            background: rgba(20, 11, 5, 0.95);
            border: 3px solid rgba(140, 88, 48, 0.85);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(140, 88, 48, 0.25), 0 10px 30px rgba(0,0,0,0.8);
        }

        .distractor-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(212, 163, 115, 0.15) 0%, rgba(140, 88, 48, 0.1) 40%, transparent 70%),
                        repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 40px, rgba(212, 163, 115, 0.05) 40px, rgba(212, 163, 115, 0.05) 42px),
                        linear-gradient(45deg, rgba(140, 88, 48, 0.05) 25%, transparent 25%, transparent 75%, rgba(140, 88, 48, 0.05) 75%, rgba(140, 88, 48, 0.05)),
                        linear-gradient(45deg, rgba(140, 88, 48, 0.05) 25%, transparent 25%, transparent 75%, rgba(140, 88, 48, 0.05) 75%, rgba(140, 88, 48, 0.05));
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-position: 0 0, 0 0, 0 0, 30px 30px;
            animation: pulseBg 6s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulseBg {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
            z-index: 2;
        }

        .controls-overlay {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            pointer-events: none;
            z-index: 10;
        }

        @media (min-width: 1024px) {
            .controls-overlay {
                display: none;
            }
        }

        .control-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
            align-items: center;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-bottom: 3px solid rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.6);
            touch-action: manipulation;
            position: relative;
        }

        .ctrl-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            background: rgba(140, 88, 48, 0.35);
            border-color: #d4a373;
        }

        .btn-logo {
            font-size: 9px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 4px rgba(255, 204, 0, 0.8);
            margin-bottom: 1px;
            letter-spacing: -0.5px;
        }

        .btn-label {
            font-size: 8px;
            font-weight: 700;
            line-height: 1;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #faedcd;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .back-btn:hover {
            color: #fff;
            border-color: #d4a373;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="game-hud">
            <div class="hud-title">⚡ LEVEL 1: 3D ARENA</div>
            <div class="hud-stats">
                <span id="scoreDisplay">COINS: 0</span>
                <span id="shieldDisplay">SHIELD: OFF</span>
            </div>
            <button class="back-btn" onclick="goHome()">QUIT</button>
        </div>

        <div class="arena-container">
            <div class="distractor-bg"></div>
            <canvas id="gameCanvas"></canvas>

            <div class="controls-overlay">
                <div class="control-group">
                    <button class="ctrl-btn" id="leftBtn">◀</button>
                    <button class="ctrl-btn" id="rightBtn">▶</button>
                    <button class="ctrl-btn" id="downBtn">▼</button>
                </div>

                <div class="control-group">
                    <button class="ctrl-btn" id="jumpBtn">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">JUMP</span>
                    </button>
                    <button class="ctrl-btn" id="rightDownBtn">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">DOWN</span>
                    </button>
                    <button class="ctrl-btn" id="shieldBtn" style="background: rgba(255,170,0,0.25);">
                        <span class="btn-logo" style="color:#ffaa00;">Z</span>
                        <span class="btn-label">SHLD</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function enableFullscreenAndLandscape() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
            window.removeEventListener('click', enableFullscreenAndLandscape);
            window.removeEventListener('touchstart', enableFullscreenAndLandscape);
        }
        window.addEventListener('click', enableFullscreenAndLandscape);
        window.addEventListener('touchstart', enableFullscreenAndLandscape);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let canvasWidth = 800;
        let canvasHeight = 500;

        function resizeCanvas() {
            canvasWidth = canvas.parentElement.clientWidth;
            canvasHeight = canvas.parentElement.clientHeight;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';

            updateGameLayout();
        }

        let score = 0;
        let shieldActive = false;
        let isExploding = false;
        let isSlowMo = false;
        let fragments = [];

        let player = {
            x: 40,
            y: 100,
            width: 14,        // Made much slimmer (patla)
            height: 50,       // Tall and sleek
            vx: 0,
            vy: 0,
            speed: 3.2,      
            jumpForce: -8.5,  
            gravity: 0.38,    
            isGrounded: false,
            animTimer: 0
        };

        let platforms = [];
        let coins = [];
        let goal = { x: 0, y: 0, w: 20, h: 35 };

        function updateGameLayout() {
            const surfaceTop = canvasHeight - 40;
            const surfaceHeight = 40;

            platforms = [
                { x: 0, y: surfaceTop, w: canvasWidth, h: surfaceHeight, type: 'ground' }, 
                { x: Math.floor(canvasWidth * 0.6), y: surfaceTop, w: 70, h: surfaceHeight, type: 'hiddenTrap', triggered: false }
            ];

            const coinSpacing = (canvasWidth - 120) / 6;
            coins = [];
            for (let i = 1; i <= 6; i++) {
                coins.push({
                    x: 60 + (i - 1) * coinSpacing,
                    y: surfaceTop - 25,
                    collected: false,
                    hasBomb: (i === 4),
                    radius: 4
                });
            }

            goal.y = surfaceTop - goal.h;
            goal.x = canvasWidth - 55;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let keys = { left: false, right: false, down: false };

        function playBlastSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(15, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.log("Audio not allowed yet", e);
            }
        }

        const bindButton = (id, onStart, onEnd) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
            btn.addEventListener('mousedown', () => onStart());
            btn.addEventListener('mouseup', () => onEnd());
        };

        bindButton('leftBtn', () => keys.left = true, () => keys.left = false);
        bindButton('rightBtn', () => keys.right = true, () => keys.right = false);
        bindButton('downBtn', () => keys.down = true, () => keys.down = false);
        bindButton('rightDownBtn', () => keys.down = true, () => keys.down = false);

        const jumpBtn = document.getElementById('jumpBtn');
        if (jumpBtn) {
            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerJump(); });
            jumpBtn.addEventListener('mousedown', () => triggerJump());
        }

        function triggerJump() {
            if (player.isGrounded && !isExploding) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
            }
        }

        const shieldBtn = document.getElementById('shieldBtn');
        if (shieldBtn) {
            const activateShield = () => {
                shieldActive = true;
                document.getElementById('shieldDisplay').innerText = "SHIELD: ON";
                document.getElementById('shieldDisplay').style.color = "#ffaa00";
            };
            const deactivateShield = () => {
                shieldActive = false;
                document.getElementById('shieldDisplay').innerText = "SHIELD: OFF";
                document.getElementById('shieldDisplay').style.color = "#d8b4fe";
            };
            shieldBtn.addEventListener('touchstart', (e) => { e.preventDefault(); activateShield(); });
            shieldBtn.addEventListener('touchend', (e) => { e.preventDefault(); deactivateShield(); });
            shieldBtn.addEventListener('mousedown', activateShield);
            shieldBtn.addEventListener('mouseup', deactivateShield);
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
        });

        function triggerExplosion() {
            if (shieldActive || isExploding) return;
            isExploding = true;
            isSlowMo = true;
            playBlastSound();

            fragments = [
                { x: player.x, y: player.y, vx: -4, vy: -5, color: '#ffffff' },
                { x: player.x + 4, y: player.y + 10, vx: 4, vy: -6, color: '#ffffff' },
                { x: player.x + 2, y: player.y + 18, vx: -5, vy: 2, color: '#e0e0e0' },
                { x: player.x + 6, y: player.y + 22, vx: 5, vy: 3, color: '#ffffff' }
            ];

            setTimeout(() => {
                window.location.reload();
            }, 2000);
        }

        function checkCoins() {
            coins.forEach(c => {
                if (!c.collected && Math.hypot((player.x + player.width/2) - c.x, (player.y + player.height/2) - c.y) < 22) {
                    c.collected = true;
                    if (c.hasBomb) {
                        triggerExplosion();
                    } else {
                        score += 20;
                    }
                }
            });
        }

        function update() {
            platforms[0].w = canvasWidth;

            let timeFactor = isSlowMo ? 0.25 : 1.0;

            if (isExploding) {
                fragments.forEach(f => {
                    f.x += f.vx * timeFactor;
                    f.y += f.vy * timeFactor;
                    f.vy += 0.45 * timeFactor; 
                });
                return;
            }

            if (keys.left) {
                player.vx = -player.speed;
                player.animTimer += 0.2;
            } else if (keys.right) {
                player.vx = player.speed;
                player.animTimer += 0.2;
            } else {
                player.vx = 0;
                player.animTimer = 0;
            }

            if (keys.down) {
                player.height = 30; // Slim duck height
            } else {
                player.height = 50; // Slim standing height
            }

            player.x += player.vx;

            if (player.x < 0) player.x = 0;
            if (player.x > canvasWidth - player.width) player.x = canvasWidth - player.width;

            player.vy += player.gravity;
            player.y += player.vy;

            player.isGrounded = false;
            platforms.forEach(p => {
                if (p.type === 'hiddenTrap' && p.triggered) return;

                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 12
                ) {
                    if (p.type === 'hiddenTrap') {
                        p.triggered = true;
                        setTimeout(() => triggerExplosion(), 120);
                    }
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            });

            if (player.y > canvasHeight + 100) {
                triggerExplosion();
            }

            checkCoins();

            if (player.x + player.width >= goal.x && player.y + player.height >= goal.y) {
                alert("🎉 Gate Unlocked! Transitioning to Level 2 Automatically...");
                window.location.reload(); 
            }

            document.getElementById('scoreDisplay').innerText = "COINS: " + score;
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            platforms.forEach(p => {
                if (p.type === 'hiddenTrap' && p.triggered) return;
                ctx.fillStyle = '#2b180a';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#d4a373';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + p.w, p.y);
                ctx.stroke();
            });

            coins.forEach(c => {
                if (!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                }
            });

            ctx.fillStyle = 'rgba(255, 159, 28, 0.25)';
            ctx.fillRect(goal.x - 4, goal.y - 4, goal.w + 8, goal.h + 8);
            
            ctx.fillStyle = '#532d0c';
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            ctx.strokeStyle = '#ff9f1c';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);

            if (isExploding) {
                fragments.forEach(f => {
                    ctx.fillStyle = f.color;
                    ctx.fillRect(f.x, f.y, 4, 4);
                });
            } else {
                let px = player.x;
                let py = player.y;

                if (shieldActive) {
                    ctx.beginPath();
                    ctx.arc(px + player.width/2, py + player.height/2, 28, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
                    ctx.fill();
                    ctx.strokeStyle = '#ffaa00';
                    ctx.stroke();
                }

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath();
                ctx.ellipse(px + player.width/2 + 1, py + player.height + 2, player.width/1.2, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Slim White Character Drawing (Patla)
                let bounce = Math.sin(player.animTimer) * 2;
                let headRadius = 5.5;
                let headX = px + player.width/2;
                let headY = py + 7 + (player.height === 30 ? 0 : bounce);
                
                let headGrad = ctx.createRadialGradient(headX - 1, headY - 1, 0.5, headX, headY, headRadius);
                headGrad.addColorStop(0, '#ffffff');
                headGrad.addColorStop(1, '#c0c0c0');
                
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
                ctx.fill();

                // Slim Upper Torso (White theme)
                let chestGrad = ctx.createLinearGradient(px, py + 13, px + player.width, py + 13);
                chestGrad.addColorStop(0, '#ffffff');
                chestGrad.addColorStop(1, '#b0b0b0');
                ctx.fillStyle = chestGrad;
                ctx.fillRect(px + 1, py + 13 + (player.height === 30 ? 0 : bounce), player.width - 2, 16);

                // Belt
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(px + 1, py + 29 + (player.height === 30 ? 0 : bounce), player.width - 2, 2.5);

                // Slim Legs
                ctx.fillStyle = '#404040';
                ctx.fillRect(px + 2, py + 31.5 + (player.height === 30 ? 0 : bounce), 3.5, player.height === 30 ? 11 : 16);
                ctx.fillRect(px + player.width - 5.5, py + 31.5 + (player.height === 30 ? 0 : bounce), 3.5, player.height === 30 ? 11 : 16);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        function goHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Base White Surface - 20000 x 20000 Open World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e293b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        #map-btn {
            position: absolute;
            top: 95px;
            left: 15px;
            background: rgba(255, 85, 0, 0.9);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
            touch-action: manipulation;
        }
        #map-btn:active {
            transform: scale(0.95);
            background: rgba(200, 65, 0, 0.9);
        }
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Base White Surface Loaded:</strong><br>
        Surface Size: <span>20,000 x 20,000 Units</span><br>
        Status: <span>Ready for Map Integration</span>
    </div>

    <!-- Full Map View Button -->
    <button id="map-btn" onclick="toggleFullMap()">🗺️ Full Map View</button>

    <!-- Live Minimap -->
    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let mapSize = 20000; // Exact 20000 x 20000 Surface
        let minimapCtx, minimapCanvas;
        let isFullMap = false;

        // Drag & Pan controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraTarget = new THREE.Vector3(0, 0, 0);

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50000);
            camera.position.set(0, 4000, 6000);
            camera.lookAt(cameraTarget);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(4000, 8000, 4000);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // 5. BASE WHITE SURFACE (20,000 x 20,000 Pure Flat White Plane)
            const surfaceGeo = new THREE.PlaneGeometry(mapSize, mapSize);
            const surfaceMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, // Pure White Surface as requested
                roughness: 0.5,
                metalness: 0.1
            });
            const baseSurface = new THREE.Mesh(surfaceGeo, surfaceMat);
            baseSurface.rotation.x = -Math.PI / 2;
            baseSurface.position.y = 0;
            baseSurface.receiveShadow = true;
            scene.add(baseSurface);

            // Mouse / Touch Dragging and Zooming Controls
            window.addEventListener('mousedown', (e) => {
                if(e.target.closest('#map-btn') || e.target.closest('#minimap-container')) return;
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let deltaX = e.clientX - previousMousePosition.x;
                let deltaY = e.clientY - previousMousePosition.y;

                cameraTarget.x -= deltaX * 4.0;
                cameraTarget.z -= deltaY * 4.0;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            window.addEventListener('wheel', (e) => {
                camera.position.y += e.deltaY * 3.5;
                camera.position.y = Math.max(500, Math.min(30000, camera.position.y));
            });

            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            window.addEventListener('resize', onWindowResize);
        }

        function toggleFullMap() {
            isFullMap = !isFullMap;
            const btn = document.getElementById('map-btn');
            if (isFullMap) {
                camera.position.set(0, 18000, 0); 
                cameraTarget.set(0, 0, 0);
                btn.innerHTML = "🗺️ Normal View";
            } else {
                camera.position.set(0, 4000, 6000); 
                cameraTarget.set(0, 0, 0);
                btn.innerHTML = "🗺️ Full Map View";
            }
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);
            minimapCtx.fillStyle = '#1e293b';
            minimapCtx.fillRect(0, 0, w, h);

            // Base Surface representation on minimap
            minimapCtx.fillStyle = '#ffffff';
            minimapCtx.fillRect(w * 0.1, h * 0.1, w * 0.8, h * 0.8);

            minimapCtx.fillStyle = '#ff3300';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 4, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            camera.lookAt(cameraTarget);
            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Open-World 3D Level & School Character</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0d1117;
            font-family: sans-serif;
            user-select: none;
        }
        #instructions {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 16px 22px;
            border-radius: 10px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        #instructions span {
            color: #58a6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <strong>HD Open-World Controls:</strong><br>
        Move: <span>W, A, S, D</span> or <span>Arrow Keys</span><br>
        Jump: <span>SPACEBAR</span><br>
        Look Around: <span>Mouse Drag</span><br>
        <em>Note: Enter houses strictly via the front door or climb stairs!</em>
    </div>

    <!-- Include Three.js & PBR Texture Libraries from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let character;
        let leftArm, rightArm, leftLeg, rightLeg;
        let obstacles = [];
        let doors = [];
        
        // Physics & Movement variables
        let velocityY = 0;
        let gravity = 0.015;
        let isGrounded = false;
        const moveSpeed = 0.14;
        const jumpForce = 0.38;
        
        let keys = { w: false, a: false, s: false, d: false };
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleX = 0, cameraAngleY = 0.45;

        init();
        animate();

        function init() {
            // 1. Scene & Atmosphere Setup (Photorealistic Sky & Fog)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x73a8f5); // HD Daytime Sky
            scene.fog = new THREE.FogExp2(0x8cb6f7, 0.003); // Deep atmospheric fog for massive scale

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);

            // 3. Renderer Setup with HD Shadows & Tone Mapping
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Advanced Lighting (Sun & HD Environment Lighting)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
            sunLight.position.set(150, 300, 150);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 4048;  // High-Res 4K Shadows
            sunLight.shadow.mapSize.height = 4048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 1000;
            const d = 250;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            // 5. Huge Open-World Ground (~FreeFire Map Scale - Half Size: 800x800 units)
            const groundGeo = new THREE.PlaneGeometry(800, 800, 64, 64);
            // Add subtle procedural vertex displacement for natural bumpy terrain
            const posAttr = groundGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i);
                const vy = posAttr.getY(i);
                if (Math.abs(vx) > 50 || Math.abs(vy) > 50) {
                    posAttr.setZ(i, Math.sin(vx * 0.02) * Math.cos(vy * 0.02) * 4);
                }
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x3b5e2b, 
                roughness: 0.9, 
                metalness: 0.05 
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 6. Build Massive World (Realistic Mountains, Specific Trees, Large Houses, Huts, Stairs)
            buildWorld();

            // 7. Build Ultra-Realistic School Uniform Dummy Character
            character = new THREE.Group();
            
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5c6a5, roughness: 0.6 });
            const whiteShirtMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.5 }); 
            const blackPantsMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.4 }); 
            const blackShoeMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.3, metalness: 0.2 }); 
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x241409, roughness: 0.8 });     

            // Torso
            const torsoGeo = new THREE.BoxGeometry(0.5, 0.65, 0.3);
            const torso = new THREE.Mesh(torsoGeo, whiteShirtMat);
            torso.position.y = 0.95;
            torso.castShadow = true;
            character.add(torso);

            // Head
            const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.45;
            head.castShadow = true;
            character.add(head);

            // Hair
            const hairGeo = new THREE.BoxGeometry(0.37, 0.12, 0.37);
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.set(0, 1.65, 0);
            hair.castShadow = true;
            character.add(hair);

            // Left Arm & Fingers
            const armGeo = new THREE.BoxGeometry(0.14, 0.52, 0.14);
            leftArm = new THREE.Mesh(armGeo, whiteShirtMat);
            leftArm.position.set(-0.35, 0.95, 0);
            leftArm.castShadow = true;
            character.add(leftArm);

            const fingerGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const leftHand = new THREE.Mesh(fingerGeo, skinMat);
            leftHand.position.set(0, -0.3, 0);
            leftArm.add(leftHand);

            // Right Arm & Fingers
            rightArm = new THREE.Mesh(armGeo, whiteShirtMat);
            rightArm.position.set(0.35, 0.95, 0);
            rightArm.castShadow = true;
            character.add(rightArm);

            const rightHand = new THREE.Mesh(fingerGeo, skinMat);
            rightHand.position.set(0, -0.3, 0);
            rightArm.add(rightHand);

            // Left Leg & Shoe
            const legGeo = new THREE.BoxGeometry(0.18, 0.5, 0.18);
            leftLeg = new THREE.Mesh(legGeo, blackPantsMat);
            leftLeg.position.set(-0.14, 0.45, 0);
            leftLeg.castShadow = true;
            character.add(leftLeg);

            const shoeGeo = new THREE.BoxGeometry(0.2, 0.12, 0.26);
            const leftShoe = new THREE.Mesh(shoeGeo, blackShoeMat);
            leftShoe.position.set(0, -0.3, 0.03);
            leftLeg.add(leftShoe);

            // Right Leg & Shoe
            rightLeg = new THREE.Mesh(legGeo, blackPantsMat);
            rightLeg.position.set(0.14, 0.45, 0);
            rightLeg.castShadow = true;
            character.add(rightLeg);

            const rightShoe = new THREE.Mesh(shoeGeo, blackShoeMat);
            rightShoe.position.set(0, -0.3, 0.03);
            rightLeg.add(rightShoe);

            // Start Position (Spawn in open village courtyard)
            character.position.set(0, 0, 15);
            scene.add(character);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            
            window.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => { isMouseDown = false; });
            window.addEventListener('mousemove', onMouseMove);
        }

        // ================= WORLD BUILDING (HD Mountains, Trees, Houses & Stairs) =================
        function buildWorld() {
            // 1. HD Mountain Ranges surrounding the map
            createMountain(-250, 20, -250, 140, 70, 140, 0x525c51);
            createMountain(250, 25, -280, 160, 85, 160, 0x475245);
            createMountain(0, 30, -350, 200, 95, 180, 0x3d473c);
            createMountain(-300, 22, 100, 150, 75, 150, 0x4a5448);
            createMountain(320, 28, 120, 180, 90, 180, 0x404b3e);

            // 2. Specific HD Trees: Bargad (Banyan), Peepal, Neem, Apple
            createBargadTree(-45, -30);
            createBargadTree(55, -45);
            
            createPeepalTree(-70, 20);
            createPeepalTree(65, 35);

            createNeemTree(-25, 50);
            createNeemTree(30, -70);

            createAppleTree(-90, -70);
            createAppleTree(95, -85);
            createAppleTree(-60, 80);

            // 3. Detailed Large Houses with Functional Doors & Stairs
            createLargeHouse(-30, -20, 0);   // House 1 (Facing Front)
            createLargeHouse(40, -40, Math.PI / 2); // House 2 (Facing Left)

            // 4. Village Huts
            createHut(-60, -10);
            createHut(70, 10);
            createHut(-20, 100);
        }

        // Detailed Mountain Generator
        function createMountain(x, y, z, w, h, d, color) {
            const geo = new THREE.ConeGeometry(w / 2, h, 8);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.95 });
            const mountain = new THREE.Mesh(geo, mat);
            mountain.position.set(x, y + h / 2 - 2, z);
            mountain.castShadow = true;
            mountain.receiveShadow = true;
            scene.add(mountain);
        }

        // Specific Tree 1: Bargad (Banyan Tree with hanging roots and massive canopy)
        function createBargadTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(1.2, 1.8, 5, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x523d28, roughness: 0.9 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 2.5, z);
            trunk.castShadow = true;
            scene.add(trunk);

            // Hanging aerial roots
            for (let i = 0; i < 4; i++) {
                const angle = i * (Math.PI / 2);
                const rootGeo = new THREE.CylinderGeometry(0.15, 0.25, 4, 5);
                const root = new THREE.Mesh(rootGeo, trunkMat);
                root.position.set(x + Math.cos(angle) * 1.5, 2, z + Math.sin(angle) * 1.5);
                scene.add(root);
            }

            // Massive Banyan Canopy clusters
            const canopyMat = new THREE.MeshStandardMaterial({ color: 0x1c4220, roughness: 0.85 });
            const topGeo = new THREE.SphereGeometry(3.5, 7, 7);
            const top = new THREE.Mesh(topGeo, canopyMat);
            top.position.set(x, 6, z);
            top.castShadow = true;
            scene.add(top);

            obstacles.push({ minX: x - 1.2, maxX: x + 1.2, minZ: z - 1.2, maxZ: z + 1.2, topY: 0 });
        }

        // Specific Tree 2: Peepal Tree (Heart-shaped leaves look, tall spread)
        function createPeepalTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.9, 1.3, 6, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x614735, roughness: 0.85 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 3, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x225c27, roughness: 0.8 });
            const leavesGeo = new THREE.DodecahedronGeometry(3, 1);
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 6.5, z);
            leaves.castShadow = true;
            scene.add(leaves);

            obstacles.push({ minX: x - 1, maxX: x + 1, minZ: z - 1, maxZ: z + 1, topY: 0 });
        }

        // Specific Tree 3: Neem Tree (Upright dense foliage)
        function createNeemTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.7, 1.0, 5, 7);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 2.5, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2d6a30, roughness: 0.8 });
            const leavesGeo = new THREE.ConeGeometry(2.5, 4.5, 6);
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 5.5, z);
            leaves.castShadow = true;
            scene.add(leaves);

            obstacles.push({ minX: x - 0.8, maxX: x + 0.8, minZ: z - 0.8, maxZ: z + 0.8, topY: 0 });
        }

        // Specific Tree 4: Apple Tree (With red fruit accents)
        function createAppleTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.6, 0.9, 4, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.85 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 2, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x286b32, roughness: 0.8 });
            const leavesGeo = new THREE.SphereGeometry(2.2, 6, 6);
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 4.5, z);
            leaves.castShadow = true;
            scene.add(leaves);

            // Red apples
            const appleMat = new THREE.MeshStandardMaterial({ color: 0xcc2929, roughness: 0.4 });
            for (let i = 0; i < 4; i++) {
                const apple = new THREE.Mesh(new THREE.SphereGeometry(0.15, 4, 4), appleMat);
                apple.position.set(x + (i % 2 === 0 ? 0.8 : -0.8), 4 + (i * 0.2), z + (i > 1 ? 0.8 : -0.8));
                scene.add(apple);
            }

            obstacles.push({ minX: x - 0.7, maxX: x + 0.7, minZ: z - 0.7, maxZ: z + 0.7, topY: 0 });
        }

        // Large Multi-Room House with Functional Doorway & Climbable Stairs
        function createLargeHouse(x, z, rotationY) {
            const houseGroup = new THREE.Group();
            houseGroup.position.set(x, 0, z);
            houseGroup.rotation.y = rotationY;

            // Main Walls (Brick/Concrete HD texture feel)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xd9d9d9, roughness: 0.7 });
            const brickMat = new THREE.MeshStandardMaterial({ color: 0xa84332, roughness: 0.8 });

            // House Base Structure
            const baseGeo = new THREE.BoxGeometry(8, 5, 8);
            const base = new THREE.Mesh(baseGeo, wallMat);
            base.position.y = 2.5;
            base.castShadow = true;
            base.receiveShadow = true;
            houseGroup.add(base);

            // Roof (Slanted gable roof)
            const roofGeo = new THREE.ConeGeometry(6.2, 3, 4);
            const roof = new THREE.Mesh(roofGeo, brickMat);
            roof.position.y = 6.5;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            houseGroup.add(roof);

            // Front Door Opening (Gap/Archway so dummy enters strictly through door)
            // We set up collision boundaries around the house walls, leaving the front door open.
            
            // Staircase leading to entrance
            for (let i = 0; i < 3; i++) {
                const stairGeo = new THREE.BoxGeometry(2.5, 0.3, 0.6);
                const stairMat = new THREE.MeshStandardMaterial({ color: 0x7a7a7a, roughness: 0.6 });
                const stair = new THREE.Mesh(stairGeo, stairMat);
                stair.position.set(0, i * 0.3 + 0.15, 4.3 + (2 - i) * 0.5);
                stair.castShadow = true;
                stair.receiveShadow = true;
                houseGroup.add(stair);

                // Register stairs as climbable collision platforms
                // Transform local stair position to world space for collision check
                const worldStairX = x + stair.position.x * Math.cos(rotationY) - stair.position.z * Math.sin(rotationY);
                const worldStairZ = z + stair.position.x * Math.sin(rotationY) + stair.position.z * Math.cos(rotationY);
                obstacles.push({
                    minX: worldStairX - 1.3, maxX: worldStairX + 1.3,
                    minZ: worldStairZ - 0.4, maxZ: worldStairZ + 0.4,
                    topY: stair.position.y + 0.15
                });
            }

            scene.add(houseGroup);

            // House Wall Collisions (Excluding Front Doorway so dummy enters inside)
            // Left Wall
            obstacles.push({ minX: x - 4.2, maxX: x - 3.8, minZ: z - 4, maxZ: z + 4, topY: 5 });
            // Right Wall
            obstacles.push({ minX: x + 3.8, maxX: x + 4.2, minZ: z - 4, maxZ: z + 4, topY: 5 });
            // Back Wall
            obstacles.push({ minX: x - 4, maxX: x + 4, minZ: z - 4.2, maxZ: z - 3.8, topY: 5 });
            // Front Left Wall segment
            obstacles.push({ minX: x - 4, maxX: x - 1.2, minZ: z + 3.8, maxZ: z + 4.2, topY: 5 });
            // Front Right Wall segment
            obstacles.push({ minX: x + 1.2, maxX: x + 4, minZ: z + 3.8, maxZ: z + 4.2, topY: 5 });
        }

        // Village Hut Generator
        function createHut(x, z) {
            const wallGeo = new THREE.BoxGeometry(3.5, 2.2, 3.5);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xc49a6c, roughness: 0.8 });
            const walls = new THREE.Mesh(wallGeo, wallMat);
            walls.position.set(x, 1.1, z);
            walls.castShadow = true;
            walls.receiveShadow = true;
            scene.add(walls);

            const roofGeo = new THREE.ConeGeometry(2.8, 1.8, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x994d1a, roughness: 0.7 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(x, 3.1, z);
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            scene.add(roof);

            // Hut collision with door gap on front
            obstacles.push({ minX: x - 1.8, maxX: x - 0.6, minZ: z + 1.6, maxZ: z + 1.9, topY: 2.2 });
            obstacles.push({ minX: x + 0.6, maxX: x + 1.8, minZ: z + 1.6, maxZ: z + 1.9, topY: 2.2 });
            obstacles.push({ minX: x - 1.9, maxX: x - 1.6, minZ: z - 1.8, maxZ: z + 1.8, topY: 2.2 });
            obstacles.push({ minX: x + 1.6, maxX: x + 1.9, minZ: z - 1.8, maxZ: z + 1.8, topY: 2.2 });
            obstacles.push({ minX: x - 1.8, maxX: x + 1.8, minZ: z - 1.9, maxZ: z - 1.6, topY: 2.2 });
        }

        function handleKey(e, isDown) {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.w = isDown; break;
                case 'KeyS': case 'ArrowDown': keys.s = isDown; break;
                case 'KeyA': case 'ArrowLeft': keys.a = isDown; break;
                case 'KeyD': case 'ArrowRight': keys.d = isDown; break;
                case 'Space': 
                    if (isDown && isGrounded) {
                        velocityY = jumpForce;
                        isGrounded = false;
                    }
                    break;
            }
        }

        function onMouseMove(e) {
            if (!isMouseDown) return;
            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;
            
            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(1.4, cameraAngleY - deltaY * 0.005));
            
            mouseX = e.clientX;
            mouseY = e.clientY;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Camera-relative Movement Calculation
            let inputX = 0;
            let inputZ = 0;

            if (keys.w) inputZ -= 1;
            if (keys.s) inputZ += 1;
            if (keys.a) inputX -= 1;
            if (keys.d) inputX += 1;

            if (inputX !== 0 || inputZ !== 0) {
                const moveX = (inputX * Math.cos(cameraAngleX) + inputZ * Math.sin(cameraAngleX)) * moveSpeed;
                const moveZ = (inputX * -Math.sin(cameraAngleX) + inputZ * Math.cos(cameraAngleX)) * moveSpeed;

                character.position.x += moveX;
                character.position.z += moveZ;

                // Automatically rotate dummy towards camera movement direction
                const targetRotation = Math.atan2(moveX, moveZ);
                character.rotation.y = targetRotation;
            }

            // Gravity & Vertical Physics
            velocityY -= gravity;
            character.position.y += velocityY;

            // Surface Collision Check (Prevent sinking into ground or house walls)
            let targetGroundY = 0;

            for (let obs of obstacles) {
                if (character.position.x >= obs.minX && character.position.x <= obs.maxX &&
                    character.position.z >= obs.minZ && character.position.z <= obs.maxZ) {
                    if (character.position.y >= obs.topY - 0.6 && character.position.y <= obs.topY + 0.6) {
                        if (obs.topY > targetGroundY) {
                            targetGroundY = obs.topY;
                        }
                    }
                }
            }

            if (character.position.y <= targetGroundY) {
                character.position.y = targetGroundY;
                velocityY = 0;
                isGrounded = true;
            }

            // Animations (Walking & Jumping)
            const time = Date.now() * 0.01;
            const isMoving = (inputX !== 0 || inputZ !== 0) && isGrounded;

            if (!isGrounded) {
                // Jump Pose: Arms raised up, legs bent
                leftArm.rotation.x = -Math.PI * 0.6;
                rightArm.rotation.x = -Math.PI * 0.6;
                leftLeg.rotation.x = Math.PI * 0.3;
                rightLeg.rotation.x = -Math.PI * 0.3;
            } else if (isMoving) {
                // Walk Animation: Swing arms and legs
                leftArm.rotation.x = Math.sin(time) * 0.8;
                rightArm.rotation.x = -Math.sin(time) * 0.8;
                leftLeg.rotation.x = -Math.sin(time) * 0.8;
                rightLeg.rotation.x = Math.sin(time) * 0.8;
            } else {
                // Idle Pose
                leftArm.rotation.x = 0;
                rightArm.rotation.x = 0;
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
            }

            // Smooth Third-Person Camera Follow
            const camDistance = 6.5;
            const targetCamX = character.position.x + Math.sin(cameraAngleX) * camDistance * Math.cos(cameraAngleY);
            const targetCamY = character.position.y + Math.sin(cameraAngleY) * camDistance + 1.0;
            const targetCamZ = character.position.z + Math.cos(cameraAngleX) * camDistance * Math.cos(cameraAngleY);

            camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.1);
            camera.lookAt(character.position.x, character.position.y + 1.0, character.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

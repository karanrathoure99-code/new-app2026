<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open-World Map - Seamless Boundary Mountains, Ocean & Center Peak</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Open-World Battleground:</strong><br>
        Map Area: <span>4000 x 4000 Units</span><br>
        Status: <span>Seamless Border Mountains, 10k Ocean & Center Peak Loaded</span>
    </div>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let mapSize = 4000;
        let minimapCtx, minimapCanvas;

        init();
        animate();

        function init() {
            // 1. Scene & Sky Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5294e2);
            scene.fog = new THREE.FogExp2(0x75aff7, 0.0004);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 15000);
            camera.position.set(0, 400, 700);
            camera.lookAt(0, 0, 0);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(800, 1200, 800);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 5000;
            const d = 1000;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // 5. Massive Ocean Surrounding (10,000 Units Wide)
            const oceanGeo = new THREE.PlaneGeometry(12000, 12000);
            const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1b4f72, roughness: 0.2 });
            const ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -2;
            scene.add(ocean);

            // 6. Map Terrain Ground
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize, 220, 220);
            const posAttr = groundGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                // Surface small hills (Chote pahadi area)
                let height = Math.sin(vx * 0.005) * Math.cos(vy * 0.005) * 18;
                posAttr.setZ(i, height);
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ color: 0x315c1b, roughness: 0.88 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 7. Build World Features (Seamless Boundary Ring, Center Peak, Surface Hills, Rivers)
            buildWorldFeatures();

            // Setup Minimap
            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            window.addEventListener('resize', onWindowResize);
        }

        function createOrganicMountain(x, z, radius, height, colorHex) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const segments = 24;
            const geo = new THREE.ConeGeometry(radius, height, segments, 16, true);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let vx = pos.getX(i);
                let vy = pos.getY(i);
                let vz = pos.getZ(i);
                if (vy > 0) {
                    let noise = Math.sin(vx * 0.08) * Math.cos(vz * 0.08) * 12 + (Math.random() - 0.5) * 8;
                    pos.setX(i, vx + noise);
                    pos.setZ(i, vz + noise);
                }
            }
            geo.computeVertexNormals();

            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.95, flatShading: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = height / 2;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);

            scene.add(group);
        }

        function buildWorldFeatures() {
            // A. MAP KE CHARO AUR BINA KISI GAP KE SEAMLESS PAHAADI BOUNDARY (Ring of Mountains)
            let boundarySize = mapSize / 2 - 100;
            let step = 350;
            for (let x = -boundarySize; x <= boundarySize; x += step) {
                createOrganicMountain(x, -boundarySize - 100, 300, 380, 0x434c40); // North Wall
                createOrganicMountain(x, boundarySize + 100, 300, 380, 0x3f483c);  // South Wall
            }
            for (let z = -boundarySize; z <= boundarySize; z += step) {
                createOrganicMountain(-boundarySize - 100, z, 300, 380, 0x475444); // West Wall
                createOrganicMountain(boundarySize + 100, z, 300, 380, 0x3b4338);  // East Wall
            }

            // B. MAP KE BILKUL BEECH MEIN 1 BADA MUKHYA PAHAAD (Center Peak)
            createOrganicMountain(0, 0, 450, 420, 0x525c4e);

            // C. SURFACE PAR CHOTE-CHOTE PAHAADI AREA (Rolling Hills)
            createOrganicMountain(-900, -800, 200, 160, 0x4a5446);
            createOrganicMountain(900, 800, 220, 180, 0x485244);
            createOrganicMountain(-800, 900, 180, 140, 0x4f5a4b);
            createOrganicMountain(800, -900, 190, 150, 0x465042);

            // D. NADIYAN (Rivers)
            const riverMat = new THREE.MeshStandardMaterial({ color: 0x2980b9, roughness: 0.3 });
            const river1 = new THREE.Mesh(new THREE.PlaneGeometry(40, 3800), riverMat);
            river1.rotation.x = -Math.PI / 2;
            river1.rotation.z = Math.PI / 4;
            river1.position.set(0, 0.2, 0);
            scene.add(river1);

            // E. Trees
            for (let i = 0; i < 120; i++) {
                let tx = (Math.random() - 0.5) * 3200;
                let tz = (Math.random() - 0.5) * 3200;
                if (Math.abs(tx) < 300 && Math.abs(tz) < 300) continue; // Keep center peak clear
                createRealisticTree(tx, tz);
            }
        }

        function createRealisticTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 8, 8), trunkMat);
            trunk.position.set(x, 4, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1d4722, roughness: 0.7 });
            const top = new THREE.Mesh(new THREE.SphereGeometry(3.5, 8, 8), foliageMat);
            top.position.set(x, 8.5, z);
            top.castShadow = true;
            scene.add(top);
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);
            minimapCtx.fillStyle = '#1b4f72'; // Ocean blue background on minimap
            minimapCtx.fillRect(0, 0, w, h);

            // Draw land mass representation
            minimapCtx.fillStyle = '#315c1b';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, w*0.38, 0, Math.PI*2);
            minimapCtx.fill();

            // Center Peak Dot
            minimapCtx.fillStyle = '#525c4e';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 8, 0, Math.PI*2);
            minimapCtx.fill();

            // Center indicator
            minimapCtx.fillStyle = '#ff3300';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 4, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            let time = Date.now() * 0.00015;
            camera.position.x = Math.sin(time) * 900;
            camera.position.z = Math.cos(time) * 900;
            camera.lookAt(0, 100, 0);

            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z PAJAL - Pure Devil Levels</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .screen-container {
            width: 100%;
            max-width: 720px;
            background: #ffb356;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.4);
            position: relative;
        }

        /* Top HUD Bar */
        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #916000;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            color: #ffb356;
            font-size: 10px;
        }

        .hud-actions {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #ffb356;
            color: #916000;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .hud-btn:active {
            transform: scale(0.94);
        }

        /* Canvas Stage */
        canvas {
            background: #ffb356;
            display: block;
            border-radius: 8px;
        }

        /* Touch Controls for Phones & Tablets */
        .touch-controller {
            display: none;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
        }

        @media (pointer: coarse), (max-width: 900px) {
            .touch-controller {
                display: flex;
            }
        }

        .touch-left {
            display: flex;
            gap: 10px;
        }

        .t-btn {
            background: #916000;
            color: #ffb356;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            touch-action: manipulation;
        }

        .t-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .t-jump {
            padding: 16px 26px;
        }

        /* Troll Dialog Modal */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #916000;
            color: #ffb356;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 99;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.5);
        }

        .modal h2 {
            font-size: 13px;
            margin-bottom: 12px;
        }

        .modal p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 15px;
            margin-bottom: 16px;
            font-weight: 700;
            line-height: 1.4;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            background: #ffb356;
            color: #916000;
            padding: 10px 14px;
            font-size: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <!-- Top HUD -->
        <div class="hud-bar">
            <span id="hudLvl">LVL: 1</span>
            <span id="hudTitle">RUNAWAY DOOR</span>
            <div class="hud-actions">
                <button class="hud-btn" onclick="restart()">🔄</button>
                <button class="hud-btn" onclick="goToLevels()">📜</button>
                <button class="hud-btn" onclick="enableFullscreen()">⛶</button>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="stage" width="640" height="280"></canvas>

        <!-- Touch Controls (Left hand = Move, Right hand = Jump) -->
        <div class="touch-controller">
            <div class="touch-left">
                <button class="t-btn" id="btnLeft">◀</button>
                <button class="t-btn" id="btnRight">▶</button>
            </div>
            <button class="t-btn t-jump" id="btnJump">⬆</button>
        </div>

        <!-- Popups -->
        <div class="modal" id="failModal">
            <h2>💀 TROLLED!</h2>
            <p id="failQuote">Kaisa laga dhoka?</p>
            <div class="modal-btns">
                <button class="modal-btn" onclick="restart()">RETRY 🔄</button>
                <button class="modal-btn" onclick="goToLevels()">LEVELS 📜</button>
            </div>
        </div>

        <div class="modal" id="winModal">
            <h2>🎉 CLEARED!</h2>
            <p id="winQuote">Agla level aur ganda hone wala hai!</p>
            <div class="modal-btns">
                <button class="modal-btn" onclick="nextLvl()">NEXT ➡️</button>
                <button class="modal-btn" onclick="goToLevels()">LEVELS 📜</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen & Landscape -->
    <script>
        async function enableFullscreen() {
            const el = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }
        window.addEventListener('click', enableFullscreen, { once: true });
        window.addEventListener('touchstart', enableFullscreen, { once: true });
    </script>

    <!-- Game Engine & 15 Progressive Devil Levels -->
    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');

        const hudLvl = document.getElementById('hudLvl');
        const hudTitle = document.getElementById('hudTitle');
        const failModal = document.getElementById('failModal');
        const winModal = document.getElementById('winModal');
        const failQuote = document.getElementById('failQuote');

        let isOver = false;

        // Player Physical Entity
        let p = {
            x: 40,
            y: 200,
            w: 22,
            h: 22,
            vx: 0,
            vy: 0,
            speed: 3.8,
            jumpStrength: -8.8,
            onGround: false
        };

        // 15 Fully Built Levels (Step-by-Step Difficulty Curve)
        const levels = [
            // Level 1: Basics + Runaway door
            {
                id: 1,
                name: "THE RUNAWAY DOOR",
                quote: "Darwaaza dekh ke aage daudte mat raho!",
                floorY: 240,
                door: { x: 550, y: 190, w: 26, h: 36 },
                spikes: [{ x: 300, y: 226, w: 30, h: 14 }],
                logic: (lvl) => {
                    if (p.x > 380 && !lvl.trolled) {
                        lvl.door.x -= 8;
                        if (lvl.door.x <= 40) {
                            lvl.door.x = 40;
                            lvl.trolled = true;
                        }
                    }
                }
            },
            // Level 2: Invisible bump in air
            {
                id: 2,
                name: "INVISIBLE BLOCK",
                quote: "Sir pe chot lagi? Upar chhipa hua pathar tha!",
                floorY: 240,
                door: { x: 550, y: 190, w: 26, h: 36 },
                spikes: [{ x: 300, y: 226, w: 50, h: 14 }],
                blocks: [{ x: 305, y: 130, w: 40, h: 18, hit: false }],
                logic: (lvl) => {
                    lvl.blocks.forEach(b => {
                        if (p.x + p.w > b.x && p.x < b.x + b.w && p.y <= b.y + b.h && p.y >= b.y) {
                            b.hit = true;
                            p.vy = 4;
                        }
                    });
                }
            },
            // Level 3: Missile Spike
            {
                id: 3,
                name: "FLYING SPIKE",
                quote: "Spike ne sniper ban ke hawa mein uda diya!",
                floorY: 240,
                door: { x: 550, y: 190, w: 26, h: 36 },
                spikes: [{ x: 350, y: 226, w: 26, h: 14, fly: false }],
                logic: (lvl) => {
                    let s = lvl.spikes[0];
                    if (!p.onGround && p.x > 180) s.fly = true;
                    if (s.fly) {
                        s.x -= 6.5;
                        s.y -= 1.8;
                    }
                }
            },
            // Level 4: Vanishing Floor
            {
                id: 4,
                name: "COLLAPSING FLOOR",
                quote: "Pairon ke neeche se zameen hi gayab ho gayi!",
                floorY: 240,
                door: { x: 550, y: 190, w: 26, h: 36 },
                fakeGround: { x: 230, y: 240, w: 120, active: true },
                spikes: [],
                logic: (lvl) => {
                    if (p.x > 210 && p.x < 350 && lvl.fakeGround.active) {
                        lvl.fakeGround.active = false;
                    }
                }
            },
            // Level 5: Inverted controls
            {
                id: 5,
                name: "BUTTON BETRAYAL",
                quote: "Right dabaya par character Left spike pe kood gaya!",
                floorY: 240,
                door: { x: 550, y: 190, w: 26, h: 36 },
                spikes: [{ x: 440, y: 226, w: 34, h: 14 }],
                inverted: false,
                logic: (lvl) => {
                    if (p.x > 250 && !lvl.inverted) {
                        lvl.inverted = true;
                        hudTitle.innerText = "CONTROLS REVERSED!";
                    }
                }
            },
            // Level 6: Fake Exit Door
            {
                id: 6,
                name: "FAKE DOOR",
                quote: "Jo dikhta hai wo door nahi, dhoka hai!",
                floorY: 240,
                door: { x: 550, y: 190, w: 26, h: 36, isFake: true },
                realDoor: { x: 30, y: 190, w: 26, h: 36, visible: false },
                spikes: [{ x: 260, y: 226, w: 30, h: 14 }],
                logic: (lvl) => {
                    if (p.x > 480 && lvl.door.isFake) {
                        lvl.door.turnedSpike = true;
                        lvl.realDoor.visible = true;
                    }
                }
            },
            // Level 7: Ceiling & Floor Pinch
            {
                id: 7,
                name: "CEILING PINCH",
                quote: "Zyada unchi jump loge toh sir tootega!",
                floorY: 240,
                door: { x: 560, y: 190, w: 26, h: 36 },
                spikes: [
                    { x: 320, y: 226, w: 30, h: 14 },
                    { x: 280, y: 50, w: 90, h: 14 }
                ],
                logic: () => {
                    if (p.y < 65 && p.x > 270 && p.x < 380) {
                        die("Ceiling ke spikes ne sir phod diya!");
                    }
                }
            },
            // Level 8: Slippery Moving Platform over Void
            {
                id: 8,
                name: "SLIPPERY PLATFORM",
                quote: "Platform pe pair rakhte hi piche phisla diya!",
                floorY: 240,
                door: { x: 560, y: 130, w: 26, h: 36 },
                spikes: [{ x: 0, y: 226, w: 640, h: 14 }],
                movingPlat: { x: 160, y: 180, w: 70, h: 14 },
                logic: (lvl) => {
                    let pl = lvl.movingPlat;
                    if (p.x + p.w > pl.x && p.x < pl.x + pl.w && p.y + p.h >= pl.y && p.y + p.h <= pl.y + 10) {
                        p.y = pl.y - p.h;
                        p.vy = 0;
                        p.onGround = true;
                        pl.x -= 3;
                    }
                }
            },
            // Level 9: Mid-Air Surprise Spike
            {
                id: 9,
                name: "AIR TRIPWIRE",
                quote: "Hawa mein spike spawn ho gaya!",
                floorY: 240,
                door: { x: 560, y: 190, w: 26, h: 36 },
                spikes: [
                    { x: 220, y: 226, w: 26, h: 14 },
                    { x: 420, y: 226, w: 26, h: 14 }
                ],
                ghostSpike: { x: 320, y: 140, w: 26, h: 14, active: false },
                logic: (lvl) => {
                    if (!p.onGround && p.x > 250 && p.x < 380) {
                        lvl.ghostSpike.active = true;
                    }
                    if (lvl.ghostSpike.active) {
                        let gs = lvl.ghostSpike;
                        if (p.x < gs.x + gs.w && p.x + p.w > gs.x && p.y < gs.y + gs.h && p.y + p.h > gs.y) {
                            die("Hawa ke spike ne pakad liya!");
                        }
                    }
                }
            },
            // Level 10: Sinking Ground + Flying Spike
            {
                id: 10,
                name: "THE DEVIL DOUBLE",
                quote: "Spike bhi uda aur zameen bhi toot gayi!",
                floorY: 240,
                door: { x: 560, y: 190, w: 26, h: 36 },
                spikes: [{ x: 380, y: 226, w: 26, h: 14, fly: false }],
                fakeGround: { x: 180, y: 240, w: 100, active: true },
                logic: (lvl) => {
                    if (p.x > 160 && lvl.fakeGround.active) lvl.fakeGround.active = false;
                    let s = lvl.spikes[0];
                    if (!p.onGround && p.x > 280) s.fly = true;
                    if (s.fly) s.x -= 7;
                }
            },
            // Level 11: Decoy Door Chase
            {
                id: 11,
                name: "BOUNCING DOOR",
                quote: "Door jump maar ke spikes ke piche chala gaya!",
                floorY: 240,
                door: { x: 300, y: 190, w: 26, h: 36 },
                spikes: [{ x: 400, y: 226, w: 60, h: 14 }],
                logic: (lvl) => {
                    if (p.x > 220 && !lvl.hopped) {
                        lvl.door.x = 550;
                        lvl.hopped = true;
                    }
                }
            },
            // Level 12: Narrow Step Tightrope
            {
                id: 12,
                name: "PIXEL LEDGE",
                quote: "0.1 second ki galti aur seedha patal!",
                floorY: 240,
                door: { x: 560, y: 190, w: 26, h: 36 },
                spikes: [{ x: 0, y: 226, w: 640, h: 14 }],
                movingPlat: { x: 260, y: 190, w: 40, h: 14 },
                logic: (lvl) => {
                    let pl = lvl.movingPlat;
                    if (p.x + p.w > pl.x && p.x < pl.x + pl.w && p.y + p.h >= pl.y && p.y + p.h <= pl.y + 10) {
                        p.y = pl.y - p.h;
                        p.vy = 0;
                        p.onGround = true;
                    }
                }
            },
            // Level 13: The Reversing Leap
            {
                id: 13,
                name: "MOMENTUM FLIP",
                quote: "Hawa mein gravity ulte raste kheenchne lagi!",
                floorY: 240,
                door: { x: 560, y: 190, w: 26, h: 36 },
                spikes: [{ x: 300, y: 226, w: 40, h: 14 }],
                logic: () => {
                    if (!p.onGround && p.x > 280 && p.x < 360) {
                        p.vx = -4.5; // blows player backwards into spike
                    }
                }
            },
            // Level 14: Double Fake Door + Collapsing Ceiling
            {
                id: 14,
                name: "GASLIGHT CHAMBER",
                quote: "Dono darwaze jhoothe the!",
                floorY: 240,
                door: { x: 560, y: 190, w: 26, h: 36, turnedSpike: false },
                realDoor: { x: 40, y: 190, w: 26, h: 36, visible: false },
                spikes: [{ x: 280, y: 226, w: 30, h: 14 }],
                logic: (lvl) => {
                    if (p.x > 460) {
                        lvl.door.turnedSpike = true;
                        lvl.realDoor.visible = true;
                    }
                }
            },
            // Level 15: Grand Master Hell Gauntlet
            {
                id: 15,
                name: "ULTIMATE DEVIL RAGE",
                quote: "Yahan aakar haar gaye na? Tumse sach mein na ho payega!",
                floorY: 240,
                door: { x: 560, y: 190, w: 26, h: 36 },
                spikes: [
                    { x: 180, y: 226, w: 26, h: 14 },
                    { x: 360, y: 226, w: 26, h: 14, fly: false }
                ],
                fakeGround: { x: 240, y: 240, w: 80, active: true },
                inverted: false,
                logic: (lvl) => {
                    if (p.x > 220 && lvl.fakeGround.active) lvl.fakeGround.active = false;
                    let s = lvl.spikes[1];
                    if (!p.onGround && p.x > 300) s.fly = true;
                    if (s.fly) s.x -= 8;
                    if (p.x > 460 && !lvl.inverted) {
                        lvl.inverted = true;
                        hudTitle.innerText = "CONTROLS REVERSED!";
                    }
                }
            }
        ];

        // Parse query param or localStorage
        const urlParams = new URLSearchParams(window.location.search);
        let activeIdx = (parseInt(urlParams.get('level')) || parseInt(localStorage.getItem('currentPlayLevel')) || 1) - 1;
        activeIdx = Math.max(0, Math.min(levels.length - 1, activeIdx));
        let activeLevel = null;

        function loadLevel(idx) {
            activeIdx = idx;
            activeLevel = JSON.parse(JSON.stringify(levels[idx]));
            isOver = false;

            p.x = 40;
            p.y = activeLevel.floorY - p.h;
            p.vx = 0;
            p.vy = 0;
            p.onGround = true;

            hudLvl.innerText = "LVL: " + activeLevel.id;
            hudTitle.innerText = activeLevel.name;

            failModal.style.display = "none";
            winModal.style.display = "none";
        }

        // Keyboard Controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'ArrowLeft') keys['left'] = true;
            if (e.key === 'ArrowRight') keys['right'] = true;
            if (e.key === 'ArrowUp' || e.key === ' ') keys['jump'] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            if (e.key === 'ArrowLeft') keys['left'] = false;
            if (e.key === 'ArrowRight') keys['right'] = false;
            if (e.key === 'ArrowUp' || e.key === ' ') keys['jump'] = false;
        });

        // Touch Control Helpers
        function bindTouch(id, k) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
            btn.addEventListener('mousedown', () => { keys[k] = true; });
            btn.addEventListener('mouseup', () => { keys[k] = false; });
        }
        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnJump', 'jump');

        function die(customQuote) {
            if (isOver) return;
            isOver = true;
            failQuote.innerText = customQuote || activeLevel.quote;
            failModal.style.display = "block";
        }

        function win() {
            if (isOver) return;
            isOver = true;
            winModal.style.display = "block";
            let saved = parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga')) || 1;
            if (activeLevel.id + 1 > saved) {
                localStorage.setItem('saveLevel_TumseNaHoPayga', activeLevel.id + 1);
            }
        }

        window.restart = () => loadLevel(activeIdx);
        window.nextLvl = () => {
            if (activeIdx + 1 < levels.length) loadLevel(activeIdx + 1);
            else {
                alert("ULTIMATE MASTER! Saare Devil Levels Paar Kar Liye!");
                goToLevels();
            }
        };
        window.goToLevels = () => { window.location.href = "level.html"; };

        // Physics & Engine Loop
        function update() {
            if (isOver) return;

            let move = 0;
            if (keys['a'] || keys['left']) move -= 1;
            if (keys['d'] || keys['right']) move += 1;

            if (activeLevel.inverted) move = -move;
            p.vx = move * p.speed;

            if ((keys['w'] || keys['jump']) && p.onGround) {
                p.vy = p.jumpStrength;
                p.onGround = false;
            }

            p.vy += 0.44;
            p.x += p.vx;
            p.y += p.vy;

            // Trigger level's unique trap
            activeLevel.logic(activeLevel);

            // Floor & Void Calculation
            let groundY = activeLevel.floorY;
            if (activeLevel.fakeGround && !activeLevel.fakeGround.active) {
                if (p.x + p.w > activeLevel.fakeGround.x && p.x < activeLevel.fakeGround.x + activeLevel.fakeGround.w) {
                    groundY = 320;
                }
            }

            if (p.y + p.h >= groundY) {
                p.y = groundY - p.h;
                p.vy = 0;
                p.onGround = true;
            }

            if (p.y > 280) die("Neeche khadde mein gir gaye! 😂");

            // Spikes Collisions
            if (activeLevel.spikes) {
                activeLevel.spikes.forEach(s => {
                    if (p.x < s.x + s.w && p.x + p.w > s.x && p.y < s.y + s.h && p.y + p.h > s.y) {
                        die();
                    }
                });
            }

            // Door Handling
            let d = activeLevel.door;
            if (p.x < d.x + d.w && p.x + p.w > d.x && p.y < d.y + d.h && p.y + p.h > d.y) {
                if (d.turnedSpike) die("Door toh spike ban gaya! Starting point pe dekho!");
                else if (!d.isFake) win();
            }

            if (activeLevel.realDoor && activeLevel.realDoor.visible) {
                let rd = activeLevel.realDoor;
                if (p.x < rd.x + rd.w && p.x + p.w > rd.x && p.y < rd.y + rd.h && p.y + p.h > rd.y) {
                    win();
                }
            }
        }

        // Render Canvas (2 Colors: #916000 & #ffb356)
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground (#916000)
            ctx.fillStyle = "#916000";
            if (activeLevel.fakeGround && !activeLevel.fakeGround.active) {
                ctx.fillRect(0, activeLevel.floorY, activeLevel.fakeGround.x, 40);
                ctx.fillRect(activeLevel.fakeGround.x + activeLevel.fakeGround.w, activeLevel.floorY, canvas.width, 40);
            } else {
                ctx.fillRect(0, activeLevel.floorY, canvas.width, 40);
            }

            // Floating Platform
            if (activeLevel.movingPlat) {
                ctx.fillStyle = "#916000";
                ctx.fillRect(activeLevel.movingPlat.x, activeLevel.movingPlat.y, activeLevel.movingPlat.w, activeLevel.movingPlat.h);
            }

            // Spikes (#916000)
            if (activeLevel.spikes) {
                ctx.fillStyle = "#916000";
                activeLevel.spikes.forEach(s => {
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y + s.h);
                    ctx.lineTo(s.x + s.w / 2, s.y);
                    ctx.lineTo(s.x + s.w, s.y + s.h);
                    ctx.fill();
                });
            }

            // Ghost mid-air spike
            if (activeLevel.ghostSpike && activeLevel.ghostSpike.active) {
                let gs = activeLevel.ghostSpike;
                ctx.fillStyle = "#916000";
                ctx.beginPath();
                ctx.moveTo(gs.x, gs.y + gs.h);
                ctx.lineTo(gs.x + gs.w / 2, gs.y);
                ctx.lineTo(gs.x + gs.w, gs.y + gs.h);
                ctx.fill();
            }

            // Invisible blocks
            if (activeLevel.blocks) {
                activeLevel.blocks.forEach(b => {
                    if (b.hit) {
                        ctx.fillStyle = "#916000";
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.fillStyle = "#ffb356";
                        ctx.fillText("?", b.x + 14, b.y + 13);
                    }
                });
            }

            // Door
            let d = activeLevel.door;
            if (d.turnedSpike) {
                ctx.fillStyle = "#916000";
                ctx.fillRect(d.x, d.y, d.w, d.h);
                ctx.fillStyle = "#ffb356";
                ctx.fillText("😈", d.x + 4, d.y + 22);
            } else {
                ctx.fillStyle = "#916000";
                ctx.fillRect(d.x, d.y, d.w, d.h);
                ctx.fillStyle = "#ffb356";
                ctx.fillRect(d.x + 4, d.y + 4, d.w - 8, d.h - 8);
            }

            if (activeLevel.realDoor && activeLevel.realDoor.visible) {
                let rd = activeLevel.realDoor;
                ctx.fillStyle = "#916000";
                ctx.fillRect(rd.x, rd.y, rd.w, rd.h);
                ctx.fillStyle = "#ffb356";
                ctx.fillRect(rd.x + 4, rd.y + 4, rd.w - 8, rd.h - 8);
            }

            // Player Devil (#916000 Body, #ffb356 Horns & Eyes)
            ctx.fillStyle = "#916000";
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = "#ffb356";
            ctx.fillRect(p.x + 2, p.y - 4, 4, 4);
            ctx.fillRect(p.x + p.w - 6, p.y - 4, 4, 4);
            ctx.fillRect(p.x + 4, p.y + 6, 3, 3);
            ctx.fillRect(p.x + 14, p.y + 6, 3, 3);
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        loadLevel(activeIdx);
        loop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤪 Z PAJAL - Level Devil Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #a26916;
      --corridor-bg: #fca240;
      --player-color: #000000;
      --door-frame: #3b2200;
      --door-fill: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Press Start 2P', monospace;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-outer);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      padding: 10px 10px 16px 10px;
    }

    .top-header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
    }

    .level-badge {
      background: #4a2d04;
      color: #fca240;
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      outline: none;
      box-shadow: 0 4px 0 #281700;
      letter-spacing: 1px;
    }

    .levels-btn {
      background: #fca240;
      color: #3b2200;
      font-size: 10px;
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #b86e18;
      transition: transform 0.08s ease;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
    }

    .levels-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b86e18;
    }

    #gameCanvas {
      background-color: var(--bg-outer);
      image-rendering: pixelated;
      display: block;
      border-radius: 4px;
      max-width: 98vw;
      max-height: 72vh;
    }

    /* On-Screen Touch Buttons (Phone / Tablet Only) */
    .controls-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .dpad {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .ctrl-btn {
      width: 74px;
      height: 48px;
      background: rgba(252, 162, 64, 0.45);
      border: 3px solid rgba(74, 45, 4, 0.55);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: #3b2200;
      cursor: pointer;
      touch-action: manipulation;
    }

    .ctrl-btn:active {
      background: rgba(252, 162, 64, 0.85);
      transform: scale(0.96);
    }

    /* Laptop / Desktop par buttons hide */
    @media (hover: hover) and (pointer: fine) {
      .controls-container {
        display: none !important;
      }
      body {
        justify-content: center;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="level-badge" id="levelDisplay">LEVEL 1 / 2</div>
    <a href="levels.html" class="levels-btn">📑 LEVELS</a>
  </div>

  <canvas id="gameCanvas" width="960" height="400"></canvas>

  <!-- Phone / Tablet Touch Controls with Crouch (Down) Button -->
  <div class="controls-container">
    <div class="dpad">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnDown">▼</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <button class="ctrl-btn" id="btnJump">▲</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('levelDisplay');

    // Auto Fullscreen & Landscape on tap/click anywhere
    async function triggerAutoFullscreen() {
      try {
        const docEl = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (docEl.requestFullscreen) {
            await docEl.requestFullscreen();
          } else if (docEl.webkitRequestFullscreen) {
            await docEl.webkitRequestFullscreen();
          }
        }
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape').catch(() => {});
        }
      } catch (e) {}
    }

    window.addEventListener('click', triggerAutoFullscreen, { once: true });
    window.addEventListener('touchstart', triggerAutoFullscreen, { once: true });

    // Corridor Play Area
    const corridor = {
      x: 40,
      y: 125,
      width: 880,
      height: 145
    };

    const STORAGE_KEY = 'saveLevel_TumseNaHoPayga';
    let currentSavedLevel = parseInt(localStorage.getItem(STORAGE_KEY)) || 1;
    if (currentSavedLevel > 2) currentSavedLevel = 1;
    let currentLevelIdx = currentSavedLevel - 1;
    let deathFlashTimer = 0;

    // Door State for Closing Animation
    let doorState = {
      isClosing: false,
      closeProgress: 0, // 0 = fully open, 1 = fully closed
      speed: 0.08 // 80% fast closing speed per frame
    };

    // Sirf Level 1 aur 2
    const levels = [
      {
        id: 1,
        playerStart: { x: 80 },
        door: { x: 820, behavior: 'none' },
        pits: [
          { x: 620, width: 52, triggerX: 500, opened: false }
        ],
        spikes: [],
        invert: false
      },
      {
        id: 2,
        playerStart: { x: 80 },
        door: { x: 700, behavior: 'jump_away', triggerDist: 150, jumped: false },
        pits: [],
        spikes: [],
        invert: false
      }
    ];

    // Player State (Dummy 70% mota: width 27px, crouch feature add)
    const NORMAL_HEIGHT = 32;
    const CROUCH_HEIGHT = 20;

    const player = {
      x: 80,
      y: 0,
      width: 27, // 70% extra mota
      height: NORMAL_HEIGHT,
      vx: 0,
      vy: 0,
      facing: 1,
      walkCycle: 0,
      speed: 3.8,
      jumpPower: -9.2,
      grounded: false,
      isCrouching: false,
      enteredDoor: false // Gate ke andar jaane ke baad bahar aana lock
    };

    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // Mobile button listeners
    const setupBtn = (id, keyName) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
      btn.addEventListener('mousedown', () => keys[keyName] = true);
      btn.addEventListener('mouseup', () => keys[keyName] = false);
    };
    setupBtn('btnLeft', 'ArrowLeft');
    setupBtn('btnRight', 'ArrowRight');
    setupBtn('btnDown', 'ArrowDown');
    setupBtn('btnJump', 'Space');

    function playBeep(freq, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initLevel(idx) {
      if (idx >= levels.length) idx = 0;
      currentLevelIdx = idx;

      const lvl = levels[currentLevelIdx];
      levelDisplay.innerText = `LEVEL ${lvl.id} / ${levels.length}`;
      localStorage.setItem(STORAGE_KEY, lvl.id);

      player.height = NORMAL_HEIGHT;
      player.x = lvl.playerStart.x;
      player.y = corridor.y + corridor.height - player.height;
      player.vx = 0;
      player.vy = 0;
      player.walkCycle = 0;
      player.facing = 1;
      player.isCrouching = false;
      player.enteredDoor = false;

      doorState.isClosing = false;
      doorState.closeProgress = 0;

      lvl.pits.forEach(p => p.opened = false);
      lvl.spikes.forEach(s => s.active = false);
      if (lvl.door.behavior === 'jump_away') lvl.door.jumped = false;
    }

    function triggerDeath() {
      playBeep(180, 0.12);
      deathFlashTimer = 16;
      initLevel(currentLevelIdx);
    }

    // Door with 80% Fast Closing Shutter Animation
    function drawDoor(x, y, w, h, closeProgress) {
      ctx.save();
      // Outer Frame
      ctx.fillStyle = '#3b2200';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + 14, w / 2, Math.PI, 0);
      ctx.rect(x, y + 14, w, h - 14);
      ctx.fill();

      // Inner Light Door Frame
      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + 16, (w - 8) / 2, Math.PI, 0);
      ctx.rect(x + 4, y + 16, w - 8, h - 16);
      ctx.fill();

      // Fast sliding door shutter (Closing effect)
      if (closeProgress > 0) {
        ctx.fillStyle = '#3b2200';
        const shutterHeight = (h - 16) * Math.min(1, closeProgress);
        ctx.fillRect(x + 4, y + 16, w - 8, shutterHeight);
      }
      ctx.restore();
    }

    // 70% Mota Dummy with Crouch Animation & Moving Legs
    function drawDummy(p) {
      ctx.save();
      ctx.fillStyle = '#000000';
      ctx.strokeStyle = '#000000';
      ctx.lineCap = 'round';

      const cx = p.x + p.width / 2;

      if (p.isCrouching) {
        // Crouched / Baithe hue pose (Chop-down stance)
        const crouchHeadRadius = 7.2; // 70% mota head
        const headCenterY = p.y + crouchHeadRadius;
        const hipY = p.y + p.height - 4;

        // Head
        ctx.beginPath();
        ctx.arc(cx + (2 * p.facing), headCenterY, crouchHeadRadius, 0, Math.PI * 2);
        ctx.fill();

        // Thick squat body
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(cx, headCenterY + 4);
        ctx.lineTo(cx - (3 * p.facing), hipY);
        ctx.stroke();

        // Bent sitting legs
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(cx - (3 * p.facing), hipY);
        ctx.lineTo(cx - 7 * p.facing, p.y + p.height);
        ctx.moveTo(cx - (3 * p.facing), hipY);
        ctx.lineTo(cx + 6 * p.facing, p.y + p.height);
        ctx.stroke();

      } else {
        // Normal Standing / Walking / Jumping Pose (70% Choda & Mota)
        const headRadius = 7.5; // Extra thick head
        const headCenterY = p.y + headRadius + 1;
        const hipY = p.y + 20;

        // 1. Devil Head
        ctx.beginPath();
        ctx.arc(cx, headCenterY, headRadius, 0, Math.PI * 2);
        ctx.fill();

        // 2. Heavy Torso Trunk (70% mota)
        ctx.lineWidth = 8.5;
        ctx.beginPath();
        ctx.moveTo(cx, headCenterY + headRadius);
        ctx.lineTo(cx, hipY);
        ctx.stroke();

        // 3. Thick Legs
        ctx.lineWidth = 6;

        if (!p.grounded) {
          // Jump in air
          ctx.beginPath();
          ctx.moveTo(cx, hipY);
          ctx.lineTo(cx - 6 * p.facing, p.y + p.height - 3);
          ctx.moveTo(cx, hipY);
          ctx.lineTo(cx + 7 * p.facing, p.y + p.height - 1);
          ctx.stroke();
        } else if (Math.abs(p.vx) > 0.1) {
          // Walk cycle
          const swing = Math.sin(p.walkCycle) * 6.5;
          ctx.beginPath();
          ctx.moveTo(cx, hipY);
          ctx.lineTo(cx + swing, p.y + p.height);
          ctx.moveTo(cx, hipY);
          ctx.lineTo(cx - swing, p.y + p.height);
          ctx.stroke();
        } else {
          // Normal Idle Legs
          ctx.beginPath();
          ctx.moveTo(cx - 4.5, hipY);
          ctx.lineTo(cx - 4.5, p.y + p.height);
          ctx.moveTo(cx + 4.5, hipY);
          ctx.lineTo(cx + 4.5, p.y + p.height);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function update() {
      const lvl = levels[currentLevelIdx];
      const groundY = corridor.y + corridor.height;

      // 1. Handle Door Closing Sequence
      if (doorState.isClosing) {
        doorState.closeProgress += doorState.speed;
        if (doorState.closeProgress >= 1) {
          doorState.closeProgress = 1;
          playBeep(700, 0.1);
          initLevel(currentLevelIdx + 1);
          return;
        }
      }

      // 2. Controls & Movement (Locked if inside door)
      let move = 0;
      if (!player.enteredDoor) {
        // Crouch Handling
        const wantsCrouch = (keys['ArrowDown'] || keys['KeyS']) && player.grounded;
        if (wantsCrouch && !player.isCrouching) {
          player.isCrouching = true;
          player.height = CROUCH_HEIGHT;
          player.y = groundY - player.height;
        } else if (!wantsCrouch && player.isCrouching) {
          player.isCrouching = false;
          player.height = NORMAL_HEIGHT;
          player.y = groundY - player.height;
        }

        if (keys['ArrowRight'] || keys['KeyD']) move += 1;
        if (keys['ArrowLeft'] || keys['KeyA']) move -= 1;
        if (lvl.invert) move *= -1;

        // Crouch me move speed thodi slow ho jati hai
        const currentSpeed = player.isCrouching ? player.speed * 0.5 : player.speed;
        player.vx = move * currentSpeed;

        if (move !== 0) {
          player.facing = move > 0 ? 1 : -1;
          player.walkCycle += 0.35;
        } else {
          player.walkCycle = 0;
        }

        // Jump (Cannot jump while crouching)
        if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded && !player.isCrouching) {
          player.vy = player.jumpPower;
          player.grounded = false;
          playBeep(450, 0.05);
        }
      } else {
        // Gate ke andar jane ke baad player fixed rahega aur bahar nahi aa sakega
        player.vx = 0;
      }

      // Physics
      player.vy += 0.44;
      player.x += player.vx;
      player.y += player.vy;

      if (player.x < corridor.x) player.x = corridor.x;

      // Traps Trigger
      lvl.pits.forEach(p => {
        if (player.x > p.triggerX) p.opened = true;
      });

      let doorX = lvl.door.x;
      if (lvl.door.behavior === 'jump_away' && Math.abs(player.x - lvl.door.x) < lvl.door.triggerDist) {
        lvl.door.jumped = true;
      }
      if (lvl.door.jumped) doorX = corridor.x + corridor.width - 55;

      // Pit Collision
      let fallingInPit = false;
      lvl.pits.forEach(p => {
        if (p.opened && (player.x + player.width > p.x && player.x < p.x + p.width)) {
          fallingInPit = true;
        }
      });

      const floorY = groundY - player.height;
      if (!fallingInPit && player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.grounded = true;
      }

      // Pit Death
      if (player.y > canvas.height + 40) {
        triggerDeath();
      }

      // Door Enter Trigger (Dami andar chala gaya aur wapas bahar na aane paye)
      const doorW = 38;
      const doorH = 46;
      const doorY = groundY - doorH;

      if (!player.enteredDoor &&
          player.x + player.width / 2 > doorX + 10 &&
          player.x < doorX + doorW &&
          player.y + player.height >= doorY) {
        player.enteredDoor = true;
        player.x = doorX + (doorW - player.width) / 2; // Center inside door
        doorState.isClosing = true; // 80% speed se gate band hona start
        playBeep(320, 0.15);
      }

      // ================= DRAW SCENE =================
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background Wall
      ctx.fillStyle = '#a26916';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Corridor Floor Area
      ctx.fillStyle = '#fca240';
      ctx.fillRect(corridor.x, corridor.y, corridor.width, corridor.height);

      // Pit Hole Cutout
      lvl.pits.forEach(p => {
        if (p.opened) {
          ctx.fillStyle = '#a26916';
          ctx.fillRect(p.x, corridor.y, p.width, corridor.height + 150);
        }
      });

      // Draw Door (Background / Open Frame)
      drawDoor(doorX, doorY, doorW, doorH, 0);

      // Draw Dummy inside or outside
      drawDummy(player);

      // Agar gate close ho raha hai to shutter ko player ke upar draw karein
      if (doorState.closeProgress > 0) {
        drawDoor(doorX, doorY, doorW, doorH, doorState.closeProgress);
      }

      // Death Flash
      if (deathFlashTimer > 0) {
        ctx.fillStyle = 'rgba(59, 34, 0, 0.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        deathFlashTimer--;
      }

      requestAnimationFrame(update);
    }

    initLevel(currentLevelIdx);
    update();
  </script>
</body>
</html>

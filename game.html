<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Pure Troll Levels</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .game-card {
            position: relative;
            background: #ffb356;
            border: 5px solid #523500;
            border-radius: 12px;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.45);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 680px;
            width: 100%;
        }

        .hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #523500;
        }

        canvas {
            background: #ffe2b3;
            border: 4px solid #523500;
            border-radius: 6px;
            display: block;
        }

        /* Troll Dialog Modals */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border: 4px solid #523500;
            border-radius: 10px;
            box-shadow: 6px 6px 0px #000;
            padding: 18px;
            text-align: center;
            display: none;
            z-index: 20;
            width: 85%;
            max-width: 420px;
        }

        .modal h2 {
            font-size: 13px;
            color: #8f1111;
            margin-bottom: 10px;
        }

        .modal p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .btn {
            background: #523500;
            color: #ffb356;
            border: 2px solid #3b2500;
            padding: 9px 14px;
            font-size: 9px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.4);
        }

        .controls-note {
            margin-top: 8px;
            font-size: 8px;
            color: #523500;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="hud">
            <span id="hudLevel">LVL: 1</span>
            <span id="hudTrollName">TROLL LEVEL</span>
            <span id="hudFails">FAILS: 0</span>
        </div>

        <canvas id="gameCanvas" width="600" height="280"></canvas>

        <div class="controls-note">Controls: [A][D] ya Arrow Keys: Run | [W] ya [Space]: Jump</div>

        <!-- Troll Fail Modal -->
        <div class="modal" id="failModal">
            <h2>💀 TROLLED!</h2>
            <p id="failQuote">Kaisa laga prank?</p>
            <button class="btn" onclick="restartLevel()">TRY AGAIN 🔄</button>
        </div>

        <!-- Win Modal -->
        <div class="modal" id="winModal">
            <h2 style="color: #0b6e1b;">🎉 TROLL SURVIVED!</h2>
            <p id="winQuote">Agla trap aur ganda hone wala hai!</p>
            <button class="btn" onclick="nextLevel()">NEXT LEVEL ➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const hudLevel = document.getElementById('hudLevel');
        const hudTrollName = document.getElementById('hudTrollName');
        const hudFails = document.getElementById('hudFails');
        const failModal = document.getElementById('failModal');
        const winModal = document.getElementById('winModal');
        const failQuote = document.getElementById('failQuote');

        let failCount = 0;
        let currentLvl = 0;
        let isDead = false;

        // Player State
        let p = {
            x: 40,
            y: 200,
            w: 22,
            h: 22,
            vx: 0,
            vy: 0,
            speed: 3.8,
            jumpStrength: -8.8,
            onGround: false
        };

        // 6 Ultra-Troll Custom Levels
        const trollLevels = [
            {
                id: 1,
                name: "THE RUNAWAY DOOR",
                // Gate bhagta hai jaise hi paas jao
                quote: "Darwaaza bhi tumse door bhag raha hai! 😂",
                door: { x: 520, y: 190, w: 26, h: 36 },
                spikes: [{ x: 260, y: 226, w: 40, h: 14, triggered: false, speed: 0 }],
                floorY: 240,
                logic: (level) => {
                    // Jab player door ke paas pahuche, door jump maarke left bhagega
                    if (p.x > 380 && !level.doorTrolled) {
                        level.door.x -= 7;
                        if (level.door.x <= 40) {
                            level.door.x = 40;
                            level.doorTrolled = true; // Ab pakad sakte ho
                        }
                    }
                }
            },
            {
                id: 2,
                name: "INVISIBLE CEILING",
                // Spikes jump karte hi sir pe invisible block lagta hai aur spike pe girte ho
                quote: "Sir pe chot lagi? Upar invisible block tha!",
                door: { x: 520, y: 190, w: 26, h: 36 },
                spikes: [{ x: 280, y: 226, w: 50, h: 14 }],
                invisibleBlocks: [{ x: 280, y: 130, w: 50, h: 20, revealed: false }],
                floorY: 240,
                logic: (level) => {
                    // Agar player spikes ke theek upar jump karega toh invisible block sir tod dega
                    level.invisibleBlocks.forEach(b => {
                        if (p.x + p.w > b.x && p.x < b.x + b.w && p.y <= b.y + b.h && p.y >= b.y) {
                            b.revealed = true;
                            p.vy = 4; // Head bump bounce down directly into spikes
                        }
                    });
                }
            },
            {
                id: 3,
                name: "MISSILE SPIKE",
                // Spikes zameen pe nahi rehte, jump karte hi missile ki tarah aate hain
                quote: "Spike ne sniper ban ke uda diya!",
                door: { x: 520, y: 190, w: 26, h: 36 },
                spikes: [{ x: 320, y: 226, w: 24, h: 14, flying: false }],
                floorY: 240,
                logic: (level) => {
                    let s = level.spikes[0];
                    // Jaise hi player jump karta hai, spike player ki taraf hawa mein udta hai
                    if (!p.onGround && p.x > 140) {
                        s.flying = true;
                    }
                    if (s.flying) {
                        s.x -= 6.5;
                        s.y -= 1.8;
                    }
                }
            },
            {
                id: 4,
                name: "THE HOLE IN REALITY",
                // Zameen normal dikhti hai par chalte hi gayab ho kar khaddar ban jati hai
                quote: "Pairon tale zameen khisakna isi ko kehte hain!",
                door: { x: 520, y: 190, w: 26, h: 36 },
                spikes: [],
                fakeGround: { x: 240, y: 240, w: 100, active: true },
                floorY: 240,
                logic: (level) => {
                    if (p.x > 220 && p.x < 330 && level.fakeGround.active) {
                        level.fakeGround.active = false; // Floor vanishes instantly
                    }
                }
            },
            {
                id: 5,
                name: "BUTTON INVERTER",
                // Raste ke beech pahunchte hi controls reverse ho jate hain
                quote: "Ungli Right pe thi par character Left mein spike pe chala gaya!",
                door: { x: 520, y: 190, w: 26, h: 36 },
                spikes: [{ x: 420, y: 226, w: 30, h: 14 }],
                invertedTriggered: false,
                floorY: 240,
                logic: (level) => {
                    if (p.x > 250 && !level.invertedTriggered) {
                        level.invertedTriggered = true;
                        hudTrollName.innerText = "CONTROLS REVERSED! 😈";
                    }
                }
            },
            {
                id: 6,
                name: "THE FAKE EXIT",
                // Door par pahunchte hi door spike ban jata hai, asli door peeche starting point par hai
                quote: "Jo dikhta hai wo door nahi, dhoka hai!",
                door: { x: 520, y: 190, w: 26, h: 36, isFake: true },
                realDoor: { x: 20, y: 190, w: 26, h: 36, visible: false },
                spikes: [{ x: 250, y: 226, w: 30, h: 14 }],
                floorY: 240,
                logic: (level) => {
                    if (p.x > 460 && level.door.isFake) {
                        level.door.turnedSpike = true;
                        level.realDoor.visible = true; // Asli gate starting point pe khula
                    }
                }
            }
        ];

        let activeLvlData = null;

        function loadLevel(idx) {
            currentLvl = idx;
            activeLvlData = JSON.parse(JSON.stringify(trollLevels[idx]));
            isDead = false;

            p.x = 40;
            p.y = activeLvlData.floorY - p.h;
            p.vx = 0;
            p.vy = 0;
            p.onGround = true;

            hudLevel.innerText = "LVL: " + activeLvlData.id;
            hudTrollName.innerText = activeLvlData.name;

            failModal.style.display = "none";
            winModal.style.display = "none";
        }

        // Input
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'ArrowLeft') keys['left'] = true;
            if (e.key === 'ArrowRight') keys['right'] = true;
            if (e.key === 'ArrowUp' || e.key === ' ') keys['jump'] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            if (e.key === 'ArrowLeft') keys['left'] = false;
            if (e.key === 'ArrowRight') keys['right'] = false;
            if (e.key === 'ArrowUp' || e.key === ' ') keys['jump'] = false;
        });

        function trollDeath(customQuote) {
            if (isDead) return;
            isDead = true;
            failCount++;
            hudFails.innerText = "FAILS: " + failCount;
            failQuote.innerText = customQuote || activeLvlData.quote;
            failModal.style.display = "block";
        }

        function trollWin() {
            if (isDead) return;
            isDead = true;
            winModal.style.display = "block";
        }

        window.restartLevel = function() {
            loadLevel(currentLvl);
        };

        window.nextLevel = function() {
            if (currentLvl + 1 < trollLevels.length) {
                loadLevel(currentLvl + 1);
            } else {
                alert("ULTIMATE TROLL MASTER! Tumne saare dhoke jhel liye!");
            }
        };

        function update() {
            if (isDead) return;

            // Handle Input & Inverted Controls Trap
            let moveDir = 0;
            let leftPressed = keys['a'] || keys['left'];
            let rightPressed = keys['d'] || keys['right'];

            if (leftPressed) moveDir -= 1;
            if (rightPressed) moveDir += 1;

            if (activeLvlData.invertedTriggered) {
                moveDir = -moveDir; // Complete control reversal
            }

            p.vx = moveDir * p.speed;

            // Jump
            if ((keys['w'] || keys['jump']) && p.onGround) {
                p.vy = p.jumpStrength;
                p.onGround = false;
            }

            // Gravity
            p.vy += 0.45;
            p.x += p.vx;
            p.y += p.vy;

            // Level Custom Troll Script Trigger
            activeLvlData.logic(activeLvlData);

            // Ground Collision
            let currentFloorY = activeLvlData.floorY;
            if (activeLvlData.fakeGround && !activeLvlData.fakeGround.active) {
                // If fake ground disappeared and player is inside gap
                if (p.x + p.w > activeLvlData.fakeGround.x && p.x < activeLvlData.fakeGround.x + activeLvlData.fakeGround.w) {
                    currentFloorY = 320; // Fall into void
                }
            }

            if (p.y + p.h >= currentFloorY) {
                p.y = currentFloorY - p.h;
                p.vy = 0;
                p.onGround = true;
            }

            // Void Death
            if (p.y > 280) {
                trollDeath("Zameen gayab ho gayi aur tum gir gaye! 😂");
            }

            // Spike Collisions
            activeLvlData.spikes.forEach(s => {
                if (p.x < s.x + s.w && p.x + p.w > s.x && p.y < s.y + s.h && p.y + p.h > s.y) {
                    trollDeath();
                }
            });

            // Door Collision & Troll Exit
            let d = activeLvlData.door;
            if (p.x < d.x + d.w && p.x + p.w > d.x && p.y < d.y + d.h && p.y + p.h > d.y) {
                if (d.turnedSpike) {
                    trollDeath("Door toh spike ban gaya! Asli door starting point pe tha!");
                } else if (!d.isFake) {
                    trollWin();
                }
            }

            // Real Door in Level 6
            if (activeLvlData.realDoor && activeLvlData.realDoor.visible) {
                let rd = activeLvlData.realDoor;
                if (p.x < rd.x + rd.w && p.x + p.w > rd.x && p.y < rd.y + rd.h && p.y + p.h > rd.y) {
                    trollWin();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ground
            ctx.fillStyle = "#523500";
            if (activeLvlData.fakeGround && !activeLvlData.fakeGround.active) {
                // Draw ground with gap
                ctx.fillRect(0, activeLvlData.floorY, activeLvlData.fakeGround.x, 40);
                ctx.fillRect(activeLvlData.fakeGround.x + activeLvlData.fakeGround.w, activeLvlData.floorY, canvas.width, 40);
            } else {
                ctx.fillRect(0, activeLvlData.floorY, canvas.width, 40);
            }

            // Draw Spikes
            activeLvlData.spikes.forEach(s => {
                ctx.fillStyle = "#a81313";
                ctx.beginPath();
                ctx.moveTo(s.x, s.y + s.h);
                ctx.lineTo(s.x + s.w / 2, s.y);
                ctx.lineTo(s.x + s.w, s.y + s.h);
                ctx.fill();
            });

            // Draw Invisible Block if Revealed (Level 2)
            if (activeLvlData.invisibleBlocks) {
                activeLvlData.invisibleBlocks.forEach(b => {
                    if (b.revealed) {
                        ctx.fillStyle = "#3b2500";
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.fillStyle = "#ffb356";
                        ctx.fillText("?", b.x + 18, b.y + 14);
                    }
                });
            }

            // Draw Door (Or Fake Door)
            let d = activeLvlData.door;
            if (d.turnedSpike) {
                ctx.fillStyle = "#a81313"; // Fake door turned spike
                ctx.fillRect(d.x, d.y, d.w, d.h);
                ctx.fillStyle = "#fff";
                ctx.fillText("😈", d.x + 4, d.y + 22);
            } else {
                ctx.fillStyle = "#3b2500";
                ctx.fillRect(d.x, d.y, d.w, d.h);
                ctx.fillStyle = "#2db300";
                ctx.fillRect(d.x + 3, d.y + 3, d.w - 6, d.h - 6);
            }

            // Draw Real Door (Level 6)
            if (activeLvlData.realDoor && activeLvlData.realDoor.visible) {
                let rd = activeLvlData.realDoor;
                ctx.fillStyle = "#3b2500";
                ctx.fillRect(rd.x, rd.y, rd.w, rd.h);
                ctx.fillStyle = "#2db300";
                ctx.fillRect(rd.x + 3, rd.y + 3, rd.w - 6, rd.h - 6);
            }

            // Draw Player Devil
            ctx.fillStyle = "#523500";
            ctx.fillRect(p.x, p.y, p.w, p.h);
            // Horns
            ctx.fillStyle = "#d11a1a";
            ctx.fillRect(p.x + 2, p.y - 4, 4, 4);
            ctx.fillRect(p.x + p.w - 6, p.y - 4, 4, 4);
            // Face
            ctx.fillStyle = "#fff";
            ctx.fillRect(p.x + 4, p.y + 6, 3, 3);
            ctx.fillRect(p.x + 14, p.y + 6, 3, 3);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loadLevel(0);
        loop();
    </script>
</body>
</html>

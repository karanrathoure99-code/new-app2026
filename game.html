<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Massive Open-World Map - Static Camera & Full Map Button</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #5294e2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        /* Full Map Toggle Button */
        #map-btn {
            position: absolute;
            top: 85px;
            left: 15px;
            background: rgba(255, 85, 0, 0.9);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
            touch-action: manipulation;
        }
        #map-btn:active {
            transform: scale(0.95);
            background: rgba(200, 65, 0, 0.9);
        }
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Massive Open-World Battleground:</strong><br>
        Map Area: <span>20,000 x 20,000 Units</span><br>
        Status: <span>Camera Static, Full Map Toggle Enabled</span>
    </div>

    <!-- Full Map View Button -->
    <button id="map-btn" onclick="toggleFullMap()">🗺️ Full Map View</button>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let mapSize = 20000;
        let minimapCtx, minimapCanvas;
        let isFullMap = false;

        init();
        animate();

        function init() {
            // 1. Scene Setup (0% Fog)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5294e2);

            // 2. Camera Setup (Fixed Static View)
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 40000);
            camera.position.set(0, 1200, 2500);
            camera.lookAt(0, 0, 0);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(2000, 4000, 2000);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 25000;
            const d = 8000;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // 5. Endless Ocean Surrounding Outside
            const oceanGeo = new THREE.PlaneGeometry(80000, 80000);
            const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1b4f72, roughness: 0.2 });
            const ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -200;
            scene.add(ocean);

            // 6. Massive Terrain Ground
            const segments = 350;
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize, segments, segments);
            const posAttr = groundGeo.attributes.position;
            
            let halfSize = mapSize / 2;

            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                
                let height = Math.abs(Math.sin(vx * 0.001) * Math.cos(vy * 0.001) * 220) 
                           + Math.abs(Math.sin(vx * 0.004) * Math.cos(vy * 0.004) * 150) + 15;

                let distFromCenter = Math.max(Math.abs(vx), Math.abs(vy));
                let borderThreshold = halfSize - 2500;
                if (distFromCenter > borderThreshold) {
                    let factor = (distFromCenter - borderThreshold) / (2500);
                    height += Math.pow(factor, 2) * 1200;
                }

                posAttr.setZ(i, height);
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ color: 0x315c1b, roughness: 0.88 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 7. Large Inner Hills
            createLargeHill(1500, 1500, 1200, 450);
            createLargeHill(-2000, 1800, 1400, 500);
            createLargeHill(1800, -2000, 1300, 480);
            createLargeHill(-1600, -1600, 1500, 520);
            createLargeHill(0, 2500, 1600, 550);
            createLargeHill(-2500, 0, 1400, 480);
            createLargeHill(2500, 0, 1400, 480);

            // 8. Dense Forests
            for (let i = 0; i < 800; i++) {
                let tx = (Math.random() - 0.5) * (mapSize - 4000);
                let tz = (Math.random() - 0.5) * (mapSize - 4000);
                createRealisticTree(tx, tz);
            }

            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            window.addEventListener('resize', onWindowResize);
        }

        // Toggle Full Map View (Top-Down Bird's Eye View)
        function toggleFullMap() {
            isFullMap = !isFullMap;
            const btn = document.getElementById('map-btn');
            if (isFullMap) {
                camera.position.set(0, 14000, 0); // High above looking straight down
                camera.lookAt(0, 0, 0);
                btn.innerHTML = "🗺️ Normal View";
            } else {
                camera.position.set(0, 1200, 2500); // Back to normal static position
                camera.lookAt(0, 0, 0);
                btn.innerHTML = "🗺️ Full Map View";
            }
        }

        function createLargeHill(x, z, radius, height) {
            const hillGeo = new THREE.ConeGeometry(radius, height, 16, 8, true);
            const pos = hillGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let vx = pos.getX(i);
                let vy = pos.getY(i);
                let vz = pos.getZ(i);
                if (vy > 0) {
                    let noise = Math.sin(vx * 0.05) * Math.cos(vz * 0.05) * 40 + (Math.random() - 0.5) * 30;
                    pos.setX(i, vx + noise);
                    pos.setZ(i, vz + noise);
                }
            }
            hillGeo.computeVertexNormals();

            const hillMat = new THREE.MeshStandardMaterial({ color: 0x434c40, roughness: 0.95, flatShading: true });
            const hillMesh = new THREE.Mesh(hillGeo, hillMat);
            hillMesh.position.set(x, height / 2, z);
            hillMesh.castShadow = true;
            hillMesh.receiveShadow = true;
            scene.add(hillMesh);
        }

        function createRealisticTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.2, 14, 8), trunkMat);
            trunk.position.set(x, 25, z); 
            trunk.castShadow = true;
            scene.add(trunk);

            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1d4722, roughness: 0.7 });
            const top = new THREE.Mesh(new THREE.SphereGeometry(7, 8, 8), foliageMat);
            top.position.set(x, 33, z);
            top.castShadow = true;
            scene.add(top);
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);
            minimapCtx.fillStyle = '#1b4f72';
            minimapCtx.fillRect(0, 0, w, h);

            minimapCtx.fillStyle = '#315c1b';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, w*0.42, 0, Math.PI*2);
            minimapCtx.fill();

            minimapCtx.fillStyle = '#ff3300';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 4, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Camera is now completely static (stopped rotating) unless Full Map View is toggled
            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

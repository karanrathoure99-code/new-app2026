<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Greedy Bridge - Ego Trap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f111a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .hud { text-align: center; margin-bottom: 16px; }
    .title { font-size: 22px; font-weight: 800; color: #ffb74d; letter-spacing: 1px; }
    .rules { font-size: 13px; color: #9aa0a6; margin-top: 4px; }
    
    .stats-bar {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      justify-content: center;
    }
    .badge {
      background: #1a1e2e;
      border: 1px solid #2e354f;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }
    .badge span { color: #ffb74d; font-size: 15px; }

    .canvas-box {
      border: 2px solid #2e354f;
      border-radius: 8px;
      background: #080a0f;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .fail-card {
      margin-top: 14px;
      width: 500px;
      padding: 12px;
      background: #161b26;
      border: 1px solid #2e354f;
      border-radius: 8px;
      text-align: center;
      min-height: 55px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .fail-title { font-size: 14px; font-weight: 800; }
    .fail-desc { font-size: 12px; color: #9aa0a6; margin-top: 2px; }

    .restart-btn {
      margin-top: 12px;
      background: #2e384d;
      color: #fff;
      border: none;
      padding: 8px 24px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .restart-btn:hover { background: #3f4d6b; }
  </style>
</head>
<body>

  <div class="hud">
    <div class="title">THE GREEDY BRIDGE</div>
    <div class="rules">Reach Exit Door. Tiles have max weight capacity. Gems add +1 Weight!</div>
    <div class="stats-bar">
      <div class="badge">Your Weight: <span id="weight-val">1</span></div>
      <div class="badge">Gems Taken: <span id="gem-val">0 / 3</span></div>
    </div>
  </div>

  <canvas class="canvas-box" id="gameCanvas" width="500" height="250"></canvas>

  <div class="fail-card" id="failCard">
    <div class="fail-title" id="failTitle" style="color: #64b5f6;">BRIDGE SECURE</div>
    <div class="fail-desc" id="failDesc">Use Arrow Keys (Up, Down, Left, Right) to step on tiles.</div>
  </div>

  <button class="restart-btn" onclick="initGame()">Instant Restart [R]</button>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const weightVal = document.getElementById("weight-val");
    const gemVal = document.getElementById("gem-val");
    const failTitle = document.getElementById("failTitle");
    const failDesc = document.getElementById("failDesc");

    // Grid 7x3
    const COLS = 7;
    const ROWS = 3;
    const TILE_W = 60;
    const TILE_H = 60;
    const OFFSET_X = 40;
    const OFFSET_Y = 35;

    let player = { col: 0, row: 1 };
    let playerWeight = 1;
    let gemsCollected = 0;
    let gameOver = false;
    let gameWon = false;

    // Tile Capacities
    // Layout: Direct center route has tiles with capacity 2.
    // Side routes have gems but lower capacity tiles leading back to exit.
    let grid = [
      // Row 0
      [ { cap: 3 }, { cap: 3, gem: true }, { cap: 2 }, { cap: 2 }, { cap: 3, gem: true }, { cap: 2 }, { cap: 0 } ],
      // Row 1 (Straight line - Cap 2 everywhere except last)
      [ { cap: 4, start: true }, { cap: 2 }, { cap: 2 }, { cap: 2 }, { cap: 2 }, { cap: 2 }, { cap: 4, exit: true } ],
      // Row 2
      [ { cap: 3 }, { cap: 2 }, { cap: 3, gem: true }, { cap: 2 }, { cap: 2 }, { cap: 2 }, { cap: 0 } ]
    ];

    function initGame() {
      player = { col: 0, row: 1 };
      playerWeight = 1;
      gemsCollected = 0;
      gameOver = false;
      gameWon = false;

      // Reset gems
      grid[0][1].gem = true;
      grid[0][4].gem = true;
      grid[2][2].gem = true;

      // Reset tile broken states
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          grid[r][c].broken = false;
        }
      }

      weightVal.textContent = playerWeight;
      gemVal.textContent = "0 / 3";
      failTitle.textContent = "BRIDGE SECURE";
      failTitle.style.color = "#64b5f6";
      failDesc.textContent = "Walk carefully. Tile numbers show max weight capacity.";
      draw();
    }

    function move(dr, dc) {
      if (gameOver || gameWon) return;

      let newRow = player.row + dr;
      let newCol = player.col + dc;

      // Bound check
      if (newRow < 0 || newRow >= ROWS || newCol < 0 || newCol >= COLS) return;

      // Check if tile exists (cap 0 means void)
      let targetTile = grid[newRow][newCol];
      if (targetTile.cap === 0) return;

      player.row = newRow;
      player.col = newCol;

      // Pick gem
      if (targetTile.gem) {
        targetTile.gem = false;
        gemsCollected++;
        playerWeight++;
        weightVal.textContent = playerWeight;
        gemVal.textContent = `${gemsCollected} / 3`;
      }

      // Check bridge strength
      if (playerWeight > targetTile.cap) {
        targetTile.broken = true;
        gameOver = true;
        failTitle.textContent = "CRACK! TILE COLLAPSED UNDER YOUR GREED";
        failTitle.style.color = "#f85149";
        failDesc.textContent = `Tile capacity was ${targetTile.cap}, but your weight was ${playerWeight} (${gemsCollected} gems collected). The empty path was safe!`;
      } else if (targetTile.exit) {
        gameWon = true;
        failTitle.textContent = `ESCAPED WITH ${gemsCollected} GEM(S)!`;
        failTitle.style.color = "#2ea043";
        failDesc.textContent = gemsCollected === 0 
          ? "You survived with zero greed. Safe, but cowardly!" 
          : `High IQ escape! You carried ${gemsCollected} gem(s) without overloading the stone.`;
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          let tile = grid[r][c];
          if (tile.cap === 0) continue; // Abyss

          let x = OFFSET_X + c * (TILE_W + 8);
          let y = OFFSET_Y + r * (TILE_H + 8);

          // Tile base
          if (tile.broken) {
            ctx.fillStyle = "#2c1318";
            ctx.strokeStyle = "#da3633";
          } else if (tile.exit) {
            ctx.fillStyle = "#122a1c";
            ctx.strokeStyle = "#238636";
          } else {
            ctx.fillStyle = "#1e2433";
            ctx.strokeStyle = "#36415d";
          }

          ctx.lineWidth = 2;
          ctx.fillRect(x, y, TILE_W, TILE_H);
          ctx.strokeRect(x, y, TILE_W, TILE_H);

          // Label
          ctx.fillStyle = tile.broken ? "#da3633" : (tile.exit ? "#3fb950" : "#8b949e");
          ctx.font = "bold 13px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          if (tile.exit) {
            ctx.fillText("EXIT", x + TILE_W/2, y + TILE_H/2);
          } else if (tile.broken) {
            ctx.fillText("BROKE", x + TILE_W/2, y + TILE_H/2);
          } else {
            ctx.fillText(`Max ${tile.cap}`, x + TILE_W/2, y + TILE_H/2 + (tile.gem ? -12 : 0));
          }

          // Draw Gem
          if (tile.gem) {
            ctx.fillStyle = "#ffb74d";
            ctx.font = "16px sans-serif";
            ctx.fillText("💎", x + TILE_W/2, y + TILE_H/2 + 10);
          }

          // Draw Player
          if (player.row === r && player.col === c && !tile.broken) {
            ctx.fillStyle = "#58a6ff";
            ctx.beginPath();
            ctx.arc(x + TILE_W/2, y + TILE_H/2, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.font = "bold 11px sans-serif";
            ctx.fillText(`W${playerWeight}`, x + TILE_W/2, y + TILE_H/2);
          }
        }
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "r" || e.key === "R") {
        initGame();
        return;
      }
      if (e.key === "ArrowUp") move(-1, 0);
      else if (e.key === "ArrowDown") move(1, 0);
      else if (e.key === "ArrowLeft") move(0, -1);
      else if (e.key === "ArrowRight") move(0, 1);
    });

    initGame();
  </script>
</body>
</html>

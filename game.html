<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Devil Grid Levels</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .cabinet {
            position: relative;
            background: #ffb356;
            border-radius: 14px;
            box-shadow: 0 8px 0px rgba(0, 0, 0, 0.45);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }

        /* Top HUD */
        .hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #523500;
            box-shadow: 0 2px 0px #523500;
        }

        .hud-actions {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #523500;
            color: #ffb356;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #3b2500;
        }

        .hud-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* 6x4 Grid Board */
        .grid-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            background: #ffe2b3;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 0px #523500;
            width: 100%;
            max-width: 540px;
            aspect-ratio: 6 / 4;
        }

        .tile {
            background: #ffa742;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 3px 0px #523500;
            transition: background 0.15s ease, transform 0.08s ease;
        }

        .tile.wall {
            background: #523500;
        }

        .tile.spike-revealed {
            background: #911212 !important;
        }

        .tile.crumb-fall {
            background: transparent !important;
            box-shadow: none !important;
        }

        /* D-Pad Controller */
        .controller-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            width: 100%;
        }

        .dpad-row {
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            background: #523500;
            color: #ffb356;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3b2500;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #3b2500;
            background: #734a00;
        }

        /* Modals */
        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border-radius: 10px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.5);
            padding: 18px 24px;
            text-align: center;
            display: none;
            z-index: 50;
            width: 85%;
            max-width: 380px;
        }

        .popup-modal h2 {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .popup-modal p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 14px;
        }

        .popup-action {
            background: #523500;
            color: #ffb356;
            padding: 10px 14px;
            font-size: 9px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 0px #3b2500;
            margin: 0 4px;
        }

        .popup-action:active {
            transform: translateY(2px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="cabinet">
        <div class="hud">
            <div>
                <span id="lvlDisplay">LVL: 1</span>
                <span style="margin-left: 10px;" id="deathDisplay">💀 0</span>
            </div>
            <div class="hud-actions">
                <button class="hud-btn" onclick="retryStage()">🔄 RESTART</button>
                <button class="hud-btn" onclick="goToMenu()">📜 LEVELS</button>
                <button class="hud-btn" onclick="toggleScreen()">⛶ FULL</button>
            </div>
        </div>

        <!-- 6x4 Grid Area -->
        <div class="grid-board" id="gridBoard"></div>

        <!-- D-Pad Controls for Mobile & Desktop -->
        <div class="controller-area">
            <button class="ctrl-btn" onclick="movePlayer(0, -1)">⬆ UP</button>
            <div class="dpad-row">
                <button class="ctrl-btn" onclick="movePlayer(-1, 0)">◀ LEFT</button>
                <button class="ctrl-btn" onclick="movePlayer(0, 1)">DOWN ⬇</button>
                <button class="ctrl-btn" onclick="movePlayer(1, 0)">RIGHT ▶</button>
            </div>
        </div>

        <!-- Failure Modal -->
        <div class="popup-modal" id="failBox">
            <h2 style="color: #911212;">💀 TROLLED!</h2>
            <p id="failDesc">Trap mein pair rakh diya!</p>
            <button class="popup-action" onclick="retryStage()">RETRY 🔄</button>
            <button class="popup-action" onclick="goToMenu()">LEVELS 📜</button>
        </div>

        <!-- Victory Modal -->
        <div class="popup-modal" id="winBox">
            <h2 style="color: #116b0d;">🎉 STAGE CLEARED!</h2>
            <p>Agla level aur ganda hone wala hai!</p>
            <button class="popup-action" onclick="nextStage()">NEXT ➡️</button>
            <button class="popup-action" onclick="goToMenu()">LEVELS 📜</button>
        </div>
    </div>

    <script>
        // Fullscreen & Landscape API
        async function toggleScreen() {
            const el = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }
        window.addEventListener('click', toggleScreen, { once: true });
        window.addEventListener('touchstart', toggleScreen, { once: true });

        const gridBoard = document.getElementById('gridBoard');
        const lvlDisplay = document.getElementById('lvlDisplay');
        const deathDisplay = document.getElementById('deathDisplay');
        const failBox = document.getElementById('failBox');
        const winBox = document.getElementById('winBox');
        const failDesc = document.getElementById('failDesc');

        let deaths = 0;
        let isOver = false;
        let playerPos = { r: 0, c: 0 };
        let doorPos = { r: 3, c: 5 };

        // 6 Unique Progressive Devil Grid Levels
        const stages = [
            {
                id: 1,
                name: "THE RUNAWAY DOOR",
                quote: "Door ke paas jaoge toh wo bhag kar shuruat mein aa jayega!",
                start: { r: 1, c: 0 },
                door: { r: 1, c: 5 },
                traps: [{ r: 1, c: 3 }],
                walls: [],
                onStep: (lvl) => {
                    // Troll: Gate bhagta hai
                    if (playerPos.r === 1 && playerPos.c === 4 && !lvl.trolled) {
                        lvl.door = { r: 1, c: 0 }; // jumps to start
                        lvl.trolled = true;
                    }
                }
            },
            {
                id: 2,
                name: "INVISIBLE MINEFIELD",
                quote: "Seedhe chalne ki sochi thi? Invisible trap tha!",
                start: { r: 3, c: 0 },
                door: { r: 0, c: 5 },
                traps: [{ r: 3, c: 2 }, { r: 2, c: 4 }, { r: 1, c: 1 }],
                walls: [{ r: 1, c: 3 }, { r: 2, c: 3 }],
                onStep: () => {}
            },
            {
                id: 3,
                name: "CRUMBLING TILES",
                quote: "Ek kadam aage badhte hi piche ki zameen gayab!",
                start: { r: 0, c: 0 },
                door: { r: 3, c: 5 },
                traps: [],
                walls: [],
                crumble: true,
                stepped: [],
                onStep: (lvl) => {
                    // Piche ka block vanish
                    lvl.stepped.push({ r: playerPos.r, c: playerPos.c });
                }
            },
            {
                id: 4,
                name: "REVERSE CONFUSION",
                quote: "Right dabaya tha, left trap mein kyun gaye?",
                start: { r: 0, c: 0 },
                door: { r: 3, c: 5 },
                traps: [{ r: 0, c: 2 }, { r: 1, c: 3 }, { r: 2, c: 1 }],
                walls: [{ r: 1, c: 1 }, { r: 2, c: 4 }],
                reversed: true,
                onStep: () => {}
            },
            {
                id: 5,
                name: "THE FAKE EXIT",
                quote: "Samne wala door fake nikla! Asli door corner mein tha!",
                start: { r: 2, c: 0 },
                door: { r: 2, c: 5 }, // Fake door
                realDoor: { r: 0, c: 0 },
                traps: [{ r: 2, c: 5 }], // Touching fake door dies
                walls: [{ r: 1, c: 2 }, { r: 3, c: 2 }],
                onStep: (lvl) => {
                    if (playerPos.c > 3 && !lvl.swapped) {
                        lvl.swapped = true;
                        lvl.door = lvl.realDoor;
                    }
                }
            }
        ];

        let curIdx = 0;
        let activeStage = null;

        function loadStage(idx) {
            curIdx = idx;
            activeStage = JSON.parse(JSON.stringify(stages[idx]));
            isOver = false;

            playerPos = { ...activeStage.start };
            doorPos = { ...activeStage.door };

            lvlDisplay.innerText = "LVL: " + activeStage.id;
            failBox.style.display = "none";
            winBox.style.display = "none";

            renderGrid();
        }

        function renderGrid() {
            gridBoard.innerHTML = "";
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 6; c++) {
                    const tile = document.createElement('div');
                    tile.className = "tile";

                    // Check Wall
                    let isWall = activeStage.walls.some(w => w.r === r && w.c === c);
                    if (isWall) {
                        tile.classList.add('wall');
                    }

                    // Check Crumbled
                    if (activeStage.crumble && activeStage.stepped) {
                        let isCrumb = activeStage.stepped.some(s => s.r === r && s.c === c && !(s.r === playerPos.r && s.c === playerPos.c));
                        if (isCrumb) {
                            tile.classList.add('crumb-fall');
                        }
                    }

                    // Render Door
                    if (doorPos.r === r && doorPos.c === c) {
                        tile.innerText = "🚪";
                    }

                    // Render Player
                    if (playerPos.r === r && playerPos.c === c) {
                        tile.innerText = "😈";
                    }

                    gridBoard.appendChild(tile);
                }
            }
        }

        window.movePlayer = function(dc, dr) {
            if (isOver) return;

            // Reverse Trap check
            if (activeStage.reversed) {
                dc = -dc;
                dr = -dr;
            }

            let newR = playerPos.r + dr;
            let newC = playerPos.c + dc;

            // Boundaries check
            if (newR < 0 || newR >= 4 || newC < 0 || newC >= 6) return;

            // Wall check
            if (activeStage.walls.some(w => w.r === newR && w.c === newC)) return;

            // Crumbled tile check
            if (activeStage.crumble && activeStage.stepped) {
                if (activeStage.stepped.some(s => s.r === newR && s.c === newC)) {
                    triggerFail("Tooti hui zameen par wapas pair rakh diya!");
                    return;
                }
            }

            playerPos.r = newR;
            playerPos.c = newC;

            // Execute Stage Trap
            activeStage.onStep(activeStage);
            doorPos = { ...activeStage.door };

            // Trap Trigger
            let hitTrap = activeStage.traps.some(t => t.r === playerPos.r && t.c === playerPos.c);
            if (hitTrap) {
                renderGrid();
                triggerFail();
                return;
            }

            // Door Goal Trigger
            if (playerPos.r === doorPos.r && playerPos.c === doorPos.c) {
                renderGrid();
                triggerWin();
                return;
            }

            renderGrid();
        };

        // Keyboard arrow/WASD support
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') movePlayer(0, -1);
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') movePlayer(0, 1);
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') movePlayer(-1, 0);
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') movePlayer(1, 0);
        });

        function triggerFail(customText) {
            if (isOver) return;
            isOver = true;
            deaths++;
            deathDisplay.innerText = "💀 " + deaths;
            failDesc.innerText = customText || activeStage.quote;
            failBox.style.display = "block";
        }

        function triggerWin() {
            if (isOver) return;
            isOver = true;
            winBox.style.display = "block";
        }

        window.retryStage = () => loadStage(curIdx);
        window.nextStage = () => {
            if (curIdx + 1 < stages.length) loadStage(curIdx + 1);
            else { alert("SHABASH! Saare Devil Grid Levels Clear!"); loadStage(0); }
        };
        window.goToMenu = () => { window.location.href = "level.html"; };

        // Start
        loadStage(0);
    </script>
</body>
</html>

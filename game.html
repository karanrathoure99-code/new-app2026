<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic Open-World Map - Organic Mountains & Rivers</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        /* Live Minimap UI Style */
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Open-World Map (Real Organic Mountains):</strong><br>
        Map Area: <span>4000 x 4000 Units</span><br>
        Status: <span>Realistic Rock Formations & Rivers Loaded</span>
    </div>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let mapSize = 4000;
        let minimapCtx, minimapCanvas;

        init();
        animate();

        function init() {
            // 1. Scene & Sky Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5294e2);
            scene.fog = new THREE.FogExp2(0x75aff7, 0.0006);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 8000);
            camera.position.set(0, 300, 500);
            camera.lookAt(0, 0, 0);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(600, 900, 600);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 3500;
            const d = 700;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // 5. Massive Terrain Ground
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize, 200, 200);
            const posAttr = groundGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                // Natural organic rolling terrain using sine/cosine combinations
                let height = Math.sin(vx * 0.003) * Math.cos(vy * 0.003) * 30 + Math.sin(vx * 0.01) * 8;
                posAttr.setZ(i, height);
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x315c1b, 
                roughness: 0.9 
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 6. Build World Features (Real Organic Mountains & Rivers)
            buildOrganicWorld();

            // Setup Minimap
            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            window.addEventListener('resize', onWindowResize);
        }

        // Asli aur Prakritik (Organic) Pahaad banane ka function (No Triangles/Cones)
        function createRealMountain(x, z, radius, height, colorHex) {
            const mountainGroup = new THREE.Group();
            mountainGroup.position.set(x, 0, z);

            // Multiple deformed rock layers to make it look rugged and natural
            const segments = 24;
            const mountainGeo = new THREE.ConeGeometry(radius, height, segments, 16, true);
            
            // Deform vertices organically so it doesn't look like a geometric triangle
            const pos = mountainGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let vx = pos.getX(i);
                let vy = pos.getY(i);
                let vz = pos.getZ(i);
                
                if (vy > 0) { // Keep base clean, deform middle and upper sections
                    let noise = Math.sin(vx * 0.1) * Math.cos(vz * 0.1) * 15 + (Math.random() - 0.5) * 10;
                    pos.setX(i, vx + noise);
                    pos.setZ(i, vz + noise);
                }
            }
            mountainGeo.computeVertexNormals();

            const mountainMat = new THREE.MeshStandardMaterial({ 
                color: colorHex, 
                roughness: 0.95, 
                flatShading: true // Gives a rugged rocky polygon look
            });
            
            const mountainMesh = new THREE.Mesh(mountainGeo, mountainMat);
            mountainMesh.position.y = height / 2;
            mountainMesh.castShadow = true;
            mountainMesh.receiveShadow = true;
            mountainGroup.add(mountainMesh);

            // Add rocky subsidiary mounds around the main mountain for realism
            for (let j = 0; j < 3; j++) {
                let subRad = radius * (0.4 + Math.random() * 0.3);
                let subHeight = height * (0.5 + Math.random() * 0.3);
                let subGeo = new THREE.ConeGeometry(subRad, subHeight, 12, 8, true);
                let subMesh = new THREE.Mesh(subGeo, mountainMat);
                let angle = (j / 3) * Math.PI * 2;
                subMesh.position.set(Math.cos(angle) * (radius * 0.5), subHeight / 2, Math.sin(angle) * (radius * 0.5));
                subMesh.castShadow = true;
                mountainGroup.add(subMesh);
            }

            scene.add(mountainGroup);
        }

        function buildOrganicWorld() {
            // 1. Map ke Charo Aur Asli Bade Pahaad (Perimeter Organic Mountains)
            createRealMountain(-1700, -1700, 600, 450, 0x4a5247);
            createRealMountain(1700, -1700, 650, 480, 0x434c40);
            createRealMountain(0, -1900, 700, 520, 0x3b4338);
            createRealMountain(-1700, 1700, 600, 460, 0x454e42);
            createRealMountain(1700, 1700, 650, 490, 0x3f483c);
            createRealMountain(-1900, 0, 700, 500, 0x424a3f);
            createRealMountain(1900, 0, 700, 510, 0x3e463b);

            // 2. Map ke Beech mein Asli Rugged Pahaad (Center Mountain Ranges)
            createRealMountain(-700, -600, 350, 300, 0x525c4e);
            createRealMountain(700, 600, 380, 320, 0x4d5749);
            createRealMountain(-800, 600, 320, 280, 0x556051);
            createRealMountain(600, -700, 340, 290, 0x4a5446);

            // 3. Nadiyan (Rivers crossing the map)
            const riverMat = new THREE.MeshStandardMaterial({ color: 0x2980b9, roughness: 0.3 });
            
            const river1 = new THREE.Mesh(new THREE.PlaneGeometry(50, 3800), riverMat);
            river1.rotation.x = -Math.PI / 2;
            river1.rotation.z = Math.PI / 4;
            river1.position.set(0, 0.2, 0);
            scene.add(river1);

            const river2 = new THREE.Mesh(new THREE.PlaneGeometry(40, 3400), riverMat);
            river2.rotation.x = -Math.PI / 2;
            river2.rotation.z = -Math.PI / 5;
            river2.position.set(-250, 0.25, 100);
            scene.add(river2);

            // 4. Realistic Trees
            for (let i = 0; i < 140; i++) {
                let tx = (Math.random() - 0.5) * 3400;
                let tz = (Math.random() - 0.5) * 3400;
                if (Math.abs(tx) < 250 && Math.abs(tz) < 250) continue;
                createRealisticTree(tx, tz);
            }
        }

        function createRealisticTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 8, 8), trunkMat);
            trunk.position.set(x, 4, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1d4722, roughness: 0.7 });
            const top = new THREE.Mesh(new THREE.SphereGeometry(3.5, 8, 8), foliageMat);
            top.position.set(x, 8.5, z);
            top.castShadow = true;
            scene.add(top);
        }

        // Live Minimap Drawing
        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);
            minimapCtx.fillStyle = '#223816';
            minimapCtx.fillRect(0, 0, w, h);

            // Draw Rivers on minimap
            minimapCtx.strokeStyle = '#2980b9';
            minimapCtx.lineWidth = 4;
            minimapCtx.beginPath();
            minimapCtx.moveTo(0, 0); minimapCtx.lineTo(w, h);
            minimapCtx.moveTo(w, 0); minimapCtx.lineTo(0, h);
            minimapCtx.stroke();

            // Center indicator dot
            minimapCtx.fillStyle = '#ff3300';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 5, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth Cinematic Camera Orbit
            let time = Date.now() * 0.00015;
            camera.position.x = Math.sin(time) * 700;
            camera.position.z = Math.cos(time) * 700;
            camera.lookAt(0, 50, 0);

            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

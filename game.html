<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Massive Open-World Map - Fixed Terrain & Raised Boundaries</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Massive Open-World Battleground:</strong><br>
        Map Area: <span>20,000 x 20,000 Units</span><br>
        Status: <span>Terrain Stabilized, Raised Borders & Bumpy Land Loaded</span>
    </div>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let mapSize = 20000;
        let minimapCtx, minimapCanvas;

        init();
        animate();

        function init() {
            // 1. Scene & Sky Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5294e2);
            scene.fog = new THREE.FogExp2(0x75aff7, 0.00015);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 30000);
            camera.position.set(0, 1500, 3000);
            camera.lookAt(0, 0, 0);

            // 3. Renderer Setup (Precision fix to prevent surface flickering / z-fighting)
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(2000, 4000, 2000);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 15000;
            const d = 6000;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // 5. Endless Ocean Surrounding Outside (Far away)
            const oceanGeo = new THREE.PlaneGeometry(60000, 60000);
            const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1b4f72, roughness: 0.2 });
            const ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -50;
            scene.add(ocean);

            // 6. Massive Bumpy & Sloped Terrain Ground with Raised Boundary Edges
            const segments = 300;
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize, segments, segments);
            const posAttr = groundGeo.attributes.position;
            
            let halfSize = mapSize / 2;

            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i); // In plane geometry local space, Y is Z in world space before rotation
                
                // Natural bumpy and varied terrain across the map
                let height = Math.sin(vx * 0.0015) * Math.cos(vy * 0.0015) * 250 
                           + Math.sin(vx * 0.006) * Math.sin(vy * 0.006) * 60 
                           + Math.cos(vx * 0.015) * 20;

                // Raise the edges/boundaries high up like mountain walls seamlessly
                let distFromCenter = Math.max(Math.abs(vx), Math.abs(vy));
                let borderThreshold = halfSize - 2500;
                if (distFromCenter > borderThreshold) {
                    let factor = (distFromCenter - borderThreshold) / (2500);
                    height += Math.pow(factor, 2) * 900; // Smooth elevation to form raised border
                }

                posAttr.setZ(i, height);
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ color: 0x315c1b, roughness: 0.88, flatShading: true });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 7. Scattered Trees across the stable terrain
            for (let i = 0; i < 300; i++) {
                let tx = (Math.random() - 0.5) * (mapSize - 4000);
                let tz = (Math.random() - 0.5) * (mapSize - 4000);
                createRealisticTree(tx, tz);
            }

            // Setup Minimap
            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            window.addEventListener('resize', onWindowResize);
        }

        function createRealisticTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.2, 12, 8), trunkMat);
            trunk.position.set(x, 15, z); // Adjusted baseline
            trunk.castShadow = true;
            scene.add(trunk);

            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1d4722, roughness: 0.7 });
            const top = new THREE.Mesh(new THREE.SphereGeometry(6, 8, 8), foliageMat);
            top.position.set(x, 22, z);
            top.castShadow = true;
            scene.add(top);
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);
            minimapCtx.fillStyle = '#1b4f72';
            minimapCtx.fillRect(0, 0, w, h);

            minimapCtx.fillStyle = '#315c1b';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, w*0.42, 0, Math.PI*2);
            minimapCtx.fill();

            minimapCtx.fillStyle = '#ff3300';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 4, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            let time = Date.now() * 0.0001;
            camera.position.x = Math.sin(time) * 5500;
            camera.position.z = Math.cos(time) * 5500;
            camera.lookAt(0, 200, 0);

            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

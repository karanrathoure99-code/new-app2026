<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - 3D Dummy Maze</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .arcade-cabinet {
            position: relative;
            background: #ffb356;
            border-radius: 14px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.45);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 620px;
            width: 100%;
            height: 95vh;
            max-height: 520px;
        }

        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 10px;
            color: #523500;
            box-shadow: 0 3px 0px #523500;
        }

        .hud-tools {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #523500;
            color: #ffb356;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #3b2500;
        }

        /* Maze Chamber */
        .puzzle-chamber {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #fff8eb;
            border-radius: 10px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        /* Maze Matchstick Walls (Dense paths like reference image) */
        .maze-wall {
            position: absolute;
            background: linear-gradient(90deg, #d4a373, #faedcd);
            border-radius: 3px;
            box-shadow: 0 3px 0px #8c6239, inset 0 1px 2px rgba(255,255,255,0.6);
        }

        /* 50% Smaller & 3D Animated Dummy Character */
        .dummy-character {
            position: absolute;
            width: 15px;
            height: 23px;
            bottom: 8px;
            left: 10px;
            z-index: 10;
            transform-style: preserve-3d;
            transition: bottom 0.2s ease, left 0.1s linear;
        }

        .dummy-head {
            position: absolute;
            top: 0;
            left: 3.5px;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle at 3px 3px, #ffdbac, #523500);
            border-radius: 50%;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        .dummy-body {
            position: absolute;
            top: 7px;
            left: 6px;
            width: 3px;
            height: 9px;
            background: #3b2500;
            border-radius: 1.5px;
        }

        .dummy-arm-left, .dummy-arm-right {
            position: absolute;
            top: 8px;
            width: 5px;
            height: 2px;
            background: #523500;
            border-radius: 1px;
        }
        .dummy-arm-left { left: 1px; }
        .dummy-arm-right { right: 1px; }

        .dummy-leg-left, .dummy-leg-right {
            position: absolute;
            bottom: 0;
            width: 2.5px;
            height: 7px;
            background: #523500;
            border-radius: 1px;
            transform-origin: top center;
        }
        .dummy-leg-left { left: 4px; }
        .dummy-leg-right { right: 4px; }

        /* Walking Animation */
        .walking .dummy-leg-left {
            animation: walkLegLeft 0.25s infinite alternate ease-in-out;
        }
        .walking .dummy-leg-right {
            animation: walkLegRight 0.25s infinite alternate ease-in-out;
        }

        @keyframes walkLegLeft {
            0% { transform: rotate(-30deg); }
            100% { transform: rotate(30deg); }
        }
        @keyframes walkLegRight {
            0% { transform: rotate(30deg); }
            100% { transform: rotate(-30deg); }
        }

        /* Jumping Animation */
        .jumping .dummy-arm-left { transform: rotate(-50deg); }
        .jumping .dummy-arm-right { transform: rotate(50deg); }
        .jumping .dummy-leg-left { transform: rotate(-35deg); }
        .jumping .dummy-leg-right { transform: rotate(35deg); }

        /* 50% Smaller Target Gate (Top Right Corner) */
        .target-gate {
            width: 22px;
            height: 25px;
            background: linear-gradient(135deg, #2db300, #186600);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 10px;
            position: absolute;
            top: 8px;
            right: 10px;
            z-index: 5;
            box-shadow: 0 2px 0px #0e3b00;
        }

        .clue-box {
            font-family: 'Chakra Petch', sans-serif;
            background: #ffa742;
            color: #523500;
            font-weight: 700;
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 4px;
            position: absolute;
            top: 5px;
            left: 5px;
            z-index: 20;
        }

        .bottom-action-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
            gap: 6px;
        }

        .control-btn {
            flex: 1;
            background: #523500;
            color: #ffb356;
            padding: 12px 6px;
            border-radius: 8px;
            font-size: 9px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3b2500;
            text-align: center;
        }

        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #3b2500;
        }

        .danger-btn {
            background: #8f1111;
            color: #fff;
            box-shadow: 0 4px 0px #540808;
        }

        .popup-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            width: 85%;
            max-width: 300px;
            box-shadow: 0 10px 0px rgba(0,0,0,0.5);
        }

        .modal-btn {
            background: #523500;
            color: #ffb356;
            padding: 8px 12px;
            font-size: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        <div class="hud-bar">
            <div>
                <span id="lvlLabel">MAZE: 1</span>
                <span style="margin-left: 10px;" id="failsLabel">FAILS: 0</span>
            </div>
            <div class="hud-tools">
                <button class="hud-btn" onclick="location.reload()">🔄 RESTART</button>
            </div>
        </div>

        <!-- Maze Chamber -->
        <div class="puzzle-chamber" id="chamber">
            <div class="clue-box">Jump karke stiks par chadh kar Gate tak jao!</div>
            
            <!-- Dense Matchstick Maze Walls with jump gaps -->
            <div class="maze-wall" style="width: 8px; height: 110px; bottom: 0px; left: 55px;"></div>
            <div class="maze-wall" style="width: 90px; height: 8px; bottom: 100px; left: 55px;"></div>
            <div class="maze-wall" style="width: 8px; height: 90px; bottom: 15px; left: 145px;"></div>
            <div class="maze-wall" style="width: 100px; height: 8px; top: 90px; left: 100px;"></div>
            <div class="maze-wall" style="width: 8px; height: 100px; top: 15px; left: 210px;"></div>
            <div class="maze-wall" style="width: 80px; height: 8px; top: 130px; left: 210px;"></div>
            <div class="maze-wall" style="width: 8px; height: 75px; bottom: 10px; left: 310px;"></div>
            <div class="maze-wall" style="width: 70px; height: 8px; top: 60px; left: 310px;"></div>

            <!-- 3D Animated Smaller Dummy Character -->
            <div class="dummy-character" id="dummy">
                <div class="dummy-head"></div>
                <div class="dummy-body"></div>
                <div class="dummy-arm-left"></div>
                <div class="dummy-arm-right"></div>
                <div class="dummy-leg-left"></div>
                <div class="dummy-leg-right"></div>
            </div>

            <!-- 50% Smaller Target Gate (Top Right Corner) -->
            <div class="target-gate" id="gate">🚪</div>
        </div>

        <!-- Controls -->
        <div class="bottom-action-bar">
            <button class="control-btn" onclick="movePlayer(-12, 0)">◀ LEFT</button>
            <button class="control-btn danger-btn" onclick="jumpPlayer()">JUMP ⬆️</button>
            <button class="control-btn" onclick="movePlayer(12, 0)">RIGHT ▶</button>
        </div>

        <!-- Win Modal -->
        <div class="popup-modal" id="winModal">
            <h2 style="color: #116b0d; font-size: 12px; margin-bottom: 8px;">🎉 JEET GAYE!</h2>
            <p style="font-family: 'Chakra Petch'; font-size: 11px; margin-bottom: 10px;">3D डमी कैरेक्टर सफलतापूर्वक गेट तक पहुँच गया!</p>
            <button class="modal-btn" onclick="location.reload()">AGAIN 🔄</button>
        </div>
    </div>

    <script>
        let posX = 10;
        let posY = 8;
        const dummy = document.getElementById('dummy');
        const winModal = document.getElementById('winModal');
        let isOver = false;
        let walkTimeout;

        function movePlayer(dx, dy) {
            if (isOver) return;
            posX = Math.max(2, Math.min(posX + dx, 380));
            dummy.style.left = posX + 'px';
            
            // Walking animation on legs
            dummy.classList.add('walking');
            clearTimeout(walkTimeout);
            walkTimeout = setTimeout(() => {
                dummy.classList.remove('walking');
            }, 180);

            checkWin();
        }

        function jumpPlayer() {
            if (isOver) return;
            dummy.classList.add('jumping');
            posY = 75; // Jump height to clear gaps & stick levels
            dummy.style.bottom = posY + 'px';

            setTimeout(() => {
                posY = 8; // Fall back down
                dummy.style.bottom = posY + 'px';
                dummy.classList.remove('jumping');
                checkWin();
            }, 300);
        }

        function checkWin() {
            // Check top-right corner gate area
            if (posX >= 330 && posY >= 40) {
                isOver = true;
                winModal.style.display = "block";
            }
        }
    </script>
</body>
</html>

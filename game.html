<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤪 Z PAJAL - Level Devil Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #a26916;
      --corridor-bg: #fca240;
      --player-color: #000000;
      --door-frame: #3b2200;
      --door-fill: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Press Start 2P', monospace;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-outer);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      padding: 10px 10px 16px 10px;
    }

    .top-header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 8px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .level-badge {
      background: #4a2d04;
      color: #fca240;
      font-size: 11px;
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      outline: none;
      box-shadow: 0 4px 0 #281700;
      letter-spacing: 1px;
    }

    .action-btn {
      background: #fca240;
      color: #3b2200;
      font-size: 10px;
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #b86e18;
      transition: transform 0.08s ease;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
    }

    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b86e18;
    }

    #gameCanvas {
      background-color: var(--bg-outer);
      image-rendering: pixelated;
      display: block;
      border-radius: 4px;
      max-width: 98vw;
      max-height: 72vh;
    }

    /* On-Screen Touch Buttons (Phone / Tablet Only) */
    .controls-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .dpad {
      display: flex;
      gap: 16px;
    }

    .ctrl-btn {
      width: 78px;
      height: 48px;
      background: rgba(252, 162, 64, 0.45);
      border: 3px solid rgba(74, 45, 4, 0.55);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: #3b2200;
      cursor: pointer;
      touch-action: manipulation;
    }

    .ctrl-btn:active {
      background: rgba(252, 162, 64, 0.85);
      transform: scale(0.96);
    }

    /* LAPTOP / PC par controls ko hide karne ke liye */
    @media (hover: hover) and (pointer: fine) {
      .controls-container {
        display: none !important;
      }
      body {
        justify-content: center;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="level-badge" id="levelDisplay">LEVEL 1 / 2</div>
    <div class="header-actions">
      <button class="action-btn" id="fsBtn">⛶ FULLSCREEN</button>
      <a href="home.html" class="action-btn">🏠 HOME</a>
    </div>
  </div>

  <canvas id="gameCanvas" width="960" height="400"></canvas>

  <!-- Only Phone / Tablet Controls -->
  <div class="controls-container">
    <div class="dpad">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <button class="ctrl-btn" id="btnJump">▲</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('levelDisplay');
    const fsBtn = document.getElementById('fsBtn');

    // Fullscreen + Landscape Lock API
    async function enterLandscapeFullscreen() {
      try {
        const docEl = document.documentElement;
        if (!document.fullscreenElement) {
          if (docEl.requestFullscreen) {
            await docEl.requestFullscreen();
          } else if (docEl.webkitRequestFullscreen) {
            await docEl.webkitRequestFullscreen();
          }
        }
        // Lock screen to Landscape
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape').catch(() => {});
        }
      } catch (err) {}
    }

    fsBtn.addEventListener('click', enterLandscapeFullscreen);
    // User ke pehle touch par bhi auto-lock trigger hoga
    window.addEventListener('touchstart', () => {
      if (!document.fullscreenElement) {
        enterLandscapeFullscreen();
      }
    }, { once: true });

    // Corridor Play Area
    const corridor = {
      x: 40,
      y: 125,
      width: 880,
      height: 145
    };

    const STORAGE_KEY = 'saveLevel_TumseNaHoPayga';
    let currentSavedLevel = parseInt(localStorage.getItem(STORAGE_KEY)) || 1;
    if (currentSavedLevel > 2) currentSavedLevel = 1;
    let currentLevelIdx = currentSavedLevel - 1;
    let deathFlashTimer = 0;

    // Sirf Level 1 aur Level 2
    const levels = [
      {
        id: 1,
        playerStart: { x: 80 },
        door: { x: 820, behavior: 'none' },
        pits: [
          { x: 620, width: 50, triggerX: 500, opened: false }
        ],
        spikes: [],
        invert: false
      },
      {
        id: 2,
        playerStart: { x: 80 },
        door: { x: 700, behavior: 'jump_away', triggerDist: 150, jumped: false },
        pits: [],
        spikes: [],
        invert: false
      }
    ];

    // Player with moving legs setup
    const player = {
      x: 80,
      y: 0,
      width: 16,
      height: 32,
      vx: 0,
      vy: 0,
      facing: 1,
      walkCycle: 0,
      speed: 3.8,
      jumpPower: -9.2,
      grounded: false
    };

    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // Touch button listeners
    const setupBtn = (id, keyName) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
      btn.addEventListener('mousedown', () => keys[keyName] = true);
      btn.addEventListener('mouseup', () => keys[keyName] = false);
    };
    setupBtn('btnLeft', 'ArrowLeft');
    setupBtn('btnRight', 'ArrowRight');
    setupBtn('btnJump', 'Space');

    function playBeep(freq, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initLevel(idx) {
      if (idx >= levels.length) idx = 0;
      currentLevelIdx = idx;

      const lvl = levels[currentLevelIdx];
      levelDisplay.innerText = `LEVEL ${lvl.id} / ${levels.length}`;
      localStorage.setItem(STORAGE_KEY, lvl.id);

      player.x = lvl.playerStart.x;
      player.y = corridor.y + corridor.height - player.height;
      player.vx = 0;
      player.vy = 0;
      player.walkCycle = 0;
      player.facing = 1;

      lvl.pits.forEach(p => p.opened = false);
      lvl.spikes.forEach(s => s.active = false);
      if (lvl.door.behavior === 'jump_away') lvl.door.jumped = false;
    }

    function triggerDeath() {
      playBeep(180, 0.12);
      deathFlashTimer = 16;
      initLevel(currentLevelIdx);
    }

    function drawDoor(x, y, w, h) {
      ctx.fillStyle = '#3b2200';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + 12, w / 2, Math.PI, 0);
      ctx.rect(x, y + 12, w, h - 12);
      ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + 14, (w - 7) / 2, Math.PI, 0);
      ctx.rect(x + 3.5, y + 14, w - 7, h - 14);
      ctx.fill();
    }

    function drawDummy(p) {
      ctx.save();
      ctx.fillStyle = '#000000';
      ctx.strokeStyle = '#000000';
      ctx.lineCap = 'round';

      const cx = p.x + p.width / 2;
      const headRadius = 4.8;
      const headCenterY = p.y + headRadius + 1;
      const hipY = p.y + 19;

      // Head
      ctx.beginPath();
      ctx.arc(cx, headCenterY, headRadius, 0, Math.PI * 2);
      ctx.fill();

      // Torso
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(cx, headCenterY + headRadius);
      ctx.lineTo(cx, hipY);
      ctx.stroke();

      // Animated Legs
      ctx.lineWidth = 3.6;

      if (!p.grounded) {
        ctx.beginPath();
        ctx.moveTo(cx, hipY);
        ctx.lineTo(cx - 4.5 * p.facing, p.y + p.height - 3);
        ctx.moveTo(cx, hipY);
        ctx.lineTo(cx + 5 * p.facing, p.y + p.height - 1);
        ctx.stroke();
      } else if (Math.abs(p.vx) > 0.1) {
        const swing = Math.sin(p.walkCycle) * 5.8;
        ctx.beginPath();
        ctx.moveTo(cx, hipY);
        ctx.lineTo(cx + swing, p.y + p.height);
        ctx.moveTo(cx, hipY);
        ctx.lineTo(cx - swing, p.y + p.height);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(cx - 2.5, hipY);
        ctx.lineTo(cx - 2.5, p.y + p.height);
        ctx.moveTo(cx + 2.5, hipY);
        ctx.lineTo(cx + 2.5, p.y + p.height);
        ctx.stroke();
      }

      ctx.restore();
    }

    function update() {
      const lvl = levels[currentLevelIdx];
      const floorY = corridor.y + corridor.height - player.height;

      // Controls
      let move = 0;
      if (keys['ArrowRight'] || keys['KeyD']) move += 1;
      if (keys['ArrowLeft'] || keys['KeyA']) move -= 1;
      if (lvl.invert) move *= -1;

      player.vx = move * player.speed;

      if (move !== 0) {
        player.facing = move > 0 ? 1 : -1;
        player.walkCycle += 0.35;
      } else {
        player.walkCycle = 0;
      }

      if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
        playBeep(450, 0.05);
      }

      player.vy += 0.44;
      player.x += player.vx;
      player.y += player.vy;

      if (player.x < corridor.x) player.x = corridor.x;

      lvl.pits.forEach(p => {
        if (player.x > p.triggerX) p.opened = true;
      });

      let doorX = lvl.door.x;
      if (lvl.door.behavior === 'jump_away' && Math.abs(player.x - lvl.door.x) < lvl.door.triggerDist) {
        lvl.door.jumped = true;
      }
      if (lvl.door.jumped) doorX = corridor.x + corridor.width - 50;

      let fallingInPit = false;
      lvl.pits.forEach(p => {
        if (p.opened && (player.x + player.width > p.x && player.x < p.x + p.width)) {
          fallingInPit = true;
        }
      });

      if (!fallingInPit && player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.grounded = true;
      }

      if (player.y > canvas.height + 40) {
        triggerDeath();
      }

      const doorY = corridor.y + corridor.height - 40;
      if (player.x + player.width > doorX && player.x < doorX + 34 && player.y + player.height >= doorY) {
        playBeep(700, 0.1);
        initLevel(currentLevelIdx + 1);
      }

      // Draw Loop
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#a26916';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fca240';
      ctx.fillRect(corridor.x, corridor.y, corridor.width, corridor.height);

      lvl.pits.forEach(p => {
        if (p.opened) {
          ctx.fillStyle = '#a26916';
          ctx.fillRect(p.x, corridor.y, p.width, corridor.height + 150);
        }
      });

      drawDoor(doorX, corridor.y + corridor.height - 40, 34, 40);
      drawDummy(player);

      if (deathFlashTimer > 0) {
        ctx.fillStyle = 'rgba(59, 34, 0, 0.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        deathFlashTimer--;
      }

      requestAnimationFrame(update);
    }

    initLevel(currentLevelIdx);
    update();
  </script>
</body>
</html>

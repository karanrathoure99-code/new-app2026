<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Level 1 Game Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #2b1a09 0%, #0f0803 50%, #1a0f03 100%);
            background-attachment: fixed;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }

        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(43, 26, 9, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(210, 140, 60, 0.3);
            border-radius: 15px;
            padding: 8px 20px;
            margin-bottom: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: #ffaa00;
            text-shadow: 0 0 8px rgba(255,170,0,0.5);
        }

        .hud-stats {
            display: flex;
            gap: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #ffcc66;
        }

        .arena-container {
            flex: 1;
            background: rgba(20, 12, 5, 0.85);
            border: 2px solid rgba(210, 140, 60, 0.4);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(210, 140, 60, 0.1), 0 10px 30px rgba(0,0,0,0.6);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
            pointer-events: none;
        }

        @media (min-width: 1024px) {
            .controls-overlay {
                display: none;
            }
        }

        .control-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
            align-items: center;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            touch-action: manipulation;
        }

        .ctrl-btn:active, .ctrl-btn.active-touch {
            transform: scale(0.92);
            background: rgba(210, 140, 60, 0.5);
            border-color: #ffaa00;
        }

        .ctrl-btn.wide {
            width: 85px;
            border-radius: 16px;
            font-size: 10px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #d0b090;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .back-btn:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="game-hud">
            <div class="hud-title">⚡ LEVEL 1: STEALTH ARENA v2</div>
            <div class="hud-stats">
                <span id="scoreDisplay">COINS: 0</span>
                <span id="shieldDisplay">SHIELD: OFF</span>
            </div>
            <button class="back-btn" onclick="goHome()">QUIT</button>
        </div>

        <div class="arena-container">
            <canvas id="gameCanvas"></canvas>

            <div class="controls-overlay">
                <div class="control-group">
                    <button class="ctrl-btn" id="leftBtn">◀</button>
                    <button class="ctrl-btn" id="rightBtn">▶</button>
                    <button class="ctrl-btn wide" id="jumpBtn">JUMP/UP</button>
                </div>

                <div class="control-group">
                    <button class="ctrl-btn wide" id="shieldBtn" style="background: rgba(255,170,0,0.25);">SHIELD</button>
                    <button class="ctrl-btn wide" id="coinBtn" style="background: rgba(255,0,127,0.25);">COLLECT</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const displayWidth = canvas.parentElement.clientWidth;
            const displayHeight = canvas.parentElement.clientHeight;
            
            // Handle High-DPI screens for sharp rendering
            const dpr = window.devicePixelRatio || 1;
            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let shieldActive = false;
        let isExploding = false;
        let fragments = [];

        // Dynamic player positioning relative to canvas size
        let player = {
            x: 50,
            y: 100,
            width: 14,
            height: 28,
            vx: 0,
            vy: 0,
            speed: 3.5,
            jumpForce: -9,
            gravity: 0.42,
            isGrounded: false,
            legAngle: 0
        };

        // Platforms layout
        let platforms = [
            { x: 0, y: 550, w: 720, h: 6, type: 'ground' },
            { x: 720, y: 550, w: 40, h: 6, type: 'hiddenTrap', triggered: false }, 
            { x: 760, y: 550, w: 300, h: 6, type: 'ground' }
        ];

        // Coins placement
        let coins = [
            { x: 160, y: 520, collected: false, hasBomb: false },
            { x: 300, y: 520, collected: false, hasBomb: false },
            { x: 450, y: 520, collected: false, hasBomb: false },
            { x: 590, y: 520, collected: false, hasBomb: true },   
            { x: 690, y: 520, collected: false, hasBomb: false }
        ];

        let goal = { x: 920, y: 518, w: 14, h: 32 };
        let cameraX = 0;
        let keys = { left: false, right: false };

        // Web Audio API Blast Sound Effect
        function playBlastSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(15, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.log("Audio not allowed yet", e);
            }
        }

        // Improved Touch & Click Handlers
        const bindButton = (id, onStart, onEnd) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
            btn.addEventListener('mousedown', () => onStart());
            btn.addEventListener('mouseup', () => onEnd());
        };

        bindButton('leftBtn', () => keys.left = true, () => keys.left = false);
        bindButton('rightBtn', () => keys.right = true, () => keys.right = false);

        document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerJump();
        });
        document.getElementById('jumpBtn').addEventListener('mousedown', () => triggerJump());

        function triggerJump() {
            if (player.isGrounded && !isExploding) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
            }
        }

        const shieldBtn = document.getElementById('shieldBtn');
        const activateShield = () => {
            shieldActive = true;
            document.getElementById('shieldDisplay').innerText = "SHIELD: ON";
            document.getElementById('shieldDisplay').style.color = "#ffaa00";
        };
        const deactivateShield = () => {
            shieldActive = false;
            document.getElementById('shieldDisplay').innerText = "SHIELD: OFF";
            document.getElementById('shieldDisplay').style.color = "#ffcc66";
        };

        shieldBtn.addEventListener('touchstart', (e) => { e.preventDefault(); activateShield(); });
        shieldBtn.addEventListener('touchend', (e) => { e.preventDefault(); deactivateShield(); });
        shieldBtn.addEventListener('mousedown', activateShield);
        shieldBtn.addEventListener('mouseup', deactivateShield);

        document.getElementById('coinBtn').addEventListener('click', () => checkCoins());

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        function triggerExplosion() {
            if (shieldActive) return;
            isExploding = true;
            playBlastSound();

            fragments = [
                { x: player.x, y: player.y, vx: -4, vy: -5, color: '#ffffff' },
                { x: player.x + 5, y: player.y + 10, vx: 3, vy: -6, color: '#ffffff' },
                { x: player.x + 2, y: player.y + 15, vx: -5, vy: 1, color: '#ffffff' },
                { x: player.x + 8, y: player.y + 15, vx: 5, vy: 2, color: '#ffffff' },
                { x: player.x + 4, y: player.y + 4, vx: -2, vy: -3, color: '#ffcc00' }
            ];

            setTimeout(() => {
                alert("💥 Boom! Blast! Restarting level.");
                window.location.reload();
            }, 900);
        }

        function checkCoins() {
            coins.forEach(c => {
                if (!c.collected && Math.hypot((player.x + player.width/2) - c.x, (player.y + player.height/2) - c.y) < 22) {
                    c.collected = true;
                    if (c.hasBomb) {
                        triggerExplosion();
                    } else {
                        score += 20;
                    }
                }
            });
        }

        function update() {
            if (isExploding) {
                fragments.forEach(f => {
                    f.x += f.vx;
                    f.y += f.vy;
                    f.vy += 0.45; 
                });
                return;
            }

            if (keys.left) {
                player.vx = -player.speed;
                player.legAngle += 0.22;
            } else if (keys.right) {
                player.vx = player.speed;
                player.legAngle += 0.22;
            } else {
                player.vx = 0;
                player.legAngle = 0;
            }

            player.x += player.vx;
            player.vy += player.gravity;
            player.y += player.vy;

            player.isGrounded = false;
            platforms.forEach(p => {
                if (p.type === 'hiddenTrap' && p.triggered) return;

                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 10
                ) {
                    if (p.type === 'hiddenTrap') {
                        p.triggered = true;
                        setTimeout(() => triggerExplosion(), 120);
                    }
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            });

            if (player.y > canvas.height / (window.devicePixelRatio || 1) + 100) {
                triggerExplosion();
            }

            const logicalWidth = canvas.width / (window.devicePixelRatio || 1);
            cameraX = player.x - logicalWidth / 3;
            if (cameraX < 0) cameraX = 0;

            checkCoins();

            if (player.x >= goal.x && player.y + player.height >= goal.y) {
                alert("🎉 Level 1 Cleared Successfully!");
                window.location.href = "index.html";
            }

            document.getElementById('scoreDisplay').innerText = "COINS: " + score;
        }

        function draw() {
            const logicalWidth = canvas.width / (window.devicePixelRatio || 1);
            const logicalHeight = canvas.height / (window.devicePixelRatio || 1);

            ctx.clearRect(0, 0, logicalWidth, logicalHeight);

            ctx.save();
            ctx.translate(-cameraX, 0);

            platforms.forEach(p => {
                if (p.type === 'hiddenTrap' && p.triggered) return;
                ctx.fillStyle = '#4e311a';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#d28c3c';
                ctx.lineWidth = 1;
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            coins.forEach(c => {
                if (!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                }
            });

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 2;
            ctx.strokeRect(goal.x - 2, goal.y - 2, goal.w + 4, goal.h + 4);
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(goal.x + 2, goal.y + 10, 2, 6);

            if (isExploding) {
                fragments.forEach(f => {
                    ctx.fillStyle = f.color;
                    ctx.fillRect(f.x, f.y, 4, 4);
                });
            } else {
                let px = player.x;
                let py = player.y;

                if (shieldActive) {
                    ctx.beginPath();
                    ctx.arc(px + 7, py + 14, 20, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
                    ctx.fill();
                    ctx.strokeStyle = '#ffaa00';
                    ctx.stroke();
                }

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(px + 7, py + 4, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillRect(px + 5, py + 9, 4, 11);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(px + 5, py + 11);
                ctx.lineTo(px + 1, py + 16);
                ctx.moveTo(px + 9, py + 11);
                ctx.lineTo(px + 13, py + 16);

                let legSwing = Math.sin(player.legAngle) * 4;
                ctx.moveTo(px + 6, py + 20);
                ctx.lineTo(px + 4 + legSwing, py + 28);
                ctx.moveTo(px + 8, py + 20);
                ctx.lineTo(px + 10 - legSwing, py + 28);
                ctx.stroke();
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        function goHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devil Troll Runner</title>
  <style>
    /* ========== THEME CUSTOMIZATION ========== */
    :root {
      /* Level Devil जैसी क्लासिक ओरिजिनल थीम:
         --bg-wall: #845203; --corridor: #fbb034; --player: #000; --door: #d1d5db; */

      /* मॉडर्न डार्क/साइबर थीम (डिफ़ॉल्ट) */
      --bg-wall: #0f172a;        /* स्क्रीन के बाहर की दीवार */
      --corridor: #1e293b;       /* बीच का टनल / प्लेएरिया */
      --floor-color: #334155;    /* ज़मीन के ब्लॉक्स */
      --player-color: #38bdf8;   /* प्लेयर कैरेक्टर */
      --door-frame: #64748b;     /* दरवाज़े का फ्रेम */
      --door-fill: #94a3b8;      /* दरवाज़ा */
      --trap-spike: #ef4444;     /* स्पाइक्स / कांटे */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-wall);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    #gameCanvas {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      image-rendering: pixelated;
    }

    .ui-overlay {
      position: absolute;
      top: 15px;
      color: #94a3b8;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="ui-overlay" id="levelDisplay">LEVEL 1 / 50</div>
  <canvas id="gameCanvas" width="960" height="420"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('levelDisplay');

    // ================= TUNNEL DIMENSIONS =================
    const corridor = {
      x: 70,
      y: 160,
      width: 820,
      height: 100
    };

    // ================= GAME STATE & CONFIG =================
    let currentLevelIdx = 0;
    let deaths = 0;
    let deathScreenTimer = 0;

    // 50 लेवल्स का इंजन बेस (प्रारंभिक 5 वर्किंग लेवल्स)
    const levels = [
      {
        id: 1,
        playerStart: { x: 120 },
        door: { x: 740, behavior: 'none' },
        pits: [{ x: 540, width: 70, triggerX: 430, opened: false }],
        spikes: [],
        invert: false
      },
      {
        id: 2,
        playerStart: { x: 120 },
        door: { x: 740, behavior: 'jump_away', triggerDist: 120, jumped: false },
        pits: [],
        spikes: [],
        invert: false
      },
      {
        id: 3,
        playerStart: { x: 120 },
        door: { x: 740, behavior: 'none' },
        pits: [{ x: 380, width: 80, triggerX: 300, opened: false }],
        spikes: [{ x: 620, width: 40, height: 16, triggerX: 520, active: false }],
        invert: false
      },
      {
        id: 4,
        playerStart: { x: 120 },
        door: { x: 740, behavior: 'none' },
        pits: [{ x: 420, width: 60, triggerX: 340, opened: false }],
        spikes: [],
        invert: true // Controls Ulte
      },
      {
        id: 5,
        playerStart: { x: 120 },
        door: { x: 740, behavior: 'teleport', triggerDist: 90, teleported: false },
        pits: [{ x: 600, width: 60, triggerX: 480, opened: false }],
        spikes: [],
        invert: false
      }
    ];

    // ================= PLAYER OBJECT =================
    const player = {
      x: 120,
      y: 0,
      width: 14,
      height: 28,
      vx: 0,
      vy: 0,
      speed: 3.5,
      jumpPower: -8.8,
      grounded: false
    };

    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    function initLevel(idx) {
      currentLevelIdx = idx % levels.length;
      levelDisplay.innerText = `LEVEL ${levels[currentLevelIdx].id} / 50`;
      
      const lvl = levels[currentLevelIdx];
      player.x = lvl.playerStart.x;
      player.y = corridor.y + corridor.height - player.height;
      player.vx = 0;
      player.vy = 0;

      // Reset dynamic traps
      lvl.pits.forEach(p => p.opened = false);
      lvl.spikes.forEach(s => s.active = false);
      if (lvl.door.behavior === 'jump_away') lvl.door.jumped = false;
      if (lvl.door.behavior === 'teleport') lvl.door.teleported = false;
    }

    // ================= DRAW FUNCTIONS =================
    function drawDoor(x, y, w, h) {
      // Outer arch
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--door-frame').trim() || '#64748b';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + 10, w / 2, Math.PI, 0);
      ctx.rect(x, y + 10, w, h - 10);
      ctx.fill();

      // Inner panel
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--door-fill').trim() || '#94a3b8';
      ctx.beginPath();
      ctx.arc(x + w / 2, y + 12, (w - 6) / 2, Math.PI, 0);
      ctx.rect(x + 3, y + 12, w - 6, h - 12);
      ctx.fill();
    }

    function drawSpike(x, y, w, h) {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--trap-spike').trim() || '#ef4444';
      const count = 3;
      const step = w / count;
      for (let i = 0; i < count; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * step, y);
        ctx.lineTo(x + (i + 0.5) * step, y - h);
        ctx.lineTo(x + (i + 1) * step, y);
        ctx.fill();
      }
    }

    function triggerDeath() {
      deaths++;
      deathScreenTimer = 25; // Flash screen frames
      initLevel(currentLevelIdx);
    }

    // ================= MAIN LOOP =================
    function loop() {
      const lvl = levels[currentLevelIdx];
      const floorY = corridor.y + corridor.height - player.height;

      // 1. Controls
      let moveDir = 0;
      if (keys['ArrowRight'] || keys['KeyD']) moveDir += 1;
      if (keys['ArrowLeft'] || keys['KeyA']) moveDir -= 1;
      if (lvl.invert) moveDir *= -1; // उल्टे कंट्रोल्स

      player.vx = moveDir * player.speed;

      if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }

      // 2. Physics & Gravity
      player.vy += 0.42;
      player.x += player.vx;
      player.y += player.vy;

      // 3. Traps Trigger Check
      lvl.pits.forEach(pit => {
        if (player.x > pit.triggerX) pit.opened = true;
      });

      lvl.spikes.forEach(spike => {
        if (player.x > spike.triggerX) spike.active = true;
      });

      // Door Troll Mechanics
      let currentDoorX = lvl.door.x;
      if (lvl.door.behavior === 'jump_away' && Math.abs(player.x - lvl.door.x) < lvl.door.triggerDist) {
        lvl.door.jumped = true;
      }
      if (lvl.door.jumped) currentDoorX = corridor.x + corridor.width - 50;

      if (lvl.door.behavior === 'teleport' && Math.abs(player.x - lvl.door.x) < lvl.door.triggerDist) {
        lvl.door.teleported = true;
      }
      if (lvl.door.teleported) currentDoorX = corridor.x + 30;

      // 4. Collision with Floor & Pits
      let onPit = false;
      lvl.pits.forEach(pit => {
        if (pit.opened && (player.x + player.width > pit.x && player.x < pit.x + pit.width)) {
          onPit = true;
        }
      });

      if (!onPit && player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.grounded = true;
      }

      // Spike Collision
      lvl.spikes.forEach(spike => {
        if (spike.active) {
          const spikeTop = corridor.y + corridor.height - spike.height;
          if (
            player.x + player.width > spike.x &&
            player.x < spike.x + spike.width &&
            player.y + player.height > spikeTop
          ) {
            triggerDeath();
          }
        }
      });

      // Out of bounds / Fall death
      if (player.y > canvas.height + 50) {
        triggerDeath();
      }

      // Door Entry (Level Complete)
      const doorY = corridor.y + corridor.height - 36;
      if (
        player.x + player.width > currentDoorX &&
        player.x < currentDoorX + 32 &&
        player.y + player.height >= doorY
      ) {
        initLevel(currentLevelIdx + 1);
      }

      // ================= RENDERING =================
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background Wall
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-wall').trim() || '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Death Flash / Red Screen
      if (deathScreenTimer > 0) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        deathScreenTimer--;
      }

      // Corridor (Play Area)
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--corridor').trim() || '#1e293b';
      ctx.fillRect(corridor.x, corridor.y, corridor.width, corridor.height);

      // Pits (गड्ढे - बैकग्राउंड कलर से ढकना)
      lvl.pits.forEach(pit => {
        if (pit.opened) {
          ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-wall').trim() || '#0f172a';
          ctx.fillRect(pit.x, corridor.y + corridor.height - 8, pit.width, 20);
        }
      });

      // Spikes
      lvl.spikes.forEach(spike => {
        if (spike.active) {
          drawSpike(spike.x, corridor.y + corridor.height, spike.width, spike.height);
        }
      });

      // Door
      drawDoor(currentDoorX, corridor.y + corridor.height - 36, 32, 36);

      // Player
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--player-color').trim() || '#38bdf8';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      requestAnimationFrame(loop);
    }

    // Start Game
    initLevel(0);
    loop();
  </script>
</body>
</html>

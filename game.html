<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeFire Style Massive 3D Open-World Battleground</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(10, 15, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px 24px;
            border-radius: 12px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
        }
        #instructions span {
            color: #ff5500;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <strong>FreeFire Style 3D Battleground:</strong><br>
        Move: <span>W, A, S, D</span> or <span>Arrow Keys</span><br>
        Jump: <span>SPACEBAR</span><br>
        Look Around: <span>Mouse Click & Drag</span><br>
        <em>Note: Enter FreeFire style houses strictly through the front door!</em>
    </div>

    <!-- Include Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let character;
        let leftArm, rightArm, leftLeg, rightLeg;
        let obstacles = [];
        
        // Physics & Movement variables
        let velocityY = 0;
        let gravity = 0.015;
        let isGrounded = false;
        const moveSpeed = 0.15;
        const jumpForce = 0.38;
        
        let keys = { w: false, a: false, s: false, d: false };
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let cameraAngleX = 0, cameraAngleY = 0.45;

        init();
        animate();

        function init() {
            // 1. Scene & Battleground Sky Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x4a85e8); // HD FreeFire Sky Blue
            scene.fog = new THREE.FogExp2(0x6fa3f7, 0.0018); // Atmospheric distance fog for massive map scale

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 3000);

            // 3. Ultra HD Renderer Setup with Soft Shadows & Cinematic Tone Mapping
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 4. Cinematic Lighting (Sun & Ambient Glow)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.4);
            sunLight.position.set(300, 500, 300);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 4048;
            sunLight.shadow.mapSize.height = 4048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 1500;
            const shadowRange = 400;
            sunLight.shadow.camera.left = -shadowRange;
            sunLight.shadow.camera.right = shadowRange;
            sunLight.shadow.camera.top = shadowRange;
            sunLight.shadow.camera.bottom = -shadowRange;
            sunLight.shadow.bias = -0.0003;
            scene.add(sunLight);

            // 5. Massive FreeFire-Sized Terrain Ground (1600x1600 units) with Hills and Grass Tuplets
            const groundGeo = new THREE.PlaneGeometry(1600, 1600, 100, 100);
            const posAttr = groundGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i);
                const vy = posAttr.getY(i);
                if (Math.abs(vx) > 50 || Math.abs(vy) > 50) {
                    posAttr.setZ(i, Math.sin(vx * 0.01) * Math.cos(vy * 0.01) * 7.5);
                }
            }
            groundGeo.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x2e4f18, 
                roughness: 0.92, 
                metalness: 0.02 
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Add Grass Tuplets across the ground to make it look lush and real
            createGrassField();

            // 6. Build Massive World (50+ Tree Variations, FreeFire Houses, Mountains)
            buildMassiveWorld();

            // 7. Build Ultra-Realistic 3D School Uniform Dummy Character
            character = new THREE.Group();
            
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5c6a5, roughness: 0.6 });
            const whiteShirtMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.45 }); 
            const blackPantsMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.4 }); 
            const blackShoeMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.25, metalness: 0.2 }); 
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x221308, roughness: 0.8 });     

            // Torso (White Shirt)
            const torsoGeo = new THREE.BoxGeometry(0.5, 0.65, 0.3);
            const torso = new THREE.Mesh(torsoGeo, whiteShirtMat);
            torso.position.y = 0.95;
            torso.castShadow = true;
            character.add(torso);

            // Head & 3D Hair
            const headGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.45;
            head.castShadow = true;
            character.add(head);

            const hairGeo = new THREE.BoxGeometry(0.37, 0.14, 0.37);
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.set(0, 1.66, 0);
            hair.castShadow = true;
            character.add(hair);

            // Left Arm with 3D Fingers
            const armGeo = new THREE.BoxGeometry(0.14, 0.52, 0.14);
            leftArm = new THREE.Mesh(armGeo, whiteShirtMat);
            leftArm.position.set(-0.35, 0.95, 0);
            leftArm.castShadow = true;
            character.add(leftArm);

            const fingerGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const leftHand = new THREE.Mesh(fingerGeo, skinMat);
            leftHand.position.set(0, -0.3, 0);
            leftArm.add(leftHand);

            // Right Arm with 3D Fingers
            rightArm = new THREE.Mesh(armGeo, whiteShirtMat);
            rightArm.position.set(0.35, 0.95, 0);
            rightArm.castShadow = true;
            character.add(rightArm);

            const rightHand = new THREE.Mesh(fingerGeo, skinMat);
            rightHand.position.set(0, -0.3, 0);
            rightArm.add(rightHand);

            // Left Leg & Black School Shoe
            const legGeo = new THREE.BoxGeometry(0.18, 0.5, 0.18);
            leftLeg = new THREE.Mesh(legGeo, blackPantsMat);
            leftLeg.position.set(-0.14, 0.45, 0);
            leftLeg.castShadow = true;
            character.add(leftLeg);

            const shoeGeo = new THREE.BoxGeometry(0.2, 0.12, 0.27);
            const leftShoe = new THREE.Mesh(shoeGeo, blackShoeMat);
            leftShoe.position.set(0, -0.3, 0.03);
            leftLeg.add(leftShoe);

            // Right Leg & Black School Shoe
            rightLeg = new THREE.Mesh(legGeo, blackPantsMat);
            rightLeg.position.set(0.14, 0.45, 0);
            rightLeg.castShadow = true;
            character.add(rightLeg);

            const rightShoe = new THREE.Mesh(shoeGeo, blackShoeMat);
            rightShoe.position.set(0, -0.3, 0.03);
            rightLeg.add(rightShoe);

            // Start Spawn Position in Open Compound
            character.position.set(0, 0, 20);
            scene.add(character);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            
            window.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => { isMouseDown = false; });
            window.addEventListener('mousemove', onMouseMove);
        }

        // ================= MASSIVE WORLD GENERATION =================
        function createGrassField() {
            // Procedural grass patches across the map
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x3b6e1a, roughness: 0.9 });
            for (let i = 0; i < 150; i++) {
                const gx = (Math.random() - 0.5) * 1200;
                const gz = (Math.random() - 0.5) * 1200;
                if (Math.abs(gx) < 30 && Math.abs(gz) < 30) continue; // Keep spawn clear
                
                const patchGeo = new THREE.ConeGeometry(0.4, 0.8, 4);
                const patch = new THREE.Mesh(patchGeo, grassMat);
                patch.position.set(gx, 0.4, gz);
                scene.add(patch);
            }
        }

        function buildMassiveWorld() {
            // 1. Epic Mountain Ranges (Surrounding the massive FreeFire map)
            createMountain(-500, 40, -500, 250, 120, 250, 0x3b4639);
            createMountain(500, 45, -550, 280, 135, 280, 0x323c30);
            createMountain(0, 50, -700, 350, 150, 300, 0x2a3328);
            createMountain(-600, 42, 200, 260, 125, 260, 0x374235);
            createMountain(620, 48, 250, 300, 140, 300, 0x303a2e);

            // 2. 50+ Tree Variations (Bargad, Peepal, Neem, Apple & Tropical Jungle Trees)
            const treeTypes = ['bargad', 'peepal', 'neem', 'apple', 'tropical'];
            for (let i = 0; i < 55; i++) {
                const tx = (Math.random() - 0.5) * 1000;
                const tz = (Math.random() - 0.5) * 1000;
                // Avoid placing directly on center spawn
                if (Math.abs(tx) < 15 && Math.abs(tz) < 15) continue;

                const selectedType = treeTypes[Math.floor(Math.random() * treeTypes.length)];
                if (selectedType === 'bargad') createBargadTree(tx, tz);
                else if (selectedType === 'peepal') createPeepalTree(tx, tz);
                else if (selectedType === 'neem') createNeemTree(tx, tz);
                else if (selectedType === 'apple') createAppleTree(tx, tz);
                else createTropicalTree(tx, tz);
            }

            // 3. FreeFire Style Multi-Room Houses with Functional Front Doors & Stairs
            createFreeFireHouse(-40, -30, 0);
            createFreeFireHouse(50, -60, Math.PI / 2);
            createFreeFireHouse(-70, 50, Math.PI);
            createFreeFireHouse(60, 70, -Math.PI / 4);

            // 4. Outlying Village Huts & Warehouses
            createHut(-90, -20);
            createHut(90, -30);
            createHut(-30, -120);
            createHut(30, 130);
        }

        function createMountain(x, y, z, w, h, d, color) {
            const geo = new THREE.ConeGeometry(w / 2, h, 8);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.95 });
            const mountain = new THREE.Mesh(geo, mat);
            mountain.position.set(x, y + h / 2 - 2, z);
            mountain.castShadow = true;
            mountain.receiveShadow = true;
            scene.add(mountain);
        }

        function createBargadTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4d3826, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.9, 5.2, 8), trunkMat);
            trunk.position.set(x, 2.6, z);
            trunk.castShadow = true;
            scene.add(trunk);

            for (let i = 0; i < 4; i++) {
                const angle = i * (Math.PI / 2);
                const root = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.28, 4.2, 5), trunkMat);
                root.position.set(x + Math.cos(angle) * 1.6, 2, z + Math.sin(angle) * 1.6);
                scene.add(root);
            }

            const canopyMat = new THREE.MeshStandardMaterial({ color: 0x193d1e, roughness: 0.85 });
            const top = new THREE.Mesh(new THREE.SphereGeometry(3.6, 8, 8), canopyMat);
            top.position.set(x, 6.2, z);
            top.castShadow = true;
            scene.add(top);

            obstacles.push({ minX: x - 1.3, maxX: x + 1.3, minZ: z - 1.3, maxZ: z + 1.3, topY: 0 });
        }

        function createPeepalTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4331, roughness: 0.85 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 1.35, 6.2, 8), trunkMat);
            trunk.position.set(x, 3.1, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x205425, roughness: 0.8 });
            const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(3.2, 1), leavesMat);
            leaves.position.set(x, 6.8, z);
            leaves.castShadow = true;
            scene.add(leaves);

            obstacles.push({ minX: x - 1.1, maxX: x + 1.1, minZ: z - 1.1, maxZ: z + 1.1, topY: 0 });
        }

        function createNeemTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x463223, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 1.05, 5.2, 7), trunkMat);
            trunk.position.set(x, 2.6, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2a632d, roughness: 0.8 });
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.6, 4.8, 6), leavesMat);
            leaves.position.set(x, 5.8, z);
            leaves.castShadow = true;
            scene.add(leaves);

            obstacles.push({ minX: x - 0.9, maxX: x + 0.9, minZ: z - 0.9, maxZ: z + 0.9, topY: 0 });
        }

        function createAppleTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x543b30, roughness: 0.85 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.95, 4.2, 6), trunkMat);
            trunk.position.set(x, 2.1, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x25622e, roughness: 0.8 });
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.4, 6, 6), leavesMat);
            leaves.position.set(x, 4.8, z);
            leaves.castShadow = true;
            scene.add(leaves);

            const appleMat = new THREE.MeshStandardMaterial({ color: 0xd92b2b, roughness: 0.35 });
            for (let i = 0; i < 4; i++) {
                const apple = new THREE.Mesh(new THREE.SphereGeometry(0.16, 5, 5), appleMat);
                apple.position.set(x + (i % 2 === 0 ? 0.85 : -0.85), 4.2 + (i * 0.2), z + (i > 1 ? 0.85 : -0.85));
                scene.add(apple);
            }

            obstacles.push({ minX: x - 0.8, maxX: x + 0.8, minZ: z - 0.8, maxZ: z + 0.8, topY: 0 });
        }

        function createTropicalTree(x, z) {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6e503b, roughness: 0.8 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 7, 7), trunkMat);
            trunk.position.set(x, 3.5, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x184a22, roughness: 0.85 });
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.8, 7, 7), leavesMat);
            leaves.position.set(x, 7.2, z);
            leaves.castShadow = true;
            scene.add(leaves);

            obstacles.push({ minX: x - 0.7, maxX: x + 0.7, minZ: z - 0.7, maxZ: z + 0.7, topY: 0 });
        }

        // FreeFire Style Multi-Room House with Door Entry & Staircase
        function createFreeFireHouse(x, z, rotationY) {
            const houseGroup = new THREE.Group();
            houseGroup.position.set(x, 0, z);
            houseGroup.rotation.y = rotationY;

            const wallMat = new THREE.MeshStandardMaterial({ color: 0xd6d3c4, roughness: 0.7 }); // Concrete finish
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8a2f24, roughness: 0.6 }); // Metal rusty red roof

            // House Base Structure
            const baseGeo = new THREE.BoxGeometry(9, 5.5, 9);
            const base = new THREE.Mesh(baseGeo, wallMat);
            base.position.y = 2.75;
            base.castShadow = true;
            base.receiveShadow = true;
            houseGroup.add(base);

            // Slanted FreeFire Roof
            const roofGeo = new THREE.ConeGeometry(7.0, 3.5, 4);
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 7.25;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            houseGroup.add(roof);

            // Staircase leading to front door
            for (let i = 0; i < 3; i++) {
                const stairGeo = new THREE.BoxGeometry(2.8, 0.3, 0.7);
                const stairMat = new THREE.MeshStandardMaterial({ color: 0x595959, roughness: 0.5 });
                const stair = new THREE.Mesh(stairGeo, stairMat);
                stair.position.set(0, i * 0.3 + 0.15, 4.8 + (2 - i) * 0.6);
                stair.castShadow = true;
                stair.receiveShadow = true;
                houseGroup.add(stair);

                const worldStairX = x + stair.position.x * Math.cos(rotationY) - stair.position.z * Math.sin(rotationY);
                const worldStairZ = z + stair.position.x * Math.sin(rotationY) + stair.position.z * Math.cos(rotationY);
                obstacles.push({
                    minX: worldStairX - 1.4, maxX: worldStairX + 1.4,
                    minZ: worldStairZ - 0.5, maxZ: worldStairZ + 0.5,
                    topY: stair.position.y + 0.15
                });
            }

            scene.add(houseGroup);

            // Wall Collisions (Leaving front door gap open so dummy enters strictly through door)
            obstacles.push({ minX: x - 4.7, maxX: x - 4.3, minZ: z - 4.5, maxZ: z + 4.5, topY: 5.5 });
            obstacles.push({ minX: x + 4.3, maxX: x + 4.7, minZ: z - 4.5, maxZ: z + 4.5, topY: 5.5 });
            obstacles.push({ minX: x - 4.5, maxX: x + 4.5, minZ: z - 4.7, maxZ: z - 4.3, topY: 5.5 });
            obstacles.push({ minX: x - 4.5, maxX: x - 1.3, minZ: z + 4.3, maxZ: z + 4.7, topY: 5.5 });
            obstacles.push({ minX: x + 1.3, maxX: x + 4.5, minZ: z + 4.3, maxZ: z + 4.7, topY: 5.5 });
        }

        // Outlying Hut
        function createHut(x, z) {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xbf9b7a, roughness: 0.8 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xa8481c, roughness: 0.7 });

            const walls = new THREE.Mesh(new THREE.BoxGeometry(4, 2.5, 4), wallMat);
            walls.position.set(x, 1.25, z);
            walls.castShadow = true;
            walls.receiveShadow = true;
            scene.add(walls);

            const roof = new THREE.Mesh(new THREE.ConeGeometry(3.1, 2.0, 4), roofMat);
            roof.position.set(x, 3.5, z);
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            scene.add(roof);

            obstacles.push({ minX: x - 2, maxX: x - 0.7, minZ: z + 1.8, maxZ: z + 2.1, topY: 2.5 });
            obstacles.push({ minX: x + 0.7, maxX: x + 2, minZ: z + 1.8, maxZ: z + 2.1, topY: 2.5 });
            obstacles.push({ minX: x - 2.1, maxX: x - 1.8, minZ: z - 2, maxZ: z + 2, topY: 2.5 });
            obstacles.push({ minX: x + 1.8, maxX: x + 2.1, minZ: z - 2, maxZ: z + 2, topY: 2.5 });
            obstacles.push({ minX: x - 2, maxX: x + 2, minZ: z - 2.1, maxZ: z - 1.8, topY: 2.5 });
        }

        function handleKey(e, isDown) {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.w = isDown; break;
                case 'KeyS': case 'ArrowDown': keys.s = isDown; break;
                case 'KeyA': case 'ArrowLeft': keys.a = isDown; break;
                case 'KeyD': case 'ArrowRight': keys.d = isDown; break;
                case 'Space': 
                    if (isDown && isGrounded) {
                        velocityY = jumpForce;
                        isGrounded = false;
                    }
                    break;
            }
        }

        function onMouseMove(e) {
            if (!isMouseDown) return;
            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;
            
            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.1, Math.min(1.4, cameraAngleY - deltaY * 0.005));
            
            mouseX = e.clientX;
            mouseY = e.clientY;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            let inputX = 0;
            let inputZ = 0;

            if (keys.w) inputZ -= 1;
            if (keys.s) inputZ += 1;
            if (keys.a) inputX -= 1;
            if (keys.d) inputX += 1;

            if (inputX !== 0 || inputZ !== 0) {
                const moveX = (inputX * Math.cos(cameraAngleX) + inputZ * Math.sin(cameraAngleX)) * moveSpeed;
                const moveZ = (inputX * -Math.sin(cameraAngleX) + inputZ * Math.cos(cameraAngleX)) * moveSpeed;

                character.position.x += moveX;
                character.position.z += moveZ;

                const targetRotation = Math.atan2(moveX, moveZ);
                character.rotation.y = targetRotation;
            }

            // Gravity & Vertical Physics
            velocityY -= gravity;
            character.position.y += velocityY;

            // Surface Collision Check
            let targetGroundY = 0;

            for (let obs of obstacles) {
                if (character.position.x >= obs.minX && character.position.x <= obs.maxX &&
                    character.position.z >= obs.minZ && character.position.z <= obs.maxZ) {
                    if (character.position.y >= obs.topY - 0.6 && character.position.y <= obs.topY + 0.6) {
                        if (obs.topY > targetGroundY) {
                            targetGroundY = obs.topY;
                        }
                    }
                }
            }

            if (character.position.y <= targetGroundY) {
                character.position.y = targetGroundY;
                velocityY = 0;
                isGrounded = true;
            }

            // Walking & Jumping Animations
            const time = Date.now() * 0.01;
            const isMoving = (inputX !== 0 || inputZ !== 0) && isGrounded;

            if (!isGrounded) {
                leftArm.rotation.x = -Math.PI * 0.6;
                rightArm.rotation.x = -Math.PI * 0.6;
                leftLeg.rotation.x = Math.PI * 0.3;
                rightLeg.rotation.x = -Math.PI * 0.3;
            } else if (isMoving) {
                leftArm.rotation.x = Math.sin(time) * 0.8;
                rightArm.rotation.x = -Math.sin(time) * 0.8;
                leftLeg.rotation.x = -Math.sin(time) * 0.8;
                rightLeg.rotation.x = Math.sin(time) * 0.8;
            } else {
                leftArm.rotation.x = 0;
                rightArm.rotation.x = 0;
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
            }

            // Third-Person Camera Tracking
            const camDistance = 7.0;
            const targetCamX = character.position.x + Math.sin(cameraAngleX) * camDistance * Math.cos(cameraAngleY);
            const targetCamY = character.position.y + Math.sin(cameraAngleY) * camDistance + 1.2;
            const targetCamZ = character.position.z + Math.cos(cameraAngleX) * camDistance * Math.cos(cameraAngleY);

            camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.1);
            camera.lookAt(character.position.x, character.position.y + 1.0, character.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Level 1 Game Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            /* 20% Lighter Background while keeping original color theme */
            background: linear-gradient(135deg, #42280e 0%, #1c0e05 50%, #2b1906 100%);
            background-attachment: fixed;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }

        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(55, 34, 12, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(225, 155, 75, 0.3);
            border-radius: 15px;
            padding: 8px 20px;
            margin-bottom: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: #ffb81a;
            text-shadow: 0 0 8px rgba(255,184,26,0.5);
        }

        .hud-stats {
            display: flex;
            gap: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #ffd67a;
        }

        .arena-container {
            flex: 1;
            background: rgba(30, 18, 8, 0.85);
            border: 2px solid rgba(225, 155, 75, 0.4);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(225, 155, 75, 0.1), 0 10px 30px rgba(0,0,0,0.6);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-overlay {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            pointer-events: none;
            z-index: 10;
        }

        @media (min-width: 1024px) {
            .controls-overlay {
                display: none;
            }
        }

        .control-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
            align-items: center;
        }

        /* 3D Glass Effect 80% Transparent (rgba with alpha ~0.2) */
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-bottom: 3px solid rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.6);
            touch-action: manipulation;
            position: relative;
        }

        .ctrl-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            background: rgba(210, 140, 60, 0.35);
            border-color: #ffaa00;
        }

        /* Small Logo inside buttons to make them compact and styled like back/front buttons */
        .btn-logo {
            font-size: 9px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 4px rgba(255, 204, 0, 0.8);
            margin-bottom: 1px;
            letter-spacing: -0.5px;
        }

        .btn-label {
            font-size: 8px;
            font-weight: 700;
            line-height: 1;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #e0c0a0;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .back-btn:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="game-hud">
            <div class="hud-title">⚡ LEVEL 1: STEALTH ARENA v2</div>
            <div class="hud-stats">
                <span id="scoreDisplay">COINS: 0</span>
                <span id="shieldDisplay">SHIELD: OFF</span>
            </div>
            <button class="back-btn" onclick="goHome()">QUIT</button>
        </div>

        <div class="arena-container">
            <canvas id="gameCanvas"></canvas>

            <div class="controls-overlay">
                <!-- Left Side: Back/Front (Left/Right) & Down Move Buttons with 3D glass effect -->
                <div class="control-group">
                    <button class="ctrl-btn" id="leftBtn">◀</button>
                    <button class="ctrl-btn" id="rightBtn">▶</button>
                    <button class="ctrl-btn" id="downBtn">▼</button>
                </div>

                <!-- Right Side: Jump, Down, Shield Buttons with small logo inside -->
                <div class="control-group">
                    <button class="ctrl-btn" id="jumpBtn">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">JUMP</span>
                    </button>
                    <button class="ctrl-btn" id="rightDownBtn">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">DOWN</span>
                    </button>
                    <button class="ctrl-btn" id="shieldBtn" style="background: rgba(255,170,0,0.25);">
                        <span class="btn-logo" style="color:#ffaa00;">Z</span>
                        <span class="btn-label">SHLD</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let canvasWidth = 800;
        let canvasHeight = 500;

        function resizeCanvas() {
            canvasWidth = canvas.parentElement.clientWidth;
            canvasHeight = canvas.parentElement.clientHeight;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';

            updateGameLayout();
        }

        let score = 0;
        let shieldActive = false;
        let isExploding = false;
        let fragments = [];

        let player = {
            x: 50,
            y: 100,
            width: 14,
            height: 28,
            vx: 0,
            vy: 0,
            speed: 3.5,
            jumpForce: -9,
            gravity: 0.42,
            isGrounded: false,
            legAngle: 0
        };

        let platforms = [];
        let coins = [];
        let goal = { x: 1060, y: 0, w: 14, h: 32 };

        function updateGameLayout() {
            const groundY = canvasHeight - 50;

            // Surface length matched to big box width & thickness aligned precisely with bottom box line
            platforms = [
                { x: 0, y: groundY, w: 720, h: 6, type: 'ground' },
                { x: 720, y: groundY, w: 80, h: 6, type: 'hiddenTrap', triggered: false }, 
                { x: 800, y: groundY, w: 300, h: 6, type: 'ground' }
            ];

            // Coin size adjusted proportionally to dame (player) size & placement
            coins = [
                { x: 160, y: groundY - 26, collected: false, hasBomb: false, radius: 4.5 },
                { x: 300, y: groundY - 26, collected: false, hasBomb: false, radius: 4.5 },
                { x: 450, y: groundY - 26, collected: false, hasBomb: false, radius: 4.5 },
                { x: 590, y: groundY - 26, collected: false, hasBomb: true, radius: 4.5 },   
                { x: 750, y: groundY - 26, collected: false, hasBomb: false, radius: 4.5 },
                { x: 920, y: groundY - 26, collected: false, hasBomb: false, radius: 4.5 }
            ];

            goal.y = groundY - 32;
            goal.x = 1060;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let cameraX = 0;
        let keys = { left: false, right: false, down: false };

        function playBlastSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(15, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.log("Audio not allowed yet", e);
            }
        }

        const bindButton = (id, onStart, onEnd) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
            btn.addEventListener('mousedown', () => onStart());
            btn.addEventListener('mouseup', () => onEnd());
        };

        bindButton('leftBtn', () => keys.left = true, () => keys.left = false);
        bindButton('rightBtn', () => keys.right = true, () => keys.right = false);
        bindButton('downBtn', () => keys.down = true, () => keys.down = false);
        bindButton('rightDownBtn', () => keys.down = true, () => keys.down = false);

        const jumpBtn = document.getElementById('jumpBtn');
        if (jumpBtn) {
            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerJump(); });
            jumpBtn.addEventListener('mousedown', () => triggerJump());
        }

        function triggerJump() {
            if (player.isGrounded && !isExploding) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
            }
        }

        const shieldBtn = document.getElementById('shieldBtn');
        if (shieldBtn) {
            const activateShield = () => {
                shieldActive = true;
                document.getElementById('shieldDisplay').innerText = "SHIELD: ON";
                document.getElementById('shieldDisplay').style.color = "#ffaa00";
            };
            const deactivateShield = () => {
                shieldActive = false;
                document.getElementById('shieldDisplay').innerText = "SHIELD: OFF";
                document.getElementById('shieldDisplay').style.color = "#ffd67a";
            };
            shieldBtn.addEventListener('touchstart', (e) => { e.preventDefault(); activateShield(); });
            shieldBtn.addEventListener('touchend', (e) => { e.preventDefault(); deactivateShield(); });
            shieldBtn.addEventListener('mousedown', activateShield);
            shieldBtn.addEventListener('mouseup', deactivateShield);
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
        });

        function triggerExplosion() {
            if (shieldActive) return;
            isExploding = true;
            playBlastSound();

            fragments = [
                { x: player.x, y: player.y, vx: -4, vy: -5, color: '#ffffff' },
                { x: player.x + 5, y: player.y + 10, vx: 3, vy: -6, color: '#ffffff' },
                { x: player.x + 2, y: player.y + 15, vx: -5, vy: 1, color: '#ffffff' },
                { x: player.x + 8, y: player.y + 15, vx: 5, vy: 2, color: '#ffffff' },
                { x: player.x + 4, y: player.y + 4, vx: -2, vy: -3, color: '#ffcc00' }
            ];

            setTimeout(() => {
                alert("💥 Boom! Blast! Restarting level.");
                window.location.reload();
            }, 900);
        }

        function checkCoins() {
            coins.forEach(c => {
                if (!c.collected && Math.hypot((player.x + player.width/2) - c.x, (player.y + player.height/2) - c.y) < 22) {
                    c.collected = true;
                    if (c.hasBomb) {
                        triggerExplosion();
                    } else {
                        score += 20;
                    }
                }
            });
        }

        function update() {
            if (isExploding) {
                fragments.forEach(f => {
                    f.x += f.vx;
                    f.y += f.vy;
                    f.vy += 0.45; 
                });
                return;
            }

            if (keys.left) {
                player.vx = -player.speed;
                player.legAngle += 0.22;
            } else if (keys.right) {
                player.vx = player.speed;
                player.legAngle += 0.22;
            } else {
                player.vx = 0;
                player.legAngle = 0;
            }

            // Down button / key action: make dame (player) bow / crouch (reduce height)
            if (keys.down) {
                player.height = 18;
            } else {
                player.height = 28;
            }

            player.x += player.vx;
            player.vy += player.gravity;
            player.y += player.vy;

            player.isGrounded = false;
            platforms.forEach(p => {
                if (p.type === 'hiddenTrap' && p.triggered) return;

                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 10
                ) {
                    if (p.type === 'hiddenTrap') {
                        p.triggered = true;
                        setTimeout(() => triggerExplosion(), 120);
                    }
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            });

            if (player.y > canvasHeight + 100) {
                triggerExplosion();
            }

            cameraX = player.x - canvasWidth / 3;
            if (cameraX < 0) cameraX = 0;

            checkCoins();

            if (player.x >= goal.x && player.y + player.height >= goal.y) {
                alert("🎉 Level 1 Cleared Successfully!");
                window.location.href = "index.html";
            }

            document.getElementById('scoreDisplay').innerText = "COINS: " + score;
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            ctx.save();
            ctx.translate(-cameraX, 0);

            platforms.forEach(p => {
                if (p.type === 'hiddenTrap' && p.triggered) return;
                ctx.fillStyle = '#4e311a';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#e19b4b';
                ctx.lineWidth = 1;
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            coins.forEach(c => {
                if (!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                }
            });

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 2;
            ctx.strokeRect(goal.x - 2, goal.y - 2, goal.w + 4, goal.h + 4);
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(goal.x + 2, goal.y + 10, 2, 6);

            if (isExploding) {
                fragments.forEach(f => {
                    ctx.fillStyle = f.color;
                    ctx.fillRect(f.x, f.y, 4, 4);
                });
            } else {
                let px = player.x;
                let py = player.y;

                if (shieldActive) {
                    ctx.beginPath();
                    ctx.arc(px + 7, py + player.height/2, 20, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
                    ctx.fill();
                    ctx.strokeStyle = '#ffaa00';
                    ctx.stroke();
                }

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(px + 7, py + 4, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillRect(px + 5, py + 9, 4, player.height - 10);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(px + 5, py + 11);
                ctx.lineTo(px + 1, py + 16);
                ctx.moveTo(px + 9, py + 11);
                ctx.lineTo(px + 13, py + 16);

                let legSwing = Math.sin(player.legAngle) * 4;
                ctx.moveTo(px + 6, py + player.height - 8);
                ctx.lineTo(px + 4 + legSwing, py + player.height);
                ctx.moveTo(px + 8, py + player.height - 8);
                ctx.lineTo(px + 10 - legSwing, py + player.height);
                ctx.stroke();
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        function goHome() {
            window.location.href = "index.html";
        }

        // Full Screen API Auto-Fit Integration
        window.addEventListener('load', () => {
            const requestFullScreen = () => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => console.log(err));
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            };
            window.addEventListener('click', requestFullScreen, { once: true });
            window.addEventListener('touchstart', requestFullScreen, { once: true });
        });
    </script>
</body>
</html>

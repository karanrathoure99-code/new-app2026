<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive 3D Open-World Map Generator & Editor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #5294e2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(10, 15, 25, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #info span {
            color: #38bdf8;
            font-weight: bold;
        }
        /* Customization Control Panel UI */
        #control-panel {
            position: absolute;
            top: 15px;
            left: 280px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            max-width: 260px;
        }
        .control-group {
            margin-bottom: 10px;
        }
        .control-group label {
            display: block;
            margin-bottom: 4px;
            color: #cbd5e1;
        }
        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .control-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .control-btn:active {
            background: #1d4ed8;
        }
        /* Full Map View Button */
        #map-btn {
            position: absolute;
            top: 220px;
            left: 15px;
            background: rgba(255, 85, 0, 0.9);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
            touch-action: manipulation;
        }
        #map-btn:active {
            transform: scale(0.95);
            background: rgba(200, 65, 0, 0.9);
        }
        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            background: rgba(10, 15, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Map Creator & Editor:</strong><br>
        Status: <span id="status-text">Interactive Mode Active</span><br>
        <em>Tip: Adjust sliders or click on terrain to raise ground!</em>
    </div>

    <!-- Customization Panel -->
    <div id="control-panel">
        <strong>⚙️ Map Customizer</strong>
        <div class="control-group" style="margin-top: 10px;">
            <label>Map Size: <span id="val-size">10000</span></label>
            <input type="range" id="range-size" min="5000" max="20000" step="1000" value="10000">
        </div>
        <div class="control-group">
            <label>Terrain Bumps: <span id="val-roughness">60</span></label>
            <input type="range" id="range-roughness" min="10" max="200" step="10" value="60">
        </div>
        <div class="control-group">
            <label>Tree Density: <span id="val-trees">300</span></label>
            <input type="range" id="range-trees" min="50" max="800" step="50" value="300">
        </div>
        <button class="control-btn" onclick="regenerateMap()">🔄 Generate New Map</button>
    </div>

    <!-- Full Map View Button -->
    <button id="map-btn" onclick="toggleFullMap()">🗺️ Full Map View</button>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="160" height="160"></canvas>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let mapSize = 10000;
        let terrainRoughness = 60;
        let treeCount = 300;
        let groundMesh, terrainGeom;
        let minimapCtx, minimapCanvas;
        let isFullMap = false;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5294e2);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 40000);
            camera.position.set(0, 1000, 2200);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
            sunLight.position.set(2000, 4000, 2000);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 25000;
            const d = 8000;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Ocean Surrounding
            const oceanGeo = new THREE.PlaneGeometry(80000, 80000);
            const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1b4f72, roughness: 0.2 });
            const ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -200;
            scene.add(ocean);

            buildTerrainAndWorld();

            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');

            // Slider Events
            document.getElementById('range-size').addEventListener('input', (e) => {
                document.getElementById('val-size').innerText = e.target.value;
            });
            document.getElementById('range-roughness').addEventListener('input', (e) => {
                document.getElementById('val-roughness').innerText = e.target.value;
            });
            document.getElementById('range-trees').addEventListener('input', (e) => {
                document.getElementById('val-trees').innerText = e.target.value;
            });

            // Interactive Click to raise terrain on map
            window.addEventListener('pointerdown', onMapClick);
            window.addEventListener('resize', onWindowResize);
        }

        function buildTerrainAndWorld() {
            // Remove previous ground/trees if any
            scene.children.forEach(child => {
                if (child.userData && child.userData.isCustomWorld) {
                    scene.remove(child);
                }
            });

            const worldGroup = new THREE.Group();
            worldGroup.userData.isCustomWorld = true;

            // Terrain Ground with custom roughness & size
            const segments = 250;
            terrainGeom = new THREE.PlaneGeometry(mapSize, mapSize, segments, segments);
            const posAttr = terrainGeom.attributes.position;
            let halfSize = mapSize / 2;

            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                
                // User-defined bumpy height variations (No sharp cone mountains, only rolling slopes)
                let height = Math.abs(Math.sin(vx * 0.001) * Math.cos(vy * 0.001) * terrainRoughness * 1.5) 
                           + Math.abs(Math.sin(vx * 0.005) * Math.sin(vy * 0.005) * (terrainRoughness * 0.6)) + 10;

                let distFromCenter = Math.max(Math.abs(vx), Math.abs(vy));
                let borderThreshold = halfSize - 1500;
                if (distFromCenter > borderThreshold) {
                    let factor = (distFromCenter - borderThreshold) / (1500);
                    height += Math.pow(factor, 2) * 800;
                }

                posAttr.setZ(i, height);
            }
            terrainGeom.computeVertexNormals();

            const groundMat = new THREE.MeshStandardMaterial({ color: 0x315c1b, roughness: 0.88 });
            groundMesh = new THREE.Mesh(terrainGeom, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            worldGroup.add(groundMesh);

            // Scattered Trees based on user slider
            for (let i = 0; i < treeCount; i++) {
                let tx = (Math.random() - 0.5) * (mapSize - 2000);
                let tz = (Math.random() - 0.5) * (mapSize - 2000);
                let treeGroup = createRealisticTree(tx, tz);
                worldGroup.add(treeGroup);
            }

            scene.add(worldGroup);
        }

        function regenerateMap() {
            mapSize = parseInt(document.getElementById('range-size').value);
            terrainRoughness = parseInt(document.getElementById('range-roughness').value);
            treeCount = parseInt(document.getElementById('range-trees').value);
            buildTerrainAndWorld();
        }

        function onMapClick(event) {
            // Ignore if clicking UI control panel
            if (event.target.closest('#control-panel') || event.target.closest('#map-btn')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            let intersects = raycaster.intersectObject(groundMesh);

            if (intersects.length > 0) {
                let point = intersects[0].point;
                // Raise terrain vertex heights around click point dynamically
                let posAttr = terrainGeom.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    let vx = posAttr.getX(i);
                    let vy = posAttr.getY(i);
                    // Local plane coordinate mapping
                    let dx = vx - point.x;
                    let dz = vy - (-point.z); // Z in local plane is -Y in world or vice versa depending on rotation
                    let dist = Math.sqrt(dx*dx + dz*dz);
                    if (dist < 800) {
                        let currentZ = posAttr.getZ(i);
                        let bump = Math.cos((dist / 800) * (Math.PI / 2)) * 80;
                        posAttr.setZ(i, currentZ + bump);
                    }
                }
                terrainGeom.computeVertexNormals();
                posAttr.needsUpdate = true;
            }
        }

        function createRealisticTree(x, z) {
            const treeGroup = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.8, 10, 8), trunkMat);
            trunk.position.set(x, 15, z); 
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1d4722, roughness: 0.7 });
            const top = new THREE.Mesh(new THREE.SphereGeometry(5, 8, 8), foliageMat);
            top.position.set(x, 21, z);
            top.castShadow = true;
            treeGroup.add(top);
            return treeGroup;
        }

        function toggleFullMap() {
            isFullMap = !isFullMap;
            const btn = document.getElementById('map-btn');
            if (isFullMap) {
                camera.position.set(0, mapSize * 0.8, 0); 
                camera.lookAt(0, 0, 0);
                btn.innerHTML = "🗺️ Normal View";
            } else {
                camera.position.set(0, 1000, 2200); 
                camera.lookAt(0, 0, 0);
                btn.innerHTML = "🗺️ Full Map View";
            }
        }

        function drawMinimap() {
            if (!minimapCtx) return;
            let w = minimapCanvas.width;
            let h = minimapCanvas.height;

            minimapCtx.clearRect(0, 0, w, h);
            minimapCtx.fillStyle = '#1b4f72';
            minimapCtx.fillRect(0, 0, w, h);

            minimapCtx.fillStyle = '#315c1b';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, w*0.42, 0, Math.PI*2);
            minimapCtx.fill();

            minimapCtx.fillStyle = '#ff3300';
            minimapCtx.beginPath();
            minimapCtx.arc(w/2, h/2, 4, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            drawMinimap();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

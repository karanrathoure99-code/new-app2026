<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Real Devil Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none !important;
            border: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .arcade-container {
            position: relative;
            background: #ffb356;
            border-radius: 12px;
            box-shadow: 0 8px 0px rgba(0, 0, 0, 0.45);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 660px;
            width: 100%;
        }

        .top-hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffa742;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            font-size: 10px;
            color: #523500;
            box-shadow: 0 2px 0px #523500;
        }

        .hud-btns {
            display: flex;
            gap: 6px;
        }

        .hud-btn {
            background: #523500;
            color: #ffb356;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 8px;
            cursor: pointer;
            box-shadow: 0 2px 0px #3b2500;
        }

        .hud-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Fixed Dimensions Canvas */
        #gameCanvas {
            background: #ffe2b3;
            border-radius: 8px;
            display: block;
            box-shadow: 0 4px 0px #523500;
            width: 100%;
            max-width: 600px;
            height: 260px;
        }

        .touch-pad {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 4px;
        }

        .left-controls {
            display: flex;
            gap: 10px;
        }

        .touch-btn {
            background: #523500;
            color: #ffb356;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0px #3b2500;
            touch-action: manipulation;
        }

        .touch-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #3b2500;
            background: #6e4600;
        }

        .jump-btn {
            background: #8f1111;
            color: #fff;
            box-shadow: 0 4px 0px #540808;
            padding: 14px 24px;
        }

        .jump-btn:active {
            background: #b51717;
            box-shadow: 0 1px 0px #540808;
        }

        /* Modal Overlays */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffb356;
            border-radius: 10px;
            box-shadow: 0 10px 0px rgba(0, 0, 0, 0.5);
            padding: 18px 24px;
            text-align: center;
            display: none;
            z-index: 50;
            width: 85%;
            max-width: 380px;
        }

        .modal h2 {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .modal p {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #523500;
            margin-bottom: 14px;
        }

        .modal-action-btn {
            background: #523500;
            color: #ffb356;
            padding: 10px 14px;
            font-size: 9px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 0px #3b2500;
            margin: 0 4px;
        }

        .modal-action-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="arcade-container">
        <div class="top-hud">
            <div>
                <span id="lvlLabel">LVL: 1</span>
                <span style="margin-left: 10px;" id="deathLabel">💀 0</span>
            </div>
            <div class="hud-btns">
                <button class="hud-btn" onclick="retryLevel()">🔄 RESTART</button>
                <button class="hud-btn" onclick="goToMenu()">📜 LEVELS</button>
                <button class="hud-btn" onclick="toggleScreen()">⛶ FULL</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="600" height="260"></canvas>

        <div class="touch-pad">
            <div class="left-controls">
                <button class="touch-btn" id="btnLeft">◀ LEFT</button>
                <button class="touch-btn" id="btnRight">RIGHT ▶</button>
            </div>
            <button class="touch-btn jump-btn" id="btnJump">JUMP ⬆</button>
        </div>

        <!-- Failure Modal -->
        <div class="modal" id="failModal">
            <h2 style="color: #8f1111;">💀 TROLLED!</h2>
            <p id="failQuote">Koshish achhi thi!</p>
            <button class="modal-action-btn" onclick="retryLevel()">RETRY 🔄</button>
            <button class="modal-action-btn" onclick="goToMenu()">LEVELS 📜</button>
        </div>

        <!-- Win Modal -->
        <div class="modal" id="winModal">
            <h2 style="color: #116b0d;">🎉 STAGE CLEARED!</h2>
            <p>Agla level aur hard hoga!</p>
            <button class="modal-action-btn" onclick="nextStage()">NEXT ➡️</button>
            <button class="modal-action-btn" onclick="goToMenu()">LEVELS 📜</button>
        </div>
    </div>

    <script>
        async function toggleScreen() {
            const el = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (el.requestFullscreen) await el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }
        window.addEventListener('click', toggleScreen, { once: true });
        window.addEventListener('touchstart', toggleScreen, { once: true });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const lvlLabel = document.getElementById('lvlLabel');
        const deathLabel = document.getElementById('deathLabel');
        const failModal = document.getElementById('failModal');
        const winModal = document.getElementById('winModal');
        const failQuote = document.getElementById('failQuote');

        let deaths = 0;
        let isDead = false;

        // Player properties
        let player = {
            x: 40,
            y: 190,
            w: 22,
            h: 22,
            vx: 0,
            vy: 0,
            speed: 3.8,
            jumpStrength: -9.0,
            onGround: false
        };

        // 3 Troll Levels
        const levels = [
            {
                id: 1,
                name: "THE RUNAWAY DOOR",
                quote: "Door ke paas jaoge toh wo bhag kar peeche shuruat mein chala jayega!",
                floorY: 220,
                spikes: [{ x: 280, y: 204, w: 32, h: 16 }],
                door: { x: 530, y: 172, w: 28, h: 48 },
                doorMoved: false,
                trollAction: (lvl) => {
                    if (player.x > 380 && !lvl.doorMoved) {
                        lvl.door.x -= 9;
                        if (lvl.door.x <= 40) {
                            lvl.door.x = 40;
                            lvl.doorMoved = true;
                        }
                    }
                }
            },
            {
                id: 2,
                name: "INVISIBLE BRICK",
                quote: "Hawa mein adrishya block se sir takra gaya!",
                floorY: 220,
                spikes: [{ x: 280, y: 204, w: 46, h: 16 }],
                blocks: [{ x: 285, y: 120, w: 36, h: 20, shown: false }],
                door: { x: 530, y: 172, w: 28, h: 48 },
                trollAction: (lvl) => {
                    lvl.blocks.forEach(b => {
                        if (player.x + player.w > b.x && player.x < b.x + b.w && player.y <= b.y + b.h && player.y >= b.y) {
                            b.shown = true;
                            player.vy = 4.5;
                        }
                    });
                }
            },
            {
                id: 3,
                name: "COLLAPSING FLOOR",
                quote: "Beech ki zameen gayab ho gayi!",
                floorY: 220,
                fakeFloor: { x: 220, y: 220, w: 140, h: 40, active: true },
                spikes: [],
                door: { x: 530, y: 172, w: 28, h: 48 },
                trollAction: (lvl) => {
                    if (player.x > 200 && player.x < 360 && lvl.fakeFloor.active) {
                        lvl.fakeFloor.active = false;
                    }
                }
            }
        ];

        // Safe URL level detection
        const urlParams = new URLSearchParams(window.location.search);
        let paramLvl = parseInt(urlParams.get('level')) || 1;
        let activeIdx = Math.max(0, Math.min(levels.length - 1, paramLvl - 1));
        let curLevel = null;

        function loadLevel(idx) {
            activeIdx = idx;
            curLevel = JSON.parse(JSON.stringify(levels[idx]));
            isDead = false;

            player.x = 40;
            player.y = curLevel.floorY - player.h;
            player.vx = 0;
            player.vy = 0;
            player.onGround = true;

            lvlLabel.innerText = "LVL: " + curLevel.id;
            failModal.style.display = "none";
            winModal.style.display = "none";
        }

        // Input Setup
        const keys = { left: false, right: false, jump: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = true;
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = true;
            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w" || e.key === " ") keys.jump = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = false;
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = false;
            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w" || e.key === " ") keys.jump = false;
        });

        function bindBtn(id, keyProp) {
            const b = document.getElementById(id);
            b.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; });
            b.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; });
            b.addEventListener('mousedown', () => { keys[keyProp] = true; });
            b.addEventListener('mouseup', () => { keys[keyProp] = false; });
        }

        bindBtn('btnLeft', 'left');
        bindBtn('btnRight', 'right');
        bindBtn('btnJump', 'jump');

        function triggerDeath(msg) {
            if (isDead) return;
            isDead = true;
            deaths++;
            deathLabel.innerText = "💀 " + deaths;
            failQuote.innerText = msg || curLevel.quote;
            failModal.style.display = "block";
        }

        function triggerWin() {
            if (isDead) return;
            isDead = true;
            winModal.style.display = "block";
        }

        window.retryLevel = () => loadLevel(activeIdx);
        window.nextStage = () => {
            if (activeIdx + 1 < levels.length) loadLevel(activeIdx + 1);
            else { alert("SHABASH! Saare Levels Clear!"); loadLevel(0); }
        };
        window.goToMenu = () => { window.location.href = "level.html"; };

        function update() {
            if (isDead || !curLevel) return;

            // Move
            player.vx = 0;
            if (keys.left) player.vx = -player.speed;
            if (keys.right) player.vx = player.speed;

            // Jump
            if (keys.jump && player.onGround) {
                player.vy = player.jumpStrength;
                player.onGround = false;
            }

            // Gravity
            player.vy += 0.44;
            player.x += player.vx;
            player.y += player.vy;

            // Run Level Troll Function
            curLevel.trollAction(curLevel);

            // Floor & Platform Collision
            let groundY = curLevel.floorY;
            if (curLevel.fakeFloor && !curLevel.fakeFloor.active) {
                if (player.x + player.w > curLevel.fakeFloor.x && player.x < curLevel.fakeFloor.x + curLevel.fakeFloor.w) {
                    groundY = 320; // Fall into void
                }
            }

            if (player.y + player.h >= groundY) {
                player.y = groundY - player.h;
                player.vy = 0;
                player.onGround = true;
            }

            // Void Death
            if (player.y > 270) {
                triggerDeath("Zameen toot gayi aur tum gir gaye! 😂");
            }

            // Spike Collision
            if (curLevel.spikes) {
                curLevel.spikes.forEach(s => {
                    if (player.x < s.x + s.w && player.x + player.w > s.x && player.y < s.y + s.h && player.y + player.h > s.y) {
                        triggerDeath();
                    }
                });
            }

            // Door Collision
            let d = curLevel.door;
            if (player.x < d.x + d.w && player.x + player.w > d.x && player.y < d.y + d.h && player.y + player.h > d.y) {
                triggerWin();
            }
        }

        function draw() {
            // Clear Frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!curLevel) return;

            // 1. Zameen (Solid Brown Floor)
            ctx.fillStyle = "#523500";
            if (curLevel.fakeFloor && !curLevel.fakeFloor.active) {
                ctx.fillRect(0, 220, curLevel.fakeFloor.x, 40);
                ctx.fillRect(curLevel.fakeFloor.x + curLevel.fakeFloor.w, 220, canvas.width, 40);
            } else {
                ctx.fillRect(0, 220, canvas.width, 40);
            }

            // 2. Invisible/Revealed Blocks (Level 2)
            if (curLevel.blocks) {
                curLevel.blocks.forEach(b => {
                    if (b.shown) {
                        ctx.fillStyle = "#523500";
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.fillStyle = "#ffb356";
                        ctx.fillText("?", b.x + 12, b.y + 14);
                    }
                });
            }

            // 3. Spikes (Red Triangles)
            if (curLevel.spikes) {
                ctx.fillStyle = "#8f1111";
                curLevel.spikes.forEach(s => {
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y + s.h);
                    ctx.lineTo(s.x + s.w / 2, s.y);
                    ctx.lineTo(s.x + s.w, s.y + s.h);
                    ctx.fill();
                });
            }

            // 4. Green Exit Gate
            let d = curLevel.door;
            ctx.fillStyle = "#523500";
            ctx.fillRect(d.x, d.y, d.w, d.h);
            ctx.fillStyle = "#2db300";
            ctx.fillRect(d.x + 3, d.y + 3, d.w - 6, d.h - 6);

            // 5. Player Devil (Visible Character)
            ctx.fillStyle = "#523500";
            ctx.fillRect(player.x, player.y, player.w, player.h);
            // Red Horns
            ctx.fillStyle = "#8f1111";
            ctx.fillRect(player.x + 2, player.y - 4, 4, 4);
            ctx.fillRect(player.x + player.w - 6, player.y - 4, 4, 4);
            // White Eyes
            ctx.fillStyle = "#fff";
            ctx.fillRect(player.x + 4, player.y + 6, 3, 3);
            ctx.fillRect(player.x + 14, player.y + 6, 3, 3);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start Level Immediately
        loadLevel(activeIdx);
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Level Devil Map (1-50)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace;
        }

        #mapViewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: grab;
            background: #916000;
        }

        #mapViewport:active {
            cursor: grabbing;
        }

        #gameCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        /* Top HUD Layer */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 18px;
            z-index: 100;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Level Devil Style Pill Buttons */
        .level-devil-btn {
            pointer-events: auto;
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 6px;
            padding: 7px 12px;
            color: #523500;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #523500;
            text-decoration: none;
            font-family: 'Press Start 2P', monospace;
        }

        .level-devil-btn:hover {
            background: #ffbe73;
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px #523500;
        }

        .level-devil-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #523500;
        }

        /* Infinite Levels Tag */
        .infinite-badge {
            pointer-events: auto;
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 4px;
            padding: 6px 10px;
            color: #523500;
            font-size: 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            box-shadow: 3px 3px 0px #523500;
        }

        /* Header Center Title */
        .game-title {
            font-size: 26px;
            font-weight: 900;
            color: #ffb356;
            text-shadow: 4px 4px 0px #523500;
            letter-spacing: 3px;
            text-align: center;
            pointer-events: none;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .info-pill {
            background: #ffb356;
            color: #523500;
            padding: 7px 12px;
            border-radius: 6px;
            border: 3px solid #523500;
            font-size: 9px;
            box-shadow: 3px 3px 0px #523500;
            letter-spacing: 1px;
        }

        /* Mobile Controls */
        .touch-pad {
            display: none;
            gap: 8px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 44px;
            height: 44px;
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #523500;
            box-shadow: 3px 3px 0px #523500;
            cursor: pointer;
        }

        .touch-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #523500;
        }

        .touch-enter {
            width: 80px;
            font-size: 9px;
            font-family: 'Press Start 2P', monospace;
        }

        @media (max-width: 850px) {
            .touch-pad {
                display: flex;
            }
            .game-title {
                font-size: 16px;
            }
            .info-pill {
                font-size: 7px;
                padding: 5px 8px;
            }
        }
    </style>
</head>
<body>

    <div id="mapViewport">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="hud-layer">
        <div class="top-bar">
            <div style="display: flex; gap: 8px; align-items: center;">
                <a href="home.html" class="level-devil-btn">⬅ HOME</a>
                <div class="infinite-badge">
                    <span>👑 DEVIL</span>
                    <span>1-50 LVL</span>
                </div>
            </div>

            <div class="game-title">LEVEL DEVIL</div>

            <div style="display: flex; gap: 8px;">
                <div class="level-devil-btn" id="recenterBtn">🎯 FOCUS</div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="info-pill" id="levelProgress">LEVEL: 1 / 50</div>
            
            <div class="touch-pad">
                <div class="touch-btn" id="mPrev">◀</div>
                <div class="touch-btn touch-enter" id="mEnter">ENTER</div>
                <div class="touch-btn" id="mNext">▶</div>
            </div>

            <div class="info-pill">USE ARROWS / DRAG</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('mapViewport');

        const TOTAL_LEVELS = 50;

        let unlockedMax = parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga')) || 1;
        if (unlockedMax > TOTAL_LEVELS) unlockedMax = TOTAL_LEVELS;

        // Level Devil exact theme palette
        const C_BG = "#916000";
        const C_ISLAND_TOP = "#ffb356";
        const C_ISLAND_SIDE = "#d48b28";
        const C_ISLAND_SHADOW = "#523500";
        const C_PATH = "#a66e1e";
        const C_CAVE_LOCKED = "#523500";
        const C_CAVE_OPEN = "#3b2500";
        const C_ACTIVE_GLOW = "#fff099";

        // Virtual World Canvas Dimensions for 50 Levels
        const WORLD_W = 5400;
        const WORLD_H = 1200;
        canvas.width = WORLD_W;
        canvas.height = WORLD_H;

        // Generate 50 Level Nodes with Level Devil Style clusters and branches
        const nodes = [];
        const edges = [];

        // Exact pattern nodes
        for (let i = 1; i <= TOTAL_LEVELS; i++) {
            const progress = (i - 1) / (TOTAL_LEVELS - 1);
            const x = 240 + progress * (WORLD_W - 550) + (Math.sin(i * 1.7) * 45);
            const waveY = Math.sin(i * 0.55) * 250;
            const y = (WORLD_H / 2) + waveY + (Math.cos(i * 0.9) * 50);

            nodes.push({ id: i, x: Math.round(x), y: Math.round(y) });

            if (i > 1) {
                edges.push([i - 2, i - 1]);
            }
        }

        let cameraX = 0;
        let cameraY = 0;
        let selectedNodeIdx = Math.min(unlockedMax - 1, TOTAL_LEVELS - 1);

        function playStepSound() {
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                const g = actx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(360, actx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(140, actx.currentTime + 0.05);
                g.gain.setValueAtTime(0.12, actx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.05);
                osc.connect(g);
                g.connect(actx.destination);
                osc.start();
                osc.stop(actx.currentTime + 0.05);
            } catch(e){}
        }

        function playLockSound() {
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                const g = actx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, actx.currentTime);
                g.gain.setValueAtTime(0.15, actx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.08);
                osc.connect(g);
                g.connect(actx.destination);
                osc.start();
                osc.stop(actx.currentTime + 0.08);
            } catch(e){}
        }

        function focusNode(idx, smooth = true) {
            const targetX = nodes[idx].x - window.innerWidth / 2;
            const targetY = nodes[idx].y - window.innerHeight / 2;
            
            if (!smooth) {
                cameraX = targetX;
                cameraY = targetY;
            } else {
                cameraX += (targetX - cameraX) * 0.25;
                cameraY += (targetY - cameraY) * 0.25;
            }

            clampCamera();
            updateCanvasTransform();
            document.getElementById('levelProgress').innerText = `LEVEL: ${nodes[selectedNodeIdx].id} / 50`;
        }

        function clampCamera() {
            const maxCamX = WORLD_W - window.innerWidth;
            const maxCamY = WORLD_H - window.innerHeight;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > maxCamX) cameraX = maxCamX;
            if (cameraY < 0) cameraY = 0;
            if (cameraY > maxCamY) cameraY = maxCamY;
        }

        function updateCanvasTransform() {
            canvas.style.transform = `translate3d(${-cameraX}px, ${-cameraY}px, 0)`;
        }

        // Draw Stepped Pixel Platforms
        function drawTerrain() {
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            // Depth Bottom Rim
            ctx.strokeStyle = C_ISLAND_SHADOW;
            ctx.lineWidth = 150;
            ctx.beginPath();
            nodes.forEach((n, idx) => {
                if (idx === 0) ctx.moveTo(n.x, n.y + 24);
                else ctx.lineTo(n.x, n.y + 24);
            });
            ctx.stroke();

            // Island 3D Side Slope
            ctx.strokeStyle = C_ISLAND_SIDE;
            ctx.lineWidth = 140;
            ctx.beginPath();
            nodes.forEach((n, idx) => {
                if (idx === 0) ctx.moveTo(n.x, n.y + 12);
                else ctx.lineTo(n.x, n.y + 12);
            });
            ctx.stroke();

            // Island Flat Surface
            ctx.strokeStyle = C_ISLAND_TOP;
            ctx.lineWidth = 130;
            ctx.beginPath();
            nodes.forEach((n, idx) => {
                if (idx === 0) ctx.moveTo(n.x, n.y);
                else ctx.lineTo(n.x, n.y);
            });
            ctx.stroke();

            // Flat Plateau at each cave station
            nodes.forEach(n => {
                ctx.fillStyle = C_ISLAND_TOP;
                ctx.beginPath();
                ctx.arc(n.x, n.y, 70, 0, Math.PI * 2);
                ctx.fill();
            });

            // Level Devil Sand Track Footpaths
            ctx.strokeStyle = C_PATH;
            ctx.lineWidth = 5;
            ctx.setLineDash([10, 8]);
            ctx.beginPath();
            edges.forEach(([a, b]) => {
                ctx.moveTo(nodes[a].x, nodes[a].y + 6);
                ctx.lineTo(nodes[b].x, nodes[b].y + 6);
            });
            ctx.stroke();
            ctx.setLineDash([]);
        }

        let animFrame = 0;

        function drawArch(cx, cy, w, h) {
            ctx.beginPath();
            ctx.arc(cx, cy, w / 2, Math.PI, 0);
            ctx.lineTo(cx + w / 2, cy + h);
            ctx.lineTo(cx - w / 2, cy + h);
            ctx.closePath();
            ctx.fill();
        }

        // Draw Caves & Active Gate
        function drawLevels() {
            animFrame++;

            nodes.forEach((n, idx) => {
                const isUnlocked = n.id <= unlockedMax;
                const isSelected = idx === selectedNodeIdx;

                // Ground dust shadow
                ctx.fillStyle = "rgba(82, 53, 0, 0.4)";
                ctx.beginPath();
                ctx.ellipse(n.x, n.y + 14, 22, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                if (isSelected) {
                    // Level Devil Glowing Gate
                    ctx.fillStyle = C_ISLAND_SHADOW;
                    drawArch(n.x, n.y - 14, 38, 42);

                    ctx.fillStyle = C_ACTIVE_GLOW;
                    drawArch(n.x, n.y - 12, 30, 36);

                    // Devil Horns
                    ctx.fillStyle = C_ISLAND_SHADOW;
                    ctx.fillRect(n.x - 17, n.y - 22, 6, 10);
                    ctx.fillRect(n.x + 11, n.y - 22, 6, 10);

                    // Downward Triangle Pointer
                    const bounce = Math.sin(animFrame * 0.09) * 5;
                    ctx.fillStyle = "#ffcc00";
                    ctx.beginPath();
                    ctx.moveTo(n.x, n.y - 36 + bounce);
                    ctx.lineTo(n.x - 8, n.y - 48 + bounce);
                    ctx.lineTo(n.x + 8, n.y - 48 + bounce);
                    ctx.closePath();
                    ctx.fill();

                    // "PRESS SPACE" / "ENTER" Prompt
                    ctx.fillStyle = "#523500";
                    ctx.font = "8px 'Press Start 2P'";
                    ctx.textAlign = "center";
                    ctx.fillText("press", n.x, n.y + 30);
                    ctx.fillText("space", n.x, n.y + 40);

                } else if (isUnlocked) {
                    // Open Cave Door
                    ctx.fillStyle = C_ISLAND_SHADOW;
                    drawArch(n.x, n.y - 10, 30, 34);

                    ctx.fillStyle = C_CAVE_OPEN;
                    drawArch(n.x, n.y - 8, 24, 28);
                } else {
                    // Locked Brown Cave
                    ctx.fillStyle = C_ISLAND_SHADOW;
                    drawArch(n.x, n.y - 10, 28, 32);

                    ctx.fillStyle = C_CAVE_LOCKED;
                    drawArch(n.x, n.y - 8, 22, 26);
                }

                // Stage Number
                ctx.fillStyle = isSelected ? "#523500" : (isUnlocked ? "#ffb356" : "#2d1d02");
                ctx.font = "7px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText(n.id, n.x, n.y + 4);
            });
        }

        // Grave landmark at the end (Level Devil Style)
        function drawMapDecorations() {
            // End Island Tombstone
            const endNode = nodes[TOTAL_LEVELS - 1];
            ctx.fillStyle = "#615c54";
            ctx.beginPath();
            ctx.arc(endNode.x + 120, endNode.y - 30, 16, Math.PI, 0);
            ctx.lineTo(endNode.x + 136, endNode.y);
            ctx.lineTo(endNode.x + 104, endNode.y);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ffb356";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("💀", endNode.x + 120, endNode.y - 10);
        }

        function render() {
            ctx.fillStyle = C_BG;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawTerrain();
            drawMapDecorations();
            drawLevels();

            requestAnimationFrame(render);
        }

        focusNode(selectedNodeIdx, false);
        render();

        function selectLevel(idx) {
            if (idx < 0 || idx >= TOTAL_LEVELS) return;
            selectedNodeIdx = idx;
            playStepSound();
            focusNode(selectedNodeIdx, true);
        }

        function enterLevel() {
            const currentLevel = nodes[selectedNodeIdx].id;
            if (currentLevel <= unlockedMax) {
                playStepSound();
                setTimeout(() => {
                    window.location.href = `game.html?level=${currentLevel}`;
                }, 120);
            } else {
                playLockSound();
            }
        }

        // Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                if (selectedNodeIdx < TOTAL_LEVELS - 1) selectLevel(selectedNodeIdx + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                if (selectedNodeIdx > 0) selectLevel(selectedNodeIdx - 1);
            } else if (e.key === 'Enter' || e.key === ' ') {
                enterLevel();
            }
        });

        document.getElementById('mPrev').addEventListener('click', () => {
            if (selectedNodeIdx > 0) selectLevel(selectedNodeIdx - 1);
        });
        document.getElementById('mNext').addEventListener('click', () => {
            if (selectedNodeIdx < TOTAL_LEVELS - 1) selectLevel(selectedNodeIdx + 1);
        });
        document.getElementById('mEnter').addEventListener('click', enterLevel);
        document.getElementById('recenterBtn').addEventListener('click', () => focusNode(selectedNodeIdx, true));

        // Click to Choose on Canvas
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left + cameraX;
            const clickY = e.clientY - rect.top + cameraY;

            nodes.forEach((n, idx) => {
                if (Math.hypot(n.x - clickX, n.y - clickY) < 38) {
                    if (selectedNodeIdx === idx) {
                        enterLevel();
                    } else {
                        selectLevel(idx);
                    }
                }
            });
        });

        // Mouse Drag & Touch Pan
        let isDragging = false;
        let startX, startY;

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX + cameraX;
            startY = e.clientY + cameraY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            cameraX = startX - e.clientX;
            cameraY = startY - e.clientY;
            clampCamera();
            updateCanvasTransform();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX + cameraX;
                startY = e.touches[0].clientY + cameraY;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            cameraX = startX - e.touches[0].clientX;
            cameraY = startY - e.touches[0].clientY;
            clampCamera();
            updateCanvasTransform();
        }, { passive: true });

        window.addEventListener('touchend', () => isDragging = false);

        viewport.addEventListener('wheel', (e) => {
            cameraX += e.deltaY;
            clampCamera();
            updateCanvasTransform();
        }, { passive: true });

        // Auto Focus Smooth Loop
        setInterval(() => {
            if (!isDragging) {
                const targetX = nodes[selectedNodeIdx].x - window.innerWidth / 2;
                const targetY = nodes[selectedNodeIdx].y - window.innerHeight / 2;
                cameraX += (targetX - cameraX) * 0.08;
                cameraY += (targetY - cameraY) * 0.08;
                clampCamera();
                updateCanvasTransform();
            }
        }, 16);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - World Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #916000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace;
        }

        #gameCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #916000;
        }

        /* Top HUD Elements */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hud-inner {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 562px;
        }

        .top-btn {
            position: absolute;
            pointer-events: auto;
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 6px;
            padding: 6px 10px;
            color: #523500;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #523500;
            transition: transform 0.1s ease;
            text-decoration: none;
        }

        .top-btn:hover {
            transform: translateY(-2px);
            background: #ffbe73;
        }

        .top-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #523500;
        }

        .btn-home { top: 16px; left: 16px; }
        .btn-settings { top: 16px; right: 16px; }

        .game-logo {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            color: #ffb356;
            text-shadow: 4px 4px 0px #523500;
            letter-spacing: 2px;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Mobile Touch Controls */
        .touch-controls {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 12px;
            pointer-events: auto;
            z-index: 50;
        }

        .touch-btn {
            width: 48px;
            height: 48px;
            background: #ffa742;
            border: 3px solid #523500;
            border-radius: 8px;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #523500;
            box-shadow: 3px 3px 0px #523500;
            cursor: pointer;
        }

        .touch-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #523500;
        }

        .touch-enter {
            width: 90px;
            font-size: 10px;
            font-family: 'Press Start 2P', monospace;
        }

        @media (max-width: 850px) {
            .touch-controls {
                display: flex;
            }
            .game-logo {
                font-size: 18px;
                top: 18px;
            }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="1000" height="562"></canvas>

    <div class="hud-layer">
        <div class="hud-inner">
            <a href="home.html" class="top-btn btn-home">⬅ HOME</a>
            <div class="game-logo">😈 LEVEL DEVIL</div>
            <div class="top-btn btn-settings" onclick="location.reload()">🔄 RESET</div>

            <!-- Touch Support on Mobile -->
            <div class="touch-controls">
                <div class="touch-btn" id="btnLeft">◀</div>
                <div class="touch-btn" id="btnUp">▲</div>
                <div class="touch-btn" id="btnDown">▼</div>
                <div class="touch-btn" id="btnRight">▶</div>
                <div class="touch-btn touch-enter" id="btnEnter">ENTER</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive Scaling
        function resize() {
            const aspect = 1000 / 562;
            let w = window.innerWidth;
            let h = window.innerHeight;

            if (w / h > aspect) {
                w = h * aspect;
            } else {
                h = w / aspect;
            }

            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
        }
        window.addEventListener('resize', resize);
        resize();

        // Level Devil Style Colors (Matching Your Theme)
        const C_BG = "#916000";
        const C_ISLAND_TOP = "#ffb356";
        const C_ISLAND_SIDE = "#d48b28";
        const C_ISLAND_SHADOW = "#523500";
        const C_PATH = "#d48b28";
        const C_DOOR_LOCKED = "#80500e";
        const C_DOOR_OUTLINE = "#523500";
        const C_DOOR_GLOW = "#fff099";

        // Current unlocked progress
        let currentUnlockedLevel = parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga')) || 1;

        // Level Node Coordinates on the Island Map
        const nodes = [
            { id: 1,  x: 130, y: 410 },
            { id: 2,  x: 155, y: 505 },
            { id: 3,  x: 215, y: 645 },
            { id: 4,  x: 205, y: 760 },
            { id: 5,  x: 295, y: 650 },
            { id: 6,  x: 300, y: 520 },
            { id: 7,  x: 210, y: 380 },
            { id: 8,  x: 235, y: 280 },
            { id: 9,  x: 388, y: 440 },
            { id: 10, x: 410, y: 610 },
            { id: 11, x: 535, y: 620 },
            { id: 12, x: 635, y: 540 },
            { id: 13, x: 650, y: 400 },
            { id: 14, x: 735, y: 450 },
            { id: 15, x: 865, y: 530 }
        ];

        // Path Connections
        const edges = [
            [0, 1], [1, 2], [2, 3], [2, 4], [4, 5],
            [5, 6], [6, 7], [5, 8], [8, 9], [9, 10],
            [10, 11], [11, 12], [11, 13], [13, 14]
        ];

        // Active Player Node Index
        let playerNode = Math.min(currentUnlockedLevel - 1, nodes.length - 1);
        let animOffset = 0;

        // Sound Effects
        function playStepSound() {
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                const g = actx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, actx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, actx.currentTime + 0.05);
                g.gain.setValueAtTime(0.12, actx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.05);
                osc.connect(g);
                g.connect(actx.destination);
                osc.start();
                osc.stop(actx.currentTime + 0.05);
            } catch(e){}
        }

        // Draw Level Devil Style Islands
        function drawIslands() {
            ctx.fillStyle = C_ISLAND_SHADOW;

            // Island 1 Shadow
            drawChunkyPolygon([
                [50, 245], [470, 135], [510, 275], [580, 310], [700, 270], 
                [800, 340], [1000, 480], [1000, 562], [760, 562], [690, 475], 
                [610, 440], [510, 435], [480, 500], [350, 505], [260, 440], 
                [180, 485], [100, 435], [50, 360]
            ], 0, 16);

            // Island 1 Base (Side Wall Depth)
            ctx.fillStyle = C_ISLAND_SIDE;
            drawChunkyPolygon([
                [50, 245], [470, 135], [510, 275], [580, 310], [700, 270], 
                [800, 340], [1000, 480], [1000, 550], [760, 550], [690, 465], 
                [610, 430], [510, 425], [480, 490], [350, 495], [260, 430], 
                [180, 475], [100, 425], [50, 350]
            ], 0, 8);

            // Island 1 Surface
            ctx.fillStyle = C_ISLAND_TOP;
            drawChunkyPolygon([
                [50, 245], [470, 135], [510, 275], [580, 310], [700, 270], 
                [800, 340], [1000, 480], [1000, 540], [760, 540], [690, 455], 
                [610, 420], [510, 415], [480, 480], [350, 485], [260, 420], 
                [180, 465], [100, 415], [50, 340]
            ], 0, 0);

            // Floating Isolated Islands (Top Right & Bottom Right)
            // Island 2 - Top Right (Grave Island)
            drawFloatingIsland(780, 130, 160, 80);
            
            // Island 3 - Bottom Right (Gate Island)
            drawFloatingIsland(760, 440, 130, 65);
        }

        function drawFloatingIsland(x, y, w, h) {
            // Shadow
            ctx.fillStyle = C_ISLAND_SHADOW;
            ctx.beginPath();
            ctx.ellipse(x + w/2, y + h/2 + 10, w/2, h/2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Side depth
            ctx.fillStyle = C_ISLAND_SIDE;
            ctx.beginPath();
            ctx.ellipse(x + w/2, y + h/2 + 4, w/2, h/2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Top
            ctx.fillStyle = C_ISLAND_TOP;
            ctx.beginPath();
            ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawChunkyPolygon(pts, ox, oy) {
            ctx.beginPath();
            ctx.moveTo(pts[0][0] + ox, pts[0][1] + oy);
            for (let i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i][0] + ox, pts[i][1] + oy);
            }
            ctx.closePath();
            ctx.fill();
        }

        // Draw Dotted Walking Trails
        function drawPaths() {
            ctx.strokeStyle = C_PATH;
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 8]);

            edges.forEach(([a, b]) => {
                const na = nodes[a];
                const nb = nodes[b];
                ctx.beginPath();
                ctx.moveTo(na.x, na.y);
                ctx.lineTo(nb.x, nb.y);
                ctx.stroke();
            });

            ctx.setLineDash([]);
        }

        // Draw Cave/Door Levels
        function drawNodes() {
            nodes.forEach((n, idx) => {
                const isUnlocked = n.id <= currentUnlockedLevel;
                const isCurrent = idx === playerNode;

                // Shadow under door
                ctx.fillStyle = "rgba(82, 53, 0, 0.4)";
                ctx.beginPath();
                ctx.ellipse(n.x, n.y + 12, 16, 6, 0, 0, Math.PI*2);
                ctx.fill();

                if (isCurrent) {
                    // Golden Active Door
                    ctx.fillStyle = C_DOOR_OUTLINE;
                    drawArch(n.x, n.y - 12, 32, 36);

                    ctx.fillStyle = C_DOOR_GLOW;
                    drawArch(n.x, n.y - 10, 26, 32);

                    // Devil Horns on Door
                    ctx.fillStyle = C_DOOR_OUTLINE;
                    ctx.fillRect(n.x - 14, n.y - 18, 5, 8);
                    ctx.fillRect(n.x + 9, n.y - 18, 5, 8);

                    // Indicator Arrow
                    const floatY = Math.sin(animOffset * 0.08) * 4;
                    ctx.fillStyle = "#ffcc00";
                    ctx.beginPath();
                    ctx.moveTo(n.x, n.y - 32 + floatY);
                    ctx.lineTo(n.x - 8, n.y - 44 + floatY);
                    ctx.lineTo(n.x + 8, n.y - 44 + floatY);
                    ctx.closePath();
                    ctx.fill();

                    // "PRESS SPACE" / "ENTER" Prompt
                    ctx.fillStyle = "#523500";
                    ctx.font = "8px 'Press Start 2P'";
                    ctx.textAlign = "center";
                    ctx.fillText("ENTER", n.x, n.y + 26);
                } else if (isUnlocked) {
                    // Unlocked Open Cave
                    ctx.fillStyle = C_DOOR_OUTLINE;
                    drawArch(n.x, n.y - 10, 28, 32);

                    ctx.fillStyle = "#3b2500";
                    drawArch(n.x, n.y - 8, 22, 28);
                } else {
                    // Locked Dark Cave
                    ctx.fillStyle = C_DOOR_OUTLINE;
                    drawArch(n.x, n.y - 10, 26, 30);

                    ctx.fillStyle = C_DOOR_LOCKED;
                    drawArch(n.x, n.y - 8, 20, 26);

                    // Small Lock Marker
                    ctx.fillStyle = "#2d1d03";
                    ctx.fillRect(n.x - 3, n.y - 1, 6, 6);
                }

                // Stage Number
                ctx.fillStyle = isCurrent ? "#523500" : (isUnlocked ? "#ffb356" : "#4a3007");
                ctx.font = "7px 'Press Start 2P'";
                ctx.textAlign = "center";
                ctx.fillText(n.id, n.x, n.y + 4);
            });
        }

        function drawArch(cx, cy, w, h) {
            ctx.beginPath();
            ctx.arc(cx, cy, w / 2, Math.PI, 0);
            ctx.lineTo(cx + w / 2, cy + h);
            ctx.lineTo(cx - w / 2, cy + h);
            ctx.closePath();
            ctx.fill();
        }

        // Grave & Portal Gate Landmarks
        function drawLandmarks() {
            // Tombstone on Island 2
            ctx.fillStyle = "#615c54";
            ctx.beginPath();
            ctx.arc(860, 160, 16, Math.PI, 0);
            ctx.lineTo(876, 185);
            ctx.lineTo(844, 185);
            ctx.closePath();
            ctx.fill();

            // Skull on Grave
            ctx.fillStyle = "#8a8377";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("💀", 860, 178);

            ctx.fillStyle = "#523500";
            ctx.font = "10px 'Press Start 2P'";
            ctx.fillText("3", 860, 206);

            // Blue Escape Portal on Island 3
            ctx.fillStyle = "#4a5df5";
            ctx.fillRect(810, 460, 36, 22);
            ctx.fillStyle = "#ffffff";
            ctx.font = "12px 'Press Start 2P'";
            ctx.fillText("➔", 828, 477);
        }

        // Main Render Loop
        function render() {
            animOffset++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawIslands();
            drawPaths();
            drawLandmarks();
            drawNodes();

            requestAnimationFrame(render);
        }
        render();

        // Level Navigation Logic
        function movePlayer(dir) {
            const cur = nodes[playerNode];
            let bestNext = null;
            let minDist = Infinity;

            edges.forEach(([a, b]) => {
                let target = null;
                if (a === playerNode) target = b;
                if (b === playerNode) target = a;

                if (target !== null && target < currentUnlockedLevel) {
                    const candidate = nodes[target];
                    const dx = candidate.x - cur.x;
                    const dy = candidate.y - cur.y;

                    let isMatch = false;
                    if (dir === 'left' && dx < -20) isMatch = true;
                    if (dir === 'right' && dx > 20) isMatch = true;
                    if (dir === 'up' && dy < -20) isMatch = true;
                    if (dir === 'down' && dy > 20) isMatch = true;

                    if (isMatch) {
                        const dist = Math.hypot(dx, dy);
                        if (dist < minDist) {
                            minDist = dist;
                            bestNext = target;
                        }
                    }
                }
            });

            if (bestNext !== null) {
                playerNode = bestNext;
                playStepSound();
            }
        }

        function enterSelectedLevel() {
            const selectedLevelId = nodes[playerNode].id;
            playStepSound();
            setTimeout(() => {
                window.location.href = `game.html?level=${selectedLevelId}`;
            }, 120);
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') movePlayer('left');
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') movePlayer('right');
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') movePlayer('up');
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') movePlayer('down');
            if (e.key === ' ' || e.key === 'Enter') enterSelectedLevel();
        });

        // Touch Control Listeners
        document.getElementById('btnLeft').addEventListener('click', () => movePlayer('left'));
        document.getElementById('btnRight').addEventListener('click', () => movePlayer('right'));
        document.getElementById('btnUp').addEventListener('click', () => movePlayer('up'));
        document.getElementById('btnDown').addEventListener('click', () => movePlayer('down'));
        document.getElementById('btnEnter').addEventListener('click', enterSelectedLevel);

        // Click Direct on Node
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = 1000 / rect.width;
            const scaleY = 562 / rect.height;
            const cx = (e.clientX - rect.left) * scaleX;
            const cy = (e.clientY - rect.top) * scaleY;

            nodes.forEach((n, idx) => {
                if (Math.hypot(n.x - cx, n.y - cy) < 28) {
                    if (n.id <= currentUnlockedLevel) {
                        if (playerNode === idx) {
                            enterSelectedLevel();
                        } else {
                            playerNode = idx;
                            playStepSound();
                        }
                    }
                }
            });
        });

        // Landscape & Fullscreen Auto Lock
        async function enableLandscapeFullscreen() {
            const docElement = document.documentElement;
            try {
                if (!document.fullscreenElement) {
                    if (docElement.requestFullscreen) await docElement.requestFullscreen();
                    else if (docElement.webkitRequestFullscreen) await docElement.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {}
        }
        window.addEventListener('click', enableLandscapeFullscreen, { once: true });
        window.addEventListener('touchstart', enableLandscapeFullscreen, { once: true });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 Z PAJAL - World 2 (Lvl 6-15)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: linear-gradient(135deg, #2a0505 0%, #0d0202 50%, #400505 100%); background-attachment: fixed; color: #ffffff; width: 100vw; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .game-wrapper { width: 100%; height: 100%; max-width: 1280px; max-height: 720px; display: flex; flex-direction: column; padding: 10px; position: relative; transition: transform 0.2s ease; }
        @media (max-width: 1023px) {
            body { display: flex; justify-content: center; align-items: center; }
            .game-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(var(--scale-factor, 0.65)); width: 1280px; height: 720px; justify-content: flex-start; padding: 10px; transform-origin: center center; }
        }
        .game-hud { display: flex; justify-content: space-between; align-items: center; background: rgba(60, 10, 10, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255, 75, 75, 0.4); border-radius: 15px; padding: 8px 20px; margin-bottom: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.7); z-index: 20; }
        .hud-title { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 900; color: #ff4d4d; text-shadow: 0 0 10px rgba(255, 77, 77, 0.7); }
        .hud-stats { display: flex; gap: 20px; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; color: #ffcccc; }
        .arena-container { flex: 1; background: rgba(25, 4, 4, 0.95); border: 3px solid rgba(200, 40, 40, 0.85); border-radius: 20px; position: relative; overflow: hidden; box-shadow: inset 0 0 40px rgba(255, 0, 0, 0.25), 0 10px 30px rgba(0,0,0,0.8); }
        .distractor-bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255, 68, 68, 0.15) 0%, rgba(150, 20, 20, 0.1) 40%, transparent 70%); pointer-events: none; z-index: 1; }
        #gameCanvas { width: 100%; height: 100%; display: block; position: relative; z-index: 2; }
        .controls-overlay { display: none; }
        @media (max-width: 1023px) { .controls-overlay { position: relative; margin-top: 8px; padding: 0 4px; display: flex; justify-content: space-between; align-items: center; width: 100%; z-index: 30; } }
        .control-group { display: flex; gap: 10px; align-items: center; }
        .control-group.right-group { display: flex; flex-direction: row; gap: 8px; align-items: center; }
        .ctrl-btn { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 1.5px solid rgba(255, 255, 255, 0.4); border-bottom: 3px solid rgba(0, 0, 0, 0.4); color: #ffffff; font-family: 'Orbitron', sans-serif; font-weight: 700; width: 62px; height: 62px; font-size: 14px; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; touch-action: manipulation; }
        .ctrl-btn:active, .ctrl-btn.pressed { transform: translateY(2px); background: rgba(200, 40, 40, 0.6); border-color: #ff6666; }
        .btn-logo { font-size: 11px; font-weight: 900; color: #ffcc00; margin-bottom: 1px; }
        .btn-label { font-size: 9.5px; font-weight: 700; line-height: 1; }
        .back-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #ffcccc; padding: 4px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        #notificationModal { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: rgba(50, 10, 10, 0.95); border: 2px solid #ff4d4d; padding: 16px 28px; border-radius: 14px; font-family: 'Orbitron', sans-serif; font-size: 14px; color: #ffcc00; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 100; opacity: 0; pointer-events: none; transition: all 0.3s ease; }
        #notificationModal.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
    </style>
</head>
<body>

    <div id="notificationModal">🔥 Level Cleared!</div>

    <div class="game-wrapper">
        <div class="game-hud">
            <div class="hud-title" id="levelTitle">🔥『 WORLD 2: INFERNO 』- Lvl 6🔥</div>
            <div class="hud-stats">
                <span id="scoreDisplay">COINS: 0/6</span>
                <span id="shieldDisplay">SHIELD: OFF</span>
            </div>
            <button class="back-btn" onclick="goHome()">HOME</button>
        </div>
        <div class="arena-container"><div class="distractor-bg"></div><canvas id="gameCanvas"></canvas></div>
        <div class="controls-overlay" id="mobileControls">
            <div class="control-group"><button class="ctrl-btn" id="leftBtnM">◀</button><button class="ctrl-btn" id="rightBtnM">▶</button></div>
            <div class="control-group right-group">
                <button class="ctrl-btn" id="jumpBtnM"><span class="btn-logo">Z</span><span class="btn-label">JUMP</span></button>
                <button class="ctrl-btn" id="rightDownBtnM"><span class="btn-logo">Z</span><span class="btn-label">DOWN</span></button>
                <button class="ctrl-btn" id="shieldBtnM" style="background: rgba(255,68,68,0.3);"><span class="btn-logo" style="color:#ff4444;">X</span><span class="btn-label">SHLD</span></button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        let canvasWidth = 1280; let canvasHeight = 520;
        function resizeCanvas() {
            if (window.innerWidth <= 1023) {
                const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720) * 0.95;
                document.documentElement.style.setProperty('--scale-factor', scale); document.getElementById('mobileControls').style.display = 'flex';
            } else { document.getElementById('mobileControls').style.display = 'none'; }
            const dpr = window.devicePixelRatio || 1; canvas.width = canvasWidth * dpr; canvas.height = canvasHeight * dpr; ctx.scale(dpr, dpr); updateGameLayout();
        }

        // LOAD LEVEL
        let currentLevel = parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga')) || 6;
        if(currentLevel < 6) currentLevel = 6; 

        let isDoorOpen = true; let score = 0; let reqCoins = 0;
        let shieldActive = false; let isExploding = false; let isSlowMo = false;
        let fragments = []; let particles = []; let floatingTexts = [];
        let player = { x: 40, y: 100, width: 14.4, height: 45, vx: 0, vy: 0, speed: 2.8, jumpForce: -8.5, gravity: 0.38, isGrounded: false, animTimer: 0 };
        let platforms = []; let coins = []; let goal = { x: 0, y: 0, w: 20, h: 35 }; let fallingTrap = { active: false };

        // LEVEL GENERATION
        function updateGameLayout() {
            score = 0; reqCoins = 0; 
            const surfaceTop = canvasHeight - 40; const cS = (canvasWidth - 120) / 6;
            document.getElementById('levelTitle').innerText = "🔥『 WORLD 2: INFERNO 』- Lvl " + currentLevel + "🔥";
            platforms = []; coins = []; fallingTrap = { active: false, x: 0, y: -200, w: 50, h: 60, vy: 20 };
            isDoorOpen = true; 

            // LEVEL 6: Sharmeela Darwaza
            if (currentLevel === 6) {
                reqCoins = 6; isDoorOpen = false;
                platforms = [{ x: 0, y: surfaceTop, w: canvasWidth, h: 40, type: 'ground' }];
                for(let i=1; i<=6; i++) coins.push({x: 60+(i-1)*cS, y: surfaceTop-25, collected: false, radius: 5, floatOffset: Math.random()*3});
                goal.x = canvasWidth - 100;
            }
            // LEVEL 7: Hologram Lava (Fake Lava)
            else if (currentLevel === 7) {
                platforms = [
                    { x: 0, y: surfaceTop, w: canvasWidth, h: 40, type: 'ground' },
                    { x: canvasWidth/2 - 50, y: surfaceTop - 150, w: 100, h: 150, type: 'hologram' }, // Fake Wall
                    { x: canvasWidth/2 - 50, y: surfaceTop - 195, w: 100, h: 45, type: 'trollBlock', visible: false } // Koodoge toh maroge
                ];
                goal.x = canvasWidth - 100;
            }
            // LEVEL 8: Poison Coin
            else if (currentLevel === 8) {
                reqCoins = 6; isDoorOpen = false;
                platforms = [{ x: 0, y: surfaceTop, w: canvasWidth, h: 40, type: 'ground' }];
                for(let i=1; i<=6; i++) coins.push({x: 60+(i-1)*cS, y: surfaceTop-25, collected: false, radius: 5, floatOffset: Math.random()*3, poison: false});
                // The Trap Coin (7th)
                coins.push({x: canvasWidth/2, y: surfaceTop - 80, collected: false, radius: 8, floatOffset: 0, poison: true});
                goal.x = canvasWidth - 100;
            }
            // LEVEL 9: Falling Floor
            else if (currentLevel === 9) {
                platforms = [ { x: 0, y: surfaceTop, w: 100, h: 40, type: 'ground' }, { x: canvasWidth - 150, y: surfaceTop, w: 150, h: 40, type: 'ground' } ];
                for(let i=0; i<6; i++) platforms.push({x: 150 + i*160, y: surfaceTop, w: 100, h: 40, type: 'fallingFloor', isFalling: false});
                goal.x = canvasWidth - 80;
            }
            // LEVEL 10: Jump Pad of Death
            else if (currentLevel === 10) {
                platforms = [
                    { x: 0, y: surfaceTop, w: 300, h: 40, type: 'ground' },
                    { x: 400, y: surfaceTop-20, w: 60, h: 20, type: 'jumpPad' }, // The trap
                    { x: 300, y: surfaceTop, w: canvasWidth-300, h: 40, type: 'ground', invisibleSafe: true }, // The real path (hidden)
                    { x: 380, y: 0, w: 100, h: canvasHeight/2, type: 'deathCeiling', visible: true }
                ];
                goal.x = canvasWidth - 100;
            }
            // LEVEL 11: Darr Ka Button
            else if (currentLevel === 11) {
                platforms = [
                    { x: 0, y: surfaceTop, w: canvasWidth, h: 40, type: 'ground' },
                    { x: canvasWidth/2, y: surfaceTop-10, w: 60, h: 10, type: 'trapButton', pressed: false } // Button
                ];
                goal.x = canvasWidth - 100;
            }
            // LEVEL 12: Bhagoda Coin
            else if (currentLevel === 12) {
                reqCoins = 1; isDoorOpen = false;
                platforms = [ { x: 0, y: surfaceTop, w: canvasWidth, h: 40, type: 'ground' }, { x: canvasWidth-150, y: surfaceTop-150, w: 150, h: 200, type: 'wall' } ];
                coins.push({x: 200, y: surfaceTop-25, collected: false, radius: 5, floatOffset: 0, runner: true});
                goal.x = canvasWidth - 80;
            }
            // LEVEL 13: Fake Walls Maze
            else if (currentLevel === 13) {
                platforms = [
                    { x: 0, y: surfaceTop, w: canvasWidth, h: 40, type: 'ground' },
                    { x: 300, y: surfaceTop-150, w: 80, h: 150, type: 'wall' }, // Solid
                    { x: 600, y: surfaceTop-150, w: 80, h: 150, type: 'hologram' }, // Fake (Pass through)
                    { x: 900, y: surfaceTop-150, w: 80, h: 150, type: 'wall' } // Solid
                ];
                goal.x = canvasWidth - 100;
            }
            // LEVEL 14: Moving Platforms Troll
            else if (currentLevel === 14) {
                platforms = [ { x: 0, y: surfaceTop, w: 150, h: 40, type: 'ground' }, { x: canvasWidth-150, y: surfaceTop, w: 150, h: 40, type: 'ground' } ];
                platforms.push({ x: 300, y: surfaceTop-50, w: 100, h: 20, type: 'moving', vy: 1.5, dir: 1, minY: surfaceTop-150, maxY: surfaceTop-20 });
                platforms.push({ x: 600, y: surfaceTop-100, w: 100, h: 20, type: 'moving', vy: 1.5, dir: -1, minY: surfaceTop-150, maxY: surfaceTop-20 });
                platforms.push({ x: 900, y: surfaceTop-50, w: 100, h: 20, type: 'fallingFloor', isFalling: false }); // Aakhiri wala girega!
                goal.x = canvasWidth - 80;
            }
            // LEVEL 15: The Trust Fall (Invisible Bridge)
            else if (currentLevel === 15) {
                platforms = [ { x: 0, y: surfaceTop, w: 200, h: 40, type: 'ground' }, { x: canvasWidth-200, y: surfaceTop, w: 200, h: 40, type: 'ground' } ];
                // Khai ke beech mein invisible floor hai, lekin jump karte hi gayab ho jayegi
                platforms.push({ x: 200, y: surfaceTop, w: canvasWidth-400, h: 40, type: 'trustBridge', visible: false }); 
                goal.x = canvasWidth - 100;
            }

            document.getElementById('scoreDisplay').innerText = reqCoins > 0 ? `COINS: ${score}/${reqCoins}` : `SURVIVE`;
            goal.y = surfaceTop - goal.h;
        }

        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        // SOUNDS & CONTROLS
        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
                if (type === 'jump') { osc.type = 'sine'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(350, now+0.15); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.15); osc.start(now); osc.stop(now+0.15); } 
                else if (type === 'coin') { osc.type = 'triangle'; osc.frequency.setValueAtTime(587.33, now); osc.frequency.setValueAtTime(880, now+0.08); gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.25); osc.start(now); osc.stop(now+0.25); } 
                else if (type === 'blast') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(15, now+0.5); gain.gain.setValueAtTime(0.6, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.5); osc.start(now); osc.stop(now+0.5); } 
                else if (type === 'win') { osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(880, now+0.3); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.6); osc.start(now); osc.stop(now+0.6); }
            } catch (e) {}
        }

        let keys = { left: false, right: false, down: false };
        const bindButton = (id, onStart, onEnd) => {
            const btn = document.getElementById(id); if (!btn) return;
            const hStart = (e) => { if(e)e.preventDefault(); btn.classList.add('pressed'); onStart(); };
            const hEnd = (e) => { if(e)e.preventDefault(); btn.classList.remove('pressed'); onEnd(); };
            btn.addEventListener('touchstart', hStart, { passive: false }); btn.addEventListener('touchend', hEnd, { passive: false }); btn.addEventListener('mousedown', hStart); btn.addEventListener('mouseup', hEnd); btn.addEventListener('mouseleave', hEnd);
        };
        bindButton('leftBtnM', () => keys.left = true, () => keys.left = false);
        bindButton('rightBtnM', () => keys.right = true, () => keys.right = false);
        bindButton('rightDownBtnM', () => keys.down = true, () => keys.down = false);

        let jumpedRecently = false;
        function triggerJump() {
            if (player.isGrounded && !isExploding) {
                player.vy = -9.4; player.isGrounded = false; jumpedRecently = true; playSound('jump');
            }
        }
        document.getElementById('jumpBtnM')?.addEventListener('touchstart', (e)=>{if(e)e.preventDefault(); triggerJump();});
        document.getElementById('jumpBtnM')?.addEventListener('mousedown', triggerJump);

        window.addEventListener('keydown', e => {
            if(e.key==='ArrowLeft'||e.key==='a') keys.left=true; if(e.key==='ArrowRight'||e.key==='d') keys.right=true; if(e.key==='ArrowDown'||e.key==='s') keys.down=true;
            if(e.key==='ArrowUp'||e.key==='w'||e.key===' ') { e.preventDefault(); triggerJump(); }
            if(e.key==='Shift'||e.key==='x') { shieldActive=true; document.getElementById('shieldDisplay').innerText="SHIELD: ON"; document.getElementById('shieldDisplay').style.color="#ff4444"; }
        });
        window.addEventListener('keyup', e => {
            if(e.key==='ArrowLeft'||e.key==='a') keys.left=false; if(e.key==='ArrowRight'||e.key==='d') keys.right=false; if(e.key==='ArrowDown'||e.key==='s') keys.down=false;
            if(e.key==='Shift'||e.key==='x') { shieldActive=false; document.getElementById('shieldDisplay').innerText="SHIELD: OFF"; document.getElementById('shieldDisplay').style.color="#ffcccc"; }
        });

        function triggerExplosion() {
            if (isExploding) return; isExploding = true; isSlowMo = true; playSound('blast');
            fragments = [{x:player.x,y:player.y,vx:-4,vy:-5,color:'#ff4d4d'},{x:player.x+4,y:player.y+10,vx:4,vy:-6,color:'#ffffff'},{x:player.x+2,y:player.y+18,vx:-5,vy:2,color:'#ff9900'},{x:player.x+6,y:player.y+22,vx:5,vy:3,color:'#ffffff'}];
            setTimeout(() => { isExploding = false; isSlowMo = false; player.x = 40; player.y = 100; player.vx = 0; player.vy = 0; updateGameLayout(); }, 2000);
        }

        let levelWon = false;

        function update() {
            let timeFactor = isSlowMo ? 0.25 : 1.0;
            if (isExploding) { fragments.forEach(f => { f.x += f.vx*timeFactor; f.y += f.vy*timeFactor; f.vy += 0.45*timeFactor; }); return; }

            if (keys.left) { player.vx = -player.speed; player.animTimer += 0.12; } else if (keys.right) { player.vx = player.speed; player.animTimer += 0.12; } else { player.vx = 0; player.animTimer = 0; }
            if (!player.isGrounded) player.animTimer += 0.12; 

            player.height = keys.down ? 27 : 45; 
            player.x += player.vx;
            if (player.x < 0) player.x = 0;
            if (player.x > canvasWidth - player.width) player.x = canvasWidth - player.width;

            player.vy += player.gravity; player.y += player.vy; player.isGrounded = false;

            // Platform Behaviors & Collisions
            platforms.forEach(p => {
                if (p.type === 'moving') { p.y += p.vy * p.dir; if(p.y < p.minY || p.y > p.maxY) p.dir *= -1; }
                if (p.type === 'fallingFloor' && p.isFalling) { p.y += 4; }
                
                // Lvl 15: Trust Bridge drops if player jumps
                if (p.type === 'trustBridge') {
                    if (jumpedRecently) { p.y += 10; } // Gayab ho jayega!
                }

                // Check standard landing collision
                let isSolid = (p.type==='ground' || p.type==='wall' || p.type==='jumpPad' || p.type==='trapButton' || p.type==='moving' || p.type==='fallingFloor' || p.type==='trustBridge' || (p.type==='trollBlock' && p.visible) || (p.type==='ground' && p.invisibleSafe));
                
                if (p.type === 'invisibleSafe') isSolid = true; // Hidden ground

                if (isSolid && player.x+player.width > p.x && player.x < p.x+p.w && player.y+player.height >= p.y && player.y+player.height-player.vy <= p.y+12) {
                    player.y = p.y - player.height; player.vy = 0; player.isGrounded = true; jumpedRecently = false;
                    if (p.type === 'fallingFloor') p.isFalling = true;
                    if (p.type === 'jumpPad') { player.vy = -20; playSound('jump'); }
                    if (p.type === 'trapButton' && !p.pressed) { p.pressed = true; p.y += 5; fallingTrap.active = true; fallingTrap.x = player.x; fallingTrap.y = player.y - 300; }
                }

                // Troll block head bump
                if (p.type === 'trollBlock' && !p.visible && player.vy < 0 && player.x+player.width > p.x && player.x < p.x+p.w && player.y <= p.y+p.h && player.y-player.vy >= p.y+p.h) {
                    player.y = p.y+p.h; player.vy = 2; p.visible = true; playSound('blast'); floatingTexts.push({ text: 'TROLL!', x: p.x, y: p.y-10, alpha: 1, vy: -0.5 });
                }

                // Wall collision (solid side)
                if (p.type === 'wall' && player.y+player.height > p.y && player.y < p.y+p.h) {
                    if (player.vx > 0 && player.x+player.width >= p.x && player.x < p.x) { player.x = p.x - player.width; }
                    if (player.vx < 0 && player.x <= p.x+p.w && player.x+player.width > p.x+p.w) { player.x = p.x + p.w; }
                }

                // Death ceiling
                if (p.type === 'deathCeiling' && player.x+player.width > p.x+5 && player.x < p.x+p.w-5 && player.y < p.y+p.h && player.y+player.height > p.y) {
                    triggerExplosion(); floatingTexts.push({ text: 'SPIKED!', x: player.x, y: player.y-20, alpha: 1, vy: -0.5 });
                }
            });

            if (player.y > canvasHeight + 100) triggerExplosion();

            // Falling Trap Logic (Lvl 11)
            if (fallingTrap.active) {
                fallingTrap.y += fallingTrap.vy;
                if (player.x < fallingTrap.x+fallingTrap.w && player.x+player.width > fallingTrap.x && player.y < fallingTrap.y+fallingTrap.h && player.y+player.height > fallingTrap.y) {
                    if (shieldActive) { fallingTrap.active = false; playSound('blast'); floatingTexts.push({ text: 'BLOCKED!', x: player.x, y: player.y-20, alpha: 1, vy: -1.5 }); } 
                    else { fallingTrap.active = false; triggerExplosion(); }
                }
            }

            // Custom Level Mechanics
            // L6: Sharmeela Darwaza
            if (currentLevel === 6 && isDoorOpen) {
                if (keys.right && goal.x - player.x < 300 && goal.x < canvasWidth-40) { goal.x += 4; } // Door runs away
                if (keys.left && goal.x > canvasWidth - 300) { goal.x -= 6; } // Door comes closer
            }
            // L12: Runner Coin
            if (currentLevel === 12) {
                coins.forEach(c => {
                    if(c.runner && !c.collected && Math.abs(player.x - c.x) < 150) {
                        c.x += (c.x > player.x) ? 4.5 : -4.5;
                        if(c.x > canvasWidth-60) c.x = 60; if(c.x < 60) c.x = canvasWidth-60; // Wrap around
                    }
                });
            }

            // Coins
            coins.forEach(c => {
                if (!c.collected && Math.hypot((player.x+player.width/2)-c.x, (player.y+player.height/2)-c.y) < 22) {
                    if (c.poison) {
                        triggerExplosion(); floatingTexts.push({ text: 'LALACH BURI BALA HAI!', x: c.x-40, y: c.y-20, alpha: 1, vy: -1 }); return;
                    }
                    c.collected = true; score += 1; playSound('coin');
                    if (reqCoins > 0 && score >= reqCoins) { isDoorOpen = true; floatingTexts.push({ text: 'GATE UNLOCKED!', x: player.x-30, y: player.y-20, alpha: 1, vy: -1 }); }
                }
            });

            // Door Goal
            if (player.x + player.width >= goal.x && player.y + player.height >= goal.y) {
                if (!isDoorOpen) { player.x = goal.x - player.width - 2; if (Math.random()<0.05) floatingTexts.push({ text: 'LOCKED!', x: player.x-10, y: player.y-10, alpha: 1, vy: -0.5 }); } 
                else if (player.x > goal.x + 2 && !levelWon) {
                    levelWon = true; playSound('win');
                    const modal = document.getElementById('notificationModal');
                    if (currentLevel < 15) {
                        modal.innerText = "🔥 Level " + currentLevel + " Cleared!"; modal.classList.add('show');
                        setTimeout(() => { modal.classList.remove('show'); currentLevel++; localStorage.setItem('saveLevel_TumseNaHoPayga', currentLevel); levelWon = false; player.x = 40; player.y = 100; updateGameLayout(); }, 2200);
                    } else {
                        modal.innerText = "🏆 WORLD 2 BEATEN! YOU ARE A LEGEND!"; modal.classList.add('show');
                        setTimeout(() => { localStorage.setItem('saveLevel_TumseNaHoPayga', 16); window.location.href = "index.html"; }, 4000);
                    }
                }
            }
            document.getElementById('scoreDisplay').innerText = reqCoins > 0 ? `COINS: ${score}/${reqCoins}` : `SURVIVE`;
            for (let i=floatingTexts.length-1; i>=0; i--) { let ft = floatingTexts[i]; ft.y+=ft.vy; ft.alpha-=0.03; if(ft.alpha<=0) floatingTexts.splice(i,1); }
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            platforms.forEach(p => {
                if (p.invisibleSafe || (p.type==='trollBlock' && !p.visible) || (p.type==='trustBridge' && !p.visible)) return; 
                
                if (p.type === 'hologram') {
                    ctx.fillStyle = 'rgba(255, 68, 68, 0.4)'; ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = '#ffcc00'; ctx.font = '14px Arial'; ctx.fillText('LAVA?', p.x+20, p.y+p.h/2);
                } else if (p.type === 'jumpPad') {
                    ctx.fillStyle = '#33cc33'; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.strokeStyle = '#00ff00'; ctx.strokeRect(p.x, p.y, p.w, p.h);
                } else if (p.type === 'trapButton') {
                    ctx.fillStyle = p.pressed ? '#800000' : '#ff0000'; ctx.fillRect(p.x, p.y, p.w, p.h);
                } else if (p.type === 'deathCeiling') {
                    ctx.fillStyle = '#111'; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.fillStyle = '#ff0000'; ctx.fillRect(p.x, p.y+p.h-5, p.w, 10);
                } else {
                    ctx.fillStyle = (p.type==='trollBlock') ? '#4a4a4a' : '#400808'; ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x+p.w, p.y); ctx.stroke();
                }
                if (p.type === 'trollBlock' && p.visible) { ctx.fillStyle = '#ffffff'; ctx.font = '22px Arial'; ctx.fillText('😜', p.x+8, p.y+30); }
            });

            coins.forEach(c => {
                if (!c.collected) {
                    c.floatOffset += 0.08; let floatY = c.y + Math.sin(c.floatOffset) * 3;
                    ctx.beginPath(); ctx.arc(c.x, floatY, c.radius+2, 0, Math.PI*2); ctx.fillStyle = c.poison ? 'rgba(255,0,0,0.4)' : 'rgba(255,204,0,0.25)'; ctx.fill();
                    ctx.beginPath(); ctx.arc(c.x, floatY, c.radius, 0, Math.PI*2); ctx.fillStyle = c.poison ? '#ff3333' : '#ffcc00'; ctx.fill();
                    ctx.lineWidth = 1; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                }
            });

            if (fallingTrap.active) { ctx.fillStyle = '#4a4a4a'; ctx.fillRect(fallingTrap.x, fallingTrap.y, fallingTrap.w, fallingTrap.h); ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 3; ctx.strokeRect(fallingTrap.x, fallingTrap.y, fallingTrap.w, fallingTrap.h); }

            if (isDoorOpen) { ctx.fillStyle = 'rgba(255, 68, 68, 0.25)'; ctx.fillRect(goal.x-4, goal.y-4, goal.w+8, goal.h+8); ctx.fillStyle = '#600404'; ctx.fillRect(goal.x, goal.y, goal.w, goal.h); ctx.strokeStyle = '#ff3333'; } 
            else { ctx.fillStyle = 'rgba(255, 0, 0, 0.25)'; ctx.fillRect(goal.x-4, goal.y-4, goal.w+8, goal.h+8); ctx.fillStyle = '#200000'; ctx.fillRect(goal.x, goal.y, goal.w, goal.h); ctx.strokeStyle = '#ff0000'; ctx.fillStyle = '#ffffff'; ctx.fillRect(goal.x+goal.w/2-2, goal.y+goal.h/2-2, 4, 4); }
            ctx.lineWidth = 2.5; ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);

            floatingTexts.forEach(ft => { ctx.save(); ctx.globalAlpha = ft.alpha; ctx.font = 'bold 12px Orbitron'; ctx.fillStyle = '#ffcc00'; ctx.fillText(ft.text, ft.x, ft.y); ctx.restore(); });

            if (isExploding) { fragments.forEach(f => { ctx.fillStyle = f.color; ctx.fillRect(f.x, f.y, 4, 4); }); } 
            else {
                let px = player.x, py = player.y;
                if (shieldActive) { ctx.beginPath(); ctx.arc(px+player.width/2, py+player.height/2, 26, 0, Math.PI*2); ctx.fillStyle = 'rgba(255, 68, 68, 0.3)'; ctx.fill(); ctx.strokeStyle = '#ff4444'; ctx.stroke(); }
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(px+player.width/2, py+6, 5, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(px+(player.width-7)/2, py+12, 7, 14.5);
                ctx.fillRect(px+1, py+27, 3, player.height===27?8:14); ctx.fillRect(px+10, py+27, 3, player.height===27?8:14);
            }
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
        function goHome() { window.location.href = "index.html"; }
    </script>
</body>
</html>

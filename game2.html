<!-- ======================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤪 Z PAJAL - Levels 6 to 15</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1f1208 0%, #0d0603 50%, #2b180a 100%);
            background-attachment: fixed;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
            transition: transform 0.2s ease;
        }

        @media (max-width: 1023px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .game-wrapper {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(var(--scale-factor, 0.65));
                width: 1280px;
                height: 720px;
                justify-content: flex-start;
                padding: 10px;
                transform-origin: center center;
            }
        }

        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(50, 28, 10, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 163, 115, 0.4);
            border-radius: 15px;
            padding: 8px 20px;
            margin-bottom: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #d4a373;
            text-shadow: 0 0 10px rgba(212,163,115,0.6);
        }

        .hud-stats {
            display: flex;
            gap: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #faedcd;
            align-items: center;
        }

        .hud-right-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .arena-container {
            flex: 1;
            background: rgba(20, 11, 5, 0.95);
            border: 3px solid rgba(140, 88, 48, 0.85);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(140, 88, 48, 0.25), 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 8px;
        }

        .distractor-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(212, 163, 115, 0.15) 0%, rgba(140, 88, 48, 0.1) 40%, transparent 70%),
                        repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 40px, rgba(212, 163, 115, 0.05) 40px, rgba(212, 163, 115, 0.05) 42px),
                        linear-gradient(45deg, rgba(140, 88, 48, 0.05) 25%, transparent 25%, transparent 75%, rgba(140, 88, 48, 0.05) 75%, rgba(140, 88, 48, 0.05)),
                        linear-gradient(45deg, rgba(140, 88, 48, 0.05) 25%, transparent 25%, transparent 75%, rgba(140, 88, 48, 0.05) 75%, rgba(140, 88, 48, 0.05));
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            background-position: 0 0, 0 0, 0 0, 30px 30px;
            animation: pulseBg 6s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulseBg {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        #gameCanvas {
            width: 100%;
            height: 410px;
            display: block;
            position: relative;
            z-index: 2;
        }

        .controls-overlay {
            display: none;
        }

        @media (max-width: 1023px) {
            .controls-overlay {
                position: relative;
                bottom: 0;
                left: 0;
                width: 100%;
                margin-top: 2px;
                padding: 0 4px;
                pointer-events: auto;
                background: transparent;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 30;
            }
        }

        .control-group {
            display: flex;
            gap: 6px;
            pointer-events: auto;
            align-items: center;
        }

        @media (max-width: 1023px) {
            .control-group.right-group {
                display: flex;
                flex-direction: row;
                gap: 6px;
                align-items: center;
            }
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-bottom: 3px solid rgba(0, 0, 0, 0.2);
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            width: 95px;
            height: 70px;
            font-size: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
            position: relative;
        }

        .ctrl-btn:active, .ctrl-btn.pressed {
            transform: translateY(2px);
            background: rgba(140, 88, 48, 0.25);
            border-color: rgba(212, 163, 115, 0.5);
        }

        .btn-logo {
            font-size: 12px;
            font-weight: 900;
            color: rgba(255, 204, 0, 0.45);
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }

        .btn-label {
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            color: rgba(255, 255, 255, 0.4);
        }

        .back-btn, .prev-lvl-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #faedcd;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
        }
        .back-btn:hover, .prev-lvl-btn:hover {
            color: #fff;
            border-color: #d4a373;
            background: rgba(212, 163, 115, 0.2);
        }

        #notificationModal {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(43, 24, 10, 0.95);
            border: 2px solid #d4a373;
            padding: 16px 28px;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #ffcc00;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notificationModal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="notificationModal">🎉 Level Cleared!</div>

    <div class="game-wrapper">
        <div class="game-hud">
            <div class="hud-title" id="levelTitle">⚡ LEVEL 6 ⚡</div>
            <div class="hud-stats">
                <span id="scoreDisplay">COINS: 0/4</span>
                <span id="shieldDisplay">SHIELD: OFF</span>
            </div>
            <div class="hud-right-group">
                <button class="prev-lvl-btn" onclick="goToPrevLevel()">◀ BACK</button>
                <button class="back-btn" onclick="goHome()">QUIT</button>
            </div>
        </div>

        <div class="arena-container">
            <div class="distractor-bg"></div>
            <canvas id="gameCanvas"></canvas>

            <div class="controls-overlay" id="mobileControls">
                <div class="control-group">
                    <button class="ctrl-btn" id="leftBtnM">◀</button>
                    <button class="ctrl-btn" id="rightBtnM">▶</button>
                </div>
                <div class="control-group right-group">
                    <button class="ctrl-btn" id="jumpBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">JUMP</span>
                    </button>
                    <button class="ctrl-btn" id="rightDownBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">DOWN</span>
                    </button>
                    <button class="ctrl-btn" id="shieldBtnM">
                        <span class="btn-logo">Z</span>
                        <span class="btn-label">SHLD</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const currentPageFile = window.location.pathname.split("/").pop() || "game2.html";
        localStorage.setItem('lastActiveFile', currentPageFile);

        function handleScreenFit(e) {
            if (e.target.closest('button') || e.target.closest('.ctrl-btn') || e.target.closest('.game-hud')) {
                return;
            }
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        window.addEventListener('click', handleScreenFit);
        window.addEventListener('touchstart', handleScreenFit);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let canvasWidth = 1280;
        let canvasHeight = 410;

        function checkDeviceControls() {
            const isMobileOrTablet = window.innerWidth <= 1023;
            document.getElementById('mobileControls').style.display = isMobileOrTablet ? 'flex' : 'none';
        }

        function resizeCanvas() {
            if (window.innerWidth <= 1023) {
                const scaleX = window.innerWidth / 1280;
                const scaleY = window.innerHeight / 720;
                const scale = Math.min(scaleX, scaleY) * 0.95;
                document.documentElement.style.setProperty('--scale-factor', scale);
            }
            canvasWidth = 1280;
            canvasHeight = 410;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';

            updateGameLayout();
            checkDeviceControls();
        }

        let maxUnlockedLevel = parseInt(localStorage.getItem('maxUnlocked_TumseNaHoPayga_Part2')) || 
                               parseInt(localStorage.getItem('saveLevel_TumseNaHoPayga_Part2')) || 6;
        
        let currentLevel = maxUnlockedLevel;
        
        let isDoorOpen = false; 
        let score = 0;
        let shieldActive = false;
        let isExploding = false;
        let isSlowMo = false;
        let fragments = [];
        let particles = [];
        let floatingTexts = [];

        let player = {
            x: 40,
            y: 100,
            width: 13.0,     
            height: 40.5,    
            vx: 0,
            vy: 0,
            speed: 2.8,        
            jumpForce: -8.5,  
            gravity: 0.38,    
            isGrounded: false,
            animTimer: 0
        };

        let platforms = [];
        let coins = [];
        let goal = { x: 0, y: 0, w: 25, h: 35 };

        function updateGameLayout() {
            score = 0;

            if (currentLevel > maxUnlockedLevel) {
                maxUnlockedLevel = currentLevel;
            }
            localStorage.setItem('maxUnlocked_TumseNaHoPayga_Part2', maxUnlockedLevel);
            localStorage.setItem('saveLevel_TumseNaHoPayga_Part2', maxUnlockedLevel);
            localStorage.setItem('lastActiveFile', currentPageFile);
            
            const surfaceTop = canvasHeight - 40;
            const surfaceHeight = 40;

            const levelTitles = {
                6: "⚡『 🏃 JUMP OR DIE 』- Lvl 6 ⚡",
                7: "🎯『 🧱 FAKE BRICKS TROLL 』- Lvl 7 ⚡",
                8: "🚀『 💣 MINEFIELD CARPET 』- Lvl 8 ⚡",
                9: "🔥『 🪜 STAIRWAY TO HEAVEN? 』- Lvl 9 ⚡",
                10: "👑『 🕳 HOLE IN ONE 』- Lvl 10 ⚡",
                11: "⚡『 🧗 ELEVATED AGONY 』- Lvl 11 ⚡",
                12: "🎯『 🔒 GATE KEEPER'S PRANK 』- Lvl 12 ⚡",
                13: "🚀『 💀 DOUBLE TROUBLE 』- Lvl 13 ⚡",
                14: "🔥『 🎯 BLIND LEAP OF FAITH 』- Lvl 14 ⚡",
                15: "👑『 👹 THE TROLL GOD (FINAL) 』- Lvl 15 ⚡"
            };

            document.getElementById('levelTitle').innerText = levelTitles[currentLevel] || `⚡『 🪙 TROLL ARENA 』- Lvl ${currentLevel} ⚡`;

            let totalCoinsInLevel = 4;
            document.getElementById('scoreDisplay').innerText = "COINS: " + score + "/" + totalCoinsInLevel;

            platforms = [
                { x: 0, y: surfaceTop, w: canvasWidth, h: surfaceHeight, type: 'ground' }
            ];

            // ==========================================
            // 😈 UNIQUE TROLL DESIGNS FOR LEVELS 6 TO 15
            // ==========================================
            if (currentLevel === 6) {
                // Trap 1: Jump Landing Trap (seedhe coin ke theek neeche)
                platforms.push({ x: 260, y: surfaceTop, w: 90, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 740, y: surfaceTop, w: 100, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
            } 
            else if (currentLevel === 7) {
                // Troll: Floating platforms jo dikhte safe hain, lekin landing ke baad zameen trap hai
                platforms.push({ x: 320, y: surfaceTop - 60, w: 90, h: 16, type: 'secondSurface' });
                platforms.push({ x: 440, y: surfaceTop, w: 140, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 760, y: surfaceTop - 70, w: 90, h: 16, type: 'secondSurface' });
                platforms.push({ x: 880, y: surfaceTop, w: 120, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
            } 
            else if (currentLevel === 8) {
                // Troll: Minefield - ground par har thodi doori par continuous chote hidden traps
                platforms.push({ x: 180, y: surfaceTop, w: 60, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 420, y: surfaceTop, w: 75, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 680, y: surfaceTop, w: 80, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 920, y: surfaceTop, w: 70, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
            } 
            else if (currentLevel === 9) {
                // Troll: Seedhi (Stairs) banayi hai, lekin upar chadh kar aage koodne par trap
                platforms.push({ x: 200, y: surfaceTop - 40, w: 70, h: 16, type: 'secondSurface' });
                platforms.push({ x: 340, y: surfaceTop - 75, w: 70, h: 16, type: 'secondSurface' });
                platforms.push({ x: 480, y: surfaceTop - 110, w: 80, h: 16, type: 'secondSurface' });
                platforms.push({ x: 600, y: surfaceTop, w: 160, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 860, y: surfaceTop - 50, w: 90, h: 16, type: 'secondSurface' });
            } 
            else if (currentLevel === 10) {
                // Troll: Center gap trap - Center mein bada hidden trap jahan player jump karta hai
                platforms.push({ x: 280, y: surfaceTop, w: 90, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 500, y: surfaceTop, w: 220, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 840, y: surfaceTop, w: 90, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
            } 
            else if (currentLevel === 11) {
                // Troll: Narrow roofs - floating surface se jump karna padega warna zameen par trap
                platforms.push({ x: 180, y: surfaceTop - 65, w: 85, h: 16, type: 'secondSurface' });
                platforms.push({ x: 380, y: surfaceTop, w: 160, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 620, y: surfaceTop - 75, w: 85, h: 16, type: 'secondSurface' });
                platforms.push({ x: 820, y: surfaceTop, w: 150, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
            } 
            else if (currentLevel === 12) {
                // Troll: Gate Keeper Trap - Gate ke theek samne hidden trap!
                platforms.push({ x: 300, y: surfaceTop, w: 80, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 650, y: surfaceTop, w: 90, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: canvasWidth - 140, y: surfaceTop, w: 90, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
            } 
            else if (currentLevel === 13) {
                // Troll: Alternate jumping surfaces aur dono side hidden traps
                platforms.push({ x: 220, y: surfaceTop - 50, w: 75, h: 16, type: 'secondSurface' });
                platforms.push({ x: 360, y: surfaceTop, w: 110, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 540, y: surfaceTop - 75, w: 75, h: 16, type: 'secondSurface' });
                platforms.push({ x: 700, y: surfaceTop, w: 120, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 890, y: surfaceTop - 55, w: 75, h: 16, type: 'secondSurface' });
                platforms.push({ x: 1020, y: surfaceTop, w: 85, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
            } 
            else if (currentLevel === 14) {
                // Troll: High tower leap - bohot oonchi platforms aur ground par wide traps
                platforms.push({ x: 260, y: surfaceTop - 85, w: 100, h: 18, type: 'secondSurface' });
                platforms.push({ x: 420, y: surfaceTop, w: 180, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 680, y: surfaceTop - 95, w: 100, h: 18, type: 'secondSurface' });
                platforms.push({ x: 850, y: surfaceTop, w: 170, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
            } 
            else if (currentLevel === 15) {
                // Troll: Boss Level - Zameen par chalna lagbhag impossible, upper islands se hi jaana hoga
                platforms.push({ x: 140, y: surfaceTop, w: 90, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 260, y: surfaceTop - 60, w: 80, h: 16, type: 'secondSurface' });
                platforms.push({ x: 400, y: surfaceTop, w: 180, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 560, y: surfaceTop - 80, w: 80, h: 16, type: 'secondSurface' });
                platforms.push({ x: 720, y: surfaceTop, w: 180, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
                platforms.push({ x: 880, y: surfaceTop - 60, w: 80, h: 16, type: 'secondSurface' });
                platforms.push({ x: 1040, y: surfaceTop, w: 120, h: surfaceHeight, type: 'hiddenTrap', triggered: false });
            }

            isDoorOpen = false;
            player.x = 40;
            player.y = 100;

            coins = [];
            let startMargin = 160; 
            let endMargin = 160;   
            let usableWidth = canvasWidth - startMargin - endMargin;
            let coinSpacing = totalCoinsInLevel > 1 ? usableWidth / (totalCoinsInLevel - 1) : 0;

            // Har level par kaunsa coin BOOM/TRAP hoga (0-indexed: 0=Pehla, 1=Dusra, 2=Teesra, 3=Chautha)
            let boomMap = {
                6: [1],         // Dusra coin trap
                7: [0, 2],      // Pehla aur teesra trap
                8: [1, 3],      // Dusra aur aakhri trap
                9: [2],         // Teesra coin fake/boom
                10: [0, 1],     // Pehle do coin traps (peeche se lena hoga)
                11: [1, 2],     // Beech ke dono coins boom
                12: [3],        // Gate ke paas wala aakhri coin boom trap
                13: [0, 2],     // Trick alternate
                14: [1, 3],     // Jump over traps
                15: [0, 2]      // Boss coins
            };
            let boomIndices = boomMap[currentLevel] || [1];

            for (let i = 1; i <= totalCoinsInLevel; i++) {
                let hasBoom = boomIndices.includes(i - 1);
                
                // Level 9, 11, 14 par coins ko floating platforms ke upar set kiya gaya hai
                let coinY = surfaceTop - 25;
                if ((currentLevel === 9 || currentLevel === 11 || currentLevel === 14 || currentLevel === 15) && (i === 2 || i === 3)) {
                    coinY = surfaceTop - 95;
                }

                coins.push({
                    x: startMargin + (i - 1) * coinSpacing,
                    y: coinY,
                    collected: false,
                    radius: 5,
                    isBoom: hasBoom,
                    floatOffset: Math.random() * Math.PI
                });
            }

            goal.y = surfaceTop - goal.h;
            goal.x = canvasWidth - goal.w - 40;
        }

        function goToPrevLevel() {
            if (currentLevel > 6) {
                currentLevel--;
                player.vx = 0;
                player.vy = 0;
                updateGameLayout();
            } else {
                window.location.href = "game.html";
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let keys = { left: false, right: false, down: false };

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        window.addEventListener('click', initAudio);
        window.addEventListener('touchstart', initAudio);
        window.addEventListener('keydown', initAudio);

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(350, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'coin') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, now); 
                    osc.frequency.setValueAtTime(880, now + 0.08); 
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'blast') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(15, now + 0.5);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        const bindButton = (id, onStart, onEnd) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const handleStart = (e) => {
                if (e) e.preventDefault();
                initAudio();
                btn.classList.add('pressed');
                onStart();
            };
            const handleEnd = (e) => {
                if (e) e.preventDefault();
                btn.classList.remove('pressed');
                onEnd();
            };
            btn.addEventListener('touchstart', handleStart, { passive: false });
            btn.addEventListener('touchend', handleEnd, { passive: false });
            btn.addEventListener('touchcancel', handleEnd, { passive: false });
            btn.addEventListener('mousedown', handleStart);
            btn.addEventListener('mouseup', handleEnd);
            btn.addEventListener('mouseleave', handleEnd);
        };

        bindButton('leftBtnM', () => keys.left = true, () => keys.left = false);
        bindButton('rightBtnM', () => keys.right = true, () => keys.right = false);
        bindButton('rightDownBtnM', () => keys.down = true, () => keys.down = false);

        function triggerJump() {
            if (player.isGrounded && !isExploding) {
                let activeJumpForce = -9.4; 

                player.vy = activeJumpForce;
                player.isGrounded = false;
                playSound('jump');
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: player.x + player.width / 2,
                        y: player.y + player.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: -Math.random() * 1.5,
                        size: Math.random() * 3 + 1,
                        color: 'rgba(212, 163, 115, 0.7)',
                        life: 25
                    });
                }
            }
        }

        const jumpBtnM = document.getElementById('jumpBtnM');
        if (jumpBtnM) {
            const handleJumpAction = (e) => {
                if (e) e.preventDefault();
                initAudio();
                jumpBtnM.classList.add('pressed');
                setTimeout(() => jumpBtnM.classList.remove('pressed'), 150);
                triggerJump();
            };
            jumpBtnM.addEventListener('touchstart', handleJumpAction, { passive: false });
            jumpBtnM.addEventListener('mousedown', handleJumpAction);
        }

        const shieldBtnM = document.getElementById('shieldBtnM');
        if (shieldBtnM) {
            const activateShield = (e) => {
                if (e) e.preventDefault();
                initAudio();
                shieldBtnM.classList.add('pressed');
                shieldActive = true;
                document.getElementById('shieldDisplay').innerText = "SHIELD: ON";
                document.getElementById('shieldDisplay').style.color = "#ffaa00";
            };
            const deactivateShield = (e) => {
                if (e) e.preventDefault();
                shieldBtnM.classList.remove('pressed');
                shieldActive = false;
                document.getElementById('shieldDisplay').innerText = "SHIELD: OFF";
                document.getElementById('shieldDisplay').style.color = "#d8b4fe";
            };
            shieldBtnM.addEventListener('touchstart', activateShield, { passive: false });
            shieldBtnM.addEventListener('touchend', deactivateShield, { passive: false });
            shieldBtnM.addEventListener('touchcancel', deactivateShield, { passive: false });
            shieldBtnM.addEventListener('mousedown', activateShield);
            shieldBtnM.addEventListener('mouseup', deactivateShield);
            shieldBtnM.addEventListener('mouseleave', deactivateShield);
        }

        window.addEventListener('keydown', e => {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'Shift') {
                shieldActive = true;
                document.getElementById('shieldDisplay').innerText = "SHIELD: ON";
                document.getElementById('shieldDisplay').style.color = "#ffaa00";
            }
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === 'Shift') {
                shieldActive = false;
                document.getElementById('shieldDisplay').innerText = "SHIELD: OFF";
                document.getElementById('shieldDisplay').style.color = "#d8b4fe";
            }
        });

        function triggerExplosion() {
            if (shieldActive) return;
            if (isExploding) return;
            
            isExploding = true;
            isSlowMo = true;
            playSound('blast');

            fragments = [
                { x: player.x, y: player.y, vx: -4, vy: -5, color: '#ffffff' },
                { x: player.x + 4, y: player.y + 10, vx: 4, vy: -6, color: '#ffffff' },
                { x: player.x + 2, y: player.y + 18, vx: -5, vy: 2, color: '#e0e0e0' },
                { x: player.x + 6, y: player.y + 22, vx: 5, vy: 3, color: '#ffffff' }
            ];

            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height / 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 5 + 2,
                    color: Math.random() > 0.5 ? '#ff9f1c' : '#ffffff',
                    life: 40
                });
            }

            setTimeout(() => {
                isExploding = false;
                isSlowMo = false;
                updateGameLayout();
            }, 2000);
        }

        function checkCoins() {
            coins.forEach(c => {
                if (!c.collected && Math.hypot((player.x + player.width/2) - c.x, (player.y + player.height/2) - c.y) < 22) {
                    c.collected = true;

                    if (c.isBoom) {
                        playSound('blast');
                        triggerExplosion();
                        return;
                    }

                    score += 1; 
                    playSound('coin');
                    
                    floatingTexts.push({ text: '+1', x: c.x, y: c.y - 10, alpha: 1, vy: -1 });

                    // Saare safe coins collect hone par gate khulega
                    let safeCoinsTotal = coins.filter(coin => !coin.isBoom).length;
                    if (score >= safeCoinsTotal) {
                        isDoorOpen = true; 
                        floatingTexts.push({ text: 'GATE UNLOCKED!', x: player.x - 30, y: player.y - 20, alpha: 1, vy: -1 });
                    }

                    for (let i = 0; i < 8; i++) {
                        particles.push({
                            x: c.x,
                            y: c.y,
                            vx: (Math.random() - 0.5) * 5,
                            vy: (Math.random() - 0.5) * 5,
                            size: Math.random() * 3 + 1,
                            color: '#ffcc00',
                            life: 20
                        });
                    }
                }
            });
        }

        let levelWon = false;

        function update() {
            let timeFactor = isSlowMo ? 0.25 : 1.0;

            if (isExploding) {
                fragments.forEach(f => {
                    f.x += f.vx * timeFactor;
                    f.y += f.vy * timeFactor;
                    f.vy += 0.45 * timeFactor; 
                });
                return;
            }

            if (keys.left) {
                player.vx = -player.speed;
                player.animTimer += 0.15; 
            } else if (keys.right) {
                player.vx = player.speed;
                player.animTimer += 0.15;
            } else {
                player.vx = 0;
                player.animTimer = 0;
            }

            if (!player.isGrounded) {
                player.animTimer += 0.15; 
            }

            if (keys.down) {
                player.height = 24.3; 
            } else {
                player.height = 40.5; 
            }

            player.x += player.vx;

            if (player.x < 0) player.x = 0;
            if (player.x > canvasWidth - player.width) player.x = canvasWidth - player.width;

            player.vy += player.gravity;
            player.y += player.vy;

            player.isGrounded = false;
            platforms.forEach(p => {
                if (p.type === 'hiddenTrap') {
                    let playerCenterX = player.x + player.width / 2;
                    if (!p.triggered && playerCenterX >= p.x && playerCenterX <= p.x + p.w && player.y + player.height >= p.y - 5) {
                        p.triggered = true; 
                        setTimeout(() => triggerExplosion(), 80);
                        return;
                    }
                    if (p.triggered) return; 
                }

                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 12
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            });

            if (player.y > canvasHeight + 100) {
                triggerExplosion();
            }

            checkCoins();

            let playerCenterInsideGoal = (player.x + player.width / 2 >= goal.x && player.x + player.width / 2 <= goal.x + goal.w);

            if (playerCenterInsideGoal && player.y + player.height >= goal.y) {
                if (!isDoorOpen) {
                    player.x = goal.x - player.width - 2; 
                    if (Math.random() < 0.05) { 
                        floatingTexts.push({ text: 'LOCKED!', x: player.x - 10, y: player.y - 10, alpha: 1, vy: -0.5 });
                    }
                } 
                else if (!levelWon) {
                    levelWon = true;
                    playSound('win');
                    
                    const modal = document.getElementById('notificationModal');
                    
                    if (currentLevel < 15) {
                        modal.innerText = `🎉 Shandar! 🤪 Level ${currentLevel} Cleared!`;
                        modal.classList.add('show');
                        
                        let nextLvl = currentLevel + 1;
                        
                        if (nextLvl > maxUnlockedLevel) {
                            maxUnlockedLevel = nextLvl;
                        }
                        localStorage.setItem('maxUnlocked_TumseNaHoPayga_Part2', maxUnlockedLevel);
                        localStorage.setItem('saveLevel_TumseNaHoPayga_Part2', maxUnlockedLevel);

                        setTimeout(() => {
                            modal.classList.remove('show');
                            currentLevel = nextLvl;
                            levelWon = false;
                            updateGameLayout();
                        }, 2000);
                    } else {
                        modal.innerText = "🏆 BADHAI HO! 🤪 SARE 15 LEVELS COMPLETE HO GAYE!";
                        modal.classList.add('show');
                        setTimeout(() => {
                            window.location.href = "index.html"; 
                        }, 3000);
                    }
                }
            } else if (!isDoorOpen && player.x + player.width >= goal.x) {
                player.x = goal.x - player.width;
            }

            let safeCoinsCount = coins.filter(coin => !coin.isBoom).length;
            document.getElementById('scoreDisplay').innerText = "COINS: " + score + "/" + safeCoinsCount;

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.03;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            platforms.forEach(p => {
                if (p.type === 'hiddenTrap' && p.triggered) return; 
                ctx.fillStyle = '#2b180a';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#d4a373';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + p.w, p.y);
                ctx.stroke();
            });

            coins.forEach((c) => {
                if (!c.collected) {
                    c.floatOffset += 0.08;
                    let floatY = c.y + Math.sin(c.floatOffset) * 3;

                    ctx.beginPath();
                    ctx.arc(c.x, floatY, c.radius + 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 204, 0, 0.25)';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(c.x, floatY, c.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                }
            });

            if (isDoorOpen) {
                ctx.fillStyle = 'rgba(255, 159, 28, 0.25)';
                ctx.fillRect(goal.x - 4, goal.y - 4, goal.w + 8, goal.h + 8);
                ctx.fillStyle = '#532d0c';
                ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
                ctx.strokeStyle = '#ff9f1c';
            } else {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.25)';
                ctx.fillRect(goal.x - 4, goal.y - 4, goal.w + 8, goal.h + 8);
                ctx.fillStyle = '#4a0000';
                ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
                ctx.strokeStyle = '#ff0000';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(goal.x + goal.w/2 - 2, goal.y + goal.h/2 - 2, 4, 4);
            }
            ctx.lineWidth = 2.5;
            ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = 'bold 12px Orbitron, sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText(ft.text, ft.x - 8, ft.y);
                ctx.restore();
            });

            if (isExploding) {
                fragments.forEach(f => {
                    ctx.fillStyle = f.color;
                    ctx.fillRect(f.x, f.y, 4, 4);
                });
            } else {
                let px = player.x;
                let py = player.y;

                if (shieldActive) {
                    ctx.beginPath();
                    ctx.arc(px + player.width/2, py + player.height/2, 23, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
                    ctx.fill();
                    ctx.strokeStyle = '#ffaa00';
                    ctx.stroke();
                }

                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath();
                ctx.ellipse(px + player.width/2 + 1, py + player.height + 2, player.width/1.2, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                let legSwing = Math.sin(player.animTimer) * 3.5;
                let isJumpingOrAirborne = !player.isGrounded;
                let jumpStretch = isJumpingOrAirborne ? -2 : 0;
                let armSwing = Math.sin(player.animTimer) * 3; 

                let headRadius = 4.5;
                let headX = px + player.width/2;
                let headY = py + 5 + jumpStretch;
                
                let headGrad = ctx.createRadialGradient(headX - 1, headY - 1, 0.5, headX, headY, headRadius);
                headGrad.addColorStop(0, '#ffffff');
                headGrad.addColorStop(1, '#c0c0c0');
                
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
                ctx.fill();

                let torsoWidth = 6.3; 
                let torsoX = px + (player.width - torsoWidth) / 2;
                let chestGrad = ctx.createLinearGradient(torsoX, py + 10 + jumpStretch, torsoX + torsoWidth, py + 10 + jumpStretch);
                chestGrad.addColorStop(0, '#ffffff');
                chestGrad.addColorStop(1, '#b0b0b0');
                ctx.fillStyle = chestGrad;
                ctx.fillRect(torsoX, py + 10 + jumpStretch, torsoWidth, 13);

                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(torsoX - 1, py + 23 + jumpStretch, torsoWidth + 2, 2.2);

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(torsoX - 3.5 + armSwing, py + 12 + jumpStretch, 2.2, 10);  
                ctx.fillRect(torsoX + torsoWidth + 0.8 - armSwing, py + 12 + jumpStretch, 2.2, 10); 

                let legHeight = player.height === 24.3 ? 7 : 12;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(torsoX + 0.8 + legSwing, py + 25.2 + jumpStretch, 2.2, legHeight); 
                ctx.fillRect(torsoX + torsoWidth - 3 - legSwing, py + 25.2 + jumpStretch, 2.2, legHeight); 
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        function goHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
